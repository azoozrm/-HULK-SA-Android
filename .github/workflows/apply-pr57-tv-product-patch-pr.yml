name: Apply verified PR57 TV product patch

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/apply-pr57-tv-product-patch-pr.yml'

permissions:
  contents: write

concurrency:
  group: apply-pr57-tv-product-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Extract and apply the reviewed fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt'
          EXPECTED_SHA='be902ccb3e8580e11b054720662eeb0074694be21eb5d1f8e80939a61b029fa6'
          ACTUAL_SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]] || {
            echo "FAIL: source moved: expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-pr57-tv-layout-focus-fix-v2.yml')
          source = workflow.read_text(encoding='utf-8')
          begin = "          --- a/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt\n"
          end = "          PATCH\n"
          start = source.find(begin)
          stop = source.find(end, start)
          if start < 0 or stop < 0:
              raise SystemExit('FAIL: reviewed patch payload was not found exactly')
          lines = source[start:stop].splitlines()
          if not lines or any(not line.startswith('          ') for line in lines):
              raise SystemExit('FAIL: reviewed patch indentation contract changed')
          patch = '\n'.join(line[10:] for line in lines) + '\n'
          Path('/tmp/pr57-tv-product.patch').write_text(patch, encoding='utf-8')
          PY

          git apply --check /tmp/pr57-tv-product.patch
          git apply /tmp/pr57-tv-product.patch

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          canonical = Path('qa/canonical/canonical-source.sha256')
          digest = sha256(source.read_bytes()).hexdigest()
          expected = '07c4011aa107252c3c8937eba2d878a671b5e48a6334028f32b13e8f0c1793e6'
          if digest != expected:
              raise SystemExit(f'FAIL: patched source digest mismatch: expected={expected} actual={digest}')
          target = 'app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt'
          lines = canonical.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith('  ' + target)]
          if len(matches) != 1:
              raise SystemExit(f'FAIL: canonical MainShell entry count={len(matches)}')
          lines[matches[0]] = f'{digest}  {target}'
          canonical.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          ! grep -Eq 'qa-tv-|qaTvPageContent|qaMarker' "$TARGET"
          grep -Fq 'http://3162356.xyz:8080' app/build.gradle.kts
          grep -Fq 'applicationId = "sa.hulksa.player"' app/build.gradle.kts
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Run focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -v
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            qa/canonical/canonical-source.sha256
          git diff --cached --check
          git commit -m 'fix(tv): keep download rows visible and route remote focus'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
