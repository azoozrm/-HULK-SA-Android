name: Build HULK SA v0.9.3.1 Mobile Polish

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
      - '.github/workflows/build-v0930-adaptive-foundation.yml'
      - 'patches/v0.9.3.0-adaptive-source/**'
      - 'tools/**'
      - 'docs/PHASE-3-ADAPTIVE-FOUNDATION.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v0931-mobile-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          mkdir -p build-logs reports
          { yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'; } 2>&1 | tee build-logs/01-sdk.log

      - name: Prepare official source
        run: |
          set -euo pipefail
          ARCHIVE='HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
          rm -rf extracted project
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n1)
          test -n "$ROOT"
          cp -a "$ROOT" project
          sha256sum "$ARCHIVE" | tee archive.sha256
          python3 tools/repair-v09120.py project 2>&1 | tee build-logs/02-repair.log
          python3 tools/prepare-v0920-architecture.py project 2>&1 | tee build-logs/03-architecture.log

      - name: Prepare and verify responsive mobile source
        run: |
          set -euo pipefail
          python3 tools/prepare-v0930-adaptive-ui.py project 2>&1 | tee build-logs/04-mobile-source-preparation.log
          python3 tools/prepare-v0930-adaptive-ui.py project 2>&1 | tee build-logs/05-mobile-idempotency.log
          python3 tools/verify-v0930-adaptive-source.py project --report reports/MOBILE-POLISH-SOURCE-REPORT.md 2>&1 | tee build-logs/06-source-policy.log

      - name: Compile, test and build
        working-directory: project
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:compileDebugKotlin testDebugUnitTest :app:assembleDebug :app:bundleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../build-logs/07-gradle.log

      - name: Verify packages
        run: |
          set -euo pipefail
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          test -s "$APK"
          test -s "$AAB"
          python3 tools/verify-android-architectures.py "$APK" --require-native-libs --report reports/APK-ARCHITECTURE-REPORT.md 2>&1 | tee build-logs/08-apk-architecture.log
          python3 tools/verify-android-architectures.py "$AAB" --require-native-libs --report reports/AAB-ARCHITECTURE-REPORT.md 2>&1 | tee build-logs/09-aab-architecture.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee reports/APK-BADGING.txt build-logs/10-apk-badging.log
          grep "package: name='sa.hulksa.player.dev' versionCode='45' versionName='0.9.3.1-beta'" reports/APK-BADGING.txt

      - name: Package complete mobile delivery
        run: |
          set -euo pipefail
          rm -rf delivery source-delivery
          mkdir delivery source-delivery
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          cp "$APK" delivery/HULK-SA-v0.9.3.1-MOBILE-POLISH-UNIVERSAL-debug.apk
          cp "$AAB" delivery/HULK-SA-v0.9.3.1-MOBILE-POLISH-debug.aab
          cp reports/*.md reports/APK-BADGING.txt delivery/
          cp docs/PHASE-3-ADAPTIVE-FOUNDATION.md delivery/
          cp tools/prepare-v0930-adaptive-ui.py delivery/
          cp -a project/. source-delivery/
          rm -rf source-delivery/.gradle source-delivery/.kotlin source-delivery/build source-delivery/app/build
          (cd source-delivery && zip -qr ../delivery/HULK-SA-Source-v0.9.3.1-MOBILE-POLISH.zip .)
          printf '# HULK SA v0.9.3.1 Mobile Build Report\n\n- Commit: %s\n- Responsive mobile source: PASS\n- Keyboard dismissal: PASS\n- Mobile navigation sizing: PASS\n- Player safe insets: PASS\n- Movie favorite action: PASS\n- Kotlin compilation: PASS\n- Unit tests: PASS\n- Universal APK and AAB: PASS\n- Qualified ABIs: arm64-v8a, armeabi-v7a, x86_64\n' "$GITHUB_SHA" > delivery/BUILD-REPORT-v0.9.3.1.md
          printf '# HULK SA v0.9.3.1 Changelog\n\n- Close the mobile keyboard on submit and outside tap.\n- Distribute primary mobile navigation evenly across compact screens.\n- Respect status and navigation bar safe areas.\n- Compact VOD and live player controls for phone screens.\n- Keep the movie My List action visible with equal-width actions.\n' > delivery/CHANGELOG-v0.9.3.1.md
          (cd delivery && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload complete v0.9.3.1 delivery
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.1-MOBILE-POLISH
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.1-MOBILE-DIAGNOSTICS
          path: |
            archive.sha256
            build-logs/
            reports/
            project/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
