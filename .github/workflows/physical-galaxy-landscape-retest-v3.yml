name: HULK SA Galaxy Landscape Retest V3

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/physical-galaxy-landscape-retest-v3.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  HULK_PORTAL_URL: http://3162356.xyz:8080
  HULK_CONFIG_URL: ''
  APP_APK: app/build/outputs/apk/debug/app-debug.apk
  TEST_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  EVIDENCE_ROOT: build/compatibility-v2/galaxy-landscape-retest-v3

jobs:
  galaxy-landscape-cutout:
    name: galaxy-landscape-cutout-only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/adaptive-ui-compatibility-lab-v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Publish landscape-only run identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Galaxy landscape evidence retest started\n\n- Run: `'$GITHUB_RUN_ID'`\n- Workflow head: `'$GITHUB_SHA'`\n- Application source: `2b4b9704bd6ee367a320968bb425be74ffa32ef9`\n- Profile: API 35, 2340×1080, density 420, font scale 1.5, ar-SA, corner cutout\n- Captures required: Login, Live, Movies and Series with app foreground proof.\n- Portrait and production signing are not part of this run.\n\nPR remains Draft; no merge, release, or force-push.'

      - name: Build current debug and instrumentation APKs
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          bash -n quality/compatibility-v2/collect_runtime_evidence.sh
          bash -n quality/compatibility-v2/run_runtime_profile.sh
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          mkdir -p "$EVIDENCE_ROOT"
          sha256sum "$APP_APK" "$TEST_APK" > "$EVIDENCE_ROOT/APK-SOURCE-SHA256.txt"
          printf 'workflow_head=%s\napplication_source_head=%s\ntest_harness_head=%s\nprofile=landscape\napi=35\ngeometry=2340x1080\ndensity=420\nfont_scale=1.5\nlocale=ar-SA\ncutout=com.android.internal.display.cutout.emulation.corner\n' \
            "$GITHUB_SHA" \
            '2b4b9704bd6ee367a320968bb425be74ffa32ef9' \
            '0dfa255a0d9c57001ede3a401266cf331672e13c' \
            > "$EVIDENCE_ROOT/SOURCE-IDENTITY.txt"

      - name: Prepare independent runtime and screen-evidence wrapper
        run: |
          set -euo pipefail
          mkdir -p build/galaxy-landscape-v3 "$EVIDENCE_ROOT"
          cat > build/galaxy-landscape-v3/run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -u
          mkdir -p "$EVIDENCE_ROOT"

          stable=0
          for attempt in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            activity="$(adb shell service check activity 2>/dev/null || true)"
            package="$(adb shell service check package 2>/dev/null || true)"
            settings="$(adb shell service check settings 2>/dev/null || true)"
            if [[ "$boot" == '1' && "$activity" == *found* && "$package" == *found* && "$settings" == *found* ]]; then
              stable=$((stable + 1))
              [[ "$stable" -ge 3 ]] && break
            else
              stable=0
            fi
            sleep 2
          done
          if [[ "$stable" -lt 3 ]]; then
            printf 'infrastructure_status=70\nreason=android_services_not_stable\n' > "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
            exit 70
          fi
          adb shell am wait-for-broadcast-idle || true

          cutout_package='com.android.internal.display.cutout.emulation.corner'
          adb shell cmd overlay list --user 0 > "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-BEFORE.txt" 2>&1 || true
          if ! grep -F "$cutout_package" "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-BEFORE.txt" >/dev/null; then
            printf 'infrastructure_status=71\nreason=required_corner_cutout_overlay_missing\n' > "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
            exit 71
          fi
          adb shell cmd overlay enable-exclusive --category --user 0 "$cutout_package" || \
            adb shell cmd overlay enable --user 0 "$cutout_package"
          sleep 4
          adb shell cmd overlay list --user 0 > "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt" 2>&1 || true
          grep -F "$cutout_package" "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt" >/dev/null || exit 72
          printf 'enabled_cutout_overlay=%s\n' "$cutout_package" > "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"

          set +e
          bash quality/compatibility-v2/run_runtime_profile.sh \
            'physical-galaxy-landscape-retest-v3-api35' '2340' '1080' '420' '1.5' '0' 'ar-SA' \
            'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' \
            "$EVIDENCE_ROOT"
          runtime_status=$?

          adb shell settings put system font_scale 1.5 >/dev/null 2>&1 || true
          adb shell wm size 2340x1080 >/dev/null 2>&1 || true
          adb shell wm density 420 >/dev/null 2>&1 || true
          adb shell pm grant sa.hulksa.player.dev android.permission.POST_NOTIFICATIONS >/dev/null 2>&1 || true
          adb shell rm -rf /sdcard/Android/data/sa.hulksa.player.dev/files/short-landscape-evidence >/dev/null 2>&1 || true

          adb shell am instrument -w -r \
            -e class 'sa.hulksa.player.compatibilityv2.ShortLandscapeMainShellTest' \
            'sa.hulksa.player.dev.test/androidx.test.runner.AndroidJUnitRunner' \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt" 2>&1
          shell_status=$?
          set -e

          set +e
          python3 quality/compatibility-v2/instrumentation_to_junit.py \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt" \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.xml" \
            --process-status "$shell_status"
          converter_status=$?

          device_evidence='/sdcard/Android/data/sa.hulksa.player.dev/files/short-landscape-evidence'
          evidence_pull_status=0
          for section in live movies series; do
            adb pull "$device_evidence/${section}-full-window.png" \
              "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-full-window.png" >/dev/null 2>&1 || evidence_pull_status=1
            adb pull "$device_evidence/${section}-window.xml" \
              "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-window.xml" >/dev/null 2>&1 || evidence_pull_status=1
          done

          adb shell am force-stop sa.hulksa.player.dev >/dev/null 2>&1 || true
          adb shell pm grant sa.hulksa.player.dev android.permission.POST_NOTIFICATIONS >/dev/null 2>&1 || true
          adb shell am start -W -n sa.hulksa.player.dev/sa.hulksa.player.MainActivity \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-RELAUNCH.txt" 2>&1
          relaunch_status=$?
          sleep 5
          adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-WINDOW-LINES.txt" 2>&1
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-ACTIVITY-LINES.txt" 2>&1
          adb shell uiautomator dump /sdcard/short-landscape-final-window.xml \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-UIAUTOMATOR.txt" 2>&1
          adb pull /sdcard/short-landscape-final-window.xml \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-window.xml" >/dev/null 2>&1
          final_xml_status=$?
          adb exec-out screencap -p > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-full-window.png"
          final_png_status=$?
          adb shell dumpsys window windows > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-WINDOW-WINDOWS.txt" 2>&1
          adb shell dumpsys activity top > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-ACTIVITY-TOP.txt" 2>&1
          adb shell dumpsys input_method | grep -E 'mInputShown|mIsInputViewShown' \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-IME-LINES.txt" 2>&1 || true
          adb logcat -d -v threadtime > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-logcat.txt" 2>&1
          set -e

          printf 'runtime_status=%s\nshell_status=%s\nconverter_status=%s\nevidence_pull_status=%s\nrelaunch_status=%s\nfinal_xml_status=%s\nfinal_png_status=%s\n' \
            "$runtime_status" "$shell_status" "$converter_status" "$evidence_pull_status" \
            "$relaunch_status" "$final_xml_status" "$final_png_status" \
            > "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          exit 0
          SCRIPT
          chmod +x build/galaxy-landscape-v3/run.sh

      - name: Configure Linux KVM
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm -a -w /dev/kvm

      - name: Execute Galaxy landscape profile only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          disk-size: 4096M
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 2340x1080
          script: bash build/galaxy-landscape-v3/run.sh

      - name: Enforce runtime, screen tests, foreground and evidence
        if: always()
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          test -s "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"
          test -s "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt"
          test -s "$EVIDENCE_ROOT/SOURCE-IDENTITY.txt"
          test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt"
          test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.xml"
          test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-full-window.png"
          test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-window.xml"
          test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-WINDOW-LINES.txt"
          test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-ACTIVITY-LINES.txt"
          for section in live movies series; do
            test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-full-window.png"
            test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-window.xml"
          done

          grep -Fx 'runtime_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -Fx 'shell_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -Fx 'converter_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -Fx 'evidence_pull_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -Fx 'relaunch_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -Fx 'final_xml_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -Fx 'final_png_status=0' "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          grep -F 'enabled_cutout_overlay=com.android.internal.display.cutout.emulation.corner' "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"
          grep -F 'sa.hulksa.player.dev' "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-WINDOW-LINES.txt"
          grep -F 'sa.hulksa.player.dev' "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-ACTIVITY-LINES.txt"
          if grep -E 'NexusLauncher|PermissionController|InputMethod' \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-FOREGROUND-WINDOW-LINES.txt"; then
            echo 'Launcher, permission dialog, or IME owns the final foreground window' >&2
            exit 91
          fi

          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime --evidence-root "$EVIDENCE_ROOT" --out "$EVIDENCE_ROOT/gate"

          python3 - "$EVIDENCE_ROOT" <<'PY'
          import struct
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path(sys.argv[1])
          junit_root = ET.parse(evidence / 'SHORT-LANDSCAPE-MAIN-SHELL.xml').getroot()
          tests = int(junit_root.attrib.get('tests', '0'))
          failures = int(junit_root.attrib.get('failures', '0'))
          errors = int(junit_root.attrib.get('errors', '0'))
          if (tests, failures, errors) != (3, 0, 0):
              raise SystemExit(f'Unexpected short-landscape result: tests={tests} failures={failures} errors={errors}')

          expected_geometry = (2340, 1080)
          expected_text = {
              'live': 'قناة اختبار 42',
              'movies': 'فيلم اختبار 40',
              'series': 'مسلسل اختبار 41',
          }

          def png_size(path: Path) -> tuple[int, int]:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit(f'Invalid PNG: {path}')
              return struct.unpack('>II', data[16:24])

          def validate_hierarchy(path: Path, required_text: str | None = None, require_full_bounds: bool = False) -> None:
              root = ET.parse(path).getroot()
              max_right = 0
              max_bottom = 0
              texts = []
              for node in root.iter('node'):
                  texts.append(node.attrib.get('text', ''))
                  bounds = node.attrib.get('bounds', '')
                  try:
                      right_bottom = bounds.rsplit('][', 1)[1].rstrip(']')
                      right, bottom = map(int, right_bottom.split(','))
                  except (IndexError, ValueError):
                      continue
                  if right < 0 or bottom < 0 or right > 2340 or bottom > 1080:
                      raise SystemExit(f'Out-of-window node in {path}: {bounds}')
                  max_right = max(max_right, right)
                  max_bottom = max(max_bottom, bottom)
              if max_right == 0 or max_bottom == 0:
                  raise SystemExit(f'No usable hierarchy bounds in {path}')
              if require_full_bounds and (max_right, max_bottom) != expected_geometry:
                  raise SystemExit(
                      f'XML geometry mismatch for {path}: expected={expected_geometry} actual={(max_right, max_bottom)}'
                  )
              if required_text and required_text not in texts:
                  raise SystemExit(f'Required bottom item is absent from {path}: {required_text!r}')

          pngs = [
              evidence / 'full-window.png',
              evidence / 'SHORT-LANDSCAPE-full-window.png',
          ] + [
              evidence / f'SHORT-LANDSCAPE-{section}-full-window.png'
              for section in expected_text
          ]
          for png in pngs:
              actual = png_size(png)
              if actual != expected_geometry:
                  raise SystemExit(f'PNG geometry mismatch for {png}: expected={expected_geometry} actual={actual}')

          validate_hierarchy(evidence / 'window.xml', require_full_bounds=True)
          validate_hierarchy(evidence / 'SHORT-LANDSCAPE-window.xml', require_full_bounds=True)
          for section, required in expected_text.items():
              validate_hierarchy(
                  evidence / f'SHORT-LANDSCAPE-{section}-window.xml',
                  required_text=required,
              )
          PY

          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-GALAXY-LANDSCAPE-V3-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

      - name: Publish landscape-only completion
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Galaxy landscape evidence retest completed\n\n- Run: `'$GITHUB_RUN_ID'`\n- Workflow head: `'$GITHUB_SHA'`\n- Application source: `2b4b9704bd6ee367a320968bb425be74ffa32ef9`\n- Job status: **'$JOB_STATUS'**\n- Artifact: `HULK-SA-GALAXY-LANDSCAPE-V3-'$GITHUB_RUN_ID'`\n\nRuntime, 3/3 short-landscape tests, per-screen PNG/XML, final foreground ownership and Evidence Gate were collected independently. No Portrait or production-signing job ran. Physical Galaxy remains pending.'
