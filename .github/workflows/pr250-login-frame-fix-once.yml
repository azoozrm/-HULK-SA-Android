name: PR250 Login Frame Fix Once

on:
  push:
    branches:
      - fix/hulk-sa-icon-system-v1-4

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply PR250 login frame fill fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/hulk-sa-icon-system-v1-4
          fetch-depth: 0

      - name: Apply verified TV Login frame correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          login = Path('app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt')
          text = login.read_text(encoding='utf-8')
          start = text.index('private fun LoginBrandRegion(')
          next_fun = text.find('\n@Composable\nprivate fun ', start + 1)
          end = len(text) if next_fun < 0 else next_fun
          block = text[start:end]

          old_bg = '''                .background(\n                    Brush.verticalGradient(\n                        colors = listOf(\n                            Color(0xE612140F),\n                            Color(0xF0080A07),\n                        ),\n                    ),\n                )'''
          new_bg = '''                .background(Color.Black)'''
          if block.count(old_bg) != 1:
              raise SystemExit(f'Login brand background contract mismatch: {block.count(old_bg)} matches')
          block = block.replace(old_bg, new_bg, 1)

          old_padding = '                .padding(20.dp)'
          new_padding = '                .padding(8.dp)'
          if block.count(old_padding) != 1:
              raise SystemExit(f'Login brand padding contract mismatch: {block.count(old_padding)} matches')
          block = block.replace(old_padding, new_padding, 1)
          login.write_text(text[:start] + block + text[end:], encoding='utf-8')

          logo = Path('app/src/main/res/drawable-television/hulk_sa_logo.xml')
          logo_text = logo.read_text(encoding='utf-8')
          black_path = '''    <path\n        android:fillColor="#000000"\n        android:pathData="M0,0 H1254 V1254 H0 Z" />\n'''
          if logo_text.count(black_path) != 1:
              raise SystemExit(f'TV login drawable black tile mismatch: {logo_text.count(black_path)} matches')
          logo.write_text(logo_text.replace(black_path, '', 1), encoding='utf-8')
          PY

          grep -A28 -F 'private fun LoginBrandRegion(' app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt | grep -F '.background(Color.Black)'
          grep -A28 -F 'private fun LoginBrandRegion(' app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt | grep -F '.padding(8.dp)'
          ! grep -F 'android:pathData="M0,0 H1254 V1254 H0 Z"' app/src/main/res/drawable-television/hulk_sa_logo.xml

      - name: Commit production correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr250-login-frame-fix-once.yml
          git add app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt \
                  app/src/main/res/drawable-television/hulk_sa_logo.xml
          git diff --cached --check
          git commit -m 'fix: fill TV login brand frame correctly'
          git push origin HEAD:fix/hulk-sa-icon-system-v1-4
