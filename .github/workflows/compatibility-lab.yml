name: HULK SA Compatibility Lab

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/compatibility-lab.yml'
      - 'qa/compatibility/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'release/v0.9.3.16/**'
      - 'release/v0.9.3.17/**'
      - 'release/v0.9.3.18/**'
      - 'tools/prepare-v09*.py'
      - 'tools/repair-v09120.py'
      - 'HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/compatibility-lab.yml'
      - 'qa/compatibility/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'release/v0.9.3.16/**'
      - 'release/v0.9.3.17/**'
      - 'release/v0.9.3.18/**'
      - 'tools/prepare-v09*.py'
      - 'tools/repair-v09120.py'
      - 'HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
  workflow_dispatch:
    inputs:
      enforce_findings:
        description: Fail jobs when the app has critical compatibility findings
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hulk-sa-compatibility-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-plan:
    name: Validate lab plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      device_count: ${{ steps.plan.outputs.device_count }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate and export device matrix
        id: plan
        run: |
          set -euo pipefail
          python3 qa/compatibility/lab_config.py --validate
          python3 qa/compatibility/lab_config.py --github-output "$GITHUB_OUTPUT"
          {
            echo '## Compatibility Lab plan'
            echo
            python3 qa/compatibility/lab_config.py --markdown
          } >> "$GITHUB_STEP_SUMMARY"

  build-lab-apk:
    name: Build debug-only lab APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate lab tooling
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -v
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh
          bash qa/compatibility/run-native-emulator.sh --help >/dev/null

      - name: Prepare canonical source and inject debug harness
        run: |
          set -euo pipefail
          bash qa/compatibility/prepare-project.sh "$GITHUB_WORKSPACE/project"
          test -f project/app/src/debug/java/sa/hulksa/player/qa/QaActivity.kt
          test ! -e project/app/src/main/java/sa/hulksa/player/qa

      - name: Compile, unit test and assemble lab APK
        working-directory: project
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest :app:assembleDebug \
            -PHULK_PORTAL_URL=https://example.invalid \
            --stacktrace 2>&1 | tee ../compatibility-lab-build.log

      - name: Verify and package lab APK
        run: |
          set -euo pipefail
          mkdir -p lab-apk
          APK="$(find project/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk
          cp compatibility-lab-build.log lab-apk/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > lab-apk/APK-BADGING.txt
          grep -q "package: name='sa.hulksa.player.dev'" lab-apk/APK-BADGING.txt
          grep -q "sa.hulksa.player.qa.QaActivity" <(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml
          )
          (
            cd lab-apk
            sha256sum HULK-SA-COMPATIBILITY-LAB-debug.apk > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-LAB-APK
          path: lab-apk/
          if-no-files-found: error
          retention-days: 14

  device-lab:
    name: ${{ matrix.name }} · API ${{ matrix.api }}
    needs:
      - lab-plan
      - build-lab-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.lab-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: HULK-SA-COMPATIBILITY-LAB-APK
          path: lab-apk

      - name: Install report dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture pages, hierarchy, focus, logs and performance
        id: emulator
        if: matrix.id != 'android-tv-4k-api36'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8G
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
            -skin ${{ matrix.boot_skin }}
          script: >-
            python3 qa/compatibility/run-lab.py
            --apk lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk
            --device-id '${{ matrix.id }}'
            --device-name '${{ matrix.name }}'
            --family '${{ matrix.family }}'
            --api '${{ matrix.api }}'
            --target '${{ matrix.target }}'
            --arch '${{ matrix.arch }}'
            --profile '${{ matrix.profile }}'
            --width '${{ matrix.width }}'
            --height '${{ matrix.height }}'
            --density '${{ matrix.density }}'
            --orientations '${{ matrix.orientations }}'
            --font-scales '${{ matrix.font_scales }}'
            --is-tv '${{ matrix.is_tv }}'
            --out 'compatibility-results/${{ matrix.id }}'

      - name: Capture native Android TV 4K after stable ADB boot
        if: matrix.id == 'android-tv-4k-api36'
        continue-on-error: true
        run: |
          bash qa/compatibility/run-native-emulator.sh \
            --api '${{ matrix.api }}' \
            --target '${{ matrix.target }}' \
            --arch '${{ matrix.arch }}' \
            --profile '${{ matrix.profile }}' \
            --skin '${{ matrix.boot_skin }}' \
            --result-dir 'compatibility-results/${{ matrix.id }}' \
            -- \
            python3 qa/compatibility/run-lab.py \
              --apk lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk \
              --device-id '${{ matrix.id }}' \
              --device-name '${{ matrix.name }}' \
              --family '${{ matrix.family }}' \
              --api '${{ matrix.api }}' \
              --target '${{ matrix.target }}' \
              --arch '${{ matrix.arch }}' \
              --profile '${{ matrix.profile }}' \
              --width '${{ matrix.width }}' \
              --height '${{ matrix.height }}' \
              --density '${{ matrix.density }}' \
              --orientations '${{ matrix.orientations }}' \
              --font-scales '${{ matrix.font_scales }}' \
              --is-tv '${{ matrix.is_tv }}' \
              --out 'compatibility-results/${{ matrix.id }}' \
              --serial emulator-5554

      - name: Analyze primary capture
        id: primary-analysis
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT='compatibility-results/${{ matrix.id }}'
          if [[ -s "$OUT/run-manifest.json" ]]; then
            python3 qa/compatibility/analyze.py "$OUT"
          else
            echo 'No run manifest was produced by the primary emulator attempt.'
            exit 2
          fi

      - name: Check whether emulator retry is required
        id: retry-check
        if: always()
        run: |
          set -euo pipefail
          SUMMARY='compatibility-results/${{ matrix.id }}/summary.json'
          if [[ ! -s "$SUMMARY" ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$SUMMARY" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          summary = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          needed = int(summary.get('infrastructure_error_count', 0)) > 0
          with pathlib.Path(sys.argv[2]).open('a', encoding='utf-8') as handle:
              handle.write(f"needed={'true' if needed else 'false'}\n")
          PY

      - name: Retry capture after transient emulator failure
        if: >-
          steps.retry-check.outputs.needed == 'true' &&
          matrix.id != 'android-tv-4k-api36'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8G
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
            -skin ${{ matrix.boot_skin }}
          script: >-
            python3 qa/compatibility/run-lab.py
            --apk lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk
            --device-id '${{ matrix.id }}'
            --device-name '${{ matrix.name }}'
            --family '${{ matrix.family }}'
            --api '${{ matrix.api }}'
            --target '${{ matrix.target }}'
            --arch '${{ matrix.arch }}'
            --profile '${{ matrix.profile }}'
            --width '${{ matrix.width }}'
            --height '${{ matrix.height }}'
            --density '${{ matrix.density }}'
            --orientations '${{ matrix.orientations }}'
            --font-scales '${{ matrix.font_scales }}'
            --is-tv '${{ matrix.is_tv }}'
            --out 'compatibility-results/${{ matrix.id }}'

      - name: Retry native Android TV 4K after transient failure
        if: >-
          steps.retry-check.outputs.needed == 'true' &&
          matrix.id == 'android-tv-4k-api36'
        continue-on-error: true
        run: |
          bash qa/compatibility/run-native-emulator.sh \
            --api '${{ matrix.api }}' \
            --target '${{ matrix.target }}' \
            --arch '${{ matrix.arch }}' \
            --profile '${{ matrix.profile }}' \
            --skin '${{ matrix.boot_skin }}' \
            --result-dir 'compatibility-results/${{ matrix.id }}' \
            -- \
            python3 qa/compatibility/run-lab.py \
              --apk lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk \
              --device-id '${{ matrix.id }}' \
              --device-name '${{ matrix.name }}' \
              --family '${{ matrix.family }}' \
              --api '${{ matrix.api }}' \
              --target '${{ matrix.target }}' \
              --arch '${{ matrix.arch }}' \
              --profile '${{ matrix.profile }}' \
              --width '${{ matrix.width }}' \
              --height '${{ matrix.height }}' \
              --density '${{ matrix.density }}' \
              --orientations '${{ matrix.orientations }}' \
              --font-scales '${{ matrix.font_scales }}' \
              --is-tv '${{ matrix.is_tv }}' \
              --out 'compatibility-results/${{ matrix.id }}' \
              --serial emulator-5554

      - name: Analyze retry capture
        if: always() && steps.retry-check.outputs.needed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT='compatibility-results/${{ matrix.id }}'
          if [[ -s "$OUT/run-manifest.json" ]]; then
            python3 qa/compatibility/analyze.py "$OUT"
          else
            echo 'No run manifest was produced by the retry emulator attempt.'
            exit 2
          fi

      - name: Preserve result even when emulator setup is blocked
        if: always()
        run: |
          set -euo pipefail
          OUT='compatibility-results/${{ matrix.id }}'
          mkdir -p "$OUT"
          if [[ -s "$OUT/summary.json" ]]; then
            exit 0
          fi
          if [[ -s "$OUT/run-manifest.json" ]]; then
            python3 qa/compatibility/analyze.py "$OUT"
            exit 0
          fi
          cat > "$OUT/summary.json" <<JSON
          {
            "device_id": "${{ matrix.id }}",
            "device_name": "${{ matrix.name }}",
            "family": "${{ matrix.family }}",
            "api": "${{ matrix.api }}",
            "critical_finding_count": 0,
            "infrastructure_error_count": 1,
            "status": "infrastructure_blocked",
            "infrastructure_error": "emulator did not produce a run manifest"
          }
          JSON

      - name: Enforce infrastructure and critical findings
        if: always()
        env:
          ENFORCE_FINDINGS: ${{ github.event_name != 'workflow_dispatch' || inputs.enforce_findings }}
        run: |
          set -euo pipefail
          python3 qa/compatibility/gate.py \
            'compatibility-results/${{ matrix.id }}/summary.json' \
            --enforce-findings "$ENFORCE_FINDINGS"

      - name: Upload device artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.id }}
          path: compatibility-results/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14
