name: HULK SA Compatibility Lab

on:
  workflow_call:
    inputs:
      enforce_findings:
        description: Fail when deterministic application findings are critical
        required: false
        type: boolean
        default: true
      source_head_sha:
        description: Exact source commit under qualification
        required: false
        type: string
        default: ''
      base_sha:
        description: Pull request base commit when applicable
        required: false
        type: string
        default: ''
      pr_number:
        description: Pull request number when applicable
        required: false
        type: string
        default: ''
      test_variant:
        description: Calling quality gate variant
        required: false
        type: string
        default: compatibility-runtime
  workflow_dispatch:
    inputs:
      enforce_findings:
        description: Fail jobs when the app has critical compatibility findings
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hulk-sa-compatibility-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-plan:
    name: Validate lab plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      device_count: ${{ steps.plan.outputs.device_count }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate and export device matrix
        id: plan
        run: |
          set -euo pipefail
          python3 qa/compatibility/lab_config.py --validate
          python3 qa/compatibility/lab_config.py --github-output "$GITHUB_OUTPUT"
          {
            echo '## Compatibility Lab plan'
            echo
            python3 qa/compatibility/lab_config.py --markdown
          } >> "$GITHUB_STEP_SUMMARY"

  build-lab-apk:
    name: Build debug-only lab APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate lab tooling
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -v
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh
          bash qa/compatibility/run-native-emulator.sh --help >/dev/null

      - name: Prepare canonical source and inject debug harness
        run: |
          set -euo pipefail
          bash qa/compatibility/prepare-project.sh "$GITHUB_WORKSPACE/project"
          test -f project/app/src/debug/java/sa/hulksa/player/qa/QaActivity.kt
          test -s project/app/src/debug/quality-marker-injection.json
          test ! -e project/app/src/main/java/sa/hulksa/player/qa
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('project/app/src/debug/quality-marker-injection.json').read_text()
          )
          assert report['schema_version'] == 1
          assert report['replacement_count'] == 13
          assert report['original_sha256'] != report['instrumented_sha256']
          assert report['markers']
          print('PASS: disposable marker injection report is complete')
          PY

      - name: Compile, unit test and assemble lab APK
        working-directory: project
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest :app:assembleDebug \
            -PHULK_PORTAL_URL=https://example.invalid \
            --stacktrace 2>&1 | tee ../compatibility-lab-build.log

      - name: Verify and package lab APK
        run: |
          set -euo pipefail
          mkdir -p lab-apk
          APK="$(find project/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk
          cp compatibility-lab-build.log lab-apk/
          cp project/app/src/debug/quality-marker-injection.json lab-apk/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > lab-apk/APK-BADGING.txt
          grep -q "package: name='sa.hulksa.player.dev'" lab-apk/APK-BADGING.txt
          grep -q "sa.hulksa.player.qa.QaActivity" <(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml
          )
          (
            cd lab-apk
            sha256sum \
              HULK-SA-COMPATIBILITY-LAB-debug.apk \
              compatibility-lab-build.log \
              APK-BADGING.txt \
              quality-marker-injection.json \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-LAB-APK
          path: lab-apk/
          if-no-files-found: error
          retention-days: 14

  device-lab:
    name: ${{ matrix.name }} · API ${{ matrix.api }}
    needs:
      - lab-plan
      - build-lab-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.lab-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: HULK-SA-COMPATIBILITY-LAB-APK
          path: lab-apk

      - name: Validate packaged debug marker evidence
        run: |
          set -euo pipefail
          test -s lab-apk/quality-marker-injection.json
          (
            cd lab-apk
            sha256sum -c SHA256SUMS.txt
          )
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('lab-apk/quality-marker-injection.json').read_text())
          assert report['replacement_count'] == 13
          assert report['original_sha256'] != report['instrumented_sha256']
          print('PASS: packaged marker evidence verified')
          PY

      - name: Install report dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture pages after stable Android service boot
        id: emulator
        continue-on-error: true
        run: |
          bash qa/compatibility/run-native-emulator.sh \
            --api '${{ matrix.api }}' \
            --target '${{ matrix.target }}' \
            --arch '${{ matrix.arch }}' \
            --profile '${{ matrix.profile }}' \
            --skin '${{ matrix.boot_skin }}' \
            --result-dir 'compatibility-results/${{ matrix.id }}' \
            -- \
            python3 qa/compatibility/run-lab.py \
              --apk lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk \
              --device-id '${{ matrix.id }}' \
              --device-name '${{ matrix.name }}' \
              --family '${{ matrix.family }}' \
              --api '${{ matrix.api }}' \
              --target '${{ matrix.target }}' \
              --arch '${{ matrix.arch }}' \
              --profile '${{ matrix.profile }}' \
              --width '${{ matrix.width }}' \
              --height '${{ matrix.height }}' \
              --density '${{ matrix.density }}' \
              --orientations '${{ matrix.orientations }}' \
              --font-scales '${{ matrix.font_scales }}' \
              --is-tv '${{ matrix.is_tv }}' \
              --out 'compatibility-results/${{ matrix.id }}' \
              --serial emulator-5554

      - name: Check whether emulator retry is required
        id: retry-check
        if: always()
        run: |
          SUMMARY='compatibility-results/${{ matrix.id }}/summary.json'
          if [[ ! -s "$SUMMARY" ]] || python3 -c \
            'import json,sys; sys.exit(0 if int(json.load(open(sys.argv[1]))["infrastructure_error_count"]) else 1)' \
            "$SUMMARY"; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve first failed attempt before infrastructure retry
        if: steps.retry-check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          OUT='compatibility-results/${{ matrix.id }}'
          PRESERVED="$RUNNER_TEMP/${{ matrix.id }}-attempt-1"
          mkdir -p "$OUT"
          if [[ ! -s "$OUT/summary.json" ]]; then
            python3 qa/compatibility/make-blocked-result.py \
              --out "$OUT" \
              --device-id '${{ matrix.id }}' \
              --device-name '${{ matrix.name }}' \
              --family '${{ matrix.family }}' \
              --api '${{ matrix.api }}' \
              --target '${{ matrix.target }}' \
              --arch '${{ matrix.arch }}' \
              --profile '${{ matrix.profile }}' \
              --width '${{ matrix.width }}' \
              --height '${{ matrix.height }}' \
              --density '${{ matrix.density }}' \
              --orientations '${{ matrix.orientations }}' \
              --font-scales '${{ matrix.font_scales }}' \
              --is-tv '${{ matrix.is_tv }}' \
              --reason 'First emulator attempt produced no summary.'
          fi
          cp -a "$OUT" "$PRESERVED"
          mkdir -p "$OUT/attempts"
          mv "$PRESERVED" "$OUT/attempts/attempt-1"
          echo 'PASS: first failed attempt retained under attempts/attempt-1'

      - name: Retry after transient emulator infrastructure failure
        if: steps.retry-check.outputs.needed == 'true'
        continue-on-error: true
        run: |
          bash qa/compatibility/run-native-emulator.sh \
            --api '${{ matrix.api }}' \
            --target '${{ matrix.target }}' \
            --arch '${{ matrix.arch }}' \
            --profile '${{ matrix.profile }}' \
            --skin '${{ matrix.boot_skin }}' \
            --result-dir 'compatibility-results/${{ matrix.id }}' \
            -- \
            python3 qa/compatibility/run-lab.py \
              --apk lab-apk/HULK-SA-COMPATIBILITY-LAB-debug.apk \
              --device-id '${{ matrix.id }}' \
              --device-name '${{ matrix.name }}' \
              --family '${{ matrix.family }}' \
              --api '${{ matrix.api }}' \
              --target '${{ matrix.target }}' \
              --arch '${{ matrix.arch }}' \
              --profile '${{ matrix.profile }}' \
              --width '${{ matrix.width }}' \
              --height '${{ matrix.height }}' \
              --density '${{ matrix.density }}' \
              --orientations '${{ matrix.orientations }}' \
              --font-scales '${{ matrix.font_scales }}' \
              --is-tv '${{ matrix.is_tv }}' \
              --out 'compatibility-results/${{ matrix.id }}' \
              --serial emulator-5554

      - name: Preserve final result and marker provenance
        if: always()
        run: |
          set -euo pipefail
          OUT='compatibility-results/${{ matrix.id }}'
          mkdir -p "$OUT"
          if [[ ! -s "$OUT/summary.json" ]]; then
            python3 qa/compatibility/make-blocked-result.py \
              --out "$OUT" \
              --device-id '${{ matrix.id }}' \
              --device-name '${{ matrix.name }}' \
              --family '${{ matrix.family }}' \
              --api '${{ matrix.api }}' \
              --target '${{ matrix.target }}' \
              --arch '${{ matrix.arch }}' \
              --profile '${{ matrix.profile }}' \
              --width '${{ matrix.width }}' \
              --height '${{ matrix.height }}' \
              --density '${{ matrix.density }}' \
              --orientations '${{ matrix.orientations }}' \
              --font-scales '${{ matrix.font_scales }}' \
              --is-tv '${{ matrix.is_tv }}' \
              --reason 'Emulator or capture driver produced no final summary.'
          fi
          cp lab-apk/quality-marker-injection.json "$OUT/quality-marker-injection.json"
          test -s "$OUT/quality-marker-injection.json"

      - name: Enforce infrastructure and critical findings
        if: always()
        env:
          ENFORCE_FINDINGS: ${{ inputs.enforce_findings }}
        run: |
          set -euo pipefail
          python3 qa/compatibility/gate.py \
            'compatibility-results/${{ matrix.id }}/summary.json' \
            --enforce-findings "$ENFORCE_FINDINGS"

      - name: Upload device artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.id }}
          path: compatibility-results/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14

  aggregate-evidence:
    name: Aggregate and enforce complete evidence
    if: always()
    needs:
      - lab-plan
      - device-lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: compatibility-*
          path: device-artifacts

      - name: Install report dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt

      - name: Build Compatibility and Quality Lab reports
        env:
          QUALITY_BUILD_SHA: ${{ inputs.source_head_sha || github.sha }}
          QUALITY_SOURCE_HEAD_SHA: ${{ inputs.source_head_sha || github.sha }}
          QUALITY_BASE_SHA: ${{ inputs.base_sha }}
          QUALITY_PR_NUMBER: ${{ inputs.pr_number }}
          QUALITY_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          QUALITY_TEST_VARIANT: ${{ inputs.test_variant || 'compatibility-runtime' }}
        run: |
          set -euo pipefail
          python3 qa/compatibility/aggregate.py device-artifacts aggregate-report
          expected_devices="$(
            python3 -c 'from qa.compatibility.lab_config import DEVICES; print(",".join(item["id"] for item in DEVICES))'
          )"
          python3 -m qa.quality.reporters.aggregate \
            --input device-artifacts \
            --output quality-report \
            --build-sha "$QUALITY_BUILD_SHA" \
            --source-branch "$QUALITY_SOURCE_BRANCH" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --pr-number "$QUALITY_PR_NUMBER" \
            --source-head-sha "$QUALITY_SOURCE_HEAD_SHA" \
            --base-sha "$QUALITY_BASE_SHA" \
            --test-variant "$QUALITY_TEST_VARIANT" \
            --expected-devices "$expected_devices"
          cat aggregate-report/GITHUB_STEP_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify mandatory aggregate artifacts
        run: |
          set -euo pipefail
          for required in \
            SUMMARY.json REPORT.md REPORT.html junit.xml run-manifest.json \
            findings.json coverage.json impact.json SHA256SUMS; do
            test -s "quality-report/$required"
          done
          (
            cd quality-report
            sha256sum -c SHA256SUMS
          )

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-QUALITY-LAB-AGGREGATE
          path: |
            aggregate-report/
            quality-report/
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed enforcement
        if: always()
        env:
          ENFORCE_FINDINGS: ${{ inputs.enforce_findings }}
        run: |
          set -euo pipefail
          test -s aggregate-report/COMPATIBILITY-LAB-SUMMARY.json
          python3 qa/compatibility/gate.py \
            aggregate-report/COMPATIBILITY-LAB-SUMMARY.json \
            --enforce-findings "$ENFORCE_FINDINGS"
