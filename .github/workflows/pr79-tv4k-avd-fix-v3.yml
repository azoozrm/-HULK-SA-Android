name: PR79 TV 4K AVD Repair V3

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-tv4k-avd-fix-v3.yml

permissions:
  contents: write

concurrency:
  group: pr79-tv4k-avd-repair-v3
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - name: Generate and verify permanent repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          Path('quality/compatibility-v2/prepare_avd_profile.sh').write_text(dedent(r'''\
          #!/usr/bin/env bash
          set -Eeuo pipefail

          width="${1:?width px is required}"
          height="${2:?height px is required}"
          density="${3:?density dpi is required}"
          avd_name="${4:-test}"
          avd_home="${ANDROID_AVD_HOME:-${HOME}/.android/avd}"
          config="${avd_home}/${avd_name}.avd/config.ini"

          if [[ ! -f "$config" ]]; then
            echo "AVD config is missing: $config" >&2
            exit 2
          fi

          python3 - "$config" "$width" "$height" "$density" <<'PY_CONFIG'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          width, height, density = sys.argv[2:]
          replacements = {
              'skin.name': f'{width}x{height}',
              'skin.path': f'{width}x{height}',
              'hw.lcd.width': width,
              'hw.lcd.height': height,
              'hw.lcd.density': density,
          }
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          seen = set()
          for line in lines:
              key = line.split('=', 1)[0].strip() if '=' in line else ''
              if key in replacements:
                  output.append(f'{key}={replacements[key]}')
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in replacements.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY_CONFIG

          for expected in \
            "skin.name=${width}x${height}" \
            "skin.path=${width}x${height}" \
            "hw.lcd.width=${width}" \
            "hw.lcd.height=${height}" \
            "hw.lcd.density=${density}"; do
            grep -Fxq "$expected" "$config" || {
              echo "AVD config verification failed: $expected" >&2
              exit 3
            }
          done
          echo "Prepared ${avd_name}: ${width}x${height} @ ${density}dpi"
          '''), encoding='utf-8')

          dollar = '$'
          braces = lambda value: dollar + '{{ ' + value + ' }}'
          full_width = braces('matrix.width')
          full_height = braces('matrix.height')
          full_density = braces('matrix.density')
          targeted_width = braces('needs.resolve-profile.outputs.width')
          targeted_height = braces('needs.resolve-profile.outputs.height')
          targeted_density = braces('needs.resolve-profile.outputs.density')

          full = Path('.github/workflows/compatibility-v2-full.yml')
          full_text = full.read_text(encoding='utf-8')
          full_emulator = (
              '          emulator-options: -no-window -gpu swiftshader_indirect -noaudio '
              '-no-boot-anim -no-metrics -camera-back none -no-snapshot-save -skin '
              + full_width + 'x' + full_height + '\n'
          )
          full_prelaunch = (
              "          pre-emulator-launch-script: bash quality/compatibility-v2/prepare_avd_profile.sh '"
              + full_width + "' '" + full_height + "' '" + full_density + "' 'test'\n"
          )
          if full_prelaunch not in full_text:
              if full_emulator not in full_text:
                  raise SystemExit('Full Matrix emulator-options marker is missing')
              full_text = full_text.replace(full_emulator, full_emulator + full_prelaunch, 1)
          full_syntax = '          bash -n quality/compatibility-v2/configure_emulator_profile.sh\n'
          helper_syntax = '          bash -n quality/compatibility-v2/prepare_avd_profile.sh\n'
          if helper_syntax not in full_text:
              if full_syntax not in full_text:
                  raise SystemExit('Full Matrix shell-validation marker is missing')
              full_text = full_text.replace(full_syntax, full_syntax + helper_syntax, 1)
          full.write_text(full_text, encoding='utf-8')

          targeted = Path('.github/workflows/compatibility-v2-targeted.yml')
          targeted_text = targeted.read_text(encoding='utf-8')
          targeted_emulator = (
              '          emulator-options: -no-window -gpu swiftshader_indirect -noaudio '
              '-no-boot-anim -no-metrics -camera-back none -skin '
              + targeted_width + 'x' + targeted_height + '\n'
          )
          targeted_prelaunch = (
              "          pre-emulator-launch-script: bash quality/compatibility-v2/prepare_avd_profile.sh '"
              + targeted_width + "' '" + targeted_height + "' '" + targeted_density + "' 'test'\n"
          )
          if targeted_prelaunch not in targeted_text:
              if targeted_emulator not in targeted_text:
                  raise SystemExit('Targeted emulator-options marker is missing')
              targeted_text = targeted_text.replace(targeted_emulator, targeted_emulator + targeted_prelaunch, 1)
          targeted_syntax = '          bash -n quality/compatibility-v2/configure_emulator_profile.sh\n'
          if helper_syntax not in targeted_text:
              if targeted_syntax not in targeted_text:
                  raise SystemExit('Targeted shell-validation marker is missing')
              targeted_text = targeted_text.replace(targeted_syntax, targeted_syntax + helper_syntax, 1)
          targeted.write_text(targeted_text, encoding='utf-8')

          Path('quality/compatibility-v2/tests/test_avd_profile_preparation.py').write_text(dedent(r'''\
          from __future__ import annotations

          import os
          import subprocess
          import tempfile
          import unittest
          from pathlib import Path


          class AvdProfilePreparationTest(unittest.TestCase):
              def test_helper_rewrites_stale_tv_profile_geometry(self) -> None:
                  helper = Path('quality/compatibility-v2/prepare_avd_profile.sh').resolve()
                  with tempfile.TemporaryDirectory() as temp:
                      avd_home = Path(temp) / 'avd'
                      config = avd_home / 'test.avd' / 'config.ini'
                      config.parent.mkdir(parents=True)
                      config.write_text(
                          'skin.name=1920x1080\n'
                          'skin.path=1920x1080\n'
                          'hw.lcd.width=1920\n'
                          'hw.lcd.height=1080\n'
                          'hw.lcd.density=320\n',
                          encoding='utf-8',
                      )
                      env = dict(os.environ, ANDROID_AVD_HOME=str(avd_home))
                      subprocess.run(
                          ['bash', str(helper), '3840', '2160', '640', 'test'],
                          check=True,
                          env=env,
                          capture_output=True,
                          text=True,
                      )
                      content = config.read_text(encoding='utf-8')
                      for expected in (
                          'skin.name=3840x2160',
                          'skin.path=3840x2160',
                          'hw.lcd.width=3840',
                          'hw.lcd.height=2160',
                          'hw.lcd.density=640',
                      ):
                          self.assertIn(expected, content)
                      self.assertNotIn('skin.name=1920x1080', content)

              def test_workflows_prepare_exact_avd_before_launch(self) -> None:
                  full = Path('.github/workflows/compatibility-v2-full.yml').read_text(encoding='utf-8')
                  targeted = Path('.github/workflows/compatibility-v2-targeted.yml').read_text(encoding='utf-8')
                  marker = 'pre-emulator-launch-script: bash quality/compatibility-v2/prepare_avd_profile.sh'
                  self.assertIn(marker, full)
                  self.assertIn(marker, targeted)
                  self.assertIn('matrix.width', full)
                  self.assertIn('matrix.height', full)
                  self.assertIn('matrix.density', full)
                  self.assertIn('needs.resolve-profile.outputs.width', targeted)
                  self.assertIn('needs.resolve-profile.outputs.height', targeted)
                  self.assertIn('needs.resolve-profile.outputs.density', targeted)
                  self.assertIn('bash -n quality/compatibility-v2/prepare_avd_profile.sh', full)
                  self.assertIn('bash -n quality/compatibility-v2/prepare_avd_profile.sh', targeted)


          if __name__ == '__main__':
              unittest.main()
          '''), encoding='utf-8')

          Path('quality/compatibility-v2/run-full.request').write_text(
              'requested_for_parent=9d7160fa0d0fa67c65429ae42e5065213c7bdb15\n'
              'reason=verify-tv-4k-avd-config-before-emulator-launch\n'
              'request_sequence=13\n'
              'requested_at=2026-08-03T20:02:00Z\n',
              encoding='utf-8',
          )
          PY

          chmod +x quality/compatibility-v2/prepare_avd_profile.sh
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          bash -n quality/compatibility-v2/prepare_avd_profile.sh
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          python3 - <<'PY'
          import yaml
          for path in (
              '.github/workflows/compatibility-v2-full.yml',
              '.github/workflows/compatibility-v2-targeted.yml',
          ):
              with open(path, encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          PY
          git diff --check

      - name: Commit verified permanent repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/pr79-tv4k-avd-fix.yml \
            .github/workflows/pr79-tv4k-avd-fix-v2.yml \
            .github/workflows/pr79-tv4k-avd-fix-v3.yml
          git add \
            .github/workflows/compatibility-v2-full.yml \
            .github/workflows/compatibility-v2-targeted.yml \
            quality/compatibility-v2/prepare_avd_profile.sh \
            quality/compatibility-v2/tests/test_avd_profile_preparation.py \
            quality/compatibility-v2/run-full.request
          git commit -m 'fix: prepare exact AVD geometry before emulator launch' \
            -m 'Replace stale Android TV hardware geometry in config.ini after AVD creation and before boot. Apply the same contract to Full Matrix and targeted retests, add executable regression coverage, and request a fresh fail-closed 17-profile qualification.'
          git push origin HEAD:fix/v09320-galaxy-landscape-clean
