name: Apply isolated PR57 download focus correction

on:
  pull_request:
    branches:
      - fix/v09318-production-host-qualification
    paths:
      - .github/workflows/pr57-download-focus-apply.yml

permissions:
  contents: write

concurrency:
  group: pr57-download-focus-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pr57-download-focus-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pr57-download-focus-actions
          fetch-depth: 0

      - name: Verify exact PR57 production source
        run: |
          set -euo pipefail
          cat > /tmp/EXPECTED-SOURCE.sha256 <<'EOF'
          7ee74b8fdf0767a7d4ba4f4eaa6f1d3f92b7862db75404b89efba27aec373f16  app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          3c61c40081ed17f215dffe00dba4e834a8ca19de8c19c897e57baab6714c1075  app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt
          EOF
          sha256sum -c /tmp/EXPECTED-SOURCE.sha256
          ! grep -Eq 'qa-tv-|qaMarker|qaTvPageContent' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt

      - name: Apply reviewable source patches
        run: |
          set -euo pipefail
          git apply --check tools/pr57-mainshell-download-focus.patch
          git apply --check tools/pr57-components-focus.patch
          git apply tools/pr57-mainshell-download-focus.patch
          git apply tools/pr57-components-focus.patch
          install -m 0644 tools/pr57-DownloadFocusPolicy.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/DownloadFocusPolicy.kt
          install -m 0644 tools/pr57-DownloadFocusPolicyTest.kt \
            app/src/test/java/sa/hulksa/player/ui/screens/DownloadFocusPolicyTest.kt

      - name: Refresh canonical hashes and enforce product invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          manifest = root / 'qa/canonical/canonical-source.sha256'
          rows = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              digest, path = line.split('  ', 1)
              rows[path] = digest

          changed = (
              'app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt',
              'app/src/main/java/sa/hulksa/player/ui/screens/DownloadFocusPolicy.kt',
              'app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt',
              'app/src/test/java/sa/hulksa/player/ui/screens/DownloadFocusPolicyTest.kt',
          )
          for path in changed:
              rows[path] = hashlib.sha256((root / path).read_bytes()).hexdigest()
          manifest.write_text(
              ''.join(f'{rows[path]}  {path}\n' for path in sorted(rows)),
              encoding='utf-8',
          )

          main = (root / changed[2]).read_text(encoding='utf-8')
          components = (root / changed[0]).read_text(encoding='utf-8')
          required = (
              'height(44.dp).focusGroup()',
              'DownloadFocusLocation.toolbar',
              'DownloadFocusLocation.card',
              'outlined = true',
              'focusRequester(focusRequesters.primary)',
              'focusRequester(focusRequesters.priority)',
              'focusRequester(focusRequesters.cancel)',
          )
          missing = [token for token in required if token not in main]
          if missing:
              raise SystemExit(f'missing product focus invariants: {missing}')
          forbidden = [token for token in ('qa-tv-', 'qaMarker', 'qaTvPageContent', 'actionRequester') if token in main]
          if forbidden:
              raise SystemExit(f'forbidden production markers or legacy focus state: {forbidden}')
          if components.count('contentDescription = text') < 2:
              raise SystemExit('shared focus controls are missing stable semantic labels')
          if rows['app/src/main/res/drawable-nodpi/hulk_sa_logo.webp'] != '2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e':
              raise SystemExit('approved logo hash changed')
          print('PASS: product actions, deterministic focus graph, semantics and canonical hashes verified')
          PY
          git diff --check

      - name: Commit only the production correction
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/pr57-download-focus-apply.yml \
            .github/workflows/pr57-download-focus-patch.yml \
            tools/pr57-mainshell-download-focus.patch \
            tools/pr57-components-focus.patch \
            tools/pr57-DownloadFocusPolicy.kt \
            tools/pr57-DownloadFocusPolicyTest.kt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app qa/canonical/canonical-source.sha256
          git commit -m 'fix: make TV download actions visible and fully focusable'
          git push origin HEAD:fix/pr57-download-focus-actions
