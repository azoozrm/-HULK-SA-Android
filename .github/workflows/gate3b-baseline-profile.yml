name: HULK SA Gate 3B Baseline Profile

# Protected Gate 3B generation of baseline-prof.txt on the GitHub-hosted Android TV
# API 36 x86_64 emulator. Authenticates the benchmark target with the protected
# production-e2e account, reuses the Gate 3A.5 HOME -> LIVE navigation contract, and
# uploads sanitized evidence only. It never adopts the profile into the shipping app.

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3b-baseline-profile

permissions:
  contents: read

concurrency:
  group: hulk-sa-gate3b-baseline-profile
  cancel-in-progress: false

jobs:
  generate:
    name: Android TV API 36 x86_64 baseline profile
    runs-on: ubuntu-latest
    environment: production-e2e
    timeout-minutes: 90
    env:
      HULK_E2E_ACCESS_CODE: ${{ secrets.HULK_E2E_ACCESS_CODE }}
      HULK_E2E_USERNAME: ${{ secrets.HULK_E2E_USERNAME }}
      HULK_E2E_PASSWORD: ${{ secrets.HULK_E2E_PASSWORD }}
      HULK_GATE3B_EGRESS_SSH_KEY: ${{ secrets.HULK_GATE3B_EGRESS_SSH_KEY }}
      HULK_GATE3B_EGRESS_HOST: ${{ secrets.HULK_GATE3B_EGRESS_HOST }}
      HULK_GATE3B_EGRESS_USER: ${{ secrets.HULK_GATE3B_EGRESS_USER }}
      HULK_GATE3B_EGRESS_PORT: ${{ secrets.HULK_GATE3B_EGRESS_PORT }}
      HULK_GATE3B_EGRESS_HOST_KEY: ${{ secrets.HULK_GATE3B_EGRESS_HOST_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Validate protected Gate 3B inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in HULK_E2E_ACCESS_CODE HULK_E2E_USERNAME HULK_E2E_PASSWORD \
            HULK_GATE3B_EGRESS_SSH_KEY HULK_GATE3B_EGRESS_HOST HULK_GATE3B_EGRESS_USER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected secret: $name" >&2
              exit 2
            fi
          done
          echo "PASS: protected Gate 3B credentials and egress inputs are available"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Resolve live Operations version override
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl -fsS --max-time 30 https://hulksa.com/hulk-operations/api/app/v1/config/)"
          code="$(printf '%s' "$config" | python3 -c 'import sys,json;print(json.load(sys.stdin)["update"]["latestVersionCode"])')"
          name="$(printf '%s' "$config" | python3 -c 'import sys,json;print(json.load(sys.stdin)["update"]["latestVersionName"])')"
          test -n "$code" && test -n "$name"
          echo "HULK_QUALIFICATION_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "HULK_QUALIFICATION_VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Build benchmark target and test APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            -PHULK_TEST_BUILD_TYPE=benchmark \
            -PHULK_QUALIFICATION_VERSION_CODE="$HULK_QUALIFICATION_VERSION_CODE" \
            -PHULK_QUALIFICATION_VERSION_NAME="$HULK_QUALIFICATION_VERSION_NAME" \
            :app:assembleBenchmark :app:assembleBenchmarkAndroidTest :macrobenchmark:assembleBenchmark

      - name: Require Linux KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Start approved Contabo egress tunnel
        shell: bash
        run: bash .github/gate3b-egress.sh

      - name: Generate and qualify baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-linux-hw-accel: false
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -no-snapshot-save -skin 1920x1080 -http-proxy 10.0.2.2:8118
          script: bash .github/gate3b-generate.sh

      - name: Write sanitized evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=build/gate3b
          mkdir -p "$out"
          {
            echo "# HULK SA Gate 3B Baseline Profile"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Emulator: Android TV API 36 / x86_64 (headless, non-root)"
            echo "- Navigation proof: HOME before journey, Optional Update Overlay owned, LIVE after journey"
            echo
            echo "## Runtime"
            echo '```'
            cat "$out/runtime.txt" 2>/dev/null || true
            echo '```'
            echo "## Profile"
            echo '```'
            cat "$out/profile-summary.txt" 2>/dev/null || true
            echo '```'
            echo "## App-owned rule samples"
            echo '```'
            cat "$out/app-owned-samples.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "No credentials, access code, session data, hosts, usernames, passwords or tokens are included."
          } > "$out/SUMMARY.md"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-GATE3B-BASELINE-PROFILE-${{ github.run_id }}
          path: build/gate3b/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down approved egress tunnel
        if: always()
        shell: bash
        run: bash .github/gate3b-egress-cleanup.sh
