name: Apply PR57 runtime focus fix

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: fix/v09318-production-host-qualification
  EXPECTED_HEAD: 0368dc6346bdd3c1f5facdadfc669208b9ece4e3

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Apply strict TV D-pad routing patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          source = path.read_text(encoding='utf-8')

          old = '''private fun Modifier.downloadFocusNavigation(
              isTv: Boolean,
              node: DownloadFocusNode,
              rowCount: Int,
              requesters: Map<DownloadFocusNode, FocusRequester>,
          ): Modifier {
              if (!isTv) return this
              val requester = requesters[node] ?: return this
              val upRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.UP)
                  ?.let(requesters::get)
              val downRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.DOWN)
                  ?.let(requesters::get)
              val leftRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.LEFT)
                  ?.let(requesters::get)
              val rightRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.RIGHT)
                  ?.let(requesters::get)
              return focusRequester(requester).focusProperties {
                  upRequester?.let { up = it }
                  downRequester?.let { down = it }
                  leftRequester?.let { left = it }
                  rightRequester?.let { right = it }
              }
          }
          '''

          new = '''private fun Modifier.downloadFocusNavigation(
              isTv: Boolean,
              node: DownloadFocusNode,
              rowCount: Int,
              requesters: Map<DownloadFocusNode, FocusRequester>,
              onRequestNode: (DownloadFocusNode) -> Unit,
          ): Modifier {
              if (!isTv) return this
              val requester = requesters[node] ?: return this
              val upRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.UP)
                  ?.let(requesters::get)
              val downRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.DOWN)
                  ?.let(requesters::get)
              val leftRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.LEFT)
                  ?.let(requesters::get)
              val rightRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.RIGHT)
                  ?.let(requesters::get)
              return focusRequester(requester)
                  .onPreviewKeyEvent { event ->
                      if (event.type != KeyEventType.KeyDown) return@onPreviewKeyEvent false
                      val direction = when (event.key) {
                          Key.DirectionUp -> DownloadFocusDirection.UP
                          Key.DirectionDown -> DownloadFocusDirection.DOWN
                          Key.DirectionLeft -> DownloadFocusDirection.LEFT
                          Key.DirectionRight -> DownloadFocusDirection.RIGHT
                          else -> return@onPreviewKeyEvent false
                      }
                      val target = nextDownloadFocusNode(node, rowCount, direction)
                          ?: return@onPreviewKeyEvent false
                      onRequestNode(target)
                      true
                  }
                  .focusProperties {
                      upRequester?.let { up = it }
                      downRequester?.let { down = it }
                      leftRequester?.let { left = it }
                      rightRequester?.let { right = it }
                  }
          }
          '''

          if source.count(old) != 1:
              raise SystemExit('FAIL: downloadFocusNavigation anchor moved')
          source = source.replace(old, new, 1)

          old = '''    fun focusModifier(node: DownloadFocusNode): Modifier = Modifier.downloadFocusNavigation(
                  isTv = isTv,
                  node = node,
                  rowCount = downloads.size,
                  requesters = downloadFocusRequesters,
              )
          '''
          new = '''    val focusScope = rememberCoroutineScope()
              fun requestDownloadFocus(target: DownloadFocusNode) {
                  focusScope.launch {
                      if (target.rowIndex >= 0) {
                          downloadsState.scrollToItem(target.rowIndex)
                          delay(32)
                      }
                      runCatching { downloadFocusRequesters[target]?.requestFocus() }
                  }
              }
              fun focusModifier(node: DownloadFocusNode): Modifier = Modifier.downloadFocusNavigation(
                  isTv = isTv,
                  node = node,
                  rowCount = downloads.size,
                  requesters = downloadFocusRequesters,
                  onRequestNode = ::requestDownloadFocus,
              )
          '''
          if source.count(old) != 1:
              raise SystemExit('FAIL: focusModifier anchor moved')
          source = source.replace(old, new, 1)

          source = source.replace(
              'internal fun tvDownloadCardHeightDp(screenHeightDp: Int): Float =\n    if (screenHeightDp <= 540) 196f else 188f',
              'internal fun tvDownloadCardHeightDp(screenHeightDp: Int): Float =\n    if (screenHeightDp <= 540) 184f else 188f',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          target = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          canonical = Path('qa/canonical/canonical-source.sha256')
          digest = sha256(target.read_bytes()).hexdigest()
          target_name = target.as_posix()
          lines = canonical.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith('  ' + target_name)]
          if len(matches) != 1:
              raise SystemExit(f'FAIL: canonical MainShell entry count={len(matches)}')
          lines[matches[0]] = f'{digest}  {target_name}'
          canonical.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'MainShell SHA-256: {digest}')
          PY

          ! grep -Eq 'qa-tv-|qaTvPageContent|qaMarker' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -Fq 'http://3162356.xyz:8080' app/build.gradle.kts
          grep -Fq 'applicationId = "sa.hulksa.player"' app/build.gradle.kts
          sha256sum -c qa/canonical/canonical-source.sha256
          git diff --check

      - name: Run focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt qa/canonical/canonical-source.sha256
          git commit -m 'fix(tv): enforce runtime download D-pad routing'
          git push origin HEAD:${TARGET_BRANCH}
