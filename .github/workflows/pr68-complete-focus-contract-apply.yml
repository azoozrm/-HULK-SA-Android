name: Apply complete TV focus contract

on:
  pull_request:
    branches:
      - fix/pr57-download-focus-actions
    paths:
      - .github/workflows/pr68-complete-focus-contract-apply.yml

permissions:
  contents: write

concurrency:
  group: pr68-complete-focus-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'quality/pr68-complete-focus-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/pr68-complete-focus-contract
          fetch-depth: 0

      - name: Verify exact qualified inputs
        run: |
          set -euo pipefail
          test "$(git hash-object qa/compatibility/QaActivity.kt)" = '5845ae64f1cc2f384e2610bd5fc296553277aa1a'
          test "$(git hash-object qa/compatibility/run-lab.py)" = 'f966f61a6258ae849b2aeb6a845e4cf4584fddc9'
          test "$(git hash-object qa/compatibility/analyze.py)" = '2979887ab767fcc830bab1e76fd3d02f40fbfe52'
          git diff --name-only 882c40ea959a431f27d852cf63bc4314c55de022..HEAD | sort

      - name: Apply reviewable fixture driver and analyzer patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          HUNK = re.compile(
              r'^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$'
          )

          def normalize(source: Path, destination: Path) -> None:
              lines = source.read_text(encoding='utf-8').splitlines()
              output: list[str] = []
              index = 0
              while index < len(lines):
                  line = lines[index]
                  match = HUNK.match(line)
                  if not match:
                      output.append(line)
                      index += 1
                      continue
                  old_start, new_start, suffix = match.groups()
                  body_start = index + 1
                  cursor = body_start
                  old_count = 0
                  new_count = 0
                  while cursor < len(lines):
                      candidate = lines[cursor]
                      if candidate.startswith('@@ ') or candidate.startswith('--- '):
                          break
                      if candidate.startswith((' ', '-')):
                          old_count += 1
                      if candidate.startswith((' ', '+')):
                          new_count += 1
                      cursor += 1
                  if source.name == 'pr68-qaactivity-focus.patch' and old_start == '566':
                      index = cursor
                      continue
                  output.append(
                      f'@@ -{old_start},{old_count} +{new_start},{new_count} @@{suffix}'
                  )
                  output.extend(lines[body_start:cursor])
                  index = cursor
              destination.write_text('\n'.join(output) + '\n', encoding='utf-8')

          for source_name in (
              'tools/pr68-qaactivity-focus.patch',
              'tools/pr68-run-lab-focus.patch',
              'tools/pr68-analyze-focus.patch',
          ):
              source = Path(source_name)
              destination = Path('/tmp') / source.name
              normalize(source, destination)
              print(f'normalized {source} -> {destination}')
          PY
          for patch_file in \
            /tmp/pr68-qaactivity-focus.patch \
            /tmp/pr68-run-lab-focus.patch \
            /tmp/pr68-analyze-focus.patch; do
            patch --batch --forward --fuzz=3 -p1 < "$patch_file"
          done
          if find qa -name '*.rej' -print -quit | grep -q .; then
            find qa -name '*.rej' -print -exec cat {} \;
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('qa/compatibility/QaActivity.kt')
          text = path.read_text(encoding='utf-8')
          changes = {
              'private const val QA_DOWNLOAD_TOTAL_BYTES = 64L * 1024L * 1024L':
                  'private const val QA_DOWNLOAD_TOTAL_BYTES = 256L * 1024L * 1024L',
              'private const val QA_DOWNLOAD_WRITE_DELAY_MS = 10L':
                  'private const val QA_DOWNLOAD_WRITE_DELAY_MS = 50L',
          }
          for old, new in changes.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one QA server constant: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile \
            qa/compatibility/focus_contract.py \
            qa/compatibility/run-lab.py \
            qa/compatibility/analyze.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            qa.compatibility.tests.test_focus_contract -v
          git diff --check

      - name: Enforce complete focus contract invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          qa = Path('qa/compatibility/QaActivity.kt').read_text(encoding='utf-8')
          runner = Path('qa/compatibility/run-lab.py').read_text(encoding='utf-8')
          analyzer = Path('qa/compatibility/analyze.py').read_text(encoding='utf-8')
          contract = Path('qa/compatibility/focus_contract.py').read_text(encoding='utf-8')

          required_qa = (
              'downloadRepository.pause(item.downloadId)',
              'downloadRepository.resume(item.downloadId)',
              'downloadRepository.remove(item.downloadId)',
              'downloadRepository.cyclePriority(item.downloadId)',
              'downloadRepository?.setConcurrentDownloads(next)',
              'qa-download-action:pause:',
              'QA_DOWNLOAD_TOTAL_BYTES = 256L * 1024L * 1024L',
          )
          required_runner = (
              'download_action_audit',
              'wifi-toggle',
              'schedule-toggle',
              'concurrent-cycle',
              'priority-cycle',
              'visible_interactive_targets',
              'focus_key_sequence',
          )
          required_analyzer = (
              'visible_focus_targets_unreachable',
              'named_control_unreachable',
              'visible_control_not_focusable',
              'download_action_contract_failed',
          )
          missing = [token for token in required_qa if token not in qa]
          missing += [token for token in required_runner if token not in runner]
          missing += [token for token in required_analyzer if token not in analyzer]
          missing += [token for token in ('DOWNLOAD_REQUIRED_LABELS', 'focus_coverage') if token not in contract]
          if missing:
              raise SystemExit(f'incomplete focus contract: {missing}')
          if 'onRetryDownload = {}' in qa or 'onCycleDownloadPriority = {}' in qa:
              raise SystemExit('fixture still contains a no-op download action')
          print('PASS: fixture actions, full-page reachability and fail-closed findings are wired')
          PY

      - name: Commit only the final Quality Lab contract
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/pr68-complete-focus-contract-apply.yml \
            tools/pr68-qaactivity-focus.patch \
            tools/pr68-run-lab-focus.patch \
            tools/pr68-analyze-focus.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa/compatibility
          git commit -m 'test: execute every TV download action and strengthen focus coverage'
          git push origin HEAD:quality/pr68-complete-focus-contract
