name: HULK SA Compatibility V2 - Install Over

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - .github/workflows/compatibility-v2-install-over.yml
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Existing HULK SA source ref to install first
        required: true
        default: c291fa7df2f3ee3a04d020cd831f02073a44d514
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-v2-install-over-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-over-debug-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASELINE_REF: ${{ inputs.baseline_ref || 'c291fa7df2f3ee3a04d020cd831f02073a44d514' }}
      PACKAGE: sa.hulksa.player.dev
      TEST_PACKAGE: sa.hulksa.player.dev.test
      TEST_RUNNER: androidx.test.runner.AndroidJUnitRunner
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE_ROOT: build/install-over-evidence

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout preserved PR57 baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and create one shared debug signer
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=HULK SA Compatibility V2,C=SA' \
            -keyalg RSA -keysize 2048 -validity 10000
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build baseline and candidate with the same signer
        run: |
          set -euo pipefail
          bash -n candidate/quality/compatibility-v2/run_runtime_profile.sh
          (
            cd baseline
            ./gradlew --no-daemon --console=plain :app:assembleDebug \
              -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
              -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          )
          (
            cd candidate
            ./gradlew --no-daemon --console=plain \
              :app:assembleDebug :app:assembleDebugAndroidTest \
              -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
              -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          )
          mkdir -p "$EVIDENCE_ROOT/apks"
          cp baseline/app/build/outputs/apk/debug/app-debug.apk "$EVIDENCE_ROOT/apks/baseline-pr57-debug.apk"
          cp candidate/app/build/outputs/apk/debug/app-debug.apk "$EVIDENCE_ROOT/apks/candidate-debug.apk"
          cp candidate/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$EVIDENCE_ROOT/apks/candidate-androidTest.apk"

      - name: Verify package identity and signer continuity before runtime
        run: |
          set -euo pipefail
          baseline_apk="$EVIDENCE_ROOT/apks/baseline-pr57-debug.apk"
          candidate_apk="$EVIDENCE_ROOT/apks/candidate-debug.apk"
          test "$(apkanalyzer manifest application-id "$baseline_apk")" = "$PACKAGE"
          test "$(apkanalyzer manifest application-id "$candidate_apk")" = "$PACKAGE"
          test "$(apkanalyzer manifest version-code "$baseline_apk")" = '64'
          test "$(apkanalyzer manifest version-code "$candidate_apk")" = '64'
          apksigner verify --print-certs "$baseline_apk" > "$EVIDENCE_ROOT/BASELINE-SIGNER.txt"
          apksigner verify --print-certs "$candidate_apk" > "$EVIDENCE_ROOT/CANDIDATE-SIGNER.txt"
          baseline_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE_ROOT/BASELINE-SIGNER.txt" | head -n1)"
          candidate_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE_ROOT/CANDIDATE-SIGNER.txt" | head -n1)"
          test -n "$baseline_cert"
          test "$baseline_cert" = "$candidate_cert"
          {
            echo "baseline_ref=$BASELINE_REF"
            echo "candidate_sha=$GITHUB_SHA"
            echo "package=$PACKAGE"
            echo 'versionCode=64'
            echo "debug_certificate_sha256=$candidate_cert"
            echo 'result=PASS'
          } > "$EVIDENCE_ROOT/INSTALL-OVER-PLAN.txt"

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install baseline, preserve data, update candidate, and test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: |
            set -euo pipefail
            baseline_apk="$EVIDENCE_ROOT/apks/baseline-pr57-debug.apk"
            candidate_apk="$EVIDENCE_ROOT/apks/candidate-debug.apk"
            test_apk="$EVIDENCE_ROOT/apks/candidate-androidTest.apk"
            sentinel='hulk-sa-install-over-c291-preserved'

            adb wait-for-device
            for attempt in $(seq 1 60); do
              if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]] \
                && adb shell cmd package list packages >/dev/null 2>&1 \
                && adb shell cmd activity get-config >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            adb shell cmd package list packages >/dev/null
            adb shell cmd activity get-config >/dev/null
            adb shell cmd activity idle-maintenance >/dev/null 2>&1 || true

            adb install --no-streaming "$baseline_apk" | tee "$EVIDENCE_ROOT/BASELINE-INSTALL.txt"
            grep -Fq 'Success' "$EVIDENCE_ROOT/BASELINE-INSTALL.txt"
            adb shell am start -W -n "$PACKAGE/sa.hulksa.player.MainActivity" | tee "$EVIDENCE_ROOT/BASELINE-LAUNCH.txt"
            grep -Fq 'Status: ok' "$EVIDENCE_ROOT/BASELINE-LAUNCH.txt"
            adb shell run-as "$PACKAGE" mkdir -p files
            adb shell run-as "$PACKAGE" sh -c "printf '%s' '$sentinel' > files/install-over-sentinel.txt"
            test "$(adb shell run-as "$PACKAGE" cat files/install-over-sentinel.txt | tr -d '\r')" = "$sentinel"
            adb shell dumpsys package "$PACKAGE" > "$EVIDENCE_ROOT/BASELINE-PACKAGE.txt"

            adb install --no-streaming -r "$candidate_apk" | tee "$EVIDENCE_ROOT/CANDIDATE-UPDATE.txt"
            grep -Fq 'Success' "$EVIDENCE_ROOT/CANDIDATE-UPDATE.txt"
            preserved="$(adb shell run-as "$PACKAGE" cat files/install-over-sentinel.txt | tr -d '\r')"
            test "$preserved" = "$sentinel"
            printf 'expected=%s\nactual=%s\nresult=PASS\n' "$sentinel" "$preserved" > "$EVIDENCE_ROOT/DATA-PRESERVATION.txt"

            adb install --no-streaming -r "$test_apk" | tee "$EVIDENCE_ROOT/TEST-INSTALL.txt"
            grep -Fq 'Success' "$EVIDENCE_ROOT/TEST-INSTALL.txt"
            adb shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/sa.hulksa.player.MainActivity" | tee "$EVIDENCE_ROOT/CANDIDATE-LAUNCH.txt"
            grep -Fq 'Status: ok' "$EVIDENCE_ROOT/CANDIDATE-LAUNCH.txt"

            set +e
            adb shell am instrument -w -r \
              -e class sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest \
              "$TEST_PACKAGE/$TEST_RUNNER" | tee "$EVIDENCE_ROOT/INSTRUMENTATION-RAW.txt"
            instrument_status=${PIPESTATUS[0]}
            set -e
            python3 candidate/quality/compatibility-v2/instrumentation_to_junit.py \
              --input "$EVIDENCE_ROOT/INSTRUMENTATION-RAW.txt" \
              --output "$EVIDENCE_ROOT/INSTRUMENTATION.xml" \
              --suite-name install-over-lineage
            test "$instrument_status" -eq 0
            grep -Eq 'tests="7"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
            grep -Eq 'failures="0"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
            grep -Eq 'errors="0"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"

            adb shell dumpsys package "$PACKAGE" > "$EVIDENCE_ROOT/CANDIDATE-PACKAGE.txt"
            adb shell dumpsys activity activities > "$EVIDENCE_ROOT/ACTIVITY-AFTER-UPDATE.txt"
            adb shell uiautomator dump /sdcard/install-over-window.xml >/dev/null
            adb pull /sdcard/install-over-window.xml "$EVIDENCE_ROOT/window.xml" >/dev/null
            adb exec-out screencap -p > "$EVIDENCE_ROOT/full-window.png"
            adb logcat -d -v threadtime > "$EVIDENCE_ROOT/logcat.txt"
            test -s "$EVIDENCE_ROOT/window.xml"
            test -s "$EVIDENCE_ROOT/full-window.png"
            test -s "$EVIDENCE_ROOT/logcat.txt"
            test "$(adb shell run-as "$PACKAGE" cat files/install-over-sentinel.txt | tr -d '\r')" = "$sentinel"

      - name: Finalize install-over evidence
        if: always()
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_ROOT/DATA-PRESERVATION.txt"
          grep -Fq 'result=PASS' "$EVIDENCE_ROOT/DATA-PRESERVATION.txt"
          test -s "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          grep -Eq 'tests="7"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          grep -Eq 'failures="0"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          grep -Eq 'errors="0"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-INSTALL-OVER-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21
