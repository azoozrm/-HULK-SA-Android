name: Apply TV search focus fix

on:
  push:
    branches: [pr-tv-search-focus-v09317]
    paths: ['.github/workflows/apply-tv-search-focus.yml']
  pull_request:
    branches: [phase-3-v0.9.3.0-adaptive-foundation]
    paths: ['.github/workflows/apply-tv-search-focus.yml']

permissions:
  contents: write

concurrency:
  group: hulk-sa-tv-search-focus-patch
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HULK_PORTAL_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr-tv-search-focus-v09317
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Apply explicit TV search focus contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = source.read_text(encoding='utf-8')

          def insert_after(anchor: str, addition: str) -> None:
              global text
              if addition in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'Non-unique import anchor: {anchor!r}')
              text = text.replace(anchor, anchor + addition, 1)

          insert_after('import androidx.compose.foundation.layout.ColumnScope\n', 'import androidx.compose.foundation.layout.WindowInsets\n')
          insert_after('import androidx.compose.foundation.layout.widthIn\n', 'import androidx.compose.foundation.layout.isImeVisible\n')
          insert_after('import androidx.compose.foundation.shape.RoundedCornerShape\n', 'import androidx.compose.foundation.text.KeyboardActions\nimport androidx.compose.foundation.text.KeyboardOptions\n')
          insert_after('import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalSoftwareKeyboardController\n')
          insert_after('import androidx.compose.ui.text.font.FontWeight\n', 'import androidx.compose.ui.text.input.ImeAction\n')

          start_marker = '@Composable\nprivate fun UnifiedSearchScreen('
          end_marker = '\n@Composable\nprivate fun DownloadsScreen('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          search = text[start:end]

          old = '    val colors = LocalHulkColors.current\n'
          new = old + '    val searchFieldRequester = remember { FocusRequester() }\n    val firstResultRequester = remember { FocusRequester() }\n'
          if search.count(old) != 1:
              raise SystemExit('Search colors anchor changed')
          search = search.replace(old, new, 1)

          old = '        HulkTextField(state.searchQuery, onSearch, "ابحث بالاسم او السنة او النوع…", Modifier.fillMaxWidth())\n'
          new = '''        TvSearchField(
              value = state.searchQuery,
              onValueChange = onSearch,
              isTv = isTv,
              hasResults = results.isNotEmpty(),
              fieldRequester = searchFieldRequester,
              firstResultRequester = firstResultRequester,
              modifier = Modifier.fillMaxWidth(),
          )
          '''.replace('          ', '')
          if search.count(old) != 1:
              raise SystemExit('Search text field anchor changed')
          search = search.replace(old, new, 1)

          old = '            ContentGrid(results, isTv, MainDestination.SEARCH, navigationMemory, isFavorite, onOpen, onToggleFavorite)\n'
          new = '''            ContentGrid(
                  content = results,
                  isTv = isTv,
                  destination = MainDestination.SEARCH,
                  navigationMemory = navigationMemory,
                  isFavorite = isFavorite,
                  onOpen = onOpen,
                  onToggleFavorite = onToggleFavorite,
                  firstItemFocusRequester = if (isTv) firstResultRequester else null,
                  firstItemUpRequester = if (isTv) searchFieldRequester else null,
              )
          '''.replace('          ', '')
          if search.count(old) != 1:
              raise SystemExit('Search results grid anchor changed')
          search = search.replace(old, new, 1)

          tv_field = '''

          @Composable
          private fun TvSearchField(
              value: String,
              onValueChange: (String) -> Unit,
              isTv: Boolean,
              hasResults: Boolean,
              fieldRequester: FocusRequester,
              firstResultRequester: FocusRequester,
              modifier: Modifier = Modifier,
          ) {
              val keyboardController = LocalSoftwareKeyboardController.current
              val imeVisible = WindowInsets.isImeVisible
              val moveToResults: () -> Boolean = {
                  if (!isTv || !hasResults) {
                      false
                  } else {
                      keyboardController?.hide()
                      runCatching { firstResultRequester.requestFocus() }.isSuccess
                  }
              }

              LaunchedEffect(isTv) {
                  if (isTv) {
                      delay(140L)
                      runCatching { fieldRequester.requestFocus() }
                  }
              }

              val tvModifier = if (isTv) {
                  Modifier
                      .focusRequester(fieldRequester)
                      .onPreviewKeyEvent { event ->
                          when (tvSearchFocusAction(true, event.type, event.key, hasResults, imeVisible)) {
                              TvSearchFocusAction.MOVE_TO_RESULTS -> moveToResults()
                              TvSearchFocusAction.DISMISS_KEYBOARD -> {
                                  keyboardController?.hide()
                                  true
                              }
                              TvSearchFocusAction.NONE -> false
                          }
                      }
              } else {
                  Modifier
              }

              HulkTextField(
                  value = value,
                  onValueChange = onValueChange,
                  label = "ابحث بالاسم او السنة او النوع…",
                  modifier = modifier.then(tvModifier),
                  keyboardOptions = if (isTv) KeyboardOptions(imeAction = ImeAction.Search) else KeyboardOptions.Default,
                  keyboardActions = if (isTv) KeyboardActions(onSearch = { moveToResults() }) else KeyboardActions.Default,
              )
          }
          '''.replace('          ', '')
          text = text[:start] + search + tv_field + text[end:]

          old = '    restoreFocusedCard: Boolean = true,\n) {'
          new = '    restoreFocusedCard: Boolean = true,\n    firstItemFocusRequester: FocusRequester? = null,\n    firstItemUpRequester: FocusRequester? = null,\n) {'
          if text.count(old) != 1:
              raise SystemExit('ContentGrid signature anchor changed')
          text = text.replace(old, new, 1)

          old = '                modifier = Modifier.fillMaxWidth().restoreFocus(restore, targetRequester),\n'
          new = '''                modifier = Modifier
                      .fillMaxWidth()
                      .then(
                          if (index == 0 && firstItemFocusRequester != null) {
                              Modifier.focusRequester(firstItemFocusRequester)
                          } else {
                              Modifier.restoreFocus(restore, targetRequester)
                          },
                      )
                      .then(
                          if (index == 0 && firstItemUpRequester != null) {
                              Modifier.focusProperties { up = firstItemUpRequester }
                          } else {
                              Modifier
                          },
                      ),
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('ContentGrid card modifier anchor changed')
          text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')
          PY

          cat > app/src/main/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicy.kt <<'KOTLIN'
          package sa.hulksa.player.ui.screens

          import androidx.compose.ui.input.key.Key
          import androidx.compose.ui.input.key.KeyEventType

          internal enum class TvSearchFocusAction { NONE, MOVE_TO_RESULTS, DISMISS_KEYBOARD }

          internal fun tvSearchFocusAction(
              isTv: Boolean,
              eventType: KeyEventType,
              key: Key,
              hasResults: Boolean,
              imeVisible: Boolean,
          ): TvSearchFocusAction {
              if (!isTv || eventType != KeyEventType.KeyDown) return TvSearchFocusAction.NONE
              return when {
                  key == Key.DirectionDown && hasResults -> TvSearchFocusAction.MOVE_TO_RESULTS
                  key == Key.Back && imeVisible -> TvSearchFocusAction.DISMISS_KEYBOARD
                  else -> TvSearchFocusAction.NONE
              }
          }
          KOTLIN

          mkdir -p app/src/test/java/sa/hulksa/player/ui/screens
          cat > app/src/test/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicyTest.kt <<'KOTLIN'
          package sa.hulksa.player.ui.screens

          import androidx.compose.ui.input.key.Key
          import androidx.compose.ui.input.key.KeyEventType
          import org.junit.Assert.assertEquals
          import org.junit.Test

          class TvSearchFocusPolicyTest {
              @Test fun downMovesToResultsOnlyOnTvWithResults() {
                  assertEquals(TvSearchFocusAction.MOVE_TO_RESULTS, tvSearchFocusAction(true, KeyEventType.KeyDown, Key.DirectionDown, true, false))
                  assertEquals(TvSearchFocusAction.NONE, tvSearchFocusAction(true, KeyEventType.KeyDown, Key.DirectionDown, false, false))
                  assertEquals(TvSearchFocusAction.NONE, tvSearchFocusAction(false, KeyEventType.KeyDown, Key.DirectionDown, true, false))
              }

              @Test fun backDismissesOnlyVisibleTvKeyboard() {
                  assertEquals(TvSearchFocusAction.DISMISS_KEYBOARD, tvSearchFocusAction(true, KeyEventType.KeyDown, Key.Back, true, true))
                  assertEquals(TvSearchFocusAction.NONE, tvSearchFocusAction(true, KeyEventType.KeyDown, Key.Back, true, false))
              }

              @Test fun keyUpNeverChangesFocus() {
                  assertEquals(TvSearchFocusAction.NONE, tvSearchFocusAction(true, KeyEventType.KeyUp, Key.DirectionDown, true, true))
              }
          }
          KOTLIN

          git diff --check
          grep -Fq 'firstItemFocusRequester' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -Fq 'WindowInsets.isImeVisible' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt

      - name: Build and test focused change
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:bundleDebug \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL"

      - name: Verify output architectures
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' archive; do
            python3 tools/verify-android-architectures.py "$archive" --require-native-libs
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicy.kt \
            app/src/test/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicyTest.kt
          git diff --cached --check
          git commit -m 'fix: hand off TV search focus to results'
          git push origin HEAD:pr-tv-search-focus-v09317
