name: HULK SA Canonical Build

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'qa/canonical/**'
      - 'tools/verify-android-architectures.py'
      - 'tools/verify-runtime-config.py'
      - 'tools/tests/**'
      - '.github/workflows/canonical-build.yml'
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'qa/canonical/**'
      - 'tools/verify-android-architectures.py'
      - 'tools/verify-runtime-config.py'
      - 'tools/tests/**'
      - '.github/workflows/canonical-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-build:
    name: Clean, lint, unit, debug, release and ABI
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify canonical checkout
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -x gradlew
          test -d app/src/main
          test ! -e app/src/main/java/sa/hulksa/player/qa
          test ! -e project/app/src/main
          ./gradlew --version
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s tools/tests -v

      - name: Verify canonical source manifest
        run: |
          set -euo pipefail
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Debug and unit tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest \
            :app:assembleDebug :app:bundleDebug \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:lintDebug \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Release and R8
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Verify release runtime configuration
        run: |
          set -euo pipefail
          build_config="$(find app/build/generated/source/buildConfig/release -type f -name BuildConfig.java -print -quit)"
          release_apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          release_aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$build_config"
          test -n "$release_apk"
          test -n "$release_aab"
          mkdir -p build/reports/runtime-config
          python3 tools/verify-runtime-config.py \
            "$release_apk" \
            --build-config "$build_config" \
            --report build/reports/runtime-config/APK-RUNTIME-CONFIG.md
          python3 tools/verify-runtime-config.py \
            "$release_aab" \
            --build-config "$build_config" \
            --report build/reports/runtime-config/AAB-RUNTIME-CONFIG.md

      - name: Verify APK and AAB architectures
        run: |
          set -euo pipefail
          mkdir -p build/reports/architecture
          count=0
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            python3 tools/verify-android-architectures.py \
              "$archive" \
              --require-native-libs \
              --report "build/reports/architecture/$name.md"
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Package unsigned verification artifacts
        run: |
          set -euo pipefail
          mkdir -p canonical-artifacts
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} canonical-artifacts/ \;
          cp -a build/reports/architecture canonical-artifacts/
          cp -a build/reports/runtime-config canonical-artifacts/
          (
            cd canonical-artifacts
            sha256sum *.apk *.aab > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-CANONICAL-UNSIGNED-BUILD
          path: canonical-artifacts/
          if-no-files-found: error
          retention-days: 14
