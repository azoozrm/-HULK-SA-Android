name: HULK SA Build Verification

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'tools/verify-android-architectures.py'
      - '.github/workflows/canonical-build.yml'
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'tools/verify-android-architectures.py'
      - '.github/workflows/canonical-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hulk-sa-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verification:
    name: Build, lint, unit, release and ABI
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify clean production checkout
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -x gradlew
          test -d app/src/main
          test ! -e qa/compatibility
          test ! -e qa/quality
          test ! -e app/src/main/java/sa/hulksa/player/qa
          ./gradlew --version

      - name: Build debug, unit tests and lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin :app:testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:bundleDebug \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Build release and R8
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Verify package, version and architectures
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$apk"
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'

          mkdir -p build/reports/architecture
          count=0
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            python3 tools/verify-android-architectures.py \
              "$archive" \
              --require-native-libs \
              --report "build/reports/architecture/$name.md"
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Package build evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} build-evidence/ \; || true
          if [[ -d build/reports ]]; then cp -a build/reports build-evidence/; fi
          if [[ -d app/build/reports ]]; then cp -a app/build/reports build-evidence/app-reports; fi
          {
            echo "commit=${GITHUB_SHA}"
            echo 'package=sa.hulksa.player'
            echo 'versionName=0.9.3.20'
            echo 'versionCode=64'
          } > build-evidence/BUILD-METADATA.txt
          find build-evidence -type f -print0 | sort -z | xargs -0 sha256sum > build-evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-BUILD-EVIDENCE-${{ github.run_id }}
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
