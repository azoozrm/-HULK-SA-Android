name: HULK SA Build Verification

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - 'app/**'
      - 'hosting/hulk-operations/**'
      - 'quality/compatibility-v2/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'tools/verify-android-architectures.py'
      - 'tools/verify-runtime-config.py'
      - 'tools/tests/test_verify_runtime_config.py'
      - '.github/workflows/canonical-build.yml'
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'app/**'
      - 'hosting/hulk-operations/**'
      - 'quality/compatibility-v2/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'tools/verify-android-architectures.py'
      - 'tools/verify-runtime-config.py'
      - 'tools/tests/test_verify_runtime_config.py'
      - '.github/workflows/canonical-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hulk-sa-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verification:
    name: Build, lint, unit, release and ABI
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v7

      - name: Apply PR250 final physical-TV visual corrections
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/hulk-sa-icon-system-v1-4'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/hulk-sa-icon-system-v1-4
          git checkout -B fix/hulk-sa-icon-system-v1-4 origin/fix/hulk-sa-icon-system-v1-4

          python3 - <<'PY'
          from pathlib import Path

          shell = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = shell.read_text(encoding='utf-8')
          replacements = [
              (
                  'ChannelLogo(item, Modifier.align(Alignment.Center).size(145.dp))',
                  'ChannelLogo(item, Modifier.align(Alignment.Center).size(104.dp))',
                  'live preview artwork size',
              ),
              (
                  'ChannelLogo(representative, Modifier.size(28.dp))',
                  'ChannelLogo(representative, Modifier.size(24.dp))',
                  'live category artwork size',
              ),
              (
                  '''                modifier = Modifier\n                    .size(28.dp)\n                    .clip(RoundedCornerShape(10.dp))\n                    .background(Color(0xFF10110D))''',
                  '''                modifier = Modifier\n                    .size(24.dp)\n                    .clip(RoundedCornerShape(10.dp))\n                    .background(Color(0xFF10110D))''',
                  'category fallback tile size',
              ),
              (
                  'BrandLogo(Modifier.fillMaxSize().padding(4.dp))',
                  'BrandLogo(Modifier.fillMaxSize().padding(2.dp))',
                  'category fallback mark padding',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)
          shell.write_text(text, encoding='utf-8')

          rail = Path('app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt')
          text = rail.read_text(encoding='utf-8')
          old = '''        if (!isTvRailLogo) {\n            Image(\n                painter = painterResource(R.drawable.ic_launcher_foreground),\n                contentDescription = "HULK SA",\n                modifier = Modifier.fillMaxSize(),\n                contentScale = ContentScale.Fit,\n            )\n            return@BoxWithConstraints\n        }'''
          new = '''        if (!isTvRailLogo) {\n            val compactCategoryMark = maxWidth <= 24.dp && maxHeight <= 24.dp\n            Image(\n                painter = painterResource(R.drawable.ic_launcher_foreground),\n                contentDescription = "HULK SA",\n                modifier = Modifier\n                    .fillMaxSize()\n                    .graphicsLayer {\n                        val compactScale = if (compactCategoryMark) 1.80f else 1f\n                        scaleX = compactScale\n                        scaleY = compactScale\n                    },\n                contentScale = ContentScale.Fit,\n            )\n            return@BoxWithConstraints\n        }'''
          if text.count(old) != 1:
              raise SystemExit('TvRailBrandLogo compact mark block did not match exactly once')
          rail.write_text(text.replace(old, new, 1), encoding='utf-8')

          login = Path('app/src/main/res/drawable-television/hulk_sa_logo.xml')
          text = login.read_text(encoding='utf-8')
          marker = '    android:viewportHeight="1254">\n'
          black = '    <path\n        android:fillColor="#000000"\n        android:pathData="M0,0 H1254 V1254 H0 Z" />\n'
          if black in text:
              raise SystemExit('TV login logo already has black background unexpectedly')
          if marker not in text:
              raise SystemExit('TV login logo vector marker missing')
          login.write_text(text.replace(marker, marker + black, 1), encoding='utf-8')

          aliases = Path('app/src/main/res/values-television/hulk_tv_launcher_aliases.xml')
          aliases.parent.mkdir(parents=True, exist_ok=True)
          aliases.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <item name="ic_launcher" type="mipmap">@mipmap/ic_launcher_tv</item>\n    <item name="ic_launcher_round" type="mipmap">@mipmap/ic_launcher_tv</item>\n</resources>\n''', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
                  app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt \
                  app/src/main/res/drawable-television/hulk_sa_logo.xml \
                  app/src/main/res/values-television/hulk_tv_launcher_aliases.xml
          git diff --cached --check
          git commit -m 'fix: normalize TV artwork and launcher presentation'
          git push origin HEAD:fix/hulk-sa-icon-system-v1-4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify clean production checkout and V2 policy
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -x gradlew
          test -d app/src/main
          test ! -e qa/compatibility
          test ! -e qa/quality
          test ! -e qa/canonical
          test ! -e app/src/main/java/sa/hulksa/player/qa
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 quality/compatibility-v2/static_validate.py \
            --repo-root . --out build/compatibility-v2/canonical-static
          ./gradlew --version

      - name: Verify HULK Operations backend package
        run: |
          set -euo pipefail
          php --version
          find hosting/hulk-operations -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          php hosting/hulk-operations/tests/run.php
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest hosting/hulk-operations/tests/test_backend_contract.py -v
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest tools/tests/test_verify_runtime_config.py -v

      - name: Build debug, unit tests and lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin :app:testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:bundleDebug

      - name: Build release and R8
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:assembleRelease :app:bundleRelease

      - name: Verify package, version and architectures
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$apk"
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'

          mkdir -p build/reports/architecture
          count=0
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            python3 tools/verify-android-architectures.py \
              "$archive" \
              --require-native-libs \
              --report "build/reports/architecture/$name.md"
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Package build evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} build-evidence/ \; || true
          if [[ -d build/reports ]]; then cp -a build/reports build-evidence/; fi
          if [[ -d app/build/reports ]]; then cp -a app/build/reports build-evidence/app-reports; fi
          if [[ -d build/compatibility-v2/canonical-static ]]; then
            cp -a build/compatibility-v2/canonical-static build-evidence/static-validation
          fi
          {
            echo "commit=${GITHUB_SHA}"
            echo 'package=sa.hulksa.player'
            echo 'versionName=0.9.3.20'
            echo 'versionCode=64'
          } > build-evidence/BUILD-METADATA.txt
          (
            cd build-evidence
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-BUILD-EVIDENCE-${{ github.run_id }}
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
