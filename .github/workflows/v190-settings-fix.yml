name: v1.9 Settings Focus Fix

on:
  push:
    branches:
      - feature/v190-settings-pro

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/v190-settings-pro
          fetch-depth: 0

      - name: Apply focused v1.9 settings fix
        run: |
          set -euo pipefail
          python3 tools/v190_settings_fix.py
          git diff --check
          file='app/src/main/java/sa/hulksa/player/ui/screens/SettingsProScreen.kt'
          grep -q 'SettingsPanel(title = "بيانات الاشتراك"' "$file"
          grep -q 'settingsConnectionUsage(account)' "$file"
          grep -q 'SimpleDateFormat("yyyy/MM/dd", Locale.US)' "$file"
          grep -q 'onFocused = {' "$file"
          grep -q 'enabled = account != null' "$file"

      - name: Commit source fix and remove temporary helpers
        run: |
          set -euo pipefail
          rm -f tools/v190_settings_fix.py tools/.keep-v190-focus-placeholder .github/workflows/v190-settings-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix v1.9 settings TV focus and subscription data'
          git push origin HEAD:feature/v190-settings-pro
