name: PR79 Mobile Layout Visual Qualification

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-mobile-layout-visual.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr79-mobile-layout-visual
  cancel-in-progress: true

jobs:
  phone-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Publish visual qualification locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ui/mobile-layout-visual' \
            -f description='Phone portrait visual qualification is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone portrait Compose layout tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            set -eu
            adb shell wm size 1080x2400
            adb shell wm density 420
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=sa.hulksa.player.compatibilityv2.AdaptiveMainShellComposeTest
            mkdir -p mobile-layout-visual
            adb pull /sdcard/Android/data/sa.hulksa.player/files/adaptive-main-shell-evidence/. mobile-layout-visual/
            test -f mobile-layout-visual/phone-portrait-bottom-navigation.png
            test -f mobile-layout-visual/phone-portrait-catalog-header.png
            test -f mobile-layout-visual/phone-portrait-page-title.png
            find mobile-layout-visual -type f -print0 | sort -z | xargs -0 sha256sum > mobile-layout-visual/SHA256SUMS.txt
            (cd mobile-layout-visual && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-MOBILE-LAYOUT-VISUAL-${{ github.run_id }}
          path: mobile-layout-visual/
          if-no-files-found: error
          retention-days: 21

      - name: Publish final visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Phone portrait screenshots and layout bounds passed'
          else
            state=failure
            description='Phone portrait visual qualification failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='ui/mobile-layout-visual' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
