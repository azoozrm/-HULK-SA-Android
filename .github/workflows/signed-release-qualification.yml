name: HULK SA Signed Release Qualification

on:
  workflow_call:
    inputs:
      target_official_sha:
        required: true
        type: string
      canonical_build_run_id:
        required: true
        type: string
      full_matrix_run_id:
        required: true
        type: string
      production_smoke_run_id:
        required: true
        type: string
      expected_version_code:
        required: false
        type: string
        default: '65'
      expected_version_name:
        required: false
        type: string
        default: '0.9.3.21'
    secrets:
      HULK_RELEASE_KEYSTORE_BASE64:
        required: true
      HULK_RELEASE_KEY_ALIAS:
        required: true
      HULK_RELEASE_STORE_PASSWORD:
        required: true
      HULK_RELEASE_KEY_PASSWORD:
        required: true
      HULK_RELEASE_CERT_SHA256:
        required: true
  workflow_dispatch:
    inputs:
      target_official_sha:
        description: Exact current Official Branch SHA to qualify
        required: true
        type: string
      canonical_build_run_id:
        description: Successful HULK SA Build Verification run ID for the exact target SHA
        required: true
        type: string
      full_matrix_run_id:
        description: Successful Compatibility V2 Full Matrix run ID for the exact target SHA
        required: true
        type: string
      production_smoke_run_id:
        description: Successful Production Authenticated Smoke run ID for the exact target SHA
        required: true
        type: string
      expected_version_code:
        description: Expected Android versionCode
        required: true
        default: '65'
        type: string
      expected_version_name:
        description: Expected Android versionName
        required: true
        default: '0.9.3.21'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: hulk-sa-signed-release-${{ inputs.target_official_sha }}
  cancel-in-progress: true

env:
  HULK_OFFICIAL_BRANCH: phase-3-v0.9.3.0-adaptive-foundation

jobs:
  qualification-evidence:
    name: Bind required evidence to exact current Official SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify requested SHA is the current Official HEAD
        id: official-start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_OFFICIAL_SHA: ${{ inputs.target_official_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${HULK_OFFICIAL_BRANCH}"
          test "$GITHUB_REF" = "$expected_ref" || {
            echo "Signed qualification must execute from the Official Branch: current=$GITHUB_REF expected=$expected_ref" >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$TARGET_OFFICIAL_SHA" || {
            echo "Signed qualification workflow SHA differs from target: workflow=$GITHUB_SHA target=$TARGET_OFFICIAL_SHA" >&2
            exit 1
          }
          [[ "$TARGET_OFFICIAL_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'target_official_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          }
          official_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${HULK_OFFICIAL_BRANCH}" --jq '.commit.sha')"
          test "$official_head" = "$TARGET_OFFICIAL_SHA" || {
            echo "Official HEAD changed or target is stale: target=$TARGET_OFFICIAL_SHA current=$official_head" >&2
            exit 1
          }
          echo "official_head=$official_head" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_official_sha }}
          fetch-depth: 1

      - name: Validate referenced workflow evidence against exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_OFFICIAL_SHA: ${{ inputs.target_official_sha }}
          OFFICIAL_HEAD_START: ${{ steps.official-start.outputs.official_head }}
          CANONICAL_BUILD_RUN_ID: ${{ inputs.canonical_build_run_id }}
          FULL_MATRIX_RUN_ID: ${{ inputs.full_matrix_run_id }}
          PRODUCTION_SMOKE_RUN_ID: ${{ inputs.production_smoke_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$CANONICAL_BUILD_RUN_ID" "$FULL_MATRIX_RUN_ID" "$PRODUCTION_SMOKE_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "Invalid workflow run id: $run_id" >&2
              exit 1
            }
          done

          mkdir -p build/release-qualification-inputs
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANONICAL_BUILD_RUN_ID}" \
            > build/release-qualification-inputs/canonical-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANONICAL_BUILD_RUN_ID}/artifacts?per_page=100" \
            > build/release-qualification-inputs/canonical-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_MATRIX_RUN_ID}" \
            > build/release-qualification-inputs/full-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_MATRIX_RUN_ID}/artifacts?per_page=100" \
            > build/release-qualification-inputs/full-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_SMOKE_RUN_ID}" \
            > build/release-qualification-inputs/production-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_SMOKE_RUN_ID}/artifacts?per_page=100" \
            > build/release-qualification-inputs/production-artifacts.json

          official_head_end="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${HULK_OFFICIAL_BRANCH}" --jq '.commit.sha')"
          checkout_sha="$(git rev-parse HEAD)"
          python3 quality/compatibility-v2/qualification_sha_gate.py verify-evidence \
            --expected-repo "$GITHUB_REPOSITORY" \
            --expected-branch "$HULK_OFFICIAL_BRANCH" \
            --target-sha "$TARGET_OFFICIAL_SHA" \
            --checkout-sha "$checkout_sha" \
            --execution-sha "$GITHUB_SHA" \
            --execution-ref "$GITHUB_REF" \
            --official-head-start "$OFFICIAL_HEAD_START" \
            --official-head-end "$official_head_end" \
            --canonical-run build/release-qualification-inputs/canonical-run.json \
            --canonical-artifacts build/release-qualification-inputs/canonical-artifacts.json \
            --full-run build/release-qualification-inputs/full-run.json \
            --full-artifacts build/release-qualification-inputs/full-artifacts.json \
            --production-run build/release-qualification-inputs/production-run.json \
            --production-artifacts build/release-qualification-inputs/production-artifacts.json

  signing-preflight:
    name: Unsigned fallback and signing fail-closed preflight
    needs: qualification-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_official_sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate verification scripts
        run: |
          set -euo pipefail
          bash -n tools/verify-apk-signing.sh
          bash -n tools/verify-aab-signing.sh
          python3 -m py_compile tools/verify-runtime-config.py quality/compatibility-v2/qualification_sha_gate.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s tools/tests -v
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest quality/compatibility-v2/tests/test_qualification_sha_gate.py -v

      - name: Prove unsigned release fallback remains buildable
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:assembleRelease :app:bundleRelease

          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$unsigned_apk"
          if apksigner verify "$unsigned_apk" >/dev/null 2>&1; then
            echo 'Unsigned fallback unexpectedly produced a signed APK' >&2
            exit 1
          fi
          unsigned_aab='app/build/outputs/bundle/release/app-release.aab'
          build_config="$(find app/build/generated/source/buildConfig/release -type f -name BuildConfig.java -print -quit)"
          test -n "$build_config"
          mkdir -p runtime-config-preflight
          python3 tools/verify-runtime-config.py \
            "$unsigned_apk" \
            --build-config "$build_config" \
            --report runtime-config-preflight/UNSIGNED-APK-RUNTIME-CONFIG.md
          python3 tools/verify-runtime-config.py \
            "$unsigned_aab" \
            --build-config "$build_config" \
            --report runtime-config-preflight/UNSIGNED-AAB-RUNTIME-CONFIG.md
          echo 'PASS: no signing inputs produces an explicitly unsigned release APK'

      - name: Prove incomplete signing configuration fails closed
        run: |
          set -euo pipefail
          set +e
          ./gradlew --no-daemon --console=plain :app:tasks \
            -PHULK_RELEASE_KEY_ALIAS=preflight-only \
            > signing-incomplete.log 2>&1
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo 'Incomplete signing configuration was accepted unexpectedly' >&2
            cat signing-incomplete.log >&2
            exit 1
          fi
          grep -Fq 'Incomplete release signing configuration' signing-incomplete.log
          echo 'PASS: partial signing inputs fail before any release is produced'

  signed-release:
    name: Build and verify signed production artifacts
    needs: signing-preflight
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 60
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
      QUALIFICATION_VERSION_CODE: ${{ inputs.expected_version_code || '65' }}
      QUALIFICATION_VERSION_NAME: ${{ inputs.expected_version_name || '0.9.3.21' }}
      TARGET_OFFICIAL_SHA: ${{ inputs.target_official_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_official_sha }}
          fetch-depth: 1

      - name: Verify target remains current before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          official_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${HULK_OFFICIAL_BRANCH}" --jq '.commit.sha')"
          python3 quality/compatibility-v2/qualification_sha_gate.py verify-head \
            --target-sha "$TARGET_OFFICIAL_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --official-head "$official_head"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate required release secrets
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$HULK_RELEASE_KEYSTORE_BASE64" ]] || missing+=(HULK_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS" ]] || missing+=(HULK_RELEASE_KEY_ALIAS)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD" ]] || missing+=(HULK_RELEASE_STORE_PASSWORD)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD" ]] || missing+=(HULK_RELEASE_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERT_SHA256" ]] || missing+=(HULK_RELEASE_CERT_SHA256)
          [[ -n "$QUALIFICATION_VERSION_CODE" ]] || missing+=(expected_version_code)
          [[ -n "$QUALIFICATION_VERSION_NAME" ]] || missing+=(expected_version_name)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Missing required release signing inputs: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          [[ "$QUALIFICATION_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          echo 'PASS: all required release signing inputs are present'
          echo 'PASS: the public HULK reseller API is compiled from reviewed source'

      - name: Materialize ephemeral keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo 'PASS: keystore materialized only in runner temporary storage'

      - name: Build signed APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            -PHULK_QUALIFICATION_VERSION_CODE="$QUALIFICATION_VERSION_CODE" \
            -PHULK_QUALIFICATION_VERSION_NAME="$QUALIFICATION_VERSION_NAME" \
            clean :app:assembleRelease :app:bundleRelease

          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify package identity and version
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code || '65' }}
          EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name || '0.9.3.21' }}
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          package_id="$(apkanalyzer manifest application-id "$apk")"
          version_code="$(apkanalyzer manifest version-code "$apk")"
          version_name="$(apkanalyzer manifest version-name "$apk")"

          test "$package_id" = 'sa.hulksa.player'
          test "$version_code" = "$EXPECTED_VERSION_CODE"
          test "$version_name" = "$EXPECTED_VERSION_NAME"

          mkdir -p signed-release-artifacts
          {
            echo "Application ID: $package_id"
            echo "Version code: $version_code"
            echo "Version name: $version_name"
            echo 'Package identity: PASS'
          } > signed-release-artifacts/PACKAGE-IDENTITY.txt

      - name: Verify signer identity and signature schemes
        run: |
          set -euo pipefail
          bash tools/verify-apk-signing.sh \
            app/build/outputs/apk/release/app-release.apk \
            "$EXPECTED_CERT_SHA256" \
            signed-release-artifacts/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh \
            app/build/outputs/bundle/release/app-release.aab \
            "$EXPECTED_CERT_SHA256" \
            signed-release-artifacts/AAB-SIGNING.txt

      - name: Verify compiled production runtime configuration
        run: |
          set -euo pipefail
          build_config="$(find app/build/generated/source/buildConfig/release -type f -name BuildConfig.java -print -quit)"
          test -n "$build_config"
          python3 tools/verify-runtime-config.py \
            app/build/outputs/apk/release/app-release.apk \
            --build-config "$build_config" \
            --report signed-release-artifacts/APK-RUNTIME-CONFIG.md
          python3 tools/verify-runtime-config.py \
            app/build/outputs/bundle/release/app-release.aab \
            --build-config "$build_config" \
            --report signed-release-artifacts/AAB-RUNTIME-CONFIG.md

      - name: Verify signed output architectures
        run: |
          set -euo pipefail
          python3 tools/verify-android-architectures.py \
            app/build/outputs/apk/release/app-release.apk \
            --require-native-libs \
            --report signed-release-artifacts/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py \
            app/build/outputs/bundle/release/app-release.aab \
            --require-native-libs \
            --report signed-release-artifacts/AAB-ARCHITECTURES.md

      - name: Revalidate Official HEAD and package signed release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_BUILD_RUN_ID: ${{ inputs.canonical_build_run_id }}
          FULL_MATRIX_RUN_ID: ${{ inputs.full_matrix_run_id }}
          PRODUCTION_SMOKE_RUN_ID: ${{ inputs.production_smoke_run_id }}
        run: |
          set -euo pipefail
          official_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${HULK_OFFICIAL_BRANCH}" --jq '.commit.sha')"
          python3 quality/compatibility-v2/qualification_sha_gate.py verify-head \
            --target-sha "$TARGET_OFFICIAL_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --official-head "$official_head"

          cp app/build/outputs/apk/release/app-release.apk signed-release-artifacts/
          cp app/build/outputs/bundle/release/app-release.aab signed-release-artifacts/
          python3 quality/compatibility-v2/qualification_sha_gate.py write-signed-metadata \
            --out signed-release-artifacts/EXACT-SHA-QUALIFICATION.json \
            --source-sha "$TARGET_OFFICIAL_SHA" \
            --canonical-run-id "$CANONICAL_BUILD_RUN_ID" \
            --full-run-id "$FULL_MATRIX_RUN_ID" \
            --production-run-id "$PRODUCTION_SMOKE_RUN_ID"
          (
            cd signed-release-artifacts
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-SIGNED-RELEASE-QUALIFICATION
          path: signed-release-artifacts/
          if-no-files-found: error
          retention-days: 14

  confirm-current-official-head:
    name: Confirm target is still the current Official HEAD
    needs: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject a candidate superseded during qualification
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_OFFICIAL_SHA: ${{ inputs.target_official_sha }}
        run: |
          set -euo pipefail
          official_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${HULK_OFFICIAL_BRANCH}" --jq '.commit.sha')"
          test "$official_head" = "$TARGET_OFFICIAL_SHA" || {
            echo "Official HEAD changed during qualification: target=$TARGET_OFFICIAL_SHA current=$official_head" >&2
            exit 1
          }
