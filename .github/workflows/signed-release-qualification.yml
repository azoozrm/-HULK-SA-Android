name: HULK SA Signed Release Qualification

on:
  workflow_call:
    inputs:
      expected_version_code:
        required: false
        type: string
        default: '64'
      expected_version_name:
        required: false
        type: string
        default: '0.9.3.20'
    secrets:
      HULK_RELEASE_KEYSTORE_BASE64:
        required: true
      HULK_RELEASE_KEY_ALIAS:
        required: true
      HULK_RELEASE_STORE_PASSWORD:
        required: true
      HULK_RELEASE_KEY_PASSWORD:
        required: true
      HULK_RELEASE_CERT_SHA256:
        required: true
  workflow_dispatch:
    inputs:
      expected_version_code:
        description: Expected Android versionCode
        required: true
        default: '64'
        type: string
      expected_version_name:
        description: Expected Android versionName
        required: true
        default: '0.9.3.20'
        type: string

permissions:
  contents: read

concurrency:
  group: hulk-sa-signed-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate signing scripts and static identity
        run: |
          set -euo pipefail
          bash -n tools/verify-apk-signing.sh
          bash -n tools/verify-aab-signing.sh
          python3 quality/compatibility-v2/static_validate.py \
            --repo-root . --out build/compatibility-v2/release-static

      - name: Prove unsigned fallback remains buildable
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$apk"
          if apksigner verify "$apk" >/dev/null 2>&1; then
            echo 'Unsigned fallback unexpectedly produced a signed APK' >&2
            exit 1
          fi

      - name: Prove partial signing input fails closed
        run: |
          set -euo pipefail
          set +e
          ./gradlew --no-daemon --console=plain :app:tasks \
            -PHULK_RELEASE_KEY_ALIAS=preflight-only > signing-incomplete.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq 'Incomplete release signing configuration' signing-incomplete.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-SIGNING-PREFLIGHT-${{ github.run_id }}
          path: |
            build/compatibility-v2/release-static/
            signing-incomplete.log
          if-no-files-found: error
          retention-days: 14

  signed-release:
    needs: signing-preflight
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 70
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate required protected inputs
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$HULK_RELEASE_KEYSTORE_BASE64" ]] || missing+=(HULK_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS" ]] || missing+=(HULK_RELEASE_KEY_ALIAS)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD" ]] || missing+=(HULK_RELEASE_STORE_PASSWORD)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD" ]] || missing+=(HULK_RELEASE_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERT_SHA256" ]] || missing+=(HULK_RELEASE_CERT_SHA256)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Missing protected signing inputs: %s\n' "${missing[*]}" >&2
            exit 2
          fi

      - name: Materialize ephemeral keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify package version signer and architectures
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code || '64' }}
          EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name || '0.9.3.20' }}
        run: |
          set -euo pipefail
          mkdir -p signed-release-artifacts
          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          package_id="$(apkanalyzer manifest application-id "$apk")"
          version_code="$(apkanalyzer manifest version-code "$apk")"
          version_name="$(apkanalyzer manifest version-name "$apk")"
          test "$package_id" = 'sa.hulksa.player'
          test "$version_code" = "$EXPECTED_VERSION_CODE"
          test "$version_name" = "$EXPECTED_VERSION_NAME"
          printf 'Application ID: %s\nVersion code: %s\nVersion name: %s\n' \
            "$package_id" "$version_code" "$version_name" > signed-release-artifacts/PACKAGE-IDENTITY.txt
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" signed-release-artifacts/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh "$aab" "$EXPECTED_CERT_SHA256" signed-release-artifacts/AAB-SIGNING.txt
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report signed-release-artifacts/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py "$aab" --require-native-libs --report signed-release-artifacts/AAB-ARCHITECTURES.md
          cp "$apk" "$aab" signed-release-artifacts/
          (
            cd signed-release-artifacts
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope release --evidence-root signed-release-artifacts \
            --out signed-release-artifacts/gate

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-SIGNED-RELEASE-QUALIFICATION-${{ github.run_id }}
          path: signed-release-artifacts/
          if-no-files-found: error
          retention-days: 21
