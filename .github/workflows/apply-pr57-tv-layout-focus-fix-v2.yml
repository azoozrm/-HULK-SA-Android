name: Apply verified PR57 TV product patch v2

on:
  push:
    branches:
      - fix/v09318-production-host-qualification
    paths:
      - '.github/workflows/apply-pr57-tv-layout-focus-fix-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-pr57-tv-product-patch-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/v09318-production-host-qualification
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Apply exact source patch and canonical digest
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt'
          EXPECTED_SHA='be902ccb3e8580e11b054720662eeb0074694be21eb5d1f8e80939a61b029fa6'
          ACTUAL_SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]] || {
            echo "FAIL: source moved: expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
            exit 1
          }

          cat > "$RUNNER_TEMP/pr57-tv-product.patch" <<'PATCH'
          --- a/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          +++ b/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          @@ -157,6 +157,9 @@
           internal fun tvRailLogoSizeDp(screenWidthDp: Int): Float =
               (screenWidthDp.coerceAtLeast(1) / 32f).coerceIn(28f, 60f)
           
          +internal fun tvDownloadCardHeightDp(screenHeightDp: Int): Float =
          +    if (screenHeightDp <= 540) 196f else 188f
          +
           
           internal enum class DownloadFocusSlot {
               WIFI,
          @@ -258,26 +261,19 @@
           ): Modifier {
               if (!isTv) return this
               val requester = requesters[node] ?: return this
          -    return focusRequester(requester).onPreviewKeyEvent { event ->
          -        if (event.type != KeyEventType.KeyDown) {
          -            false
          -        } else {
          -            val direction = when (event.key) {
          -                Key.DirectionUp -> DownloadFocusDirection.UP
          -                Key.DirectionDown -> DownloadFocusDirection.DOWN
          -                Key.DirectionLeft -> DownloadFocusDirection.LEFT
          -                Key.DirectionRight -> DownloadFocusDirection.RIGHT
          -                else -> null
          -            }
          -            val target = direction?.let { nextDownloadFocusNode(node, rowCount, it) }
          -            if (target == null) {
          -                false
          -            } else {
          -                requesters[target]?.let { targetRequester ->
          -                    runCatching { targetRequester.requestFocus() }.isSuccess
          -                } ?: false
          -            }
          -        }
          +    val upRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.UP)
          +        ?.let(requesters::get)
          +    val downRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.DOWN)
          +        ?.let(requesters::get)
          +    val leftRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.LEFT)
          +        ?.let(requesters::get)
          +    val rightRequester = nextDownloadFocusNode(node, rowCount, DownloadFocusDirection.RIGHT)
          +        ?.let(requesters::get)
          +    return focusRequester(requester).focusProperties {
          +        upRequester?.let { up = it }
          +        downRequester?.let { down = it }
          +        leftRequester?.let { left = it }
          +        rightRequester?.let { right = it }
               }
           }
           
          @@ -1272,13 +1268,14 @@
                       visible.getOrNull(index)?.let { navigationMemory.save(MainDestination.LIVE, "${it.type}:${it.id}", index) }
                   }
               }
          -    LaunchedEffect(visible) {
          +    LaunchedEffect(isTv, visible, state.searchQuery, remembered.itemKey, rememberedIndex) {
                   if (preview == null || preview !in visible) {
                       preview = visible.firstOrNull { "${it.type}:${it.id}" == remembered.itemKey } ?: visible.getOrNull(rememberedIndex) ?: visible.firstOrNull()
                   }
          -        if (state.searchQuery.isBlank() && remembered.itemKey.isNotBlank() && visible.isNotEmpty()) {
          -            listState.scrollToItem(rememberedIndex)
          -            delay(180)
          +        if (isTv && state.searchQuery.isBlank() && visible.isNotEmpty()) {
          +            if (remembered.itemKey.isNotBlank()) {
          +                listState.scrollToItem(rememberedIndex)
          +            }
                       runCatching { channelRequester.requestFocus() }
                   }
               }
          @@ -1646,7 +1643,6 @@
           
               LaunchedEffect(isTv, downloadIds, remembered.itemKey, rememberedIndex) {
                   if (isTv) {
          -            delay(180L)
                       val initialNode = if (remembered.itemKey.isBlank()) {
                           DownloadFocusNode(-1, DownloadFocusSlot.WIFI)
                       } else {
          @@ -1661,15 +1657,36 @@
                       .fillMaxSize()
                       .padding(if (isTv) TV_PAGE_GUTTER else 13.dp),
               ) {
          -        PageTitle("التنزيلات", "ادارة كاملة للمشاهدة بدون انترنت", downloads.size, Icons.Rounded.Download)
          -        Spacer(Modifier.height(12.dp))
          -        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
          -            InfoPill("مكتمل  $completed")
          -            if (active > 0) InfoPill("نشط ومجدول  $active")
          -            if (storedBytes > 0L) InfoPill("المحفوظ  ${formatBytes(storedBytes)}")
          -            InfoPill("المساحة المتاحة بالجهاز  ${formatBytes(availableBytes)}")
          +        if (isTv) {
          +            Row(
          +                modifier = Modifier.fillMaxWidth(),
          +                verticalAlignment = Alignment.CenterVertically,
          +                horizontalArrangement = Arrangement.spacedBy(16.dp),
          +            ) {
          +                PageTitle("التنزيلات", "ادارة كاملة للمشاهدة بدون انترنت", downloads.size, Icons.Rounded.Download)
          +                LazyRow(
          +                    modifier = Modifier.weight(1f),
          +                    horizontalArrangement = Arrangement.spacedBy(8.dp),
          +                    contentPadding = PaddingValues(horizontal = 2.dp),
          +                ) {
          +                    item { InfoPill("مكتمل  $completed") }
          +                    if (active > 0) item { InfoPill("نشط ومجدول  $active") }
          +                    if (storedBytes > 0L) item { InfoPill("المحفوظ  ${formatBytes(storedBytes)}") }
          +                    item { InfoPill("المساحة المتاحة بالجهاز  ${formatBytes(availableBytes)}") }
          +                }
          +            }
          +            Spacer(Modifier.height(4.dp))
          +        } else {
          +            PageTitle("التنزيلات", "ادارة كاملة للمشاهدة بدون انترنت", downloads.size, Icons.Rounded.Download)
          +            Spacer(Modifier.height(12.dp))
          +            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
          +                InfoPill("مكتمل  $completed")
          +                if (active > 0) InfoPill("نشط ومجدول  $active")
          +                if (storedBytes > 0L) InfoPill("المحفوظ  ${formatBytes(storedBytes)}")
          +                InfoPill("المساحة المتاحة بالجهاز  ${formatBytes(availableBytes)}")
          +            }
          +            Spacer(Modifier.height(11.dp))
                   }
          -        Spacer(Modifier.height(11.dp))
                   LazyRow(
                       horizontalArrangement = Arrangement.spacedBy(8.dp),
                       contentPadding = PaddingValues(horizontal = 2.dp, vertical = 4.dp),
          @@ -1705,7 +1722,7 @@
                           )
                       }
                   }
          -        Spacer(Modifier.height(12.dp))
          +        Spacer(Modifier.height(if (isTv) 4.dp else 12.dp))
                   if (downloads.isEmpty()) {
                       EmptyState("ستظهر هنا الافلام والحلقات التي تختار تحميلها")
                   } else {
          @@ -1758,10 +1775,10 @@
               var focused by remember { mutableStateOf(false) }
               val shape = RoundedCornerShape(17.dp)
               val screenHeightDp = LocalConfiguration.current.screenHeightDp
          -    val cardHeight = when {
          -        !isTv -> 220.dp
          -        screenHeightDp <= 540 -> 196.dp
          -        else -> 188.dp
          +    val cardHeight = if (isTv) {
          +        tvDownloadCardHeightDp(screenHeightDp).dp
          +    } else {
          +        220.dp
               }
               Column(
                   modifier = modifier
          PATCH

          sed -i 's/^          //' "$RUNNER_TEMP/pr57-tv-product.patch"
          git apply --check "$RUNNER_TEMP/pr57-tv-product.patch"
          git apply "$RUNNER_TEMP/pr57-tv-product.patch"

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          canonical = Path('qa/canonical/canonical-source.sha256')
          digest = sha256(source.read_bytes()).hexdigest()
          expected = '07c4011aa107252c3c8937eba2d878a671b5e48a6334028f32b13e8f0c1793e6'
          if digest != expected:
              raise SystemExit(f'FAIL: patched source digest mismatch: expected={expected} actual={digest}')
          target = 'app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt'
          lines = canonical.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith('  ' + target)]
          if len(matches) != 1:
              raise SystemExit(f'FAIL: canonical MainShell entry count={len(matches)}')
          lines[matches[0]] = f'{digest}  {target}'
          canonical.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          ! grep -Eq 'qa-tv-|qaTvPageContent|qaMarker' "$TARGET"
          grep -Fq 'http://3162356.xyz:8080' app/build.gradle.kts
          grep -Fq 'applicationId = "sa.hulksa.player"' app/build.gradle.kts
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Run focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -v
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            qa/canonical/canonical-source.sha256
          git diff --cached --check
          git commit -m 'fix(tv): keep download rows visible and route remote focus'
          git push origin HEAD:fix/v09318-production-host-qualification
