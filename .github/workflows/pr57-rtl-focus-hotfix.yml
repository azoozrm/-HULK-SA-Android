name: Apply PR57 RTL focus hotfix

on:
  push:
    branches:
      - fix/v09318-production-host-qualification
    paths:
      - .github/workflows/pr57-rtl-focus-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr57-rtl-focus-hotfix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09318-production-host-qualification
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply verified RTL focus and 720p card fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = source.read_text()

          old_height = '''internal fun tvDownloadCardHeightDp(screenHeightDp: Int): Float =
              if (screenHeightDp <= 540) 196f else 188f'''
          new_height = '''internal fun tvDownloadCardHeightDp(screenHeightDp: Int): Float =
              if (screenHeightDp <= 540) 164f else 188f'''
          assert text.count(old_height) == 1, 'unexpected TV card-height source state'
          text = text.replace(old_height, new_height, 1)

          old_down = '''DownloadFocusSlot.WIFI -> DownloadFocusNode(0, DownloadFocusSlot.PRIMARY)
                          DownloadFocusSlot.SCHEDULE -> DownloadFocusNode(0, DownloadFocusSlot.PRIORITY)
                          DownloadFocusSlot.CONCURRENT -> DownloadFocusNode(0, DownloadFocusSlot.CANCEL)'''
          new_down = '''DownloadFocusSlot.WIFI -> DownloadFocusNode(0, DownloadFocusSlot.CANCEL)
                          DownloadFocusSlot.SCHEDULE -> DownloadFocusNode(0, DownloadFocusSlot.PRIORITY)
                          DownloadFocusSlot.CONCURRENT -> DownloadFocusNode(0, DownloadFocusSlot.PRIMARY)'''
          assert text.count(old_down) == 1, 'unexpected toolbar-to-row focus source state'
          text = text.replace(old_down, new_down, 1)

          old_up = '''DownloadFocusSlot.PRIMARY -> DownloadFocusSlot.WIFI
                              DownloadFocusSlot.PRIORITY -> DownloadFocusSlot.SCHEDULE
                              DownloadFocusSlot.CANCEL -> DownloadFocusSlot.CONCURRENT'''
          new_up = '''DownloadFocusSlot.PRIMARY -> DownloadFocusSlot.CONCURRENT
                              DownloadFocusSlot.PRIORITY -> DownloadFocusSlot.SCHEDULE
                              DownloadFocusSlot.CANCEL -> DownloadFocusSlot.WIFI'''
          assert text.count(old_up) == 1, 'unexpected row-to-toolbar focus source state'
          text = text.replace(old_up, new_up, 1)
          source.write_text(text)

          test = Path('app/src/test/java/sa/hulksa/player/ui/screens/TvLayoutPolicyTest.kt')
          t = test.read_text()
          t = t.replace('assertEquals(196f, tvDownloadCardHeightDp(screenHeightDp = 360), 0.001f)',
                        'assertEquals(164f, tvDownloadCardHeightDp(screenHeightDp = 360), 0.001f)')
          t = t.replace('assertEquals(196f, tvDownloadCardHeightDp(screenHeightDp = 540), 0.001f)',
                        'assertEquals(164f, tvDownloadCardHeightDp(screenHeightDp = 540), 0.001f)')
          t = t.replace('fun `toolbar focus descends to the aligned action column`()',
                        'fun `toolbar focus descends to the physically aligned RTL action column`()')
          t = t.replace('''DownloadFocusNode(0, DownloadFocusSlot.CANCEL),
                      nextDownloadFocusNode(
                          DownloadFocusNode(-1, DownloadFocusSlot.CONCURRENT),''',
                        '''DownloadFocusNode(0, DownloadFocusSlot.PRIMARY),
                      nextDownloadFocusNode(
                          DownloadFocusNode(-1, DownloadFocusSlot.CONCURRENT),''', 1)
          t = t.replace('''DownloadFocusNode(0, DownloadFocusSlot.PRIMARY),
                      nextDownloadFocusNode(
                          DownloadFocusNode(-1, DownloadFocusSlot.WIFI),''',
                        '''DownloadFocusNode(0, DownloadFocusSlot.CANCEL),
                      nextDownloadFocusNode(
                          DownloadFocusNode(-1, DownloadFocusSlot.WIFI),''', 1)
          t = t.replace('''DownloadFocusNode(-1, DownloadFocusSlot.CONCURRENT),
                      nextDownloadFocusNode(
                          DownloadFocusNode(0, DownloadFocusSlot.CANCEL),''',
                        '''DownloadFocusNode(-1, DownloadFocusSlot.WIFI),
                      nextDownloadFocusNode(
                          DownloadFocusNode(0, DownloadFocusSlot.CANCEL),''', 1)
          test.write_text(t)
          PY

      - name: Update canonical source hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          canonical = Path('qa/canonical/canonical-source.sha256')
          target = 'app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt'
          updated = []
          seen = False
          for line in canonical.read_text().splitlines():
              digest, path = line.split('  ', 1)
              if path == target:
                  digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  seen = True
              updated.append(f'{digest}  {path}')
          assert seen, f'missing canonical target: {target}'
          canonical.write_text('\n'.join(updated) + '\n')
          PY
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Run focused unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'sa.hulksa.player.ui.screens.TvLayoutPolicyTest'

      - name: Commit product fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr57-rtl-focus-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
                  app/src/test/java/sa/hulksa/player/ui/screens/TvLayoutPolicyTest.kt \
                  qa/canonical/canonical-source.sha256 \
                  .github/workflows/pr57-rtl-focus-hotfix.yml
          git commit -m 'fix(tv): align download focus columns for RTL'
          git push origin HEAD:fix/v09318-production-host-qualification
