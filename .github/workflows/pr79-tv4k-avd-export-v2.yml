name: PR79 Export Verified TV 4K Repair V2

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-tv4k-avd-export-v2.yml

permissions:
  contents: read
  statuses: write

jobs:
  export-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean

      - name: Publish export status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='pr79/tv4k-patch-export-v2' \
            -f description="Complete verified TV 4K patch is being exported" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Generate and verify patch
        run: |
          set -euo pipefail
          python3 tools/pr79_tv4k_avd_fix.py
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          bash -n quality/compatibility-v2/prepare_avd_profile.sh
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          git diff --check
          mkdir -p build/pr79-tv4k-patch/.github/workflows
          mkdir -p build/pr79-tv4k-patch/quality/compatibility-v2/tests
          cp .github/workflows/compatibility-v2-full.yml build/pr79-tv4k-patch/.github/workflows/
          cp .github/workflows/compatibility-v2-targeted.yml build/pr79-tv4k-patch/.github/workflows/
          cp quality/compatibility-v2/prepare_avd_profile.sh build/pr79-tv4k-patch/quality/compatibility-v2/
          cp quality/compatibility-v2/run-full.request build/pr79-tv4k-patch/quality/compatibility-v2/
          cp quality/compatibility-v2/tests/test_avd_profile_preparation.py build/pr79-tv4k-patch/quality/compatibility-v2/tests/
          (
            cd build/pr79-tv4k-patch
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: PR79-TV4K-VERIFIED-PATCH-COMPLETE-${{ github.run_id }}
          path: build/pr79-tv4k-patch/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
