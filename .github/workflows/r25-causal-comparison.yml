name: R25 Causal Comparison Signed A/B

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hulk-sa-r25-causal-comparison
  cancel-in-progress: true

env:
  A_SHA: 996ec8a0a1cab774cd524a3e1fcb4a3955c7dd83
  B_SHA: 34f455f64d94adf680a84e295b7fadfdc2dd0137
  BRIDGE_INDICATOR: ec620013af68e0cdc0bd230fa3877601b7701154
  OFFICIAL_HEAD: 7237e7277d5fdc52f27a0c207c05051f5e8f0382
  EXPECTED_PACKAGE: sa.hulksa.player
  EXPECTED_VERSION_CODE: '69'
  EXPECTED_VERSION_NAME: 1.0.1
  EXPECTED_INSTALLED_CERT_SHA256: 144e0548da502aa8bd060a9a280a98bb9dc6763387bf8b20ea100b5fed652fe0
  PATCH_PATH: quality/r25/a-http-trace.patch

jobs:
  build-comparison:
    name: Build and sign historical A and current B
    if: >
      github.repository == 'azoozrm/-HULK-SA-Android' &&
      github.ref == 'refs/heads/fix/home-hero-copy-layout-r01'
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 90
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}

    steps:
      - name: Checkout exact comparison support commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify closed source allowlist and patch identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${A_SHA}^{commit}")" = "$A_SHA"
          test "$(git rev-parse "${B_SHA}^{commit}")" = "$B_SHA"
          test "$(git rev-parse "${BRIDGE_INDICATOR}^")" = "$A_SHA"
          test "$(git rev-parse "${OFFICIAL_HEAD}^{commit}")" = "$OFFICIAL_HEAD"
          git merge-base --is-ancestor "$A_SHA" "$B_SHA"
          git merge-base --is-ancestor "$B_SHA" "$GITHUB_SHA"
          test -f "$PATCH_PATH"
          cp "$PATCH_PATH" "$RUNNER_TEMP/a-http-trace.patch"
          sha256sum "$RUNNER_TEMP/a-http-trace.patch" > "$RUNNER_TEMP/a-http-trace.sha256"
          cat "$RUNNER_TEMP/a-http-trace.sha256"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_ref=${GITHUB_REF}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "a_sha=${A_SHA}"
            echo "b_sha=${B_SHA}"
            echo "bridge_sha=${BRIDGE_INDICATOR}"
            echo "official_head_at_start=${OFFICIAL_HEAD}"
            echo "diagnostic_patch_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/a-http-trace.sha256")"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$RUNNER_TEMP/closed-inputs.txt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate signing inputs
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$HULK_RELEASE_KEYSTORE_BASE64" ]] || missing+=(HULK_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS" ]] || missing+=(HULK_RELEASE_KEY_ALIAS)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD" ]] || missing+=(HULK_RELEASE_STORE_PASSWORD)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD" ]] || missing+=(HULK_RELEASE_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERT_SHA256" ]] || missing+=(HULK_RELEASE_CERT_SHA256)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Missing required signing inputs: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          normalized="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          installed="$(printf '%s' "$EXPECTED_INSTALLED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$normalized" = "$installed"
          echo 'PASS: protected signer continuity is configured'

      - name: Materialize ephemeral keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo 'PASS: signing material is runner-temporary only'

      - name: Prepare isolated A/B worktrees
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/srcA" "$A_SHA"
          git worktree add --detach "$RUNNER_TEMP/srcB" "$B_SHA"
          git -C "$RUNNER_TEMP/srcA" apply --check "$RUNNER_TEMP/a-http-trace.patch"
          git -C "$RUNNER_TEMP/srcA" apply "$RUNNER_TEMP/a-http-trace.patch"

      - name: Build signed A with observation-only patch
        working-directory: ${{ runner.temp }}/srcA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/A"
          test "$(git rev-parse HEAD)" = "$A_SHA"
          git diff > "$RUNNER_TEMP/out/A/DIAGNOSTIC-DIFF.diff"
          sha256sum "$RUNNER_TEMP/out/A/DIAGNOSTIC-DIFF.diff" > "$RUNNER_TEMP/out/A/DIAGNOSTIC-DIFF.sha256"
          ./gradlew --no-daemon --console=plain \
            -PHULK_QUALIFICATION_VERSION_CODE="$EXPECTED_VERSION_CODE" \
            -PHULK_QUALIFICATION_VERSION_NAME="$EXPECTED_VERSION_NAME" \
            clean :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/out/A/HULK-SA-R25-A-${A_SHA}-diag-${EXPECTED_VERSION_CODE}-${EXPECTED_VERSION_NAME}.apk"
          cp "$RUNNER_TEMP/closed-inputs.txt" "$RUNNER_TEMP/out/A/CLOSED-INPUTS.txt"
          {
            cat "$RUNNER_TEMP/closed-inputs.txt"
            echo "arm=A"
            echo "source_sha=${A_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "diagnostic_patch_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/a-http-trace.sha256")"
            echo "diagnostic_diff_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/out/A/DIAGNOSTIC-DIFF.sha256")"
          } > "$RUNNER_TEMP/out/A/SOURCE-PROVENANCE.txt"
          apk="$RUNNER_TEMP/out/A/HULK-SA-R25-A-${A_SHA}-diag-${EXPECTED_VERSION_CODE}-${EXPECTED_VERSION_NAME}.apk"
          package_id="$(apkanalyzer manifest application-id "$apk")"
          version_code="$(apkanalyzer manifest version-code "$apk")"
          version_name="$(apkanalyzer manifest version-name "$apk")"
          test "$package_id" = "$EXPECTED_PACKAGE"
          test "$version_code" = "$EXPECTED_VERSION_CODE"
          test "$version_name" = "$EXPECTED_VERSION_NAME"
          if aapt dump badging "$apk" | grep -q 'application-debuggable'; then exit 1; fi
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" "$RUNNER_TEMP/out/A/APK-SIGNING.txt"
          build_config="$(find app/build/generated/source/buildConfig/release -type f -name BuildConfig.java -print -quit)"
          python3 tools/verify-runtime-config.py "$apk" --build-config "$build_config" --report "$RUNNER_TEMP/out/A/APK-RUNTIME-CONFIG.md"
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report "$RUNNER_TEMP/out/A/APK-ARCHITECTURES.md"
          {
            echo "Application ID: $package_id"
            echo "Version code: $version_code"
            echo "Version name: $version_name"
            echo 'Debuggable: false'
          } > "$RUNNER_TEMP/out/A/PACKAGE-IDENTITY.txt"
          sha256sum "$apk" > "$RUNNER_TEMP/out/A/APK-SHA256.txt"
          cat "$RUNNER_TEMP/out/A/APK-SHA256.txt"

      - name: Build signed B unmodified
        working-directory: ${{ runner.temp }}/srcB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/B"
          test "$(git rev-parse HEAD)" = "$B_SHA"
          ./gradlew --no-daemon --console=plain \
            -PHULK_QUALIFICATION_VERSION_CODE="$EXPECTED_VERSION_CODE" \
            -PHULK_QUALIFICATION_VERSION_NAME="$EXPECTED_VERSION_NAME" \
            clean :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/out/B/HULK-SA-R25-B-${B_SHA}-stock-${EXPECTED_VERSION_CODE}-${EXPECTED_VERSION_NAME}.apk"
          cp "$RUNNER_TEMP/closed-inputs.txt" "$RUNNER_TEMP/out/B/CLOSED-INPUTS.txt"
          {
            cat "$RUNNER_TEMP/closed-inputs.txt"
            echo "arm=B"
            echo "source_sha=${B_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "diagnostic_patch_sha256=none"
          } > "$RUNNER_TEMP/out/B/SOURCE-PROVENANCE.txt"
          apk="$RUNNER_TEMP/out/B/HULK-SA-R25-B-${B_SHA}-stock-${EXPECTED_VERSION_CODE}-${EXPECTED_VERSION_NAME}.apk"
          package_id="$(apkanalyzer manifest application-id "$apk")"
          version_code="$(apkanalyzer manifest version-code "$apk")"
          version_name="$(apkanalyzer manifest version-name "$apk")"
          test "$package_id" = "$EXPECTED_PACKAGE"
          test "$version_code" = "$EXPECTED_VERSION_CODE"
          test "$version_name" = "$EXPECTED_VERSION_NAME"
          if aapt dump badging "$apk" | grep -q 'application-debuggable'; then exit 1; fi
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" "$RUNNER_TEMP/out/B/APK-SIGNING.txt"
          build_config="$(find app/build/generated/source/buildConfig/release -type f -name BuildConfig.java -print -quit)"
          python3 tools/verify-runtime-config.py "$apk" --build-config "$build_config" --report "$RUNNER_TEMP/out/B/APK-RUNTIME-CONFIG.md"
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report "$RUNNER_TEMP/out/B/APK-ARCHITECTURES.md"
          {
            echo "Application ID: $package_id"
            echo "Version code: $version_code"
            echo "Version name: $version_name"
            echo 'Debuggable: false'
          } > "$RUNNER_TEMP/out/B/PACKAGE-IDENTITY.txt"
          sha256sum "$apk" > "$RUNNER_TEMP/out/B/APK-SHA256.txt"
          cat "$RUNNER_TEMP/out/B/APK-SHA256.txt"

      - name: Upload signed comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r25-causal-comparison-signed
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 14
