name: HULK SA Quality UI Gate

on:
  workflow_call:
    inputs:
      full_matrix:
        required: false
        type: boolean
        default: false
      report_only:
        required: false
        type: boolean
        default: false
      update_baseline:
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'qa/compatibility/**'
      - 'qa/quality/**'
      - '.github/workflows/quality-ui.yml'
      - '.github/workflows/compatibility-lab.yml'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run all qualified Compatibility Lab profiles
        required: false
        type: boolean
        default: true
      report_only:
        description: Does not override deterministic product failures
        required: false
        type: boolean
        default: false
      update_baseline:
        description: Baseline updates are forbidden here
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hulk-quality-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-policy:
    name: Enforce visual baseline policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject automatic visual baseline update
        env:
          UPDATE_BASELINE: ${{ inputs.update_baseline || false }}
        run: |
          set -euo pipefail
          [[ "$UPDATE_BASELINE" = 'false' ]]

  compose-instrumentation:
    name: Compose, Android and deterministic download instrumentation
    needs: baseline-policy
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Prepare fail-closed instrumentation evidence
        run: |
          set -euo pipefail
          python3 -m qa.quality.scripts.instrumentation_evidence \
            --out quality-evidence/instrumentation \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --step-outcome not_started

      - name: Run isolated instrumentation on API 35
        id: instrumented
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 1024M
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window -gpu swiftshader -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot -no-metrics
          script: |
            set -euo pipefail

            runtime_evidence="quality-evidence/instrumentation/runtime"
            mkdir -p "$runtime_evidence"

            capture_device_evidence() {
              local destination="$1"
              mkdir -p "$destination"
              adb devices -l > "$destination/adb-devices.txt" 2>&1 || true
              adb shell getprop > "$destination/getprop.txt" 2>&1 || true
              adb shell service list > "$destination/services.txt" 2>&1 || true
              adb shell dumpsys activity activities > "$destination/activity.txt" 2>&1 || true
              adb shell dumpsys package sa.hulksa.player.dev > "$destination/package.txt" 2>&1 || true
              adb shell dumpsys meminfo > "$destination/meminfo.txt" 2>&1 || true
              adb shell dumpsys dropbox --print system_app_crash > "$destination/dropbox-system-app-crash.txt" 2>&1 || true
              adb logcat -d -v threadtime > "$destination/logcat.txt" 2>&1 || true
              cp -a app/build/outputs/androidTest-results "$destination/androidTest-results" 2>/dev/null || true
              cp -a app/build/reports/androidTests "$destination/androidTest-reports" 2>/dev/null || true
            }

            wait_for_android_services() {
              adb wait-for-device
              local consecutive=0
              local attempt
              for attempt in $(seq 1 180); do
                local boot package_service activity_service current_user
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                package_service="$(adb shell service check package 2>/dev/null || true)"
                activity_service="$(adb shell service check activity 2>/dev/null || true)"
                current_user="$(adb shell am get-current-user 2>/dev/null | tr -d '\r' || true)"
                if [[ "$boot" = '1' ]] &&
                   [[ "$package_service" == *'found'* ]] &&
                   [[ "$activity_service" == *'found'* ]] &&
                   [[ "$current_user" =~ ^[0-9]+$ ]]; then
                  consecutive=$((consecutive + 1))
                  if (( consecutive >= 6 )); then
                    return 0
                  fi
                else
                  consecutive=0
                fi
                sleep 5
              done
              capture_device_evidence "$runtime_evidence/boot-failure"
              return 1
            }

            run_instrumentation() {
              ./gradlew --no-daemon --console=plain \
                connectedDebugAndroidTest \
                -PHULK_PORTAL_URL=http://3162356.xyz:8080 \
                -PHULK_CONFIG_URL= \
                --stacktrace
            }

            wait_for_android_services
            adb shell input keyevent 82 || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            capture_device_evidence "$runtime_evidence/pre-test"

            if run_instrumentation; then
              capture_device_evidence "$runtime_evidence/success"
              exit 0
            fi
            first_status=$?

            capture_device_evidence "$runtime_evidence/attempts/attempt-1"

            # Retry only a zero-test infrastructure failure. A real assertion or
            # product failure must remain final and must never be hidden by retry.
            if ! grep -Rqs 'No test results' app/build/outputs/androidTest-results 2>/dev/null; then
              exit "$first_status"
            fi
            if grep -RqsE 'tests="[1-9][0-9]*"' app/build/outputs/androidTest-results 2>/dev/null; then
              exit "$first_status"
            fi

            rm -rf app/build/outputs/androidTest-results app/build/reports/androidTests
            adb reconnect || true
            wait_for_android_services
            adb shell am force-stop androidx.test.orchestrator || true
            adb shell pm clear androidx.test.orchestrator || true
            adb shell pm clear androidx.test.services || true
            adb shell pm clear sa.hulksa.player.dev || true
            sleep 10

            if run_instrumentation; then
              capture_device_evidence "$runtime_evidence/success-after-infrastructure-retry"
              exit 0
            fi
            retry_status=$?
            capture_device_evidence "$runtime_evidence/attempts/attempt-2"
            exit "$retry_status"

      - name: Finalize instrumentation evidence
        if: always()
        env:
          EMULATOR_STEP_OUTCOME: ${{ steps.instrumented.outcome }}
        run: |
          set -euo pipefail
          python3 -m qa.quality.scripts.instrumentation_evidence \
            --out quality-evidence/instrumentation \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --step-outcome "$EMULATOR_STEP_OUTCOME" \
            --results-root app/build/outputs/androidTest-results \
            --reports-root app/build/reports/androidTests

      - name: Verify instrumentation evidence exists
        if: always()
        run: |
          set -euo pipefail
          jq -e '.overall_status == "PASS"' \
            quality-evidence/instrumentation/SUMMARY.json
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -quit |
            grep -q .
          find app/build/reports/androidTests -type f -print -quit | grep -q .

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-COMPOSE-INSTRUMENTATION
          path: |
            quality-evidence/instrumentation/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14

  compatibility-runtime:
    name: Compatibility runtime, visual, navigation and focus
    needs: baseline-policy
    uses: ./.github/workflows/compatibility-lab.yml
    with:
      enforce_findings: true
      source_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      pr_number: ${{ github.event.pull_request.number || '' }}
      test_variant: quality-ui

  enforce:
    name: Final UI evidence enforcement
    if: always()
    needs:
      - baseline-policy
      - compose-instrumentation
      - compatibility-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce all UI layers
        env:
          POLICY: ${{ needs.baseline-policy.result }}
          INSTRUMENTATION: ${{ needs.compose-instrumentation.result }}
          COMPATIBILITY: ${{ needs.compatibility-runtime.result }}
          REPORT_ONLY: ${{ inputs.report_only || false }}
        run: |
          set -euo pipefail
          echo "report_only=$REPORT_ONLY (cannot override failures)"
          [[ "$POLICY" = 'success' ]]
          [[ "$INSTRUMENTATION" = 'success' ]]
          [[ "$COMPATIBILITY" = 'success' ]]
