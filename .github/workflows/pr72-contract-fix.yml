name: PR72 Contract Fix

on:
  push:
    branches:
      - quality/api28-tv-focus-audit-repair

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/api28-tv-focus-audit-repair
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lab test dependencies
        run: python -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt
      - name: Apply exact runner/analyzer contract repair
        run: python qa/compatibility/pr72_contract_fix.py
      - name: Validate lab contracts
        run: |
          set -euo pipefail
          python -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python -m unittest discover -s qa/compatibility/tests -v
          python qa/compatibility/lab_config.py --validate
      - name: Commit clean three-file PR head
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/pr72-contract-fix.yml qa/compatibility/pr72_contract_fix.py
          git add qa/compatibility/run-lab.py qa/compatibility/tests/test_lab.py
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "qa/compatibility/run-lab.py qa/compatibility/tests/test_lab.py "
          git commit -m 'test: align TV download action audit contract'
          git push origin HEAD:quality/api28-tv-focus-audit-repair
