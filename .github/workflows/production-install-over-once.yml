name: HULK SA Production Install Over Once

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - .github/workflows/production-install-over-once.yml

permissions:
  contents: read

concurrency:
  group: hulk-sa-production-install-over-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-install-over:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 85
    env:
      BASELINE_REF: c291fa7df2f3ee3a04d020cd831f02073a44d514
      PACKAGE: sa.hulksa.player
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE_ROOT: build/production-install-over-evidence

    steps:
      - name: Checkout candidate head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Checkout preserved PR57 baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and validate protected inputs
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
          missing=()
          [[ -n "$HULK_RELEASE_KEYSTORE_BASE64" ]] || missing+=(HULK_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS" ]] || missing+=(HULK_RELEASE_KEY_ALIAS)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD" ]] || missing+=(HULK_RELEASE_STORE_PASSWORD)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD" ]] || missing+=(HULK_RELEASE_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERT_SHA256" ]] || missing+=(HULK_RELEASE_CERT_SHA256)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Missing protected signing inputs: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build PR57 baseline and candidate with production signer
        run: |
          set -euo pipefail
          (
            cd baseline
            ./gradlew --no-daemon --console=plain clean :app:assembleRelease \
              -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
              -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          )
          (
            cd candidate
            ./gradlew --no-daemon --console=plain clean :app:assembleRelease \
              -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
              -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          )
          mkdir -p "$EVIDENCE_ROOT/apks"
          cp baseline/app/build/outputs/apk/release/app-release.apk \
            "$EVIDENCE_ROOT/apks/pr57-production.apk"
          cp candidate/app/build/outputs/apk/release/app-release.apk \
            "$EVIDENCE_ROOT/apks/candidate-production.apk"

      - name: Verify production identity and certificate continuity
        run: |
          set -euo pipefail
          baseline_apk="$EVIDENCE_ROOT/apks/pr57-production.apk"
          candidate_apk="$EVIDENCE_ROOT/apks/candidate-production.apk"
          for apk in "$baseline_apk" "$candidate_apk"; do
            test "$(apkanalyzer manifest application-id "$apk")" = "$PACKAGE"
            test "$(apkanalyzer manifest version-code "$apk")" = '64'
            test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'
            apksigner verify --verbose --print-certs "$apk"
          done
          apksigner verify --verbose --print-certs "$baseline_apk" \
            > "$EVIDENCE_ROOT/BASELINE-SIGNER.txt"
          apksigner verify --verbose --print-certs "$candidate_apk" \
            > "$EVIDENCE_ROOT/CANDIDATE-SIGNER.txt"
          baseline_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE_ROOT/BASELINE-SIGNER.txt" | head -n1 | tr '[:lower:]' '[:upper:]')"
          candidate_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE_ROOT/CANDIDATE-SIGNER.txt" | head -n1 | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$baseline_cert"
          test "$baseline_cert" = "$candidate_cert"
          test "$candidate_cert" = "$expected_cert"
          baseline_sha="$(git -C baseline rev-parse HEAD)"
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          baseline_apk_sha="$(sha256sum "$baseline_apk" | awk '{print $1}')"
          candidate_apk_sha="$(sha256sum "$candidate_apk" | awk '{print $1}')"
          {
            echo "baseline_sha=$baseline_sha"
            echo "candidate_sha=$candidate_sha"
            echo "package=$PACKAGE"
            echo 'versionCode=64'
            echo 'versionName=0.9.3.20'
            echo "certificate_sha256=$candidate_cert"
            echo "baseline_apk_sha256=$baseline_apk_sha"
            echo "candidate_apk_sha256=$candidate_apk_sha"
            echo 'identity_result=PASS'
          } > "$EVIDENCE_ROOT/PRODUCTION-INSTALL-OVER-PLAN.txt"

      - name: Create runtime qualification script
        run: |
          set -euo pipefail
          cat > candidate/build/run-production-install-over.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          baseline_apk="$1"
          candidate_apk="$2"
          package="$3"
          evidence="$4"
          mkdir -p "$evidence/runtime"
          runtime="$evidence/runtime"

          adb wait-for-device
          adb logcat -c
          adb uninstall "$package" >/dev/null 2>&1 || true
          adb install --no-streaming "$baseline_apk" | tee "$runtime/BASELINE-INSTALL.txt"
          grep -Fq 'Success' "$runtime/BASELINE-INSTALL.txt"
          adb shell dumpsys package "$package" > "$runtime/PACKAGE-BEFORE.txt"
          adb shell cmd package list packages -U "$package" > "$runtime/UID-BEFORE.txt"

          extract_field() {
            local pattern="$1"
            local file="$2"
            grep -m1 "$pattern" "$file" | sed 's/^[[:space:]]*//'
          }

          uid_before="$(extract_field 'userId=' "$runtime/PACKAGE-BEFORE.txt")"
          data_before="$(extract_field 'dataDir=' "$runtime/PACKAGE-BEFORE.txt")"
          first_before="$(extract_field 'firstInstallTime=' "$runtime/PACKAGE-BEFORE.txt")"
          test -n "$uid_before"
          test -n "$data_before"
          test -n "$first_before"

          adb shell am start -W -n "$package/sa.hulksa.player.MainActivity" \
            > "$runtime/BASELINE-LAUNCH.txt"
          grep -Fq 'Status: ok' "$runtime/BASELINE-LAUNCH.txt"
          sleep 3
          adb exec-out screencap -p > "$runtime/baseline-window.png"

          sleep 2
          adb install --no-streaming -r "$candidate_apk" | tee "$runtime/CANDIDATE-UPDATE.txt"
          grep -Fq 'Success' "$runtime/CANDIDATE-UPDATE.txt"
          adb shell dumpsys package "$package" > "$runtime/PACKAGE-AFTER.txt"
          adb shell cmd package list packages -U "$package" > "$runtime/UID-AFTER.txt"

          uid_after="$(extract_field 'userId=' "$runtime/PACKAGE-AFTER.txt")"
          data_after="$(extract_field 'dataDir=' "$runtime/PACKAGE-AFTER.txt")"
          first_after="$(extract_field 'firstInstallTime=' "$runtime/PACKAGE-AFTER.txt")"
          last_after="$(extract_field 'lastUpdateTime=' "$runtime/PACKAGE-AFTER.txt")"
          test "$uid_before" = "$uid_after"
          test "$data_before" = "$data_after"
          test "$first_before" = "$first_after"
          test -n "$last_after"
          cmp -s "$runtime/UID-BEFORE.txt" "$runtime/UID-AFTER.txt"

          adb shell am force-stop "$package"
          adb shell am start -W -n "$package/sa.hulksa.player.MainActivity" \
            > "$runtime/CANDIDATE-LAUNCH.txt"
          grep -Fq 'Status: ok' "$runtime/CANDIDATE-LAUNCH.txt"

          stable=0
          for attempt in 1 2 3 4 5 6 7 8; do
            resumed="$(adb shell dumpsys activity activities | grep -m1 'mResumedActivity' || true)"
            echo "probe=$attempt resumed=$resumed" >> "$runtime/FOREGROUND-PROBES.txt"
            if [[ "$resumed" == *"$package"* ]]; then
              stable=$((stable + 1))
              if [[ "$stable" -ge 3 ]]; then
                break
              fi
            else
              stable=0
            fi
            sleep 2
          done
          test "$stable" -ge 3

          adb shell uiautomator dump /sdcard/production-window.xml >/dev/null
          adb pull /sdcard/production-window.xml "$runtime/window.xml" >/dev/null
          adb exec-out screencap -p > "$runtime/full-window.png"
          adb logcat -d -v threadtime > "$runtime/logcat.txt"
          adb shell dumpsys activity activities > "$runtime/activities.txt"
          adb shell dumpsys window windows > "$runtime/windows.txt"

          python3 - "$runtime" "$package" <<'PY'
          import struct
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(sys.argv[1])
          package = sys.argv[2]
          png = root / 'full-window.png'
          data = png.read_bytes()[:24]
          if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
              raise SystemExit('Invalid final PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1080, 2340):
              raise SystemExit(f'Unexpected final PNG geometry: {width}x{height}')
          hierarchy = ET.parse(root / 'window.xml').getroot()
          packages = {
              node.attrib.get('package')
              for node in hierarchy.iter()
              if node.attrib.get('package')
          }
          if package not in packages:
              raise SystemExit(f'Application package absent from hierarchy: {sorted(packages)}')
          PY

          {
            echo 'baseline_install=PASS'
            echo 'candidate_install_r=PASS'
            echo 'package_uid_preserved=PASS'
            echo 'data_directory_preserved=PASS'
            echo 'first_install_time_preserved=PASS'
            echo 'candidate_cold_launch=PASS'
            echo 'foreground_stability=PASS'
            echo 'result=PASS'
          } > "$evidence/PRODUCTION-INSTALL-OVER-RESULT.txt"
          BASH
          chmod +x candidate/build/run-production-install-over.sh

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install PR57 production APK and update candidate in place
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: >-
            bash candidate/build/run-production-install-over.sh
            "$EVIDENCE_ROOT/apks/pr57-production.apk"
            "$EVIDENCE_ROOT/apks/candidate-production.apk"
            "$PACKAGE"
            "$EVIDENCE_ROOT"

      - name: Finalize production install-over evidence
        if: always()
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_ROOT/PRODUCTION-INSTALL-OVER-RESULT.txt"
          grep -Fq 'result=PASS' "$EVIDENCE_ROOT/PRODUCTION-INSTALL-OVER-RESULT.txt"
          test -s "$EVIDENCE_ROOT/runtime/full-window.png"
          test -s "$EVIDENCE_ROOT/runtime/window.xml"
          test -s "$EVIDENCE_ROOT/runtime/logcat.txt"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
              xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-PRODUCTION-INSTALL-OVER-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21
