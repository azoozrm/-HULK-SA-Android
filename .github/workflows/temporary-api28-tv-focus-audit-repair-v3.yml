name: Temporary API28 and TV focus audit repair v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'quality/api28-tv-focus-audit-repair'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct generator escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qa/compatibility/patch-api28-tv-focus-audit.py')
          text = path.read_text(encoding='utf-8')
          old = 'json.dumps(result, ensure_ascii=False, indent=2) + "\\n",'
          new = 'json.dumps(result, ensure_ascii=False, indent=2) + "\\\\n",'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'escaping anchor count: {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic repair
        run: python3 qa/compatibility/patch-api28-tv-focus-audit.py

      - name: Install Quality Lab test dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Run Quality Lab unit contracts
        run: |
          python3 -m py_compile qa/compatibility/run-lab.py qa/compatibility/tests/test_lab.py
          python3 -m unittest qa.compatibility.tests.test_lab

      - name: Commit only intended lab files and remove temporary tooling
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-api28-tv-focus-audit-repair.yml
          git rm .github/workflows/temporary-api28-tv-focus-audit-repair-v2.yml
          git rm .github/workflows/temporary-api28-tv-focus-audit-repair-v3.yml
          git rm qa/compatibility/patch-api28-tv-focus-audit.py
          git add qa/compatibility/QaActivity.kt
          git add qa/compatibility/run-lab.py
          git add qa/compatibility/tests/test_lab.py
          git diff --cached --check
          git commit -m "test: stabilize API28 harness and TV focus action audit"
          git push origin "HEAD:${BRANCH}"
