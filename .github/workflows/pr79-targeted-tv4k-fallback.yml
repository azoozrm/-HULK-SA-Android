name: PR79 Targeted TV 4K Qualification

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-targeted-tv4k-fallback.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr79-targeted-tv4k-qualification
  cancel-in-progress: false

jobs:
  targeted-tv4k:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE_ROOT: build/compatibility-v2/targeted/tv-4k-api36
      APP_APK: app/build/outputs/apk/debug/app-debug.apk
      TEST_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
    steps:
      - uses: actions/checkout@v7

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='compatibility-v2/targeted-tv4k' \
            -f description='Targeted TV 4K qualification is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Build target APKs and validate tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          bash -n quality/compatibility-v2/prepare_avd_profile.sh
          bash -n quality/compatibility-v2/collect_runtime_evidence.sh
          bash -n quality/compatibility-v2/run_runtime_profile.sh
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Configure Linux KVM
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Execute targeted TV 4K profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -no-snapshot-save -skin 3840x2160
          pre-emulator-launch-script: bash quality/compatibility-v2/prepare_avd_profile.sh '3840' '2160' '640' 'test'
          script: bash quality/compatibility-v2/run_runtime_profile.sh 'tv-4k-api36' '3840' '2160' '640' '1.0' '0' 'ar-SA' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' 'build/compatibility-v2/targeted/tv-4k-api36' 'none' 'default' 'TELEVISION' 'REMOTE' 'EXPANDED' 'MEDIUM' 'LANDSCAPE'

      - name: Enforce targeted evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root "$EVIDENCE_ROOT" \
            --out "$EVIDENCE_ROOT/gate"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-TARGETED-TV4K-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

      - name: Publish final targeted status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Targeted TV 4K qualification failed'
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='Targeted TV 4K qualification passed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='compatibility-v2/targeted-tv4k' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
