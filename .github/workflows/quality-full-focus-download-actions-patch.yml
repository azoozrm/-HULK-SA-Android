name: Apply Full Focus Download Lab Patch

on:
  push:
    branches:
      - quality/full-focus-and-download-actions
    paths:
      - tools/.quality-full-focus-trigger

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/full-focus-and-download-actions
          fetch-depth: 0

      - name: Apply isolated Quality Lab patch
        run: |
          set -euo pipefail
          python3 tools/patch_full_focus_download_lab.py
          python3 -m py_compile \
            qa/compatibility/run-lab.py \
            qa/compatibility/analyze.py \
            qa/compatibility/tests/test_lab.py

      - name: Run Quality Lab unit and contract tests
        run: |
          set -euo pipefail
          python3 -m pip install -r qa/compatibility/requirements.txt
          python3 -m unittest discover -s qa/compatibility/tests -v
          python3 qa/compatibility/lab_config.py --validate
          grep -Fq 'repository.pause(item.downloadId)' qa/compatibility/QaActivity.kt
          grep -Fq 'repository.cyclePriority(item.downloadId)' qa/compatibility/QaActivity.kt
          grep -Fq 'def download_action_audit' qa/compatibility/run-lab.py
          grep -Fq 'tv_download_action_not_executed' qa/compatibility/analyze.py

      - name: Commit only the qualified lab files
        run: |
          set -euo pipefail
          rm -f tools/patch_full_focus_download_lab.py
          rm -f tools/.quality-full-focus-trigger
          rm -f .github/workflows/quality-full-focus-download-actions-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            qa/compatibility/QaActivity.kt \
            qa/compatibility/run-lab.py \
            qa/compatibility/analyze.py \
            qa/compatibility/tests/test_lab.py \
            qa/compatibility/README.md \
            tools/patch_full_focus_download_lab.py \
            tools/.quality-full-focus-trigger \
            .github/workflows/quality-full-focus-download-actions-patch.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m 'test: enforce full TV focus and real download actions'
          git push origin HEAD:quality/full-focus-and-download-actions
