name: Validate HULK SA v0.9.3.3 Mobile Memory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-v0933-mobile-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          set -o pipefail
          mkdir -p build-logs reports
          { yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'; } 2>&1 | tee build-logs/01-sdk.log
      - name: Prepare source
        run: |
          set -euo pipefail
          ARCHIVE='HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
          rm -rf extracted project
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n1)
          test -n "$ROOT"
          cp -a "$ROOT" project
          python3 tools/repair-v09120.py project 2>&1 | tee build-logs/02-repair.log
          python3 tools/prepare-v0920-architecture.py project 2>&1 | tee build-logs/03-architecture.log
          python3 tools/prepare-v0930-adaptive-ui.py project 2>&1 | tee build-logs/04-adaptive.log
          python3 tools/prepare-v0932-mobile-followup.py project 2>&1 | tee build-logs/05-followup.log
          python3 tools/prepare-v0933-mobile-memory.py project 2>&1 | tee build-logs/06-memory.log
          python3 tools/prepare-v0933-mobile-memory.py project 2>&1 | tee build-logs/07-idempotency.log
          grep -n 'versionCode = 47' project/app/build.gradle.kts
          grep -n 'versionName = "0.9.3.3"' project/app/build.gradle.kts
          grep -RIn 'queryMemory' project/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -RIn 'categoryMemory' project/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -RIn 'detectVerticalDragGestures' project/app/src/main/java/sa/hulksa/player/ui/screens/PlayerScreen.kt
          grep -RIn 'player.seekTo(target)' project/app/src/main/java/sa/hulksa/player/ui/screens/PlayerScreen.kt
          printf '# HULK SA v0.9.3.3 Source Verification\n\nStatus: **PASS**\n' > reports/MOBILE-MEMORY-SOURCE-REPORT.md
      - name: Compile, test and build
        working-directory: project
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:compileDebugKotlin testDebugUnitTest :app:assembleDebug :app:bundleDebug --stacktrace 2>&1 | tee ../build-logs/08-gradle.log
      - name: Verify packages
        run: |
          set -euo pipefail
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          test -s "$APK"
          test -s "$AAB"
          python3 tools/verify-android-architectures.py "$APK" --require-native-libs --report reports/APK-ARCHITECTURE-REPORT.md
          python3 tools/verify-android-architectures.py "$AAB" --require-native-libs --report reports/AAB-ARCHITECTURE-REPORT.md
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee reports/APK-BADGING.txt
          grep "package: name='sa.hulksa.player.dev' versionCode='47' versionName='0.9.3.3-beta'" reports/APK-BADGING.txt
      - name: Package delivery
        run: |
          set -euo pipefail
          rm -rf delivery source-delivery
          mkdir delivery source-delivery
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          cp "$APK" delivery/HULK-SA-v0.9.3.3-MOBILE-MEMORY-UNIVERSAL-debug.apk
          cp "$AAB" delivery/HULK-SA-v0.9.3.3-MOBILE-MEMORY-debug.aab
          cp reports/* delivery/
          cp -a project/. source-delivery/
          rm -rf source-delivery/.gradle source-delivery/.kotlin source-delivery/build source-delivery/app/build
          (cd source-delivery && zip -qr ../delivery/HULK-SA-Source-v0.9.3.3-MOBILE-MEMORY.zip .)
          printf '# HULK SA v0.9.3.3 Build Report\n\n- Per-section memory: PASS\n- Mobile/TV hints: PASS\n- Reorder edit mode: PASS\n- Live swipe switching: PASS\n- Safe area: PASS\n- Immediate inverted seek: PASS\n- Kotlin/tests/APK/AAB/ABI: PASS\n' > delivery/BUILD-REPORT-v0.9.3.3.md
          (cd delivery && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.3-MOBILE-MEMORY
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.3-MOBILE-MEMORY-DIAGNOSTICS
          path: |
            build-logs/
            reports/
            project/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
