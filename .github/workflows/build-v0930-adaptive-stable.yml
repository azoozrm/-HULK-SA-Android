name: Build HULK SA v0.9.3.0 Adaptive Stable

on:
  push:
    branches: [phase-3-v0.9.3.0-adaptive-stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v0930-adaptive-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          mkdir -p build-logs reports
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare source
        run: |
          set -euo pipefail
          rm -rf extracted project
          mkdir extracted
          unzip -q 'HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip' -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n1)
          cp -a "$ROOT" project
          python3 tools/repair-v09120.py project
          python3 tools/prepare-v0920-architecture.py project
          python3 tools/prepare-v0930-adaptive-source.py project
          python3 tools/verify-v0930-adaptive-source.py project --report reports/ADAPTIVE-SOURCE-REPORT.md
      - name: Build and test
        working-directory: project
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean testDebugUnitTest :app:assembleDebug :app:bundleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../build-logs/gradle.log
      - name: Verify and package
        run: |
          set -euo pipefail
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          python3 tools/verify-android-architectures.py "$APK" --require-native-libs --report reports/APK-ARCHITECTURE-REPORT.md
          python3 tools/verify-android-architectures.py "$AAB" --require-native-libs --report reports/AAB-ARCHITECTURE-REPORT.md
          rm -rf delivery source-delivery
          mkdir delivery source-delivery
          cp "$APK" delivery/HULK-SA-v0.9.3.0-ADAPTIVE-STABLE-UNIVERSAL-debug.apk
          cp "$AAB" delivery/HULK-SA-v0.9.3.0-ADAPTIVE-STABLE-debug.aab
          cp reports/*.md delivery/
          cp -a project/. source-delivery/
          rm -rf source-delivery/.gradle source-delivery/.kotlin source-delivery/build source-delivery/app/build
          (cd source-delivery && zip -qr ../delivery/HULK-SA-Source-v0.9.3.0-ADAPTIVE-STABLE.zip .)
          (cd delivery && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.0-ADAPTIVE-STABLE
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.0-ADAPTIVE-STABLE-DIAGNOSTICS
          path: |
            build-logs/
            reports/
            project/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
