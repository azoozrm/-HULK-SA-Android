name: HULK SA Production Authenticated Smoke

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Smoke runtime: GitHub-hosted emulator or the lab physical device'
        required: true
        default: github-emulator
        type: choice
        options:
          - github-emulator
          - lab-device

permissions:
  contents: read

concurrency:
  group: hulk-sa-production-authenticated-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-smoke:
    name: Authenticated catalog/details/stream smoke
    runs-on: ${{ inputs.runtime == 'lab-device' && 'hulk-lab-smoke' || 'ubuntu-latest' }}
    environment: production-e2e
    timeout-minutes: 60
    env:
      HULK_E2E_ACCESS_CODE: ${{ secrets.HULK_E2E_ACCESS_CODE }}
      HULK_E2E_USERNAME: ${{ secrets.HULK_E2E_USERNAME }}
      HULK_E2E_PASSWORD: ${{ secrets.HULK_E2E_PASSWORD }}
      HULK_SMOKE_RUNTIME: ${{ inputs.runtime == 'lab-device' && 'lab physical device' || 'Android API 35 / x86_64 emulator' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4
        if: inputs.runtime != 'lab-device'

      - name: Use lab Android SDK
        if: inputs.runtime == 'lab-device'
        shell: bash
        env:
          HULK_LAB_ANDROID_SDK: ${{ vars.HULK_LAB_ANDROID_SDK }}
        run: |
          set -euo pipefail
          [[ -n "$HULK_LAB_ANDROID_SDK" ]] || { echo 'STOP: HULK_LAB_ANDROID_SDK environment variable is missing' >&2; exit 2; }
          [[ -x "$HULK_LAB_ANDROID_SDK/platform-tools/adb" ]] || { echo 'STOP: lab Android SDK is incomplete' >&2; exit 2; }
          echo "ANDROID_SDK_ROOT=$HULK_LAB_ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HULK_LAB_ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$HULK_LAB_ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Validate protected E2E inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HULK_E2E_ACCESS_CODE" ]] || { echo 'Missing HULK_E2E_ACCESS_CODE in production-e2e environment' >&2; exit 2; }
          [[ -n "$HULK_E2E_USERNAME" ]] || { echo 'Missing HULK_E2E_USERNAME in production-e2e environment' >&2; exit 2; }
          [[ -n "$HULK_E2E_PASSWORD" ]] || { echo 'Missing HULK_E2E_PASSWORD in production-e2e environment' >&2; exit 2; }
          echo 'PASS: protected production E2E credentials are available'

      - name: Configure Linux KVM when available
        if: inputs.runtime != 'lab-device'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm || true
          fi

      - name: Run protected production instrumentation (emulator)
        if: inputs.runtime != 'lab-device'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -no-snapshot-save
          script: >-
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=sa.hulksa.player.ProductionAuthenticatedSmokeTest
            -Pandroid.testInstrumentationRunnerArguments.hulkProductionE2e=true
            -Pandroid.testInstrumentationRunnerArguments.hulkE2eAccessCode="$HULK_E2E_ACCESS_CODE"
            -Pandroid.testInstrumentationRunnerArguments.hulkE2eUsername="$HULK_E2E_USERNAME"
            -Pandroid.testInstrumentationRunnerArguments.hulkE2ePassword="$HULK_E2E_PASSWORD"

      - name: Run protected production instrumentation (lab physical device)
        if: inputs.runtime == 'lab-device'
        shell: bash
        env:
          HULK_LAB_SERIAL: ${{ vars.HULK_LAB_SMOKE_SERIAL }}
          HULK_LAB_MODEL: SM-A065F
          HULK_TV_SERIAL: ${{ vars.HULK_LAB_TV_SERIAL }}
        run: |
          set -euo pipefail
          [[ -n "$HULK_LAB_SERIAL" ]] || { echo 'STOP: HULK_LAB_SMOKE_SERIAL environment variable is missing' >&2; exit 2; }
          adb connect "$HULK_LAB_SERIAL" >/dev/null 2>&1 || true
          timeout 60 adb -s "$HULK_LAB_SERIAL" wait-for-device || { echo 'STOP: lab smoke device is not online' >&2; exit 4; }
          model=$(adb -s "$HULK_LAB_SERIAL" shell getprop ro.product.model | tr -d '\r')
          [[ "$model" == "$HULK_LAB_MODEL" ]] || { echo "STOP: unexpected lab device model '$model'" >&2; exit 3; }
          api=$(adb -s "$HULK_LAB_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')
          echo "Lab smoke device: $HULK_LAB_MODEL (API $api)"
          adb -s "$HULK_LAB_SERIAL" shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          if [[ -n "${HULK_TV_SERIAL:-}" ]]; then
            # The TV engineering transport must not join this connected test run.
            adb disconnect "$HULK_TV_SERIAL" >/dev/null 2>&1 || true
            trap 'adb connect "$HULK_TV_SERIAL" >/dev/null 2>&1 || true' EXIT
          fi
          ANDROID_SERIAL="$HULK_LAB_SERIAL" ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=sa.hulksa.player.ProductionAuthenticatedSmokeTest \
            -Pandroid.testInstrumentationRunnerArguments.hulkProductionE2e=true \
            -Pandroid.testInstrumentationRunnerArguments.hulkE2eAccessCode="$HULK_E2E_ACCESS_CODE" \
            -Pandroid.testInstrumentationRunnerArguments.hulkE2eUsername="$HULK_E2E_USERNAME" \
            -Pandroid.testInstrumentationRunnerArguments.hulkE2ePassword="$HULK_E2E_PASSWORD"

      - name: Publish sanitized evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/production-e2e-evidence
          cat > build/production-e2e-evidence/SUMMARY.md <<EOF
          # HULK SA Production Authenticated Smoke

          - Source SHA: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Runtime: ${HULK_SMOKE_RUNTIME}
          - Production login: PASS
          - Live catalog: PASS
          - Movie catalog and details: PASS
          - Series catalog and episode lookup: PASS
          - Live stream bounded byte probe: PASS
          - Movie stream bounded byte probe: PASS
          - Episode stream bounded byte probe: PASS
          - Credentials persisted by test: NO
          - Credentials included in evidence artifact: NO
          EOF
          sha256sum build/production-e2e-evidence/SUMMARY.md > build/production-e2e-evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: HULK-SA-PRODUCTION-AUTHENTICATED-SMOKE-${{ github.run_id }}
          path: build/production-e2e-evidence/
          if-no-files-found: error
          retention-days: 14
