name: HULK SA Compatibility V2 - API35 Final Confirmation

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - .github/workflows/compatibility-v2-api35-final-confirmation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: compatibility-v2-api35-final-confirmation
  cancel-in-progress: true

jobs:
  api35-final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: phone-landscape-font150-api35
            width: 2340
            height: 1080
            density: 420
            font_scale: '1.5'
            rotation: 1
            locale: ar-SA
          - id: tablet-600-portrait-api35
            width: 1200
            height: 1920
            density: 240
            font_scale: '1.3'
            rotation: 0
            locale: ar-SA
          - id: tablet-expanded-landscape-api35
            width: 2560
            height: 1600
            density: 320
            font_scale: '1.0'
            rotation: 1
            locale: en-US
    env:
      EVIDENCE_ROOT: build/compatibility-v2/final-api35/${{ matrix.id }}
      APP_APK: build/compatibility-v2/fast/apks/app-debug.apk
      TEST_APK: build/compatibility-v2/fast/apks/app-debug-androidTest.apk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-FAST-30731238610
          path: build/compatibility-v2/fast
          run-id: 30731238610
          github-token: ${{ github.token }}

      - name: Verify exact qualified APKs
        run: |
          set -euo pipefail
          test -s "$APP_APK"
          test -s "$TEST_APK"
          sha256sum "$APP_APK" "$TEST_APK"

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Execute corrected API35 runtime profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin ${{ matrix.width }}x${{ matrix.height }}
          script: bash quality/compatibility-v2/run_runtime_profile.sh '${{ matrix.id }}' '${{ matrix.width }}' '${{ matrix.height }}' '${{ matrix.density }}' '${{ matrix.font_scale }}' '${{ matrix.rotation }}' '${{ matrix.locale }}' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' "$EVIDENCE_ROOT"

      - name: Enforce runtime evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root "$EVIDENCE_ROOT" \
            --out "$EVIDENCE_ROOT/gate"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-API35-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 14
