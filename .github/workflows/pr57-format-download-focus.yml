name: PR57 Format Download Focus Repair

on:
  push:
    branches:
      - fix/v09318-production-host-qualification
    paths:
      - tools/.pr57-format-trigger

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09318-production-host-qualification
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4

      - name: Apply deterministic formatting repair
        run: |
          set -euo pipefail
          python3 tools/pr57_format_download_focus.py
          ! grep -R -n -E 'qa-tv-|qaTvPageContent|qaMarker|QA_TV_' app/src/main

      - name: Prove marker injection and source contracts
        run: |
          set -euo pipefail
          python3 -m unittest qa.compatibility.tests.test_marker_injection -v
          work="$(mktemp -d)/project"
          bash qa/compatibility/prepare-project.sh "$work"
          test -f "$work/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt"

      - name: Compile unit and Android tests
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon --console=plain \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            -PHULK_PORTAL_URL=https://example.invalid

      - name: Commit only formatted product source and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f tools/pr57_format_download_focus.py
          rm -f tools/.pr57-format-trigger
          rm -f .github/workflows/pr57-format-download-focus.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            qa/canonical/canonical-source.sha256 \
            tools/pr57_format_download_focus.py \
            tools/.pr57-format-trigger \
            .github/workflows/pr57-format-download-focus.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'fix: normalize TV download focus repair for strict lab injection'
          git push origin HEAD:fix/v09318-production-host-qualification
