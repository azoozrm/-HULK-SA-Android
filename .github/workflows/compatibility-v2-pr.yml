name: HULK SA Compatibility V2 - Fast PR

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
      - fix/v09318-production-host-qualification
    paths:
      - 'app/**'
      - 'quality/compatibility-v2/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/compatibility-v2-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-v2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EVIDENCE: build/compatibility-v2/fast
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Detect first V2 migration
        id: migration
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          migrated=false
          if [[ -n "$BASE_REF" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            if git cat-file -e FETCH_HEAD:quality/compatibility-v2/static_validate.py 2>/dev/null; then
              migrated=true
            fi
          fi
          echo "base_already_v2=$migrated" >> "$GITHUB_OUTPUT"

      - name: Validate V2 implementation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 -m py_compile \
            quality/compatibility-v2/static_validate.py \
            quality/compatibility-v2/evidence_gate.py \
            quality/compatibility-v2/instrumentation_to_junit.py
          bash -n quality/compatibility-v2/collect_runtime_evidence.sh
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          bash -n quality/compatibility-v2/prepare_avd_profile.sh
          bash -n quality/compatibility-v2/run_runtime_profile.sh
          bash -n quality/compatibility-v2/visual_regression.sh

      - name: Enforce product policy after V2 adoption
        if: steps.migration.outputs.base_already_v2 == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/static_validate.py \
            --repo-root . --out "$EVIDENCE/static"

      - name: Compile, unit, lint and AndroidTest APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin :app:testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Package migration evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/apks" "$EVIDENCE/reports"
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$EVIDENCE/apks/" \; 2>/dev/null || true
          if [[ -d app/build/reports ]]; then cp -a app/build/reports/. "$EVIDENCE/reports/"; fi
          {
            echo "commit=${GITHUB_SHA}"
            echo "base_ref=${GITHUB_BASE_REF:-none}"
            echo "base_already_v2=${{ steps.migration.outputs.base_already_v2 }}"
            echo 'package=sa.hulksa.player'
            echo 'versionName=0.9.3.20'
            echo 'versionCode=64'
          } > "$EVIDENCE/BUILD-METADATA.txt"
          (
            cd "$EVIDENCE"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-FAST-${{ github.run_id }}
          path: build/compatibility-v2/fast/
          if-no-files-found: error
          retention-days: 21
