name: HULK SA Compatibility V2 - Fast PR

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'app/**'
      - 'quality/compatibility-v2/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/compatibility-v2-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-v2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE: build/compatibility-v2/fast

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate V2 tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 -m py_compile \
            quality/compatibility-v2/static_validate.py \
            quality/compatibility-v2/evidence_gate.py \
            quality/compatibility-v2/instrumentation_to_junit.py
          bash -n quality/compatibility-v2/collect_runtime_evidence.sh
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          bash -n quality/compatibility-v2/visual_regression.sh

      - name: Static validation
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python3 quality/compatibility-v2/static_validate.py \
            --repo-root . \
            --out "$EVIDENCE"

      - name: Unit, lint, debug and test APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin :app:testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Package fast evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/unit-raw" "$EVIDENCE/apks" "$EVIDENCE/reports"
          find app/build/test-results/testDebugUnitTest -type f -name '*.xml' -exec cp {} "$EVIDENCE/unit-raw/" \; 2>/dev/null || true
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$EVIDENCE/apks/" \; 2>/dev/null || true
          if [[ -d app/build/reports ]]; then cp -a app/build/reports/. "$EVIDENCE/reports/"; fi

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('build/compatibility-v2/fast')
          files = sorted((root / 'unit-raw').glob('*.xml'))
          if not files:
              raise SystemExit('Missing Gradle unit-test XML; evidence cannot be synthesized')
          tests = failures = errors = skipped = 0
          for file in files:
              suite = ET.parse(file).getroot()
              tests += int(float(suite.attrib.get('tests', 0)))
              failures += int(float(suite.attrib.get('failures', 0)))
              errors += int(float(suite.attrib.get('errors', 0)))
              skipped += int(float(suite.attrib.get('skipped', 0)))
          if tests <= 0:
              raise SystemExit('Gradle unit-test XML contains zero executed tests')
          output = root / 'UNIT-TESTS.xml'
          output.write_text(
              f'<testsuite name="gradle-unit-summary" tests="{tests}" failures="{failures}" errors="{errors}" skipped="{skipped}" sourceFiles="{len(files)}"/>\n',
              encoding='utf-8',
          )
          PY

          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo 'package=sa.hulksa.player'
            echo 'versionName=0.9.3.20'
            echo 'versionCode=64'
            echo 'scope=fast-pr'
          } > "$EVIDENCE/BUILD-METADATA.txt"

      - name: Enforce mandatory fast evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope fast \
            --evidence-root "$EVIDENCE" \
            --out "$EVIDENCE/gate"
          (
            cd "$EVIDENCE"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-FAST-${{ github.run_id }}
          path: build/compatibility-v2/fast/
          if-no-files-found: error
          retention-days: 21
