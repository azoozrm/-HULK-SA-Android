name: Build HULK SA v0.9.3.5 TV Compatibility

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - 'HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
      - '.github/workflows/build-v0935-tv-compatibility.yml'
      - 'patches/v0.9.3.0-adaptive-source/**'
      - 'tools/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v0935-tv-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          mkdir -p build-logs reports
          { yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'; } 2>&1 | tee build-logs/01-sdk.log

      - name: Prepare source
        run: |
          set -euo pipefail
          ARCHIVE='HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
          rm -rf extracted project
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n1)
          test -n "$ROOT"
          cp -a "$ROOT" project
          sha256sum "$ARCHIVE" | tee archive.sha256
          python3 tools/repair-v09120.py project 2>&1 | tee build-logs/02-repair.log
          python3 tools/prepare-v0920-architecture.py project 2>&1 | tee build-logs/03-architecture.log
          python3 tools/prepare-v0930-adaptive-ui.py project 2>&1 | tee build-logs/04-adaptive.log
          python3 tools/prepare-v0932-mobile-followup.py project 2>&1 | tee build-logs/05-followup.log
          python3 tools/prepare-v0933-mobile-memory.py project 2>&1 | tee build-logs/06-memory.log
          python3 tools/prepare-v0934-mobile-fixes.py project 2>&1 | tee build-logs/07-mobile-fixes.log
          python3 tools/prepare-v0935-tv-compatibility.py project 2>&1 | tee build-logs/08-tv-compatibility.log

      - name: Compile, test and build
        working-directory: project
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:compileDebugKotlin testDebugUnitTest :app:assembleDebug :app:bundleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../build-logs/10-gradle.log

      - name: Verify packages
        run: |
          set -euo pipefail
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          test -s "$APK"
          test -s "$AAB"
          python3 tools/verify-android-architectures.py "$APK" --require-native-libs --report reports/APK-ARCHITECTURE-REPORT.md 2>&1 | tee build-logs/11-apk-architecture.log
          python3 tools/verify-android-architectures.py "$AAB" --require-native-libs --report reports/AAB-ARCHITECTURE-REPORT.md 2>&1 | tee build-logs/12-aab-architecture.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee reports/APK-BADGING.txt build-logs/13-apk-badging.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > reports/MANIFEST-TREE.txt
          python3 - <<'PY'
          from pathlib import Path
          badging = Path('reports/APK-BADGING.txt').read_text(encoding='utf-8')
          manifest = Path('reports/MANIFEST-TREE.txt').read_text(encoding='utf-8')
          required_badging = [
              "package: name='sa.hulksa.player.dev' versionCode='49' versionName='0.9.3.5-beta'",
              "leanback-launchable-activity: name='sa.hulksa.player.TvMainActivity'",
              "icon='res/mipmap-anydpi-v26/ic_launcher.xml'",
              "banner='res/drawable/tv_banner.xml'",
          ]
          required_manifest = [
              'sa.hulksa.player.TvMainActivity',
              'android.intent.category.LEANBACK_LAUNCHER',
          ]
          missing = [item for item in required_badging if item not in badging]
          missing += [item for item in required_manifest if item not in manifest]
          if missing:
              raise SystemExit('Missing package verification markers: ' + ', '.join(missing))
          print('TV package verification: PASS')
          PY

      - name: Package delivery
        run: |
          set -euo pipefail
          rm -rf delivery source-delivery
          mkdir delivery source-delivery
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          cp "$APK" delivery/HULK-SA-v0.9.3.5-TV-COMPATIBILITY-UNIVERSAL-debug.apk
          cp "$AAB" delivery/HULK-SA-v0.9.3.5-TV-COMPATIBILITY-debug.aab
          cp reports/*.md reports/APK-BADGING.txt reports/MANIFEST-TREE.txt delivery/
          cp tools/prepare-v0935-tv-compatibility.py delivery/
          cp -a project/. source-delivery/
          rm -rf source-delivery/.gradle source-delivery/.kotlin source-delivery/build source-delivery/app/build
          (cd source-delivery && zip -qr ../delivery/HULK-SA-Source-v0.9.3.5-TV-COMPATIBILITY.zip .)
          printf '# HULK SA v0.9.3.5 TV Compatibility Build Report\n\n- Commit: %s\n- Dedicated Android TV launcher activity: PASS\n- Runtime orientation change removed from TV startup: PASS\n- Android TV 12-safe immersive mode: PASS\n- Adaptive launcher icon resources: PASS\n- TV banner resource: PASS\n- Kotlin compilation: PASS\n- Unit tests: PASS\n- Universal APK and AAB: PASS\n- Qualified ABIs: arm64-v8a, armeabi-v7a, x86_64\n' "$GITHUB_SHA" > delivery/BUILD-REPORT-v0.9.3.5.md
          (cd delivery && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.5-TV-COMPATIBILITY
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.5-TV-COMPATIBILITY-DIAGNOSTICS
          path: |
            archive.sha256
            build-logs/
            reports/
            project/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
