name: HULK SA PR Intelligence

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Force full matrix selection
        required: false
        type: boolean
        default: false
      report_only:
        description: Report without changing enforcement
        required: false
        type: boolean
        default: false
      update_baseline:
        description: Baseline updates are forbidden in this workflow
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hulk-quality-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Classify changes and select tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject baseline mutation outside the protected manual workflow
        if: inputs.update_baseline
        run: |
          echo 'Baseline updates require a dedicated manual review workflow and recorded reason.' >&2
          exit 2

      - name: Determine changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git merge-base HEAD origin/phase-3-v0.9.3.0-adaptive-foundation)}"
          head="${HEAD_SHA:-HEAD}"
          git diff --name-only "$base...$head" > changed-files.txt
          test -s changed-files.txt

      - name: Run impact engine and its self-tests
        env:
          FORCE_FULL: ${{ inputs.full_matrix || false }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            qa.quality.tests.test_impact \
            qa.quality.tests.test_pr_inventory -v
          flags=()
          if [[ "$FORCE_FULL" = 'true' ]]; then flags+=(--full-matrix); fi
          python3 qa/quality/impact/classifier.py \
            --files changed-files.txt \
            --output quality-impact/impact.json \
            --selected-output quality-impact/selected-tests.json \
            --summary quality-impact/STEP-SUMMARY.md \
            "${flags[@]}"
          cat quality-impact/STEP-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify impact outputs
        run: |
          set -euo pipefail
          jq -e '.changed_file_count > 0 and (.selected_tests | length) > 0' \
            quality-impact/impact.json >/dev/null
          jq -e '.tests | length > 0' quality-impact/selected-tests.json >/dev/null

      - name: Write one updateable PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          COMMENT_BODY_PATH: quality-impact/STEP-SUMMARY.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hulk-sa-quality-impact -->';
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT_BODY_PATH, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-PR-IMPACT
          path: |
            changed-files.txt
            quality-impact/
          if-no-files-found: error
          retention-days: 14

      - name: Final impact enforcement
        if: always()
        run: |
          set -euo pipefail
          test -s quality-impact/impact.json
          test -s quality-impact/selected-tests.json

