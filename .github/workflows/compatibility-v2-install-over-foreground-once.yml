name: HULK SA Compatibility V2 - Install Over Foreground Once

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - .github/workflows/compatibility-v2-install-over-foreground-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: compatibility-v2-install-over-foreground-once
  cancel-in-progress: true

jobs:
  install-over-foreground-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PACKAGE: sa.hulksa.player.dev
      TEST_PACKAGE: sa.hulksa.player.dev.test
      TEST_RUNNER: androidx.test.runner.AndroidJUnitRunner
      SOURCE_ROOT: build/install-over-source
      EVIDENCE_ROOT: build/install-over-final

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-INSTALL-OVER-30747989162
          path: ${{ env.SOURCE_ROOT }}
          run-id: 30747989162
          github-token: ${{ github.token }}

      - name: Verify exact previously qualified APK bytes
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE_ROOT/apks/baseline-pr57-debug.apk" | awk '{print $1}')" = 'e8425f0dad5467fdf7348318333d354e3feff1b140dabe6b8042f3b8997bd264'
          test "$(sha256sum "$SOURCE_ROOT/apks/candidate-debug.apk" | awk '{print $1}')" = '679501f7f85bc8364c75043bb1f5a9762578f1ce34d78f5668869ce6a9e7c0d8'
          test "$(sha256sum "$SOURCE_ROOT/apks/candidate-androidTest.apk" | awk '{print $1}')" = '3b9b2482275101632d55d875ba8b8c4dea62a6818133060812ff1d4c0d492061'
          bash -n quality/compatibility-v2/run_install_over_qualification.sh
          mkdir -p "$EVIDENCE_ROOT/apks"
          cp "$SOURCE_ROOT/apks/baseline-pr57-debug.apk" "$EVIDENCE_ROOT/apks/"
          cp "$SOURCE_ROOT/apks/candidate-debug.apk" "$EVIDENCE_ROOT/apks/"
          cp "$SOURCE_ROOT/apks/candidate-androidTest.apk" "$EVIDENCE_ROOT/apks/"
          cp "$SOURCE_ROOT/BASELINE-SIGNER.txt" "$EVIDENCE_ROOT/"
          cp "$SOURCE_ROOT/CANDIDATE-SIGNER.txt" "$EVIDENCE_ROOT/"
          cp "$SOURCE_ROOT/INSTALL-OVER-PLAN.txt" "$EVIDENCE_ROOT/"

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Repeat install-over and require candidate foreground
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: >-
            bash quality/compatibility-v2/run_install_over_qualification.sh
            "$EVIDENCE_ROOT/apks/baseline-pr57-debug.apk"
            "$EVIDENCE_ROOT/apks/candidate-debug.apk"
            "$EVIDENCE_ROOT/apks/candidate-androidTest.apk"
            "$PACKAGE"
            "$TEST_PACKAGE"
            "$TEST_RUNNER"
            "$EVIDENCE_ROOT"

      - name: Enforce final install-over evidence
        if: always()
        run: |
          set -euo pipefail
          for file in INSTALL-OVER-RESULT.txt BASELINE-DATA.txt DATA-PRESERVATION.txt POST-INSTRUMENTATION-DATA.txt FINAL-FOREGROUND.txt; do
            test -s "$EVIDENCE_ROOT/$file"
            grep -Fq 'result=PASS' "$EVIDENCE_ROOT/$file"
          done
          test -s "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          grep -Eq 'tests="7"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          grep -Eq 'failures="0"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          test -s "$EVIDENCE_ROOT/full-window.png"
          test -s "$EVIDENCE_ROOT/window.xml"
          test -s "$EVIDENCE_ROOT/logcat.txt"
          python3 - "$EVIDENCE_ROOT" "$PACKAGE" <<'PY'
          import struct
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(sys.argv[1])
          package = sys.argv[2]
          header = (root / 'full-window.png').read_bytes()[:24]
          if len(header) < 24 or header[:8] != b'\x89PNG\r\n\x1a\n' or header[12:16] != b'IHDR':
              raise SystemExit('Invalid PNG evidence')
          width, height = struct.unpack('>II', header[16:24])
          if (width, height) != (1080, 2340):
              raise SystemExit(f'Unexpected PNG geometry: {width}x{height}')
          hierarchy = ET.parse(root / 'window.xml').getroot()
          packages = {node.attrib.get('package') for node in hierarchy.iter() if node.attrib.get('package')}
          if package not in packages:
              raise SystemExit(f'Application package absent from hierarchy: {sorted(packages)}')
          PY
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-INSTALL-OVER-FOREGROUND-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21
