name: HULK SA Galaxy Landscape Evidence V5

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/physical-galaxy-landscape-evidence-v5.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  HULK_PORTAL_URL: http://3162356.xyz:8080
  HULK_CONFIG_URL: ''
  APP_APK: app/build/outputs/apk/debug/app-debug.apk
  TEST_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  EVIDENCE_ROOT: build/compatibility-v2/galaxy-landscape-evidence-v5

jobs:
  galaxy-landscape-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/adaptive-ui-compatibility-lab-v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Build current debug and instrumentation APKs
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          mkdir -p "$EVIDENCE_ROOT"
          sha256sum "$APP_APK" "$TEST_APK" > "$EVIDENCE_ROOT/APK-SOURCE-SHA256.txt"
          printf 'workflow_head=%s\nproduction_application_source=%s\ntest_harness_source=%s\nprofile=landscape\napi=35\ngeometry=2340x1080\ndensity=420\nfont_scale=1.5\nlocale=ar-SA\ncutout=com.android.internal.display.cutout.emulation.corner\n' \
            "$GITHUB_SHA" \
            '2b4b9704bd6ee367a320968bb425be74ffa32ef9' \
            '7ab190bf2967d1cccdcf09925865b93d595a8c02' \
            > "$EVIDENCE_ROOT/SOURCE-IDENTITY.txt"

      - name: Prepare fail-closed runner
        run: |
          set -euo pipefail
          mkdir -p build/galaxy-landscape-v5
          cat > build/galaxy-landscape-v5/run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -u
          mkdir -p "$EVIDENCE_ROOT"

          wait_stable() {
            local stable=0
            for attempt in $(seq 1 120); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              activity="$(adb shell service check activity 2>/dev/null || true)"
              package="$(adb shell service check package 2>/dev/null || true)"
              settings="$(adb shell service check settings 2>/dev/null || true)"
              if [[ "$boot" == '1' && "$activity" == *found* && "$package" == *found* && "$settings" == *found* ]]; then
                stable=$((stable + 1))
                [[ "$stable" -ge 3 ]] && return 0
              else
                stable=0
              fi
              sleep 2
            done
            return 1
          }

          wait_stable || { printf 'reason=initial_services_not_stable\n' > "$EVIDENCE_ROOT/INFRASTRUCTURE.txt"; exit 70; }
          set +e
          root_output="$(adb root 2>&1)"
          root_status=$?
          set -e
          printf 'pre_root_status=%s\npre_root_output=%s\n' "$root_status" "${root_output//$'\n'/ | }" \
            > "$EVIDENCE_ROOT/ADB-ROOT-PRECONDITION.txt"
          test "$root_status" -eq 0 || exit 73
          adb wait-for-device
          wait_stable || { printf 'reason=services_not_stable_after_adb_root\n' > "$EVIDENCE_ROOT/INFRASTRUCTURE.txt"; exit 74; }
          test "$(adb shell id -u | tr -d '\r')" = '0' || exit 75

          cutout='com.android.internal.display.cutout.emulation.corner'
          adb shell cmd overlay list --user 0 > "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-BEFORE.txt" 2>&1
          grep -F "$cutout" "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-BEFORE.txt" >/dev/null || exit 71
          adb shell cmd overlay enable-exclusive --category --user 0 "$cutout" || \
            adb shell cmd overlay enable --user 0 "$cutout"
          sleep 4
          adb wait-for-device
          wait_stable || exit 76
          adb shell cmd overlay list --user 0 > "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt" 2>&1
          grep -F "$cutout" "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt" >/dev/null || exit 72
          printf 'enabled_cutout_overlay=%s\n' "$cutout" > "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"

          set +e
          bash quality/compatibility-v2/run_runtime_profile.sh \
            'physical-galaxy-landscape-evidence-v5-api35' '2340' '1080' '420' '1.5' '0' 'ar-SA' \
            'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' \
            "$EVIDENCE_ROOT"
          runtime_status=$?

          adb shell rm -rf /sdcard/Android/data/sa.hulksa.player.dev/files/short-landscape-evidence >/dev/null 2>&1 || true
          adb shell am instrument -w -r \
            -e class 'sa.hulksa.player.compatibilityv2.ShortLandscapeMainShellTest' \
            'sa.hulksa.player.dev.test/androidx.test.runner.AndroidJUnitRunner' \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt" 2>&1
          shell_status=$?
          python3 quality/compatibility-v2/instrumentation_to_junit.py \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt" \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.xml" \
            --process-status "$shell_status"
          converter_status=$?

          device_dir='/sdcard/Android/data/sa.hulksa.player.dev/files/short-landscape-evidence'
          evidence_pull_status=0
          for section in live movies series; do
            adb pull "$device_dir/${section}-full-window.png" "$EVIDENCE_ROOT/${section}-full-window.png" >/dev/null 2>&1 || evidence_pull_status=1
            adb pull "$device_dir/${section}-window.xml" "$EVIDENCE_ROOT/${section}-window.xml" >/dev/null 2>&1 || evidence_pull_status=1
          done

          adb shell am force-stop sa.hulksa.player.dev >/dev/null 2>&1 || true
          adb shell am start -W -n sa.hulksa.player.dev/sa.hulksa.player.MainActivity > "$EVIDENCE_ROOT/FINAL-RELAUNCH.txt" 2>&1
          relaunch_status=$?
          sleep 5
          adb shell dumpsys activity activities > "$EVIDENCE_ROOT/FINAL-ACTIVITY-ACTIVITIES.txt" 2>&1
          adb shell dumpsys window > "$EVIDENCE_ROOT/FINAL-WINDOW-DUMP.txt" 2>&1
          adb shell uiautomator dump /sdcard/final-galaxy-window.xml > "$EVIDENCE_ROOT/FINAL-UIAUTOMATOR.txt" 2>&1
          adb pull /sdcard/final-galaxy-window.xml "$EVIDENCE_ROOT/FINAL-window.xml" >/dev/null 2>&1
          final_xml_status=$?
          adb exec-out screencap -p > "$EVIDENCE_ROOT/FINAL-full-window.png"
          final_png_status=$?
          adb shell dumpsys input_method > "$EVIDENCE_ROOT/FINAL-IME.txt" 2>&1
          adb logcat -d -v threadtime > "$EVIDENCE_ROOT/FINAL-logcat.txt" 2>&1
          set -e

          printf 'runtime_status=%s\nshell_status=%s\nconverter_status=%s\nevidence_pull_status=%s\nrelaunch_status=%s\nfinal_xml_status=%s\nfinal_png_status=%s\n' \
            "$runtime_status" "$shell_status" "$converter_status" "$evidence_pull_status" \
            "$relaunch_status" "$final_xml_status" "$final_png_status" > "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          exit 0
          SCRIPT
          chmod +x build/galaxy-landscape-v5/run.sh

      - name: Configure Linux KVM
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm -a -w /dev/kvm

      - name: Execute Landscape profile only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          disk-size: 4096M
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 2340x1080
          script: bash build/galaxy-landscape-v5/run.sh

      - name: Enforce all evidence
        if: always()
        run: |
          set -euo pipefail
          for file in EXECUTION-STATUS.txt SOURCE-IDENTITY.txt ADB-ROOT-PRECONDITION.txt CUTOUT-OVERLAY.txt INSTRUMENTATION.xml SHORT-LANDSCAPE-MAIN-SHELL.xml full-window.png window.xml FINAL-full-window.png FINAL-window.xml FINAL-ACTIVITY-ACTIVITIES.txt FINAL-WINDOW-DUMP.txt; do
            test -s "$EVIDENCE_ROOT/$file"
          done
          for section in live movies series; do
            test -s "$EVIDENCE_ROOT/${section}-full-window.png"
            test -s "$EVIDENCE_ROOT/${section}-window.xml"
          done
          for key in runtime_status shell_status converter_status evidence_pull_status relaunch_status final_xml_status final_png_status; do
            grep -Fx "${key}=0" "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          done
          grep -Fx 'pre_root_status=0' "$EVIDENCE_ROOT/ADB-ROOT-PRECONDITION.txt"
          grep -Fx 'enabled_cutout_overlay=com.android.internal.display.cutout.emulation.corner' "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"
          grep -F 'topResumedActivity=' "$EVIDENCE_ROOT/FINAL-ACTIVITY-ACTIVITIES.txt" | grep -F 'sa.hulksa.player.dev/sa.hulksa.player.MainActivity'

          python3 quality/compatibility-v2/evidence_gate.py --scope runtime --evidence-root "$EVIDENCE_ROOT" --out "$EVIDENCE_ROOT/gate"
          python3 - "$EVIDENCE_ROOT" <<'PY'
          import json, struct, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(sys.argv[1])
          required = {'live': 'قناة اختبار 42', 'movies': 'فيلم اختبار 40', 'series': 'مسلسل اختبار 41'}

          def junit(name, count):
              suite = ET.parse(root / name).getroot()
              result = (int(suite.attrib.get('tests','0')), int(suite.attrib.get('failures','0')), int(suite.attrib.get('errors','0')))
              if result != (count,0,0): raise SystemExit(f'{name}: {result}')
          def png(path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (2340,1080):
                  raise SystemExit(f'bad PNG geometry: {path}')
          def parse_bounds(value):
              try:
                  a,b=value.split(']['); l,t=map(int,a.lstrip('[').split(',')); r,bt=map(int,b.rstrip(']').split(',')); return l,t,r,bt
              except Exception: return None

          junit('INSTRUMENTATION.xml',9); junit('SHORT-LANDSCAPE-MAIN-SHELL.xml',3)
          summary=json.loads((root/'gate/EVIDENCE-GATE-runtime.json').read_text())['summary']
          if summary != {'PASS':26,'FAIL':0,'BLOCKED':0,'SKIPPED':0}: raise SystemExit(f'gate={summary}')
          for name in ['full-window.png','FINAL-full-window.png',*[f'{x}-full-window.png' for x in required]]: png(root/name)

          final_nodes=list(ET.parse(root/'FINAL-window.xml').getroot().iter('node'))
          packages={n.attrib.get('package','') for n in final_nodes}
          if 'sa.hulksa.player.dev' not in packages: raise SystemExit(f'app absent: {packages}')
          if packages & {'com.google.android.apps.nexuslauncher','com.google.android.permissioncontroller'}: raise SystemExit(f'forbidden foreground: {packages}')

          for section,text in required.items():
              nodes=[n for n in ET.parse(root/f'{section}-window.xml').getroot().iter('node') if n.attrib.get('package')=='sa.hulksa.player.dev']
              if text not in {n.attrib.get('text','') for n in nodes}: raise SystemExit(f'{section}: bottom item absent')
              if sum(n.attrib.get('scrollable')=='true' for n in nodes) != 1: raise SystemExit(f'{section}: vertical scroll surface count invalid')
              for n in nodes:
                  if n.attrib.get('class') not in {'android.widget.Button','android.widget.TextView'}: continue
                  b=parse_bounds(n.attrib.get('bounds',''))
                  if b and (b[1] < 132 or b[3] > 1017): raise SystemExit(f'{section}: unsafe interactive node {n.attrib.get("text")!r} {n.attrib.get("bounds")}')
          PY
          (cd "$EVIDENCE_ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-GALAXY-LANDSCAPE-EVIDENCE-V5-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Galaxy landscape evidence V5 completed\n\n- Run: `'$GITHUB_RUN_ID'`\n- Head: `'$GITHUB_SHA'`\n- Status: **'$JOB_STATUS'**\n- Artifact: `HULK-SA-GALAXY-LANDSCAPE-EVIDENCE-V5-'$GITHUB_RUN_ID'`\n\nLandscape only; no Portrait or production signing.'
