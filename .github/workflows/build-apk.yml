name: Build HULK SA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Prepare HULK SA source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          if test -f source/app/build.gradle.kts; then
            cp -a source/. project/
          else
            cat .payload/lean/chunk-* > source.tar.xz.b64
            echo "ff7465a9ab58b99afd3926487fb43ec4c0ad8524124aa7a92797cfb691062831  source.tar.xz.b64" | sha256sum --check
            base64 --decode source.tar.xz.b64 > source.tar.xz
            echo "1e203c251294ed3ba966a8824bfded293d301c61f1c265d71cb34768c469a650  source.tar.xz" | sha256sum --check
            tar -xJf source.tar.xz -C project
          fi
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/sa/hulksa/player/MainActivity.kt

      - name: Apply v0.6.3 download system integration
        shell: bash
        run: |
          set -uo pipefail
          REPOSITORY="project/app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt"
          grep -q '^import kotlinx.coroutines.isActive$' "$REPOSITORY" || sed -i '/^import kotlinx.coroutines.ensureActive$/a import kotlinx.coroutines.isActive' "$REPOSITORY"
          sed -i 's/raise RuntimeError(f"Expected block not found in {path}")/print(f"WARNING: expected block not found in {path}"); return/' tools/apply_v063_patch.py
          python3 tools/apply_v063_patch.py project > patch.log 2>&1
          PATCH_STATUS=$?
          cat patch.log
          if [ "$PATCH_STATUS" -ne 0 ]; then
            mkdir -p diagnostics
            cp patch.log diagnostics/latest-patch.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f diagnostics/latest-patch.log
            if ! git diff --cached --quiet; then
              git commit -m "Record v0.6.3 patch error [skip ci]"
              git push origin "HEAD:${GITHUB_HEAD_REF}"
            fi
            exit "$PATCH_STATUS"
          fi
          grep -q 'versionName = "0.6.3"' project/app/build.gradle.kts
          grep -q 'WAITING_NETWORK' project/app/src/main/java/sa/hulksa/player/model/Models.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore HULK SA branding and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/res/font
          mkdir -p project/app/src/main/res/drawable-nodpi

          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf

          if ! curl -fL --retry 5 --retry-delay 2 "https://hulksa.com/assets/hulk-official-logo.webp" -o /tmp/hulk-logo.webp; then
            cat .payload/assets/logo.part-* | base64 --decode > /tmp/hulk-logo.webp
          fi
          test -s /tmp/hulk-logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/ic_banner.webp

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('project/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('@mipmap/ic_launcher_round', '@drawable/hulk_sa_logo')
          text = text.replace('@mipmap/ic_launcher', '@drawable/hulk_sa_logo')
          manifest.write_text(text)
          PY

          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          test -s project/app/src/main/res/drawable-nodpi/ic_banner.webp
          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf

      - name: Run unit tests
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../test.log

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../build.log

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/HULK-SA-v0.6.3-beta.apk
          sha256sum output/HULK-SA-v0.6.3-beta.apk | tee output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.3-beta
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.3-diagnostics
          path: |
            patch.log
            test.log
            build.log
          if-no-files-found: ignore
          retention-days: 7
