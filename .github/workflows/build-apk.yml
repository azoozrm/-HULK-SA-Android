name: Build HULK SA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore compact HULK SA source
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/lean/chunk-* > source.tar.xz.b64
          echo "ff7465a9ab58b99afd3926487fb43ec4c0ad8524124aa7a92797cfb691062831  source.tar.xz.b64" | sha256sum --check
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "1e203c251294ed3ba966a8824bfded293d301c61f1c265d71cb34768c469a650  source.tar.xz" | sha256sum --check
          mkdir -p project
          tar -xJf source.tar.xz -C project
          cp .patches/v0.6.1/DownloadRepository.kt project/app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt
          cp .patches/v0.6.1/Models.kt project/app/src/main/java/sa/hulksa/player/model/Models.kt
          sed -i 's/versionCode = 10/versionCode = 12/' project/app/build.gradle.kts
          sed -i 's/versionName = "0.6.0"/versionName = "0.6.2"/' project/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          s = p.read_text()
          old = '''    val label = when {
                  item.status == OfflineStatus.COMPLETED -> formatBytes(item.totalBytes.coerceAtLeast(item.bytesDownloaded))
                  item.totalBytes > 0L -> "$percent%  •  ${formatBytes(item.bytesDownloaded)} / ${formatBytes(item.totalBytes)}"
                  item.bytesDownloaded > 0L -> formatBytes(item.bytesDownloaded)
                  else -> downloadStatusLabel(item.status)
              }
              Text(label, color = colors.textMuted, fontSize = 8.sp, maxLines = 1)'''
          new = '''    val label = when {
                  item.status == OfflineStatus.FAILED -> downloadFailureLabel(item.failureReason)
                  item.status == OfflineStatus.COMPLETED -> formatBytes(item.totalBytes.coerceAtLeast(item.bytesDownloaded))
                  item.totalBytes > 0L -> "$percent%  •  ${formatBytes(item.bytesDownloaded)} / ${formatBytes(item.totalBytes)}"
                  item.bytesDownloaded > 0L -> formatBytes(item.bytesDownloaded)
                  else -> downloadStatusLabel(item.status)
              }
              Text(label, color = colors.textMuted, fontSize = 8.sp, maxLines = 2)'''
          if old not in s:
              raise SystemExit('Download progress block not found')
          s = s.replace(old, new)
          marker = 'private fun downloadStatusLabel(status: OfflineStatus): String = when (status) {'
          helper = '''private fun downloadFailureLabel(reason: Int?): String = when (reason) {
              401 -> "HTTP 401 • بيانات الدخول مرفوضة"
              403 -> "HTTP 403 • السيرفر منع التحميل المباشر"
              404 -> "HTTP 404 • ملف الفيديو غير موجود"
              416 -> "HTTP 416 • الاستكمال غير مدعوم؛ احذف الملف وأعد المحاولة"
              in 500..599 -> "HTTP $reason • خادم الفيديو غير متاح مؤقتا"
              1001 -> "خطأ شبكة • تعذر الاتصال بخادم الفيديو"
              1002 -> "مساحة التخزين غير كافية"
              1003 -> "البث HLS (m3u8) • يحتاج محرك تحميل مقاطع"
              1004 -> "السيرفر لم يرسل بيانات الفيديو"
              1005 -> "انقطع الاتصال قبل اكتمال الملف"
              null -> "تعذر التحميل • السبب غير معروف"
              else -> "HTTP $reason • فشل طلب التحميل"
          }

          '''
          if marker not in s:
              raise SystemExit('Download status marker not found')
          s = s.replace(marker, helper + marker)
          p.write_text(s)
          PY
          test -f project/app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore HULK SA branding and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/res/font project/app/src/main/res/drawable-nodpi
          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf
          if ! curl -fL --retry 5 "https://hulksa.com/assets/hulk-official-logo.webp" -o /tmp/hulk-logo.webp; then
            cat .payload/assets/logo.part-* | base64 --decode > /tmp/hulk-logo.webp
          fi
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/ic_banner.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('@mipmap/ic_launcher_round','@drawable/hulk_sa_logo').replace('@mipmap/ic_launcher','@drawable/hulk_sa_logo')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../build.log

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/HULK-SA-v0.6.2-beta.apk
          sha256sum output/HULK-SA-v0.6.2-beta.apk | tee output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.2-beta
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.2-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7