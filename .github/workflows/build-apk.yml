name: Build HULK SA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore HULK SA source
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/source/part-* > source.tar.xz.b64
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "dc046adbe100e3b9227872c4c155690aa52bec9180e803415f9e3cc47f158b02  source.tar.xz" | sha256sum --check
          mkdir -p project
          tar -xJf source.tar.xz -C project
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/sa/hulksa/player/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore official branding and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          mkdir -p project/app/src/main/res/font
          mkdir -p project/app/src/main/res/drawable-nodpi

          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf

          curl -fL --retry 5 --retry-delay 2 "https://hulksa.com/assets/hulk-official-logo.webp" -o /tmp/hulk-logo.webp
          convert /tmp/hulk-logo.webp -resize 1024x1024 -background black -gravity center -extent 1024x1024 project/app/src/main/res/drawable-nodpi/hulk_sa_logo.png
          convert -size 320x180 xc:black /tmp/hulk-logo.webp -resize 150x150 -gravity center -composite project/app/src/main/res/drawable-nodpi/ic_banner.png

          rm -rf project/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('project/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('@mipmap/ic_launcher_round', '@drawable/hulk_sa_logo')
          text = text.replace('@mipmap/ic_launcher', '@drawable/hulk_sa_logo')
          manifest.write_text(text)
          PY

          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_logo.png
          test -s project/app/src/main/res/drawable-nodpi/ic_banner.png
          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest -PHULK_PORTAL_URL=http://3162356.xyz:8080

      - name: Run Android lint
        working-directory: project
        run: gradle --no-daemon lintDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/HULK-SA-v0.6.0-beta.apk
          sha256sum output/HULK-SA-v0.6.0-beta.apk | tee output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.0-beta
          path: output/
          if-no-files-found: error
          retention-days: 30
