name: Build HULK SA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore compact HULK SA source
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/lean/chunk-* > source.tar.xz.b64
          echo "ff7465a9ab58b99afd3926487fb43ec4c0ad8524124aa7a92797cfb691062831  source.tar.xz.b64" | sha256sum --check
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "1e203c251294ed3ba966a8824bfded293d301c61f1c265d71cb34768c469a650  source.tar.xz" | sha256sum --check
          mkdir -p project
          tar -xJf source.tar.xz -C project
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/sa/hulksa/player/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore current HULK SA icon package and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/res/font

          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf

          find project/app/src/main/res -type f \
            \( -name 'ic_launcher*' -o -name 'tv_banner*' -o -name 'ic_stat_hulk*' \
               -o -name 'hulk_sa_logo*' -o -name 'hulk_sa_adaptive_*' -o -name 'ic_banner*' \) \
            -delete

          find app/src/main/res -type f \
            \( -name 'ic_launcher*' -o -name 'tv_banner.png' -o -name 'ic_stat_hulk.png' \
               -o -name 'hulk_sa_logo.png' -o -name 'hulk_sa_adaptive_*' \) \
            -print0 | while IFS= read -r -d '' asset; do
              target="project/$asset"
              mkdir -p "$(dirname "$target")"
              cp "$asset" "$target"
            done

          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_logo.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_adaptive_foreground.png
          test -s project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s project/app/src/main/res/mipmap-xxxhdpi/tv_banner.png
          test ! -e project/app/src/main/res/drawable/ic_stat_hulk.xml
          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/HULK-SA-v0.6.0-beta.apk
          sha256sum output/HULK-SA-v0.6.0-beta.apk | tee output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.0-beta
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
