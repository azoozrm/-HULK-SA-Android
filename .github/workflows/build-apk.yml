name: Build HULK SA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore compact HULK SA source
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/lean/chunk-* > source.tar.xz.b64
          echo "ff7465a9ab58b99afd3926487fb43ec4c0ad8524124aa7a92797cfb691062831  source.tar.xz.b64" | sha256sum --check
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "1e203c251294ed3ba966a8824bfded293d301c61f1c265d71cb34768c469a650  source.tar.xz" | sha256sum --check
          mkdir -p project
          tar -xJf source.tar.xz -C project
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/sa/hulksa/player/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Arabic fonts and canonical HULK SA branding
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project/app/src/main/res/font

          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf

          # Remove obsolete launcher / brand overrides from the extracted lean project.
          rm -f \
            project/app/src/main/res/drawable/ic_launcher_background.xml \
            project/app/src/main/res/drawable/ic_launcher_foreground.xml \
            project/app/src/main/res/drawable/ic_launcher_tv_foreground.xml \
            project/app/src/main/res/drawable-v33/ic_launcher_monochrome.xml \
            project/app/src/main/res/drawable/ic_stat_hulk.xml \
            project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp \
            project/app/src/main/res/drawable-nodpi/ic_banner.webp

          # Overlay the canonical Android icon / brand package from this branch.
          BRAND_RES_DIRS=(
            drawable-mdpi
            drawable-hdpi
            drawable-xhdpi
            drawable-xxhdpi
            drawable-xxxhdpi
            drawable-nodpi
            drawable-television
            mipmap-anydpi-v26
            mipmap-anydpi-v33
            mipmap-television
            mipmap-mdpi
            mipmap-hdpi
            mipmap-xhdpi
            mipmap-xxhdpi
            mipmap-xxxhdpi
          )

          for dir in "${BRAND_RES_DIRS[@]}"; do
            test -d "app/src/main/res/$dir"
            mkdir -p "project/app/src/main/res/$dir"
            cp -R "app/src/main/res/$dir/." "project/app/src/main/res/$dir/"
          done

          # Overlay canonical runtime source ownership.
          mkdir -p project/app/src/main/java/sa/hulksa/player/ui/components
          mkdir -p project/app/src/main/java/sa/hulksa/player/tv

          cp \
            app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt \
            project/app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt

          cp \
            app/src/main/java/sa/hulksa/player/tv/TvHomeChannelManager.kt \
            project/app/src/main/java/sa/hulksa/player/tv/TvHomeChannelManager.kt

          # Verify every canonical brand resource reached the actual Gradle project unchanged.
          for dir in "${BRAND_RES_DIRS[@]}"; do
            while IFS= read -r -d '' src; do
              rel="${src#app/src/main/res/}"
              dst="project/app/src/main/res/$rel"

              test -f "$dst"
              cmp -s "$src" "$dst" || {
                echo "Brand resource overlay mismatch: $rel"
                exit 1
              }
            done < <(find "app/src/main/res/$dir" -type f -print0)
          done

          # Verify runtime source ownership also reached the actual Gradle project unchanged.
          cmp -s \
            app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt \
            project/app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt

          cmp -s \
            app/src/main/java/sa/hulksa/player/tv/TvHomeChannelManager.kt \
            project/app/src/main/java/sa/hulksa/player/tv/TvHomeChannelManager.kt

          # Legacy brand contract must not survive in the actual build tree.
          test ! -e project/app/src/main/res/drawable/ic_launcher_background.xml
          test ! -e project/app/src/main/res/drawable/ic_launcher_foreground.xml
          test ! -e project/app/src/main/res/drawable/ic_launcher_tv_foreground.xml
          test ! -e project/app/src/main/res/drawable-v33/ic_launcher_monochrome.xml
          test ! -e project/app/src/main/res/drawable/ic_stat_hulk.xml
          test ! -e project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          test ! -e project/app/src/main/res/drawable-nodpi/ic_banner.webp

          # Required canonical final assets.
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_logo.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_mark.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_mark_monochrome.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_adaptive_background.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_adaptive_foreground.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_adaptive_monochrome.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_tv_channel_logo.png
          test -s project/app/src/main/res/drawable-nodpi/hulk_sa_content_fallback_wide.png
          test -s project/app/src/main/res/drawable-television/hulk_sa_logo.xml
          test -s project/app/src/main/res/drawable-television/hulk_sa_mark.xml
          test -s project/app/src/main/res/mipmap-television/tv_banner.xml

          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          test -s project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/HULK-SA-v0.6.0-beta.apk
          sha256sum output/HULK-SA-v0.6.0-beta.apk | tee output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.0-beta
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
