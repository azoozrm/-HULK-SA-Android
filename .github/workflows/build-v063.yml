name: Verify HULK SA v0.6.3

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          cp -a source/. project/
          REPOSITORY="project/app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt"
          grep -q '^import kotlinx.coroutines.isActive$' "$REPOSITORY" || sed -i '/^import kotlinx.coroutines.ensureActive$/a import kotlinx.coroutines.isActive' "$REPOSITORY"
          sed -i 's/raise RuntimeError(f"Expected block not found in {path}")/print(f"WARNING: expected block not found in {path}"); return/' tools/apply_v063_patch.py
          python3 tools/apply_v063_patch.py project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore approved branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/res/font project/app/src/main/res/drawable-nodpi
          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf
          if ! curl -fL --retry 5 --retry-delay 2 "https://hulksa.com/assets/hulk-official-logo.webp" -o /tmp/hulk-logo.webp; then
            cat .payload/assets/logo.part-* | base64 --decode > /tmp/hulk-logo.webp
          fi
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/ic_banner.webp
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('project/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('@mipmap/ic_launcher_round', '@drawable/hulk_sa_logo')
          text = text.replace('@mipmap/ic_launcher', '@drawable/hulk_sa_logo')
          manifest.write_text(text)
          PY

      - name: Test and build
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd project
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../verification.log
          STATUS=${PIPESTATUS[0]}
          cd ..
          if [ "$STATUS" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "marker=HULK-V063-BUILD_OK" >> "$GITHUB_OUTPUT"
          else
            ERROR="$(grep -E '(^e: | error: |FAILURE:)' verification.log | head -n 1)"
            [ -n "$ERROR" ] || ERROR="$(tail -n 1 verification.log)"
            SAFE="$(printf '%s' "$ERROR" | sed 's/[^A-Za-z0-9._-]/_/g' | cut -c1-180)"
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "marker=HULK-V063-${SAFE}" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Prepare APK
        if: steps.build.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/HULK-SA-v0.6.3-beta.apk
          sha256sum output/HULK-SA-v0.6.3-beta.apk | tee output/SHA256.txt

      - name: Upload APK
        if: steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.6.3-beta
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification marker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.marker }}
          path: verification.log
          if-no-files-found: error
          retention-days: 2
