name: Apply landscape touch navigation fix

on:
  push:
    branches:
      - pr-landscape-touch-navigation-v09317
    paths:
      - '.github/workflows/apply-landscape-touch-navigation.yml'

permissions:
  contents: write

concurrency:
  group: hulk-sa-landscape-touch-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr-landscape-touch-navigation-v09317
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Apply focused landscape interaction fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = shell.read_text(encoding='utf-8')
          old = '''                    DestinationContent(
                              state = state,
                              isTv = true,
                              navigationMemory = navigationMemory,
          '''
          new = '''                    DestinationContent(
                              state = state,
                              // A rail is a layout choice; only an actual TV uses TV interaction semantics.
                              isTv = isTv,
                              navigationMemory = navigationMemory,
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one rail DestinationContent block, found {text.count(old)}')
              text = text.replace(old, new, 1)
              shell.write_text(text, encoding='utf-8')

          test_file = Path('app/src/test/java/sa/hulksa/player/ui/adaptive/AdaptiveUiClassifierTest.kt')
          tests = test_file.read_text(encoding='utf-8')
          marker = '''    @Test
              fun televisionAlwaysUsesRailAndFocusHighlights() {
          '''
          addition = '''    @Test
              fun expandedTouchTabletUsesRailWithoutTelevisionInteractionModel() {
                  val state = AdaptiveUiState(
                      deviceClass = HulkDeviceClass.TABLET,
                      windowWidthClass = HulkWindowWidthClass.EXPANDED,
                      navigationType = HulkNavigationType.RAIL,
                      inputMode = HulkInputMode.TOUCH,
                      screenWidthDp = 1280,
                      screenHeightDp = 800,
                  )

                  assertEquals(HulkNavigationType.RAIL, state.navigationType)
                  assertFalse(state.isTelevision)
                  assertFalse(state.showFocusHighlights)
              }

          '''
          if addition not in tests:
              if tests.count(marker) != 1:
                  raise SystemExit(f'Expected one television test marker, found {tests.count(marker)}')
              tests = tests.replace(marker, addition + marker, 1)
              test_file.write_text(tests, encoding='utf-8')

          if 'isTv = true,' in shell.read_text(encoding='utf-8'):
              raise SystemExit('A rail path still hard-codes television interaction semantics')
          print('PASS: rail layout is decoupled from television interaction semantics')
          PY

      - name: Build and test focused change
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:bundleDebug \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL=https://example.invalid

      - name: Verify output architectures
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' archive; do
            python3 tools/verify-android-architectures.py "$archive" --require-native-libs
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/test/java/sa/hulksa/player/ui/adaptive/AdaptiveUiClassifierTest.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve touch interaction in expanded landscape layouts'
          git push origin HEAD:pr-landscape-touch-navigation-v09317
