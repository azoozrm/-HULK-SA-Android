name: HULK SA Galaxy Landscape Evidence V4

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/physical-galaxy-landscape-evidence-v4.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  HULK_PORTAL_URL: http://3162356.xyz:8080
  HULK_CONFIG_URL: ''
  APP_APK: app/build/outputs/apk/debug/app-debug.apk
  TEST_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  EVIDENCE_ROOT: build/compatibility-v2/galaxy-landscape-evidence-v4

jobs:
  galaxy-landscape-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/adaptive-ui-compatibility-lab-v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Report isolated retest identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Galaxy landscape evidence V4 started\n\n- Run: `'$GITHUB_RUN_ID'`\n- Workflow head: `'$GITHUB_SHA'`\n- Production application source: `2b4b9704bd6ee367a320968bb425be74ffa32ef9`\n- Test harness source: `b9a1d0cdf05e3bec7d3a3a9b1cbf850f521f1785`\n- Profile: API 35, 2340×1080, density 420, font scale 1.5, ar-SA, corner cutout\n- Scope: Landscape only; no Portrait or production signing.\n\nPR remains Draft and unmerged.'

      - name: Build debug and instrumentation APKs
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          mkdir -p "$EVIDENCE_ROOT"
          sha256sum "$APP_APK" "$TEST_APK" > "$EVIDENCE_ROOT/APK-SOURCE-SHA256.txt"
          printf 'workflow_head=%s\nproduction_application_source=%s\ntest_harness_source=%s\nprofile=landscape\napi=35\ngeometry=2340x1080\ndensity=420\nfont_scale=1.5\nlocale=ar-SA\ncutout=com.android.internal.display.cutout.emulation.corner\n' \
            "$GITHUB_SHA" \
            '2b4b9704bd6ee367a320968bb425be74ffa32ef9' \
            'b9a1d0cdf05e3bec7d3a3a9b1cbf850f521f1785' \
            > "$EVIDENCE_ROOT/SOURCE-IDENTITY.txt"

      - name: Prepare fail-closed evidence runner
        run: |
          set -euo pipefail
          mkdir -p build/galaxy-landscape-v4
          cat > build/galaxy-landscape-v4/run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -u
          mkdir -p "$EVIDENCE_ROOT"

          stable=0
          for attempt in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            activity="$(adb shell service check activity 2>/dev/null || true)"
            package="$(adb shell service check package 2>/dev/null || true)"
            if [[ "$boot" == '1' && "$activity" == *found* && "$package" == *found* ]]; then
              stable=$((stable + 1))
              [[ "$stable" -ge 3 ]] && break
            else
              stable=0
            fi
            sleep 2
          done
          if [[ "$stable" -lt 3 ]]; then
            printf 'infrastructure_status=70\nreason=android_services_not_stable\n' > "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
            exit 70
          fi

          cutout='com.android.internal.display.cutout.emulation.corner'
          adb shell cmd overlay list --user 0 > "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-BEFORE.txt" 2>&1 || true
          grep -F "$cutout" "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-BEFORE.txt" >/dev/null || exit 71
          adb shell cmd overlay enable-exclusive --category --user 0 "$cutout" || \
            adb shell cmd overlay enable --user 0 "$cutout"
          sleep 4
          adb shell cmd overlay list --user 0 > "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt" 2>&1 || true
          grep -F "$cutout" "$EVIDENCE_ROOT/CUTOUT-OVERLAYS-AFTER.txt" >/dev/null || exit 72
          printf 'enabled_cutout_overlay=%s\n' "$cutout" > "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"

          set +e
          bash quality/compatibility-v2/run_runtime_profile.sh \
            'physical-galaxy-landscape-evidence-v4-api35' '2340' '1080' '420' '1.5' '0' 'ar-SA' \
            'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' \
            "$EVIDENCE_ROOT"
          runtime_status=$?

          adb shell settings put system font_scale 1.5 >/dev/null 2>&1 || true
          adb shell wm size 2340x1080 >/dev/null 2>&1 || true
          adb shell wm density 420 >/dev/null 2>&1 || true
          adb shell rm -rf /sdcard/Android/data/sa.hulksa.player.dev/files/short-landscape-evidence >/dev/null 2>&1 || true
          adb shell am instrument -w -r \
            -e class 'sa.hulksa.player.compatibilityv2.ShortLandscapeMainShellTest' \
            'sa.hulksa.player.dev.test/androidx.test.runner.AndroidJUnitRunner' \
            > "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt" 2>&1
          shell_status=$?

          python3 quality/compatibility-v2/instrumentation_to_junit.py \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.txt" \
            "$EVIDENCE_ROOT/SHORT-LANDSCAPE-MAIN-SHELL.xml" \
            --process-status "$shell_status"
          converter_status=$?

          device_dir='/sdcard/Android/data/sa.hulksa.player.dev/files/short-landscape-evidence'
          evidence_pull_status=0
          for section in live movies series; do
            adb pull "$device_dir/${section}-full-window.png" \
              "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-full-window.png" >/dev/null 2>&1 || evidence_pull_status=1
            adb pull "$device_dir/${section}-window.xml" \
              "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-window.xml" >/dev/null 2>&1 || evidence_pull_status=1
          done

          adb shell am force-stop sa.hulksa.player.dev >/dev/null 2>&1 || true
          adb shell am start -W -n sa.hulksa.player.dev/sa.hulksa.player.MainActivity \
            > "$EVIDENCE_ROOT/FINAL-RELAUNCH.txt" 2>&1
          relaunch_status=$?
          sleep 5
          adb shell dumpsys activity activities > "$EVIDENCE_ROOT/FINAL-ACTIVITY-ACTIVITIES.txt" 2>&1
          adb shell dumpsys window > "$EVIDENCE_ROOT/FINAL-WINDOW-DUMP.txt" 2>&1
          adb shell uiautomator dump /sdcard/final-galaxy-window.xml \
            > "$EVIDENCE_ROOT/FINAL-UIAUTOMATOR.txt" 2>&1
          adb pull /sdcard/final-galaxy-window.xml "$EVIDENCE_ROOT/FINAL-window.xml" >/dev/null 2>&1
          final_xml_status=$?
          adb exec-out screencap -p > "$EVIDENCE_ROOT/FINAL-full-window.png"
          final_png_status=$?
          adb shell dumpsys input_method > "$EVIDENCE_ROOT/FINAL-IME.txt" 2>&1
          adb logcat -d -v threadtime > "$EVIDENCE_ROOT/FINAL-logcat.txt" 2>&1
          set -e

          printf 'runtime_status=%s\nshell_status=%s\nconverter_status=%s\nevidence_pull_status=%s\nrelaunch_status=%s\nfinal_xml_status=%s\nfinal_png_status=%s\n' \
            "$runtime_status" "$shell_status" "$converter_status" "$evidence_pull_status" \
            "$relaunch_status" "$final_xml_status" "$final_png_status" \
            > "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          exit 0
          SCRIPT
          chmod +x build/galaxy-landscape-v4/run.sh

      - name: Configure Linux KVM
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm -a -w /dev/kvm

      - name: Execute Landscape profile only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          disk-size: 4096M
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 2340x1080
          script: bash build/galaxy-landscape-v4/run.sh

      - name: Enforce runtime, screen, foreground and safe-area evidence
        if: always()
        run: |
          set -euo pipefail
          for file in \
            EXECUTION-STATUS.txt SOURCE-IDENTITY.txt CUTOUT-OVERLAY.txt \
            INSTRUMENTATION.xml SHORT-LANDSCAPE-MAIN-SHELL.xml \
            full-window.png window.xml FINAL-full-window.png FINAL-window.xml \
            FINAL-ACTIVITY-ACTIVITIES.txt FINAL-WINDOW-DUMP.txt; do
            test -s "$EVIDENCE_ROOT/$file"
          done
          for section in live movies series; do
            test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-full-window.png"
            test -s "$EVIDENCE_ROOT/SHORT-LANDSCAPE-${section}-window.xml"
          done
          for key in runtime_status shell_status converter_status evidence_pull_status relaunch_status final_xml_status final_png_status; do
            grep -Fx "${key}=0" "$EVIDENCE_ROOT/EXECUTION-STATUS.txt"
          done
          grep -Fx 'enabled_cutout_overlay=com.android.internal.display.cutout.emulation.corner' "$EVIDENCE_ROOT/CUTOUT-OVERLAY.txt"
          grep -F 'topResumedActivity=' "$EVIDENCE_ROOT/FINAL-ACTIVITY-ACTIVITIES.txt" | grep -F 'sa.hulksa.player.dev/sa.hulksa.player.MainActivity'

          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime --evidence-root "$EVIDENCE_ROOT" --out "$EVIDENCE_ROOT/gate"

          python3 - "$EVIDENCE_ROOT" <<'PY'
          import json
          import struct
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(sys.argv[1])
          expected_geometry = (2340, 1080)
          safe_top = 132
          safe_bottom = 1017
          required_text = {
              'live': 'قناة اختبار 42',
              'movies': 'فيلم اختبار 40',
              'series': 'مسلسل اختبار 41',
          }

          def junit(path: Path, expected_tests: int) -> None:
              suite = ET.parse(path).getroot()
              values = (
                  int(suite.attrib.get('tests', '0')),
                  int(suite.attrib.get('failures', '0')),
                  int(suite.attrib.get('errors', '0')),
              )
              if values != (expected_tests, 0, 0):
                  raise SystemExit(f'JUnit failure for {path}: {values}')

          def png_size(path: Path) -> tuple[int, int]:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit(f'Invalid PNG: {path}')
              return struct.unpack('>II', data[16:24])

          def bounds(value: str):
              try:
                  left_top, right_bottom = value.split('][')
                  left, top = map(int, left_top.lstrip('[').split(','))
                  right, bottom = map(int, right_bottom.rstrip(']').split(','))
                  return left, top, right, bottom
              except Exception:
                  return None

          junit(root / 'INSTRUMENTATION.xml', 9)
          junit(root / 'SHORT-LANDSCAPE-MAIN-SHELL.xml', 3)
          gate = json.loads((root / 'gate/EVIDENCE-GATE-runtime.json').read_text())
          if gate.get('summary') != {'PASS': 26, 'FAIL': 0, 'BLOCKED': 0, 'SKIPPED': 0}:
              raise SystemExit(f'Unexpected Evidence Gate summary: {gate.get("summary")}')

          pngs = [root / 'full-window.png', root / 'FINAL-full-window.png']
          pngs += [root / f'SHORT-LANDSCAPE-{name}-full-window.png' for name in required_text]
          for path in pngs:
              if png_size(path) != expected_geometry:
                  raise SystemExit(f'Geometry mismatch: {path} -> {png_size(path)}')

          final_nodes = list(ET.parse(root / 'FINAL-window.xml').getroot().iter('node'))
          packages = {node.attrib.get('package', '') for node in final_nodes}
          if 'sa.hulksa.player.dev' not in packages:
              raise SystemExit(f'Final hierarchy does not contain the app package: {packages}')
          forbidden = {'com.google.android.apps.nexuslauncher', 'com.google.android.permissioncontroller'}
          if packages & forbidden:
              raise SystemExit(f'Forbidden foreground package in final hierarchy: {packages & forbidden}')

          for name, expected in required_text.items():
              path = root / f'SHORT-LANDSCAPE-{name}-window.xml'
              nodes = list(ET.parse(path).getroot().iter('node'))
              app_nodes = [n for n in nodes if n.attrib.get('package') == 'sa.hulksa.player.dev']
              texts = {n.attrib.get('text', '') for n in app_nodes}
              if expected not in texts:
                  raise SystemExit(f'Missing bottom item in {name}: {expected!r}')
              scrollable = [n for n in app_nodes if n.attrib.get('scrollable') == 'true']
              if len(scrollable) != 1:
                  raise SystemExit(f'Expected one vertical scroll surface in {name}, found {len(scrollable)}')
              for node in app_nodes:
                  if node.attrib.get('class') not in {'android.widget.Button', 'android.widget.TextView'}:
                      continue
                  parsed = bounds(node.attrib.get('bounds', ''))
                  if not parsed:
                      continue
                  _, top, _, bottom = parsed
                  if top < safe_top or bottom > safe_bottom:
                      raise SystemExit(
                          f'Interactive content outside safe drawing in {name}: '
                          f'{node.attrib.get("text", "")!r} {node.attrib.get("bounds")}'
                      )
          PY

          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-GALAXY-LANDSCAPE-EVIDENCE-V4-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

      - name: Report completion
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Galaxy landscape evidence V4 completed\n\n- Run: `'$GITHUB_RUN_ID'`\n- Workflow head: `'$GITHUB_SHA'`\n- Status: **'$JOB_STATUS'**\n- Artifact: `HULK-SA-GALAXY-LANDSCAPE-EVIDENCE-V4-'$GITHUB_RUN_ID'`\n\nThis run tested Landscape only and did not rebuild production signing. Physical Galaxy remains pending.'
