name: PR57 Strip Production QA Markers

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/pr57-strip-production-qa-markers.yml'

permissions:
  contents: write

jobs:
  strip-and-verify:
    if: github.event.pull_request.number == 57
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09318-production-host-qualification
          fetch-depth: 0

      - name: Remove all test-only markers from production UI source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          source = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = source.read_text(encoding='utf-8')
          original = text

          for import_line in (
              'import androidx.compose.ui.semantics.contentDescription\n',
              'import androidx.compose.ui.semantics.semantics\n',
          ):
              text = text.replace(import_line, '')

          for constant in (
              'private const val QA_TV_PAGE_CONTENT_PREFIX = "qa-tv-page-content:"\n',
              'private const val QA_TV_LIVE_ACTIONS = "qa-tv-live-actions"\n',
              'private const val QA_TV_DOWNLOAD_LIST = "qa-tv-download-list"\n',
              'private const val QA_TV_DOWNLOAD_CARD_PREFIX = "qa-tv-download-card:"\n',
          ):
              text = text.replace(constant, '')

          helper_pattern = re.compile(
              r'\nprivate fun Modifier\.qaTvPageContent\([\s\S]*?\n\)\n\n'
              r'private fun Modifier\.qaMarker\([\s\S]*?\n\)\n',
          )
          text, helper_count = helper_pattern.subn('\n', text, count=1)
          if helper_count != 1:
              raise SystemExit(f'FAIL: expected one QA helper block, removed {helper_count}')

          text, rail_count = re.subn(
              r'\n\s*\.semantics \{ contentDescription = "qa-tv-rail" \}',
              '',
              text,
              count=1,
          )
          if rail_count != 1:
              raise SystemExit(f'FAIL: expected one direct rail marker, removed {rail_count}')

          text, page_count = re.subn(
              r'\n\s*\.qaTvPageContent\([^\n]*\),',
              ',',
              text,
          )
          text, marker_arg_count = re.subn(
              r'\n\s*\.qaMarker\([^\n]*\),',
              ',',
              text,
          )
          text, marker_chain_count = re.subn(
              r'\n\s*\.qaMarker\([^\n]*\)(?=\n\s*\.)',
              '',
              text,
          )

          if page_count != 7:
              raise SystemExit(f'FAIL: expected seven page marker calls, removed {page_count}')
          if marker_arg_count != 2:
              raise SystemExit(f'FAIL: expected two marker argument calls, removed {marker_arg_count}')
          if marker_chain_count != 1:
              raise SystemExit(f'FAIL: expected one chained card marker, removed {marker_chain_count}')

          forbidden = (
              'QA_TV_',
              'qaTvPageContent',
              'qaMarker',
              'qa-tv-',
              'contentDescription',
              'androidx.compose.ui.semantics.semantics',
          )
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit(f'FAIL: production QA tokens remain: {leftovers}')
          if text == original:
              raise SystemExit('FAIL: source was not changed')

          source.write_text(text, encoding='utf-8')

          manifest = Path('qa/canonical/canonical-source.sha256')
          target = source.as_posix()
          digest = sha256(source.read_bytes()).hexdigest()
          lines = []
          replaced = 0
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if line.endswith('  ' + target):
                  lines.append(f'{digest}  {target}')
                  replaced += 1
              else:
                  lines.append(line)
          if replaced != 1:
              raise SystemExit(f'FAIL: expected one manifest entry, found {replaced}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print(
              'PASS: stripped production QA markers; '
              f'page={page_count}, arg={marker_arg_count}, chain={marker_chain_count}, sha256={digest}'
          )
          PY

      - name: Verify canonical source, approved branding and disposable injection
        run: |
          set -euo pipefail
          sha256sum -c qa/canonical/canonical-source.sha256
          test "$(sha256sum app/src/main/res/drawable-nodpi/hulk_sa_logo.webp | awk '{print $1}')" = \
            '2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e'
          test "$(sha256sum app/src/main/res/drawable-nodpi/ic_banner.webp | awk '{print $1}')" = \
            '2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e'

          bash qa/compatibility/prepare-project.sh "$RUNNER_TEMP/injected-project"
          test -s "$RUNNER_TEMP/injected-project/app/src/debug/quality-marker-injection.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'injected-project/app/src/debug/quality-marker-injection.json')
              .read_text(encoding='utf-8')
          )
          assert report['replacement_count'] == 13, report
          assert report['original_sha256'] != report['instrumented_sha256'], report
          print('PASS: Quality Lab injected all 13 disposable debug markers')
          PY
          git diff --check

      - name: Commit atomic production-source cleanup
        run: |
          set -euo pipefail
          rm '.github/workflows/pr57-strip-production-qa-markers.yml'
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep Quality Lab markers out of production UI'
          git push origin HEAD:fix/v09318-production-host-qualification
