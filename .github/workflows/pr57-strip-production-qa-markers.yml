name: PR57 Finalize Production QA Marker Cleanup

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/pr57-strip-production-qa-markers.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.event.pull_request.number == 57
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09318-production-host-qualification
          fetch-depth: 0

      - name: Prove production source contains no Quality Lab markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = source.read_text(encoding='utf-8')
          forbidden = (
              'QA_TV_',
              'qaTvPageContent',
              'qaMarker',
              'qa-tv-',
              'androidx.compose.ui.semantics.semantics',
          )
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit(f'FAIL: production QA tokens remain: {leftovers}')

          manifest = Path('qa/canonical/canonical-source.sha256')
          target = source.as_posix()
          digest = sha256(source.read_bytes()).hexdigest()
          lines = []
          replaced = 0
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if line.endswith('  ' + target):
                  lines.append(f'{digest}  {target}')
                  replaced += 1
              else:
                  lines.append(line)
          if replaced != 1:
              raise SystemExit(f'FAIL: expected one manifest entry, found {replaced}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'PASS: production source is marker-free; canonical SHA-256={digest}')
          PY

      - name: Verify canonical tree, branding and disposable debug injection
        run: |
          set -euo pipefail
          sha256sum -c qa/canonical/canonical-source.sha256
          test "$(sha256sum app/src/main/res/drawable-nodpi/hulk_sa_logo.webp | awk '{print $1}')" = \
            '2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e'
          test "$(sha256sum app/src/main/res/drawable-nodpi/ic_banner.webp | awk '{print $1}')" = \
            '2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e'

          bash qa/compatibility/prepare-project.sh "$RUNNER_TEMP/injected-project"
          test -s "$RUNNER_TEMP/injected-project/app/src/debug/quality-marker-injection.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'injected-project/app/src/debug/quality-marker-injection.json')
              .read_text(encoding='utf-8')
          )
          assert report['replacement_count'] == 13, report
          assert report['original_sha256'] != report['instrumented_sha256'], report
          print('PASS: Quality Lab injected all 13 disposable debug markers')
          PY
          git diff --check

      - name: Commit atomic finalization
        run: |
          set -euo pipefail
          rm '.github/workflows/pr57-strip-production-qa-markers.yml'
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: finalize marker-free v0.9.3.20 source contract'
          git push origin HEAD:fix/v09318-production-host-qualification
