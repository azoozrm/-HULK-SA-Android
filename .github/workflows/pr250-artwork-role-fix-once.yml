name: PR250 Artwork Role Fix Once

on:
  push:
    branches:
      - fix/hulk-sa-icon-system-v1-4

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: apply PR250 artwork role fix'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/hulk-sa-icon-system-v1-4
          fetch-depth: 0

      - name: Apply verified artwork role correction
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/drawable-nodpi
          cp brand/HULK-SA-Android-Icon-System-v1.4/adaptive/ic_launcher_foreground_432.png \
             app/src/main/res/drawable-nodpi/hulk_sa_mark_reference.png
          cp brand/HULK-SA-Android-Icon-System-v1.4/tv/tv_launcher_xxxhdpi_320.png \
             app/src/main/res/drawable-nodpi/hulk_sa_channel_placeholder.png

          cat > app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt <<'KOTLIN'
          package sa.hulksa.player.ui.components

          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.BoxWithConstraints
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.unit.dp
          import sa.hulksa.player.R
          import sa.hulksa.player.ui.adaptive.HulkNavigationType
          import sa.hulksa.player.ui.adaptive.LocalAdaptiveUi
          import sa.hulksa.player.ui.theme.LocalHulkColors
          import kotlin.math.abs

          /**
           * One-argument BrandLogo overload used by the TV rail and fallback artwork surfaces.
           *
           * Compact category marks use the audited raster mark at a restrained scale.
           * The TV rail uses the same audited raster mark at rail scale so the HS geometry
           * is preserved exactly and never distorted by vector rescaling artifacts.
           */
          @Composable
          fun BrandLogo(modifier: Modifier) {
              BoxWithConstraints(
                  modifier = modifier,
                  contentAlignment = Alignment.Center,
              ) {
                  val adaptiveUi = LocalAdaptiveUi.current
                  val expectedRailLogoSizeDp = adaptiveUi.tvPremiumPolicy.railLogoSizeDp
                  val isTvRailLogo = adaptiveUi.isTelevision &&
                      adaptiveUi.navigationType == HulkNavigationType.RAIL &&
                      abs(maxWidth.value - expectedRailLogoSizeDp) <= 0.5f &&
                      abs(maxHeight.value - expectedRailLogoSizeDp) <= 0.5f

                  if (!isTvRailLogo) {
                      val compactCategoryMark = maxWidth <= 24.dp && maxHeight <= 24.dp
                      Image(
                          painter = painterResource(
                              if (compactCategoryMark) {
                                  R.drawable.hulk_sa_mark_reference
                              } else {
                                  R.drawable.ic_launcher_foreground
                              },
                          ),
                          contentDescription = "HULK SA",
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer {
                                  val compactScale = if (compactCategoryMark) 1.00f else 1f
                                  scaleX = compactScale
                                  scaleY = compactScale
                              },
                          contentScale = ContentScale.Fit,
                      )
                      return@BoxWithConstraints
                  }

                  val colors = LocalHulkColors.current
                  val shape = RoundedCornerShape(
                      (expectedRailLogoSizeDp * 0.18f).coerceIn(10f, 14f).dp,
                  )

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .clip(shape)
                          .background(Color.Black)
                          .border(1.5.dp, colors.goldBright.copy(alpha = .72f), shape)
                          .padding(3.dp),
                      contentAlignment = Alignment.Center,
                  ) {
                      Image(
                          painter = painterResource(R.drawable.hulk_sa_mark_reference),
                          contentDescription = "HULK SA",
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer {
                                  scaleX = 1.30f
                                  scaleY = 1.30f
                              },
                          contentScale = ContentScale.Fit,
                      )
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt')
          text = path.read_text(encoding='utf-8')
          start = text.index('@Composable\nfun ChannelLogo(')
          end = text.index('\n@Composable\nfun ChannelListItem(', start)

          replacement = '''@Composable
          fun ChannelLogo(
              item: ContentItem,
              modifier: Modifier = Modifier,
          ) {
              var imageFailed by remember(item.posterUrl) { mutableStateOf(false) }
              BoxWithConstraints(
                  modifier = modifier
                      .clip(RoundedCornerShape(10.dp))
                      .background(Color(0xFFF0EEE7))
                      .border(1.dp, Color.White.copy(alpha = .18f), RoundedCornerShape(10.dp)),
                  contentAlignment = Alignment.Center,
              ) {
                  val compactCategoryFallback = maxWidth <= 24.dp && maxHeight <= 24.dp

                  if (!item.posterUrl.isNullOrBlank() && !imageFailed) {
                      AsyncImage(
                          model = item.posterUrl,
                          contentDescription = item.name,
                          modifier = Modifier.fillMaxSize().padding(4.dp),
                          contentScale = ContentScale.Fit,
                          placeholder = painterResource(
                              if (compactCategoryFallback) {
                                  R.drawable.hulk_sa_mark_reference
                              } else {
                                  R.drawable.hulk_sa_channel_placeholder
                              },
                          ),
                          onError = { imageFailed = true },
                      )
                  } else if (compactCategoryFallback) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xFF10110D)),
                          contentAlignment = Alignment.Center,
                      ) {
                          Image(
                              painter = painterResource(R.drawable.hulk_sa_mark_reference),
                              contentDescription = "HULK SA",
                              modifier = Modifier.fillMaxSize().padding(4.dp),
                              contentScale = ContentScale.Fit,
                          )
                      }
                  } else {
                      Image(
                          painter = painterResource(R.drawable.hulk_sa_channel_placeholder),
                          contentDescription = "HULK SA",
                          modifier = Modifier.fillMaxSize(),
                          contentScale = ContentScale.Fit,
                      )
                  }
              }
          }
          '''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          grep -F 'R.drawable.hulk_sa_mark_reference' app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt
          grep -F 'compactCategoryFallback = maxWidth <= 24.dp' app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt
          grep -F 'R.drawable.hulk_sa_channel_placeholder' app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt
          test -s app/src/main/res/drawable-nodpi/hulk_sa_mark_reference.png
          test -s app/src/main/res/drawable-nodpi/hulk_sa_channel_placeholder.png

      - name: Commit production correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr250-artwork-role-fix-once.yml
          git add app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt \
                  app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt \
                  app/src/main/res/drawable-nodpi/hulk_sa_mark_reference.png \
                  app/src/main/res/drawable-nodpi/hulk_sa_channel_placeholder.png
          git diff --cached --check
          git commit -m 'fix: separate category channel and rail artwork'
          git push origin HEAD:fix/hulk-sa-icon-system-v1-4
