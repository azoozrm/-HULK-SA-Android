name: Build HULK SA v0.9.1.23 Phase 1

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/v0.9.1.23
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        shell: bash
        run: |
          echo "checkout=ok" > phase1-status.log
          find .phase1/source -maxdepth 1 -type f -printf '%f %s bytes\n' | sort >> phase1-status.log

      - name: Restore verified Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          echo "restore=started" >> phase1-status.log
          cat .phase1/source/chunk-* > source.tar.xz.b64
          sha256sum source.tar.xz.b64 >> phase1-status.log
          echo "d1e1146c115edd01dbb89474bc55722818089de0f8f4cc3dce9073b925f72e70  source.tar.xz.b64" | sha256sum --check
          echo "base64_hash=ok" >> phase1-status.log
          base64 --decode source.tar.xz.b64 > source.tar.xz
          sha256sum source.tar.xz >> phase1-status.log
          echo "720eaf26b1a569ff51806832a8e6d871a6570474531b99d4013820d6001e460c  source.tar.xz" | sha256sum --check
          echo "archive_hash=ok" >> phase1-status.log
          mkdir -p project
          tar -xJf source.tar.xz -C project
          echo "extract=ok" >> phase1-status.log
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/sa/hulksa/player/MainActivity.kt
          test -f project/app/src/main/java/sa/hulksa/player/ui/screens/HomeContentSnapshot.kt
          echo "source_files=ok" >> phase1-status.log

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Mark Java ready
        run: echo "java=ok" >> phase1-status.log

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Mark Gradle ready
        run: echo "gradle=ok" >> phase1-status.log

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          echo "sdk_install=started" >> phase1-status.log
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk_install=ok" >> phase1-status.log

      - name: Restore approved HULK SA assets
        shell: bash
        run: |
          set -euo pipefail
          echo "assets=started" >> phase1-status.log
          mkdir -p project/app/src/main/res/font
          mkdir -p project/app/src/main/res/drawable-nodpi

          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf

          if ! curl -fL --retry 5 --retry-delay 2 "https://hulksa.com/assets/hulk-official-logo.webp" -o /tmp/hulk-logo.webp; then
            cat .payload/assets/logo.part-* | base64 --decode > /tmp/hulk-logo.webp
          fi
          test -s /tmp/hulk-logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/ic_banner.webp
          echo "assets=ok" >> phase1-status.log

      - name: Verify Phase 1 source settings
        shell: bash
        run: |
          set -euo pipefail
          echo "verify_source=started" >> phase1-status.log
          grep -q 'applicationId = "sa.hulksa.player.dev"' project/app/build.gradle.kts
          grep -q 'versionCode = 45' project/app/build.gradle.kts
          grep -q 'versionName = "0.9.1.23"' project/app/build.gradle.kts
          grep -q 'android:extractNativeLibs="false"' project/app/src/main/AndroidManifest.xml
          grep -R -q 'التنزيلات' project/app/src/main/java
          grep -R -q 'ادارة كاملة للمشاهدة بدون انترنت' project/app/src/main/java
          echo "verify_source=ok" >> phase1-status.log

      - name: Run unit tests and build unsigned release APK
        working-directory: project
        shell: bash
        run: |
          echo "gradle_build=started" >> ../phase1-status.log
          set -o pipefail
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            -PHULK_PORTAL_URL=http://3162356.xyz:8080 \
            --stacktrace 2>&1 | tee ../build.log
          echo "gradle_build=ok" >> ../phase1-status.log

      - name: Inspect unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          echo "inspect=started" >> phase1-status.log
          APK="project/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p output
          cp "$APK" output/HULK-SA-v0.9.1.23-PHASE1-UNSIGNED.apk
          sha256sum output/HULK-SA-v0.9.1.23-PHASE1-UNSIGNED.apk | tee output/SHA256-UNSIGNED.txt
          zipinfo -1 "$APK" | grep '^lib/' | sort > output/NATIVE-LIBS.txt
          test -s output/NATIVE-LIBS.txt
          echo "inspect=ok" >> phase1-status.log

      - name: Upload unsigned Phase 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.1.23-PHASE1-UNSIGNED
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.1.23-build-diagnostics
          path: |
            phase1-status.log
            build.log
          if-no-files-found: error
          retention-days: 7
