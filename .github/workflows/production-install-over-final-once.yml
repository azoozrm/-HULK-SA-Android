name: HULK SA Production Install Over Final Once

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - .github/workflows/production-install-over-final-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: hulk-sa-production-install-over-final-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-install-over-final:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 45
    env:
      PACKAGE: sa.hulksa.player
      SOURCE_ARTIFACT_ID: '8834332669'
      SOURCE_ARTIFACT_DIGEST: sha256:788bf214cc221012df87f757356ed3d9ecc5ca31a66ab5cdea0521248db0aefb
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
      EVIDENCE_ROOT: build/production-install-over-final
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Download and reverify production APK evidence
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERT_SHA256"
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")"
          test "$(jq -r '.digest' <<< "$metadata")" = "$SOURCE_ARTIFACT_DIGEST"
          test "$(jq -r '.expired' <<< "$metadata")" = 'false'
          mkdir -p "$EVIDENCE_ROOT/source"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$EVIDENCE_ROOT/source"
          baseline="$EVIDENCE_ROOT/source/apks/pr57-production.apk"
          candidate="$EVIDENCE_ROOT/source/apks/candidate-production.apk"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          for apk in "$baseline" "$candidate"; do
            test "$(apkanalyzer manifest application-id "$apk")" = "$PACKAGE"
            test "$(apkanalyzer manifest version-code "$apk")" = '64'
            test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'
            report="$RUNNER_TEMP/$(basename "$apk").signer.txt"
            apksigner verify --verbose --print-certs "$apk" > "$report"
            cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$report" | head -n1 | tr '[:lower:]' '[:upper:]')"
            test "$cert" = "$expected"
          done

      - name: Create final runtime gate
        run: |
          set -euo pipefail
          mkdir -p build/final-harness
          cat > build/final-harness/run.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          baseline="$1"
          candidate="$2"
          package="$3"
          root="$4"
          runtime="$root/runtime"
          rm -rf "$runtime"
          mkdir -p "$runtime"

          field() {
            local pattern="$1"
            local file="$2"
            grep -m1 "$pattern" "$file" | sed 's/^[[:space:]]*//'
          }

          adb wait-for-device
          adb logcat -c
          adb uninstall "$package" >/dev/null 2>&1 || true

          adb install --no-streaming "$baseline" | tee "$runtime/BASELINE-INSTALL.txt"
          grep -Fq 'Success' "$runtime/BASELINE-INSTALL.txt"
          adb shell pm grant "$package" android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys package "$package" > "$runtime/PACKAGE-BEFORE.txt"
          adb shell cmd package list packages -U "$package" > "$runtime/UID-BEFORE.txt"

          app_id_before="$(field 'appId=' "$runtime/PACKAGE-BEFORE.txt")"
          data_before="$(field 'dataDir=' "$runtime/PACKAGE-BEFORE.txt")"
          first_before="$(field 'firstInstallTime=' "$runtime/PACKAGE-BEFORE.txt")"
          test -n "$app_id_before"
          test -n "$data_before"
          test -n "$first_before"

          adb shell am force-stop "$package"
          adb shell am start -W -n "$package/sa.hulksa.player.MainActivity" \
            > "$runtime/BASELINE-LAUNCH.txt"
          grep -Fq 'Status: ok' "$runtime/BASELINE-LAUNCH.txt"
          sleep 3
          adb exec-out screencap -p > "$runtime/baseline-window.png"

          adb install --no-streaming -r "$candidate" | tee "$runtime/CANDIDATE-UPDATE.txt"
          grep -Fq 'Success' "$runtime/CANDIDATE-UPDATE.txt"
          adb shell pm grant "$package" android.permission.POST_NOTIFICATIONS || true
          adb shell dumpsys package "$package" > "$runtime/PACKAGE-AFTER.txt"
          adb shell cmd package list packages -U "$package" > "$runtime/UID-AFTER.txt"

          app_id_after="$(field 'appId=' "$runtime/PACKAGE-AFTER.txt")"
          data_after="$(field 'dataDir=' "$runtime/PACKAGE-AFTER.txt")"
          first_after="$(field 'firstInstallTime=' "$runtime/PACKAGE-AFTER.txt")"
          last_after="$(field 'lastUpdateTime=' "$runtime/PACKAGE-AFTER.txt")"
          test "$app_id_before" = "$app_id_after"
          test "$data_before" = "$data_after"
          test "$first_before" = "$first_after"
          test -n "$last_after"
          cmp -s "$runtime/UID-BEFORE.txt" "$runtime/UID-AFTER.txt"

          adb shell am force-stop "$package"
          adb shell am start -W -n "$package/sa.hulksa.player.MainActivity" \
            > "$runtime/CANDIDATE-LAUNCH.txt"
          grep -Fq 'Status: ok' "$runtime/CANDIDATE-LAUNCH.txt"

          stable=0
          for attempt in 1 2 3 4 5 6 7 8; do
            resumed="$(adb shell dumpsys activity activities | grep -m1 -E 'mResumedActivity|topResumedActivity' || true)"
            echo "probe=$attempt resumed=$resumed" >> "$runtime/FOREGROUND-PROBES.txt"
            if [[ "$resumed" == *"$package"* ]]; then
              stable=$((stable + 1))
              [[ "$stable" -ge 3 ]] && break
            else
              stable=0
            fi
            sleep 2
          done
          test "$stable" -ge 3

          adb shell uiautomator dump /sdcard/production-final.xml >/dev/null
          adb pull /sdcard/production-final.xml "$runtime/window.xml" >/dev/null
          adb exec-out screencap -p > "$runtime/full-window.png"
          adb logcat -d -v threadtime > "$runtime/logcat.txt"
          adb shell dumpsys activity activities > "$runtime/activities.txt"
          adb shell dumpsys window windows > "$runtime/windows.txt"

          python3 - "$runtime" "$package" <<'PY'
          import struct
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(sys.argv[1])
          package = sys.argv[2]
          png = root / 'full-window.png'
          data = png.read_bytes()[:24]
          if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
              raise SystemExit('Invalid final PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1080, 2340):
              raise SystemExit(f'Unexpected PNG geometry: {width}x{height}')
          hierarchy = ET.parse(root / 'window.xml').getroot()
          nodes = list(hierarchy.iter('node'))
          packages = {n.attrib.get('package') for n in nodes if n.attrib.get('package')}
          if packages != {package}:
              raise SystemExit(f'Unexpected hierarchy packages: {sorted(packages)}')
          if len(nodes) < 8:
              raise SystemExit(f'Unexpectedly sparse hierarchy: {len(nodes)}')
          texts = ' '.join((n.attrib.get('text') or '') for n in nodes)
          if 'HULK' not in texts and 'تسجيل' not in texts and 'دخول' not in texts:
              raise SystemExit('Expected login semantics absent from hierarchy')
          PY

          {
            echo 'baseline_install=PASS'
            echo 'candidate_install_r=PASS'
            echo 'production_certificate_continuity=PASS'
            echo 'package_app_id_preserved=PASS'
            echo 'package_uid_preserved=PASS'
            echo 'data_directory_preserved=PASS'
            echo 'first_install_time_preserved=PASS'
            echo 'candidate_cold_launch=PASS'
            echo 'foreground_stability=PASS'
            echo 'final_png_and_hierarchy=PASS'
            echo 'result=PASS'
          } > "$root/PRODUCTION-INSTALL-OVER-RESULT.txt"
          BASH
          chmod +x build/final-harness/run.sh

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Qualify production update and final foreground
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: >-
            bash build/final-harness/run.sh
            "$EVIDENCE_ROOT/source/apks/pr57-production.apk"
            "$EVIDENCE_ROOT/source/apks/candidate-production.apk"
            "$PACKAGE"
            "$EVIDENCE_ROOT"

      - name: Finalize evidence
        if: always()
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_ROOT/PRODUCTION-INSTALL-OVER-RESULT.txt"
          grep -Fq 'result=PASS' "$EVIDENCE_ROOT/PRODUCTION-INSTALL-OVER-RESULT.txt"
          test -s "$EVIDENCE_ROOT/runtime/full-window.png"
          test -s "$EVIDENCE_ROOT/runtime/window.xml"
          rm -rf "$EVIDENCE_ROOT/source/runtime" "$EVIDENCE_ROOT/source/runtime-final"
          rm -f "$EVIDENCE_ROOT/source/SHA256SUMS.txt"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
              xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-PRODUCTION-INSTALL-OVER-FINAL-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21
