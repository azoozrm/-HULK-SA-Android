name: PR57 Production Semantics Cleanup

on:
  push:
    branches:
      - fix/v09318-production-host-qualification
    paths:
      - '.github/workflows/pr57-production-semantics-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: pr57-production-semantics-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove production QA semantics and rebuild canonical hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v09318-production-host-qualification
          fetch-depth: 0

      - name: Remove quality-only semantics from production source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          source = path.read_text(encoding='utf-8')

          replacements = {
              '''import androidx.compose.ui.semantics.contentDescription
          import androidx.compose.ui.semantics.semantics
          ''': '',
              '''private const val QA_TV_PAGE_CONTENT_PREFIX = "qa-tv-page-content:"
          private const val QA_TV_LIVE_ACTIONS = "qa-tv-live-actions"
          private const val QA_TV_DOWNLOAD_LIST = "qa-tv-download-list"
          private const val QA_TV_DOWNLOAD_CARD_PREFIX = "qa-tv-download-card:"
          ''': '',
              '''private fun Modifier.qaTvPageContent(
              isTv: Boolean,
              destination: MainDestination,
          ): Modifier = then(
              if (isTv && BuildConfig.DEBUG) {
                  Modifier.semantics {
                      contentDescription = "$QA_TV_PAGE_CONTENT_PREFIX${destination.name.lowercase(Locale.ROOT)}"
                  }
              } else {
                  Modifier
              },
          )

          private fun Modifier.qaMarker(isTv: Boolean, description: String): Modifier = then(
              if (isTv && BuildConfig.DEBUG) {
                  Modifier.semantics { contentDescription = description }
              } else {
                  Modifier
              },
          )

          ''': '',
              '''            .fillMaxHeight()
                      .semantics { contentDescription = "qa-tv-rail" }
                      .focusGroup()
          ''': '''            .fillMaxHeight()
                      .focusGroup()
          ''',
              '''            .padding(if (isTv) TV_PAGE_GUTTER else 0.dp)
                      .qaTvPageContent(isTv, MainDestination.HOME),
          ''': '''            .padding(if (isTv) TV_PAGE_GUTTER else 0.dp),
          ''',
              '''            .padding(
                          horizontal = if (isTv) TV_PAGE_GUTTER else 13.dp,
                          vertical = if (isTv) TV_PAGE_GUTTER else 12.dp,
                      )
                      .qaTvPageContent(isTv, destination),
          ''': '''            .padding(
                          horizontal = if (isTv) TV_PAGE_GUTTER else 13.dp,
                          vertical = if (isTv) TV_PAGE_GUTTER else 12.dp,
                      ),
          ''',
              '''            .padding(
                          horizontal = if (isTv) TV_PAGE_GUTTER else 12.dp,
                          vertical = if (isTv) TV_PAGE_GUTTER else 11.dp,
                      )
                      .qaTvPageContent(isTv, MainDestination.LIVE),
          ''': '''            .padding(
                          horizontal = if (isTv) TV_PAGE_GUTTER else 12.dp,
                          vertical = if (isTv) TV_PAGE_GUTTER else 11.dp,
                      ),
          ''',
              '''                        Modifier
                                      .fillMaxWidth()
                                      .qaMarker(isTv = true, description = QA_TV_LIVE_ACTIONS),
          ''': '''                        Modifier.fillMaxWidth(),
          ''',
              '''            .padding(if (isTv) TV_PAGE_GUTTER else 13.dp)
                      .qaTvPageContent(isTv, MainDestination.FAVORITES),
          ''': '''            .padding(if (isTv) TV_PAGE_GUTTER else 13.dp),
          ''',
              '''            .padding(if (isTv) TV_PAGE_GUTTER else 13.dp)
                      .qaTvPageContent(isTv, MainDestination.SEARCH),
          ''': '''            .padding(if (isTv) TV_PAGE_GUTTER else 13.dp),
          ''',
              '''            .padding(if (isTv) TV_PAGE_GUTTER else 13.dp)
                      .qaTvPageContent(isTv, MainDestination.DOWNLOADS),
          ''': '''            .padding(if (isTv) TV_PAGE_GUTTER else 13.dp),
          ''',
              '''                modifier = Modifier
                              .fillMaxSize()
                              .qaMarker(isTv, QA_TV_DOWNLOAD_LIST),
          ''': '''                modifier = Modifier.fillMaxSize(),
          ''',
              '''            .height(if (isTv) 164.dp else 220.dp)
                      .qaMarker(isTv, "$QA_TV_DOWNLOAD_CARD_PREFIX${item.downloadId}")
                      .clip(shape)
          ''': '''            .height(if (isTv) 164.dp else 220.dp)
                      .clip(shape)
          ''',
              '''            .padding(if (isTv) TV_PAGE_GUTTER else 0.dp)
                      .qaTvPageContent(isTv, MainDestination.SETTINGS),
          ''': '''            .padding(if (isTv) TV_PAGE_GUTTER else 0.dp),
          ''',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'cleanup pattern expected once, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)

          forbidden = (
              'qa-tv-',
              'qaTvPageContent',
              'qaMarker(',
              'androidx.compose.ui.semantics.contentDescription',
              'androidx.compose.ui.semantics.semantics',
          )
          remaining = [marker for marker in forbidden if marker in source]
          if remaining:
              raise SystemExit(f'quality-only production semantics remain: {remaining}')

          path.write_text(source, encoding='utf-8')
          print('PASS: production source contains no Quality Lab-only semantics')
          PY

      - name: Rebuild canonical source manifest from actual bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          manifest = Path('qa/canonical/canonical-source.sha256')
          rebuilt = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _digest, relative = raw.split(maxsplit=1)
              path = Path(relative)
              if not path.is_file():
                  raise SystemExit(f'canonical path missing: {relative}')
              rebuilt.append(f'{sha256(path.read_bytes()).hexdigest()}  {relative}')
          manifest.write_text('\n'.join(rebuilt) + '\n', encoding='utf-8')
          print(f'PASS: rebuilt {len(rebuilt)} canonical hashes from repository bytes')
          PY
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Verify approved logo remains untouched
        run: |
          set -euo pipefail
          expected='2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e'
          test "$(sha256sum app/src/main/res/drawable-nodpi/hulk_sa_logo.webp | awk '{print $1}')" = "$expected"
          test "$(sha256sum app/src/main/res/drawable-nodpi/ic_banner.webp | awk '{print $1}')" = "$expected"
          python3 qa/quality/release/logo_integrity.py

      - name: Commit atomic cleanup and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/pr57-production-semantics-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt qa/canonical/canonical-source.sha256
          git diff --cached --check
          git commit -m 'fix: isolate Quality Lab semantics from PR57 production source'
          git push origin HEAD:fix/v09318-production-host-qualification
