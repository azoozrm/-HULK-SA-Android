name: HULK SA Mobile Fix Final Qualification

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/mobile-fix-final-qualification.yml'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: hulk-mobile-fix-final-qualification
  cancel-in-progress: true

jobs:
  phone-api35-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EVIDENCE_ROOT: build/compatibility-v2/mobile-fix-phone-api35
      APP_APK: app/build/outputs/apk/debug/app-debug.apk
      TEST_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
    steps:
      - uses: actions/checkout@v7

      - uses: android-actions/setup-android@v4

      - name: Install Android platform tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools'

      - name: Download APKs from verified Fast run
        uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-FAST-30756443540
          path: build/fast-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 30756443540

      - name: Prepare exact APK paths and stable-service wrapper
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug build/mobile-fix
          cp build/fast-source/apks/app-debug.apk "$APP_APK"
          cp build/fast-source/apks/app-debug-androidTest.apk "$TEST_APK"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          sha256sum "$APP_APK" "$TEST_APK"
          cat > build/mobile-fix/run-after-services-ready.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          stable=0
          for attempt in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            activity="$(adb shell service check activity 2>/dev/null || true)"
            package="$(adb shell service check package 2>/dev/null || true)"
            settings="$(adb shell service check settings 2>/dev/null || true)"
            if [[ "$boot" == "1" && "$activity" == *found* && "$package" == *found* && "$settings" == *found* ]]; then
              stable=$((stable + 1))
              if [[ "$stable" -ge 3 ]]; then
                break
              fi
            else
              stable=0
            fi
            sleep 2
          done
          if [[ "$stable" -lt 3 ]]; then
            echo 'Android services did not become stable in time' >&2
            adb shell service list || true
            exit 70
          fi
          adb shell am wait-for-broadcast-idle || true
          bash quality/compatibility-v2/run_runtime_profile.sh \
            'phone-medium-api35' '1080' '2340' '420' '1.0' '0' 'ar-SA' \
            'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' \
            'build/compatibility-v2/mobile-fix-phone-api35'
          SCRIPT
          chmod +x build/mobile-fix/run-after-services-ready.sh

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]] && sudo chmod a+rw /dev/kvm && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            echo 'KVM unavailable; emulator runner remains mandatory.'
          fi

      - name: Execute phone API35 runtime and system-bar contract
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: bash build/mobile-fix/run-after-services-ready.sh

      - name: Enforce runtime evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root "$EVIDENCE_ROOT" \
            --out "$EVIDENCE_ROOT/gate"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-MOBILE-FIX-PHONE-API35-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

  signed-production:
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 70
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate protected signing inputs
        run: |
          set -euo pipefail
          test -n "$HULK_RELEASE_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD"
          test -n "$EXPECTED_CERT_SHA256"
          bash -n tools/verify-apk-signing.sh
          bash -n tools/verify-aab-signing.sh

      - name: Materialize ephemeral keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed production APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed identity and package evidence
        run: |
          set -euo pipefail
          mkdir -p signed-release-artifacts
          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" signed-release-artifacts/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh "$aab" "$EXPECTED_CERT_SHA256" signed-release-artifacts/AAB-SIGNING.txt
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report signed-release-artifacts/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py "$aab" --require-native-libs --report signed-release-artifacts/AAB-ARCHITECTURES.md
          printf 'Application ID: sa.hulksa.player\nVersion code: 64\nVersion name: 0.9.3.20\n' > signed-release-artifacts/PACKAGE-IDENTITY.txt
          cp "$apk" signed-release-artifacts/HULK-SA-v0.9.3.20-mobile-layout-fix-production-signed.apk
          cp "$aab" signed-release-artifacts/HULK-SA-v0.9.3.20-mobile-layout-fix-production-signed.aab
          (
            cd signed-release-artifacts
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope release --evidence-root signed-release-artifacts \
            --out signed-release-artifacts/gate

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-MOBILE-FIX-SIGNED-PRODUCTION-${{ github.run_id }}
          path: signed-release-artifacts/
          if-no-files-found: error
          retention-days: 21

  checkpoint:
    if: always()
    needs:
      - phone-api35-runtime
      - signed-production
    runs-on: ubuntu-latest
    steps:
      - name: Publish traceable result to PR 78
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHONE_RESULT: ${{ needs.phone-api35-runtime.result }}
          SIGNED_RESULT: ${{ needs.signed-production.result }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ## Mobile fix final qualification

          - Run: \`$RUN_ID\`
          - Head: \`$HEAD_SHA\`
          - Phone API35 runtime: **$PHONE_RESULT**
          - Production-signed qualification: **$SIGNED_RESULT**

          Runtime and signed artifacts are attached to this run. Physical Galaxy visual closure still requires installing the newly signed APK.
          EOF
          )"
