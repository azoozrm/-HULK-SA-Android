name: HULK SA Mobile Fix Final Qualification

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/mobile-fix-final-qualification.yml'

permissions:
  contents: read
  actions: read

jobs:
  phone-api35-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_ROOT: build/compatibility-v2/mobile-fix-phone-api35
    steps:
      - uses: actions/checkout@v7

      - uses: android-actions/setup-android@v4

      - name: Install Android platform tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools'

      - name: Download APKs from verified Fast run
        uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-FAST-30756443540
          path: build/fast-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 30756443540

      - name: Prepare exact APK paths
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
          cp build/fast-source/apks/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
          cp build/fast-source/apks/app-debug-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
                    app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]] && sudo chmod a+rw /dev/kvm && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            echo 'KVM unavailable; emulator runner remains mandatory.'
          fi

      - name: Execute phone API35 runtime and system-bar contract
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: bash quality/compatibility-v2/run_runtime_profile.sh 'phone-medium-api35' '1080' '2340' '420' '1.0' '0' 'ar-SA' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' 'build/compatibility-v2/mobile-fix-phone-api35'

      - name: Enforce runtime evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root "$EVIDENCE_ROOT" \
            --out "$EVIDENCE_ROOT/gate"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-MOBILE-FIX-PHONE-API35-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

  signed-production:
    uses: ./.github/workflows/signed-release-qualification.yml
    with:
      expected_version_code: '64'
      expected_version_name: '0.9.3.20'
    secrets: inherit
