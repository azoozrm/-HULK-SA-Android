name: QA HULK SA v0.9.3.17 Emulator Matrix

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/qa-v09317-emulator-matrix.yml'
      - 'qa/emulator/**'
      - 'release/v0.9.3.17/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-v09317-emulator-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Reconstruct latest v0.9.3.17 source
        run: |
          set -euo pipefail
          ARCHIVE='HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
          rm -rf extracted project
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n1)
          test -n "$ROOT"
          cp -a "$ROOT" project
          python3 tools/repair-v09120.py project
          python3 tools/prepare-v0920-architecture.py project
          python3 tools/prepare-v0930-adaptive-ui.py project
          python3 tools/prepare-v0932-mobile-followup.py project
          python3 tools/prepare-v0933-mobile-memory.py project
          python3 tools/prepare-v0934-mobile-fixes.py project
          python3 tools/prepare-v0935-tv-compatibility.py project
          python3 tools/prepare-v0936-tcl-polish.py project
          python3 tools/prepare-v0937-tcl-navigation-player.py project
          python3 tools/prepare-v0938-back-focus-fix.py project
          python3 tools/prepare-v0939-category-search-polish.py project
          python3 tools/prepare-v0940-installer-favorites-fix.py project
          python3 tools/prepare-v0941-rtl-reorder-login-keyboard.py project
          python3 tools/prepare-v0942-category-position-memory.py project
          python3 tools/prepare-v0943-category-player-state-fix.py project
          python3 tools/prepare-v0944-favorites-home-polish.py project
          python3 tools/prepare-v0945-xiaomi-search-safeareas.py project
          python3 release/v0.9.3.16/v0946-main.py project
          python3 release/v0.9.3.16/v0946-login.py project
          python3 release/v0.9.3.16/v0946-player.py project
          python3 release/v0.9.3.16/v0946-series.py project
          python3 release/v0.9.3.17/v0947-navigation-categories.py project
          python3 release/v0.9.3.17/v0947-player-panels.py project
          python3 release/v0.9.3.17/v0947-details-favorites-downloads.py project
          python3 qa/emulator/prepare-qa-harness.py project

      - name: Unit tests and QA APK
        id: qa_build
        working-directory: project
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --console=plain clean testDebugUnitTest :app:assembleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../qa-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Android lint diagnostics
        if: always()
        continue-on-error: true
        working-directory: project
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:lintDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../qa-lint.log

      - name: Package QA build and diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p qa-apk
          cp qa-build.log qa-apk/ 2>/dev/null || true
          cp qa-lint.log qa-apk/ 2>/dev/null || true
          cp -a project/app/build/reports/lint-results-debug.html qa-apk/ 2>/dev/null || true
          cp -a project/app/build/reports/lint-results-debug.xml qa-apk/ 2>/dev/null || true
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1 || true)
          if test -n "$APK" && test -s "$APK"; then
            cp "$APK" qa-apk/HULK-SA-v0.9.3.17-QA-EMULATOR-debug.apk
            echo 'QA APK build: PASS' > qa-apk/BUILD-STATUS.txt
          else
            echo 'QA APK build: FAIL' > qa-apk/BUILD-STATUS.txt
            tail -n 400 qa-build.log > qa-apk/qa-build-tail.log 2>/dev/null || true
          fi
          (cd qa-apk && sha256sum * > SHA256SUMS.txt)

      - name: Upload QA build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.17-QA-APK
          path: qa-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce QA APK build success
        if: always()
        run: |
          test '${{ steps.qa_build.outputs.status }}' = '0'
          test -s qa-apk/HULK-SA-v0.9.3.17-QA-EMULATOR-debug.apk

  emulator-smoke:
    needs: build-qa-apk
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: galaxy-phone-api35
            api: 35
            target: google_apis
            profile: pixel_6
            is_tv: 'false'
          - device: tablet-api35
            api: 35
            target: google_apis
            profile: pixel_c
            is_tv: 'false'
          - device: android-tv-1080p-api34
            api: 34
            target: android-tv
            profile: tv_1080p
            is_tv: 'true'
          - device: android-tv-720p-api34
            api: 34
            target: android-tv
            profile: tv_720p
            is_tv: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: HULK-SA-v0.9.3.17-QA-APK
          path: qa-apk
      - name: Install report tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run visual, focus, keyboard and crash smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: bash qa/emulator/run-smoke.sh qa-apk/HULK-SA-v0.9.3.17-QA-EMULATOR-debug.apk '${{ matrix.device }}' '${{ matrix.is_tv }}' 'qa-results/${{ matrix.device }}'

      - name: Preserve emulator diagnostics
        if: always()
        run: |
          mkdir -p qa-results/${{ matrix.device }}
          adb devices -l > qa-results/${{ matrix.device }}/adb-devices.txt 2>&1 || true
          adb bugreport qa-results/${{ matrix.device }}/bugreport.zip >/dev/null 2>&1 || true
          test -f qa-results/${{ matrix.device }}/REPORT.md || cat > qa-results/${{ matrix.device }}/REPORT.md <<EOF
          # HULK SA Emulator QA — ${{ matrix.device }}

          Emulator or smoke script did not complete. Inspect adb, bugreport and workflow logs.
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HULK-SA-v0.9.3.17-QA-${{ matrix.device }}
          path: qa-results/${{ matrix.device }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate-report:
    needs: [build-qa-apk, emulator-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: HULK-SA-v0.9.3.17-QA-*
          path: all-qa-artifacts
          merge-multiple: false
      - name: Build overall diagnosis
        run: |
          mkdir -p all-qa-artifacts
          python3 qa/emulator/aggregate.py all-qa-artifacts
          find all-qa-artifacts -maxdepth 4 -type f | sort > all-qa-artifacts/FILES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HULK-SA-v0.9.3.17-EMULATOR-MATRIX-REPORT
          path: |
            all-qa-artifacts/EMULATOR-MATRIX-REPORT.md
            all-qa-artifacts/EMULATOR-MATRIX-SUMMARY.json
            all-qa-artifacts/FILES.txt
          if-no-files-found: error
          retention-days: 30
