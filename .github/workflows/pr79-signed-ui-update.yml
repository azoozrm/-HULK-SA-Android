name: PR79 Signed Mobile UI Update

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-signed-ui-update.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr79-signed-mobile-ui-update
  cancel-in-progress: false

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-signing
    steps:
      - name: Publish signing status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='release/production-signing' \
            -f description='Production-signed APK is being built and verified' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmdline-tools;latest'

      - name: Verify source identity
        run: |
          set -euo pipefail
          grep -F 'applicationId = "sa.hulksa.player"' app/build.gradle.kts
          grep -F 'versionCode = 64' app/build.gradle.kts
          grep -F 'versionName = "0.9.3.20"' app/build.gradle.kts
          grep -F 'val productionPortalUrl = "http://3162356.xyz:8080"' app/build.gradle.kts
          git merge-base --is-ancestor b9d8c92de054e9ae1bc5b1be98865a2c62e1debc HEAD

      - name: Verify production signing secrets
        env:
          HULK_SIGNING_KEYSTORE_B64: ${{ secrets.HULK_SIGNING_KEYSTORE_B64 }}
          HULK_SIGNING_STORE_PASSWORD: ${{ secrets.HULK_SIGNING_STORE_PASSWORD }}
          HULK_SIGNING_KEY_ALIAS: ${{ secrets.HULK_SIGNING_KEY_ALIAS }}
          HULK_SIGNING_KEY_PASSWORD: ${{ secrets.HULK_SIGNING_KEY_PASSWORD }}
          HULK_SIGNING_CERT_SHA256: ${{ secrets.HULK_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${HULK_SIGNING_KEYSTORE_B64:-}" ]] || missing+=(HULK_SIGNING_KEYSTORE_B64)
          [[ -n "${HULK_SIGNING_STORE_PASSWORD:-}" ]] || missing+=(HULK_SIGNING_STORE_PASSWORD)
          [[ -n "${HULK_SIGNING_KEY_ALIAS:-}" ]] || missing+=(HULK_SIGNING_KEY_ALIAS)
          [[ -n "${HULK_SIGNING_KEY_PASSWORD:-}" ]] || missing+=(HULK_SIGNING_KEY_PASSWORD)
          [[ -n "${HULK_SIGNING_CERT_SHA256:-}" ]] || missing+=(HULK_SIGNING_CERT_SHA256)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Materialize and inspect production keystore
        env:
          HULK_SIGNING_KEYSTORE_B64: ${{ secrets.HULK_SIGNING_KEYSTORE_B64 }}
          HULK_SIGNING_STORE_PASSWORD: ${{ secrets.HULK_SIGNING_STORE_PASSWORD }}
          HULK_SIGNING_KEY_ALIAS: ${{ secrets.HULK_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/hulk-sa-production.jks"
          printf '%s' "$HULK_SIGNING_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          [[ -s "$keystore" ]]
          keytool -list -keystore "$keystore" \
            -storepass "$HULK_SIGNING_STORE_PASSWORD" \
            -alias "$HULK_SIGNING_KEY_ALIAS" >/dev/null
          printf 'HULK_KEYSTORE_PATH=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build signed production release
        env:
          ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE: ${{ env.HULK_KEYSTORE_PATH }}
          ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            clean :app:assembleRelease :app:bundleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed APK identity, ABI and certificate
        env:
          HULK_SIGNING_CERT_SHA256: ${{ secrets.HULK_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p signed-apk/evidence

          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee signed-apk/evidence/APK-BADGING.txt
          grep -F "package: name='sa.hulksa.player' versionCode='64' versionName='0.9.3.20'" signed-apk/evidence/APK-BADGING.txt

          "$BUILD_TOOLS/apkanalyzer" files list "$APK" | tee signed-apk/evidence/APK-FILES.txt
          grep -q '^/lib/arm64-v8a/' signed-apk/evidence/APK-FILES.txt
          grep -q '^/lib/armeabi-v7a/' signed-apk/evidence/APK-FILES.txt
          grep -q '^/lib/x86_64/' signed-apk/evidence/APK-FILES.txt
          if grep -q '^/lib/x86/' signed-apk/evidence/APK-FILES.txt; then
            echo 'Legacy x86 ABI must not be present' >&2
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tee signed-apk/evidence/APK-ZIPALIGN.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signed-apk/evidence/APK-SIGNATURE.txt
          grep -F 'Verified using v1 scheme (JAR signing): true' signed-apk/evidence/APK-SIGNATURE.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-apk/evidence/APK-SIGNATURE.txt

          ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signed-apk/evidence/APK-SIGNATURE.txt | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(printf '%s' "$HULK_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo 'Production certificate mismatch' >&2
            echo "Actual: $ACTUAL_CERT" >&2
            exit 1
          }

          cp "$APK" signed-apk/HULK-SA-v0.9.3.20-SIGNED-UI-UPDATE.apk
          sha256sum signed-apk/HULK-SA-v0.9.3.20-SIGNED-UI-UPDATE.apk | tee signed-apk/evidence/APK-SHA256SUMS.txt
          printf 'ui_source_commit=b9d8c92de054e9ae1bc5b1be98865a2c62e1debc\nbuild_commit=%s\npackage=sa.hulksa.player\nversionName=0.9.3.20\nversionCode=64\ncertificate_sha256=%s\n' \
            "$GITHUB_SHA" "$ACTUAL_CERT" > signed-apk/evidence/APK-METADATA.txt

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-v0.9.3.20-SIGNED-UI-UPDATE-${{ github.run_id }}
          path: signed-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Publish final signing status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='Production-signed APK certificate and identity verified'
          else
            state=failure
            description='Production signing or verification failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='release/production-signing' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
