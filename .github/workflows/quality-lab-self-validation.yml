name: HULK SA Quality Lab Self Validation

on:
  pull_request:
    branches: [phase-3-v0.9.3.0-adaptive-foundation]
    paths:
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'qa/compatibility/**'
      - 'qa/quality/**'
      - 'docs/quality/**'
      - '.github/workflows/compatibility-lab.yml'
      - '.github/workflows/quality-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hulk-quality-lab-self-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify self-validation scope
    runs-on: ubuntu-latest
    outputs:
      lab_changed: ${{ steps.classify.outputs.lab_changed }}
      product_changed: ${{ steps.classify.outputs.product_changed }}
      lab_only: ${{ steps.classify.outputs.lab_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify independent lab and product scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p quality-evidence/self-validation/scope
          python3 - <<'PY'
          import json, os, subprocess
          base = os.environ.get('BASE_SHA')
          head = os.environ['HEAD_SHA']
          if base:
              changed = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
          else:
              changed = subprocess.check_output(['git', 'show', '--pretty=', '--name-only', head], text=True).splitlines()
          lab_prefixes = ('qa/compatibility/', 'qa/quality/', 'app/src/androidTest/')
          lab_workflows = {
              '.github/workflows/compatibility-lab.yml',
              '.github/workflows/quality-ui.yml',
              '.github/workflows/quality-pr.yml',
              '.github/workflows/quality-lab-self-validation.yml',
          }
          lab_files = [p for p in changed if p.startswith(lab_prefixes) or p in lab_workflows]
          product_files = [p for p in changed if p.startswith('app/src/main/') or p == 'app/build.gradle.kts']
          result = {
              'schema_version': 2,
              'lab_changed': bool(lab_files),
              'product_changed': bool(product_files),
              'lab_only': bool(lab_files) and not bool(product_files),
              'lab_files': lab_files,
              'product_files': product_files,
              'changed_files': changed,
          }
          open('quality-evidence/self-validation/scope/SCOPE.json', 'w').write(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('lab_changed', 'product_changed', 'lab_only'):
                  output.write(f"{key}={str(result[key]).lower()}\n")
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-QUALITY-LAB-SELF-VALIDATION-SCOPE
          path: quality-evidence/self-validation/scope/
          if-no-files-found: error
          retention-days: 14

  static-contracts:
    name: Validate Quality Lab source and contracts
    needs: scope
    if: needs.scope.outputs.lab_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove no production source or approved logo changed
        if: needs.scope.outputs.lab_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$BASE_SHA" ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -qE '^app/src/main/' <<<"$changed"; then
            echo 'BLOCKED: lab-only self-validation detected production source changes.'
            grep -E '^app/src/main/' <<<"$changed"
            exit 1
          fi
          if grep -qE '^app/src/main/res/.*/(logo|ic_launcher|tv_banner)' <<<"$changed"; then
            echo 'BLOCKED: approved branding assets changed.'
            exit 1
          fi
      - name: Run static Quality Lab contracts for lab-only or mixed PRs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/quality/tests -p 'test_*.py' -v
          python3 -m unittest discover -s qa/compatibility/tests -p 'test_*.py' -v
          python3 qa/compatibility/lab_config.py --validate
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh
          grep -q 'Classify self-validation scope' .github/workflows/quality-lab-self-validation.yml
          grep -q "needs.scope.outputs.lab_changed == 'true'" .github/workflows/quality-lab-self-validation.yml
      - name: Record STATIC_VALIDATED evidence
        run: |
          mkdir -p quality-evidence/self-validation/static
          printf '%s\n' '{"status":"STATIC_VALIDATED"}' > quality-evidence/self-validation/static/STATUS.json
      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-QUALITY-LAB-SELF-VALIDATION-STATIC
          path: quality-evidence/self-validation/static/
          if-no-files-found: error
          retention-days: 14

  infrastructure-instrumentation:
    name: Run non-product instrumentation controls
    needs: [scope, static-contracts]
    if: needs.scope.outputs.lab_changed == 'true' && needs.static-contracts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with: {cache-cleanup: on-success}
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run infrastructure instrumentation after stable Android boot
        env:
          INSTRUMENTATION_CLASSES: sa.hulksa.player.CompatibilitySmokeTest,sa.hulksa.player.ui.MainShellComposeQualityTest
        run: |
          set -euo pipefail
          bash qa/compatibility/run-native-emulator.sh --api 35 --target google_apis --arch x86_64 --profile pixel_6 --skin 1080x2400 --result-dir quality-evidence/self-validation/instrumentation/emulator -- bash qa/quality/scripts/run_instrumentation.sh
      - name: Verify runtime evidence and record RUNTIME_VALIDATED
        run: |
          set -euo pipefail
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -quit | grep -q .
          mkdir -p quality-evidence/self-validation/instrumentation
          printf '%s\n' '{"status":"RUNTIME_VALIDATED"}' > quality-evidence/self-validation/instrumentation/STATUS.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-QUALITY-LAB-SELF-VALIDATION-INSTRUMENTATION
          path: |
            quality-evidence/self-validation/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14

  enforce:
    name: Final lab self-validation enforcement
    if: always()
    needs: [scope, static-contracts, infrastructure-instrumentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require actual self-validation evidence
        env:
          LAB_CHANGED: ${{ needs.scope.outputs.lab_changed }}
          PRODUCT_CHANGED: ${{ needs.scope.outputs.product_changed }}
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static-contracts.result }}
          RUNTIME: ${{ needs.infrastructure-instrumentation.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE" = success ]]
          if [[ "$LAB_CHANGED" = true ]]; then
            [[ "$STATIC" = success ]]
            [[ "$RUNTIME" = success ]]
            echo 'RUNTIME_VALIDATED: Quality Lab changes received static and runtime self-validation.'
          elif [[ "$PRODUCT_CHANGED" = true ]]; then
            [[ "$STATIC" = skipped ]]
            [[ "$RUNTIME" = skipped ]]
            echo 'DELEGATED_ONLY: no Quality Lab files changed; product gates own acceptance.'
          else
            echo 'STATIC_VALIDATED: no runtime-affecting lab or product change.'
          fi
