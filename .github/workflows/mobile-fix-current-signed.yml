name: HULK SA Current Mobile Fix Signed APK

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/mobile-fix-current-signed.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  HULK_PORTAL_URL: http://3162356.xyz:8080
  HULK_CONFIG_URL: ''

jobs:
  signed-production:
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 70
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate protected signing inputs
        run: |
          set -euo pipefail
          test -n "$HULK_RELEASE_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD"
          test -n "$EXPECTED_CERT_SHA256"
          bash -n tools/verify-apk-signing.sh
          bash -n tools/verify-aab-signing.sh

      - name: Materialize ephemeral keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build current signed APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify and package current-head signed artifacts
        run: |
          set -euo pipefail
          mkdir -p signed-mobile-fix
          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" signed-mobile-fix/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh "$aab" "$EXPECTED_CERT_SHA256" signed-mobile-fix/AAB-SIGNING.txt
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report signed-mobile-fix/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py "$aab" --require-native-libs --report signed-mobile-fix/AAB-ARCHITECTURES.md
          printf 'Application ID: sa.hulksa.player\nVersion code: 64\nVersion name: 0.9.3.20\nSource head: %s\n' "$GITHUB_SHA" > signed-mobile-fix/PACKAGE-IDENTITY.txt
          cp "$apk" signed-mobile-fix/HULK-SA-v0.9.3.20-Galaxy-layout-fix-production-signed.apk
          cp "$aab" signed-mobile-fix/HULK-SA-v0.9.3.20-Galaxy-layout-fix-production-signed.aab
          (
            cd signed-mobile-fix
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope release --evidence-root signed-mobile-fix \
            --out signed-mobile-fix/gate

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-GALAXY-LAYOUT-FIX-SIGNED-${{ github.run_id }}
          path: signed-mobile-fix/
          if-no-files-found: error
          retention-days: 21

      - name: Publish signing result to PR 78
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body "## Current-head Galaxy layout fix signing\n\n- Run: \`${{ github.run_id }}\`\n- Head: \`${{ github.sha }}\`\n- Production APK/AAB signing and release evidence: **$JOB_STATUS**\n\nNo release or merge was performed."
