name: Canonical build diagnostic

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/canonical-build-diagnostic.yml'
      - '.github/workflows/materialize-canonical-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Materialize canonical checkout
        run: |
          set -euo pipefail
          PROD="$RUNNER_TEMP/hulk-production"
          cp qa/compatibility/prepare-harness.py "$RUNNER_TEMP/prepare-harness.py"
          cat > qa/compatibility/prepare-harness.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          project = Path(sys.argv[1]).resolve()
          if not (project / "settings.gradle.kts").is_file():
              raise SystemExit("missing settings.gradle.kts")
          if not (project / "app/src/main").is_dir():
              raise SystemExit("missing app/src/main")
          print("PASS: production materialization without debug harness")
          PY
          chmod +x qa/compatibility/prepare-harness.py
          bash qa/compatibility/prepare-project.sh "$PROD"
          mv "$RUNNER_TEMP/prepare-harness.py" qa/compatibility/prepare-harness.py

          rm -rf app gradle
          cp -a "$PROD/app" app
          for file in settings.gradle.kts settings.gradle build.gradle.kts build.gradle gradle.properties; do
            if [[ -f "$PROD/$file" ]]; then
              cp "$PROD/$file" "$file"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          player = Path("app/src/main/java/sa/hulksa/player/ui/screens/PlayerScreen.kt")
          text = player.read_text(encoding="utf-8")
          annotation = "@file:androidx.annotation.OptIn(markerClass = [androidx.media3.common.util.UnstableApi::class])"
          if annotation not in text:
              player.write_text(annotation + "\n\n" + text, encoding="utf-8")
          PY

          gradle --no-daemon --console=plain wrapper \
            --gradle-version 8.13 \
            --distribution-type bin \
            -PHULK_PORTAL_URL=https://example.invalid
          chmod +x gradlew

      - name: Guard sensitive material
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {".jks", ".keystore", ".p12", ".pfx", ".pem", ".key"}
          markers = (b"-----BEGIN PRIVATE KEY-----", b"-----BEGIN RSA PRIVATE KEY-----", b"-----BEGIN EC PRIVATE KEY-----")
          bad = []
          for root_name in ("app", "gradle"):
              root = Path(root_name)
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() in forbidden:
                      bad.append(path.as_posix())
                      continue
                  payload = path.read_bytes()
                  if any(marker in payload for marker in markers):
                      bad.append(path.as_posix())
          if bad:
              print("Forbidden sensitive paths:")
              print("\n".join(bad))
              raise SystemExit(1)
          print("PASS: no signing/private-key material")
          PY

      - name: Debug and unit
        id: debug_unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest \
            :app:assembleDebug :app:bundleDebug \
            -PHULK_PORTAL_URL=https://example.invalid \
            --stacktrace 2>&1 | tee canonical-debug-unit.log

      - name: Lint
        id: lint
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            :app:lintDebug \
            -PHULK_PORTAL_URL=https://example.invalid \
            --stacktrace 2>&1 | tee canonical-lint.log

      - name: Release and R8
        id: release
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL=https://example.invalid \
            --stacktrace 2>&1 | tee canonical-release.log

      - name: ABI verification
        id: abi
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p canonical-architecture
          count=0
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            python3 tools/verify-android-architectures.py \
              "$archive" --require-native-libs \
              --report "canonical-architecture/$name.md" || exit 1
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-CANONICAL-DIAGNOSTIC
          path: |
            canonical-*.log
            canonical-architecture/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce diagnostic result
        if: always()
        env:
          DEBUG_UNIT: ${{ steps.debug_unit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          ABI: ${{ steps.abi.outcome }}
        run: |
          set -euo pipefail
          echo "debug_unit=$DEBUG_UNIT"
          echo "lint=$LINT"
          echo "release=$RELEASE"
          echo "abi=$ABI"
          test "$DEBUG_UNIT" = success
          test "$LINT" = success
          test "$RELEASE" = success
          test "$ABI" = success
