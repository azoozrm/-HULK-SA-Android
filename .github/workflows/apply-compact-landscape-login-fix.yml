name: Apply Compact Landscape Login Fix

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/apply-compact-landscape-login-fix.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/adaptive-ui-compatibility-lab-v2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Apply guarded source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          login = 'app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt'
          components = 'app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt'

          replace_once(
              login,
              '''                    modifier = Modifier
                          .widthIn(max = 1110.dp)
                          .fillMaxWidth()
                          .heightIn(max = if (compactMobileLandscape) 390.dp else 680.dp),''',
              '''                    modifier = Modifier
                          .widthIn(max = 1110.dp)
                          .fillMaxWidth()
                          .then(
                              if (compactMobileLandscape) {
                                  Modifier.fillMaxHeight()
                              } else {
                                  Modifier.heightIn(max = 680.dp)
                              },
                          ),''',
          )
          replace_once(
              login,
              '''                        modifier = Modifier.width(
                              when {
                                  compactMobileLandscape -> 520.dp
                                  compactWideTv -> 440.dp
                                  isTv -> 450.dp
                                  else -> 430.dp
                              },
                          ),''',
              '''                        modifier = Modifier
                              .width(
                                  when {
                                      compactMobileLandscape -> 500.dp
                                      compactWideTv -> 440.dp
                                      isTv -> 450.dp
                                      else -> 430.dp
                                  },
                              )
                              .then(
                                  if (compactMobileLandscape) Modifier.fillMaxHeight() else Modifier,
                              ),''',
          )
          replace_once(
              login,
              '''    val panelShape = RoundedCornerShape(if (compact) 18.dp else 26.dp)
              val panelHorizontalPadding = if (compact) 18.dp else 28.dp
              val panelVerticalPadding = if (compact) 8.dp else 22.dp
              Column(
                  modifier = modifier
                      .widthIn(max = 474.dp)
                      .clip(panelShape)''',
              '''    val panelShape = RoundedCornerShape(if (compact) 18.dp else 26.dp)
              val panelHorizontalPadding = if (compact) 14.dp else 28.dp
              val panelVerticalPadding = if (compact) 6.dp else 22.dp
              val panelScrollState = rememberScrollState()
              Column(
                  modifier = modifier
                      .widthIn(max = 474.dp)
                      .then(if (compact) Modifier.verticalScroll(panelScrollState) else Modifier)
                      .clip(panelShape)''',
          )
          replace_once(login, 'fontSize = if (compact) 22.sp else 31.sp,', 'fontSize = if (compact) 18.sp else 31.sp,')
          replace_once(login, 'fontSize = if (compact) 10.sp else 13.sp,', 'fontSize = if (compact) 9.sp else 13.sp,')
          replace_once(login, 'Spacer(Modifier.height(if (compact) 6.dp else 18.dp))', 'Spacer(Modifier.height(if (compact) 4.dp else 18.dp))')
          replace_once(login, '.heightIn(min = if (compact) 42.dp else 55.dp),\n            keyboardOptions', '.heightIn(min = if (compact) 38.dp else 55.dp),\n            compact = compact,\n            keyboardOptions')
          replace_once(login, '.heightIn(min = if (compact) 42.dp else 55.dp),\n            visualTransformation', '.heightIn(min = if (compact) 38.dp else 55.dp),\n            compact = compact,\n            visualTransformation')
          replace_once(login, 'Spacer(Modifier.height(if (compact) 6.dp else 10.dp))', 'Spacer(Modifier.height(if (compact) 4.dp else 10.dp))')
          replace_once(login, 'Spacer(Modifier.height(if (compact) 4.dp else 8.dp))\n\n        LoginOption(', 'Spacer(Modifier.height(if (compact) 2.dp else 8.dp))\n\n        LoginOption(')
          replace_once(login, 'Spacer(Modifier.height(if (compact) 6.dp else 13.dp))', 'Spacer(Modifier.height(if (compact) 4.dp else 13.dp))')
          replace_once(
              login,
              '''            enabled = !isLoading,
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = if (compact) 40.dp else 52.dp),
                          onFocused = onNonTextFocus,''',
              '''            enabled = !isLoading,
                          compact = compact,
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = if (compact) 36.dp else 52.dp),
                          onFocused = onNonTextFocus,''',
          )
          replace_once(
              login,
              '''            modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = if (compact) 40.dp else 52.dp),
                          primary = false,''',
              '''            compact = compact,
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = if (compact) 36.dp else 52.dp),
                          primary = false,''',
          )
          replace_once(login, '.heightIn(min = if (compact) 36.dp else 48.dp)', '.heightIn(min = if (compact) 32.dp else 48.dp)')
          replace_once(login, '.padding(horizontal = 7.dp, vertical = 6.dp),', '.padding(horizontal = if (compact) 5.dp else 7.dp, vertical = if (compact) 3.dp else 6.dp),')
          replace_once(login, '.size(20.dp)\n                .clip', '.size(if (compact) 18.dp else 20.dp)\n                .clip')
          replace_once(login, 'Spacer(Modifier.width(10.dp))', 'Spacer(Modifier.width(if (compact) 7.dp else 10.dp))')
          replace_once(login, 'fontSize = 12.sp,\n            fontWeight = if (focused)', 'fontSize = if (compact) 10.sp else 12.sp,\n            fontWeight = if (focused)')

          replace_once(
              components,
              '''    keyboardOptions: KeyboardOptions = KeyboardOptions.Default,
                  keyboardActions: KeyboardActions = KeyboardActions.Default,
              ) {
                  val colors = LocalHulkColors.current
                  var focused by remember { mutableStateOf(false) }
                  val shape = RoundedCornerShape(12.dp)''',
              '''    keyboardOptions: KeyboardOptions = KeyboardOptions.Default,
                  keyboardActions: KeyboardActions = KeyboardActions.Default,
                  compact: Boolean = false,
              ) {
                  val colors = LocalHulkColors.current
                  var focused by remember { mutableStateOf(false) }
                  val shape = RoundedCornerShape(if (compact) 10.dp else 12.dp)''',
          )
          replace_once(
              components,
              '.padding(horizontal = 15.dp, vertical = 13.dp),',
              '.padding(horizontal = if (compact) 12.dp else 15.dp, vertical = if (compact) 8.dp else 13.dp),',
          )
          replace_once(
              components,
              'textStyle = TextStyle(color = colors.text, fontSize = 15.sp, textAlign = TextAlign.Start),',
              'textStyle = TextStyle(color = colors.text, fontSize = if (compact) 13.sp else 15.sp, textAlign = TextAlign.Start),',
          )
          replace_once(
              components,
              'if (value.isEmpty()) Text(label, color = colors.textMuted, fontSize = 14.sp)',
              'if (value.isEmpty()) Text(label, color = colors.textMuted, fontSize = if (compact) 12.sp else 14.sp)',
          )

          print('Applied compact, scrollable short-landscape Login correction.')
          PY
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 quality/compatibility-v2/static_validate.py --repo-root . --out build/compatibility-v2/login-fix-static
          git diff --check

      - name: Compile app and instrumentation
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL='http://3162356.xyz:8080' \
            -PHULK_CONFIG_URL=''

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app quality
          test -n "$(git status --porcelain)"
          git commit -m 'fix: keep compact landscape login actions reachable'
          git push origin HEAD:rebuild/adaptive-ui-compatibility-lab-v2

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == 'success' ]]; then
            gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body '## Compact landscape Login correction applied

The short-landscape Login now uses a full-height scrollable panel and genuinely compact fields, buttons and option rows. Debug and androidTest APK compilation passed before commit. The physical Galaxy landscape qualification must be rerun; no merge or release was performed.'
          else
            gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body '## Compact landscape Login correction stopped safely

The guarded patch or compile gate failed before a source commit. No pass was claimed and the exact workflow logs require inspection.'
          fi
