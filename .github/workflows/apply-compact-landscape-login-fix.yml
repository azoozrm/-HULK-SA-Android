name: Apply Compact Landscape Login Fix

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/apply-compact-landscape-login-fix.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/adaptive-ui-compatibility-lab-v2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Apply guarded source patch
        run: |
          set -euo pipefail
          python3 tools/apply_compact_landscape_login_fix.py
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 quality/compatibility-v2/static_validate.py --repo-root . --out build/compatibility-v2/login-fix-static
          git diff --check

      - name: Compile app and instrumentation
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL='http://3162356.xyz:8080' \
            -PHULK_CONFIG_URL=''

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app quality
          test -n "$(git status --porcelain)"
          git commit -m 'fix: keep compact landscape login actions reachable'
          git push origin HEAD:rebuild/adaptive-ui-compatibility-lab-v2

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Compact landscape Login correction applied\n\nThe short-landscape Login now uses a full-height scrollable panel and genuinely compact fields, buttons and option rows. Static tests plus Debug and androidTest APK compilation passed before commit. Physical Galaxy landscape qualification must be rerun; no merge or release was performed.'

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Compact landscape Login correction stopped safely\n\nThe guarded patch, static gate or compile gate failed before a source commit. No pass was claimed. Inspect the latest Apply Compact Landscape Login Fix run.'
