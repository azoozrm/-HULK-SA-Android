name: Generate canonical v0.9.3.18 reconciliation

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/canonical-v09318-sync.yml'
      - 'qa/canonical/sync-v09318.py'
      - 'qa/compatibility/prepare-reconstructed-project.sh'

permissions:
  contents: read

concurrency:
  group: canonical-v09318-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync-canonical-v09318-lab

      - name: Apply audited reconciliation in workspace
        run: |
          set -euo pipefail
          python3 -m py_compile qa/canonical/sync-v09318.py
          python3 qa/canonical/sync-v09318.py "$GITHUB_WORKSPACE"
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/prepare-reconstructed-project.sh
          test -x gradlew
          grep -Fq 'versionCode = 62' app/build.gradle.kts
          grep -Fq 'versionName = "0.9.3.18"' app/build.gradle.kts
          grep -Fq 'readOnly = isTv && !tvSearchEditing' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -Fq "cp -a \"\$REPO_ROOT/app\"" qa/compatibility/prepare-project.sh
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Package reconciliation files
        run: |
          set -euo pipefail
          mkdir -p reconciliation
          git diff --name-only > reconciliation/CHANGED-FILES.txt
          test -s reconciliation/CHANGED-FILES.txt
          while IFS= read -r file; do
            test -f "$file"
            mkdir -p "reconciliation/files/$(dirname "$file")"
            cp -a "$file" "reconciliation/files/$file"
          done < reconciliation/CHANGED-FILES.txt
          git diff --binary > reconciliation/reconciliation.patch
          (
            cd reconciliation
            sha256sum reconciliation.patch > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-CANONICAL-V09318-RECONCILIATION
          path: reconciliation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
