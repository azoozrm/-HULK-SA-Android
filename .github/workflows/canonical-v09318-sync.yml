name: Apply canonical v0.9.3.18 source reconciliation

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/canonical-v09318-sync.yml'
      - 'qa/canonical/sync-v09318.py'
      - 'qa/compatibility/prepare-reconstructed-project.sh'

permissions:
  contents: write

concurrency:
  group: canonical-v09318-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync-canonical-v09318-lab
          fetch-depth: 0

      - name: Apply audited reconciliation
        run: |
          set -euo pipefail
          python3 -m py_compile qa/canonical/sync-v09318.py
          python3 qa/canonical/sync-v09318.py "$GITHUB_WORKSPACE"
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/prepare-reconstructed-project.sh
          test -x gradlew
          grep -Fq 'versionCode = 62' app/build.gradle.kts
          grep -Fq 'versionName = "0.9.3.18"' app/build.gradle.kts
          grep -Fq 'readOnly = isTv && !tvSearchEditing' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -Fq "cp -a \"\$REPO_ROOT/app\"" qa/compatibility/prepare-project.sh
          sha256sum -c qa/canonical/canonical-source.sha256

      - name: Commit non-workflow reconciliation files
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs qa
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No source reconciliation changes were produced' >&2; exit 1; }
          git commit -m 'build: synchronize canonical v0.9.3.18 application source'
          git push origin HEAD:sync-canonical-v09318-lab
