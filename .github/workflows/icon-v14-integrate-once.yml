name: Integrate HULK SA Icon System v1.4 Once

on:
  push:
    branches:
      - fix/hulk-sa-icon-system-v1-4
    paths:
      - '.github/workflows/icon-v14-integrate-once.yml'

permissions:
  contents: write

concurrency:
  group: hulk-sa-icon-v14-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hulk-sa-icon-system-v1-4
          fetch-depth: 0

      - name: Verify uploaded audited package
        shell: bash
        run: |
          set -euo pipefail
          ZIP='HULK-SA-Android-Icon-System-v1.4.zip'
          test -f "$ZIP"
          echo '82926ba0b8ec7173eef073e851adf8d7f3c6b97be72015d374da27c7ded86660  HULK-SA-Android-Icon-System-v1.4.zip' | sha256sum --check
          rm -rf /tmp/hulk-icon-v14
          mkdir -p /tmp/hulk-icon-v14
          unzip -q "$ZIP" -d /tmp/hulk-icon-v14
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/hulk-icon-v14/HULK-SA-Android-Icon-System-v1.4')
          report = json.loads((root/'qa/qa_report.json').read_text(encoding='utf-8'))
          assert report.get('status') == 'PASS', report.get('status')
          failed = [c for c in report.get('checks', []) if not c.get('pass', True)]
          assert not failed, failed[:5]
          required = [
              root/'android-res/drawable/ic_launcher_foreground.xml',
              root/'android-res/drawable/ic_launcher_monochrome.xml',
              root/'master/hulk_sa_lockup_master_4096x2304.png',
              root/'play-store/hulk_sa_play_store_512.png',
              root/'tv/tv_banner_master_3840x2160.png',
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, path
          print(f'package QA PASS: {len(report.get("checks", []))} checks')
          PY

      - name: Install complete package and Android runtime resources
        shell: bash
        run: |
          set -euo pipefail
          PKG='/tmp/hulk-icon-v14/HULK-SA-Android-Icon-System-v1.4'
          RES='app/src/main/res'
          BRAND='brand/HULK-SA-Android-Icon-System-v1.4'

          rm -rf "$BRAND"
          mkdir -p brand
          cp -a "$PKG" "$BRAND"

          # Runtime brand lockup used by in-app HULK SA logo surfaces.
          install -m 0644 "$PKG/master/hulk_sa_lockup_master_4096x2304.png" \
            "$RES/drawable-nodpi/hulk_sa_logo.png"

          # Adaptive / themed launcher vectors.
          install -m 0644 "$PKG/android-res/drawable/ic_launcher_foreground.xml" \
            "$RES/drawable/ic_launcher_foreground.xml"
          install -m 0644 "$PKG/android-res/drawable/ic_launcher_monochrome.xml" \
            "$RES/drawable-v33/ic_launcher_monochrome.xml"

          install -m 0644 "$PKG/android-res/mipmap-anydpi-v26/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          install -m 0644 "$PKG/android-res/mipmap-anydpi-v26/ic_launcher_round.xml" \
            "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          install -m 0644 "$PKG/android-res/mipmap-anydpi-v33/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v33/ic_launcher.xml"
          install -m 0644 "$PKG/android-res/mipmap-anydpi-v33/ic_launcher_round.xml" \
            "$RES/mipmap-anydpi-v33/ic_launcher_round.xml"

          # TV adaptive launcher points at the same audited shield foreground.
          cat > "$RES/mipmap-anydpi-v26/ic_launcher_tv.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Preserve all existing theme colors; only synchronize launcher background.
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('app/src/main/res/values/colors.xml')
          text = p.read_text(encoding='utf-8')
          new, count = re.subn(
              r'(<color\s+name="ic_launcher_background">)[^<]+(</color>)',
              r'\1#07090B\2',
              text,
              count=1,
          )
          assert count == 1, 'ic_launcher_background color not found'
          p.write_text(new, encoding='utf-8')
          PY

          # Density matrix. Repo contracts use ic_launcher_tv, tv_banner in mipmap,
          # and ic_stat_hulk for notification small icon.
          declare -A LAUNCHER=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A TVLAUNCHER=( [mdpi]=80 [hdpi]=120 [xhdpi]=160 [xxhdpi]=240 [xxxhdpi]=320 )
          declare -A NOTIF=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          declare -A BANNER=( [mdpi]='160x90' [hdpi]='240x135' [xhdpi]='320x180' [xxhdpi]='480x270' [xxxhdpi]='640x360' )

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density" "$RES/drawable-$density"
            install -m 0644 "$PKG/legacy/ic_launcher_${density}_${LAUNCHER[$density]}.png" \
              "$RES/mipmap-$density/ic_launcher.png"
            install -m 0644 "$PKG/round/ic_launcher_round_${density}_${LAUNCHER[$density]}.png" \
              "$RES/mipmap-$density/ic_launcher_round.png"
            install -m 0644 "$PKG/tv/tv_launcher_${density}_${TVLAUNCHER[$density]}.png" \
              "$RES/mipmap-$density/ic_launcher_tv.png"
            install -m 0644 "$PKG/tv/tv_banner_${density}_${BANNER[$density]}.png" \
              "$RES/mipmap-$density/tv_banner.png"
            install -m 0644 "$PKG/notification/ic_stat_hulk_sa_${density}_${NOTIF[$density]}.png" \
              "$RES/drawable-$density/ic_stat_hulk.png"
          done

          install -m 0644 "$PKG/notification/ic_stat_hulk_sa.xml" \
            "$RES/drawable/ic_stat_hulk.xml"

          # Remove obsolete icon-layer resources after all adaptive XML points to the new audited foreground/color.
          rm -f "$RES/drawable/ic_launcher_tv_foreground.xml"
          rm -f "$RES/drawable/ic_launcher_background.xml"

          # The uploaded ZIP is only transport. The complete extracted audited package is retained under brand/.
          rm -f HULK-SA-Android-Icon-System-v1.4.zip

      - name: Synchronize approved brand hashes and integration evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path

          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          logo = sha('app/src/main/res/drawable-nodpi/hulk_sa_logo.png')
          banner = sha('app/src/main/res/mipmap-xhdpi/tv_banner.png')
          tv_icon = sha('app/src/main/res/mipmap-xhdpi/ic_launcher_tv.png')

          validator = Path('quality/compatibility-v2/static_validate.py')
          text = validator.read_text(encoding='utf-8')
          text, n1 = re.subn(
              r'DEFAULT_LOGO_SHA256 = "[0-9a-f]{64}"',
              f'DEFAULT_LOGO_SHA256 = "{logo}"',
              text,
              count=1,
          )
          text, n2 = re.subn(
              r'("app/src/main/res/mipmap-xhdpi/tv_banner\.png":\s*)"[0-9a-f]{64}"',
              rf'\1"{banner}"',
              text,
              count=1,
          )
          text, n3 = re.subn(
              r'("app/src/main/res/mipmap-xhdpi/ic_launcher_tv\.png":\s*)"[0-9a-f]{64}"',
              rf'\1"{tv_icon}"',
              text,
              count=1,
          )
          assert (n1, n2, n3) == (1, 1, 1), (n1, n2, n3)
          validator.write_text(text, encoding='utf-8')

          evidence = Path('brand/HULK-SA-Android-Icon-System-v1.4/INTEGRATION.md')
          evidence.write_text(
              '# HULK SA Android Icon System v1.4 — Repository Integration\n\n'
              '- Transport package SHA-256: `82926ba0b8ec7173eef073e851adf8d7f3c6b97be72015d374da27c7ded86660`\n'
              '- Package QA: **PASS — 126 checks, 0 failures**\n'
              f'- Runtime lockup SHA-256: `{logo}`\n'
              f'- xhdpi TV banner SHA-256: `{banner}`\n'
              f'- xhdpi TV launcher SHA-256: `{tv_icon}`\n'
              '- Manifest contract remains `@mipmap/ic_launcher`, `@mipmap/ic_launcher_round`, `@mipmap/ic_launcher_tv`, `@mipmap/tv_banner`.\n'
              '- Notification runtime contract remains `@drawable/ic_stat_hulk`.\n'
              '- Full audited source/master/previews/QA package is retained in this directory.\n',
              encoding='utf-8',
          )
          print('logo', logo)
          print('banner', banner)
          print('tv_icon', tv_icon)
          PY

      - name: Verify Android resource and brand contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          rm -rf build/icon-v14-static
          python3 quality/compatibility-v2/static_validate.py \
            --repo-root . --out build/icon-v14-static
          python3 - <<'PY'
          import struct
          from pathlib import Path
          expected = {
              'mdpi': (48, 80, (160,90), 24),
              'hdpi': (72, 120, (240,135), 36),
              'xhdpi': (96, 160, (320,180), 48),
              'xxhdpi': (144, 240, (480,270), 72),
              'xxxhdpi': (192, 320, (640,360), 96),
          }
          def dims(path):
              with open(path,'rb') as f:
                  assert f.read(8) == b'\x89PNG\r\n\x1a\n', path
                  assert struct.unpack('>I', f.read(4))[0] >= 8
                  assert f.read(4) == b'IHDR'
                  return struct.unpack('>II', f.read(8))
          for d,(launcher,tv,banner,notif) in expected.items():
              assert dims(f'app/src/main/res/mipmap-{d}/ic_launcher.png') == (launcher,launcher)
              assert dims(f'app/src/main/res/mipmap-{d}/ic_launcher_round.png') == (launcher,launcher)
              assert dims(f'app/src/main/res/mipmap-{d}/ic_launcher_tv.png') == (tv,tv)
              assert dims(f'app/src/main/res/mipmap-{d}/tv_banner.png') == banner
              assert dims(f'app/src/main/res/drawable-{d}/ic_stat_hulk.png') == (notif,notif)
          print('density matrix PASS')
          PY
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q 'android:banner="@mipmap/tv_banner"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher_tv"' app/src/main/AndroidManifest.xml
          test -f brand/HULK-SA-Android-Icon-System-v1.4/qa/qa_report.json
          test -f brand/HULK-SA-Android-Icon-System-v1.4/master/hulk_sa_badge_master.svg
          test -f brand/HULK-SA-Android-Icon-System-v1.4/master/hulk_sa_badge_master.pdf
          test -f brand/HULK-SA-Android-Icon-System-v1.4/master/hulk_sa_badge_master.eps
          test -f brand/HULK-SA-Android-Icon-System-v1.4/tv/tv_banner_master_3840x2160.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Android resources and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            :app:processDebugResources :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit integrated package and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/icon-v14-integrate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m 'feat: integrate audited HULK SA icon system v1.4'
          git push origin HEAD:fix/hulk-sa-icon-system-v1-4
