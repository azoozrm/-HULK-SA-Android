name: PR79 Portrait Regression Recovery

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-portrait-recovery.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr79-portrait-regression-recovery
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE_ROOT: build/compatibility-v2/targeted/phone-medium-api35
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish diagnostic locator
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/79/comments" \
            -f body="Portrait failure-evidence run started: run ${GITHUB_RUN_ID}, head ${GITHUB_SHA}."

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Apply exact repair in runner
        run: |
          set -euo pipefail
          python3 tools/pr79_portrait_recovery.py
          git diff --check

      - name: Compile unit lint and instrumentation APKs
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64'
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Configure KVM
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm || true; fi

      - name: Run portrait keyboard regression and retain evidence
        id: portrait_runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: bash quality/compatibility-v2/run_runtime_profile.sh 'phone-medium-api35' '1080' '2340' '420' '1.0' '0' 'ar-SA' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest#phonePortraitLoginFieldsAcceptTypingWithoutCrash' 'build/compatibility-v2/targeted/phone-medium-api35'

      - name: Print focused failure evidence
        if: always()
        run: |
          set +e
          echo "runtime_outcome=${{ steps.portrait_runtime.outcome }}"
          for f in \
            "$EVIDENCE_ROOT/PROFILE-CONFIG.txt" \
            "$EVIDENCE_ROOT/INSTALL-READINESS.txt" \
            "$EVIDENCE_ROOT/INSTALLATION.txt" \
            "$EVIDENCE_ROOT/PACKAGE-REGISTRATION.txt" \
            "$EVIDENCE_ROOT/APPLICATION-LOCALE.txt" \
            "$EVIDENCE_ROOT/INSTRUMENTATION.txt" \
            "$EVIDENCE_ROOT/INSTRUMENTATION.xml" \
            "$EVIDENCE_ROOT/FOREGROUND-APP.txt"; do
            echo "===== $f ====="
            test -f "$f" && tail -n 240 "$f" || echo MISSING
          done
          if test -f "$EVIDENCE_ROOT/logcat.txt"; then
            echo '===== crash logcat ====='
            grep -nE 'FATAL EXCEPTION|AndroidRuntime|Process: sa\.hulksa\.player|Caused by:|IllegalStateException|IndexOutOfBoundsException|NullPointerException' "$EVIDENCE_ROOT/logcat.txt" | tail -n 240 || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-PR79-PORTRAIT-FAILURE-EVIDENCE-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: warn
          retention-days: 21

      - name: Require targeted runtime success
        if: always()
        run: |
          test '${{ steps.portrait_runtime.outcome }}' = 'success'
