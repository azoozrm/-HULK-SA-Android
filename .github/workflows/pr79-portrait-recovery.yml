name: PR79 Portrait Regression Recovery

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-portrait-recovery.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr79-portrait-regression-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE_ROOT: build/compatibility-v2/targeted/phone-medium-api35
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish run locator
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/79/comments" \
            -f body="Portrait recovery started: run ${GITHUB_RUN_ID}, head ${GITHUB_SHA}."

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Apply exact repair
        run: |
          set -euo pipefail
          python3 tools/pr79_portrait_recovery.py
          git diff --check
          git diff --stat

      - name: Compile unit lint and instrumentation APKs
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64'
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Configure KVM
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm || true; fi

      - name: Run portrait keyboard crash regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: bash quality/compatibility-v2/run_runtime_profile.sh 'phone-medium-api35' '1080' '2340' '420' '1.0' '0' 'ar-SA' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest#phonePortraitLoginFieldsAcceptTypingWithoutCrash' 'build/compatibility-v2/targeted/phone-medium-api35'

      - name: Enforce runtime evidence
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root "$EVIDENCE_ROOT" \
            --out "$EVIDENCE_ROOT/gate"

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-PR79-PORTRAIT-RECOVERY-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

      - name: Commit verified permanent repair only
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/pr79-portrait-recovery.yml \
            tools/pr79_portrait_recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/sa/hulksa/player/ui/adaptive/AdaptiveUi.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/androidTest/java/sa/hulksa/player/compatibilityv2/CompatibilityV2InstrumentationTest.kt \
            app/src/test/java/sa/hulksa/player/ui/adaptive/AdaptiveUiClassifierTest.kt
          git diff --cached --check
          git commit -m 'fix: stabilize portrait IME and restore adaptive page bounds'
          git push origin HEAD:fix/v09320-galaxy-landscape-clean

      - name: Publish success
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/79/comments" \
            -f body="Portrait recovery passed: run ${GITHUB_RUN_ID}. Portrait typing, unit tests, lint, APK builds and runtime evidence gate all passed."
