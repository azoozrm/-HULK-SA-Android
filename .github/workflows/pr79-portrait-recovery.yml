name: PR79 Portrait Repair

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-portrait-recovery.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr79-portrait-repair
  cancel-in-progress: true

jobs:
  repair-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
      EVIDENCE_ROOT: build/compatibility-v2/targeted/phone-medium-api35
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish run locator
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/79/comments" \
            -f body="Portrait repair evidence run started: run ${GITHUB_RUN_ID}, head ${GITHUB_SHA}."

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Apply guarded source repair
        run: |
          set -euo pipefail
          python3 tools/pr79_portrait_recovery.py
          python3 tools/pr79_portrait_evidence_followup.py
          git diff --check

      - name: Run static and JVM validation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          mkdir -p build/compatibility-v2/portrait-repair-static
          python3 quality/compatibility-v2/static_validate.py \
            --out build/compatibility-v2/portrait-repair-static/STATIC-VALIDATION.md
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64'
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          mkdir -p build/compatibility-v2/binaries
          cp app/build/outputs/apk/debug/app-debug.apk build/compatibility-v2/binaries/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/compatibility-v2/binaries/app-debug-androidTest.apk

      - name: Configure KVM
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm || true; fi

      - name: Run portrait keyboard test and collect evidence
        id: runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin 1080x2340
          script: bash quality/compatibility-v2/run_runtime_profile.sh 'phone-medium-api35' '1080' '2340' '420' '1.0' '0' 'ar-SA' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest#phonePortraitLoginFieldsAcceptTypingWithoutCrash' 'build/compatibility-v2/targeted/phone-medium-api35'

      - name: Print focused evidence
        if: always()
        run: |
          set +e
          echo "runtime_outcome=${{ steps.runtime.outcome }}"
          for f in INSTRUMENTATION.txt INSTRUMENTATION.xml IME-STATE.txt FOREGROUND-APP.txt; do
            echo "===== $f ====="
            test -f "$EVIDENCE_ROOT/$f" && cat "$EVIDENCE_ROOT/$f" || echo MISSING
          done
          echo '===== crash scan ====='
          test -f "$EVIDENCE_ROOT/logcat.txt" && grep -nE 'FATAL EXCEPTION|AndroidRuntime|Process: sa\.hulksa\.player|Caused by:|AssertionError' "$EVIDENCE_ROOT/logcat.txt" | tail -n 200 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-PR79-PORTRAIT-DIAGNOSTIC-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 21

      - name: Require exact portrait test success
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.runtime.outcome }}' = 'success'
          grep -q 'OK (1 test)' "$EVIDENCE_ROOT/INSTRUMENTATION.txt"
          grep -q 'tests="1" failures="0"' "$EVIDENCE_ROOT/INSTRUMENTATION.xml"
          grep -q 'result=PASS' "$EVIDENCE_ROOT/IME-STATE.txt"
          ! grep -qE 'FATAL EXCEPTION|Process: sa\.hulksa\.player' "$EVIDENCE_ROOT/logcat.txt"

      - name: Commit only the verified permanent repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/sa/hulksa/player/ui/adaptive/AdaptiveUi.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/androidTest/java/sa/hulksa/player/compatibilityv2/CompatibilityV2InstrumentationTest.kt \
            app/src/test/java/sa/hulksa/player/ui/adaptive/AdaptiveUiClassifierTest.kt
          git rm \
            .github/workflows/pr79-portrait-recovery.yml \
            tools/pr79_portrait_evidence_followup.py \
            tools/pr79_portrait_ime_cleanup.py \
            tools/pr79_portrait_no_back.py \
            tools/pr79_portrait_recovery.py
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/pr79-portrait-recovery.yml' \
            'app/src/androidTest/java/sa/hulksa/player/compatibilityv2/CompatibilityV2InstrumentationTest.kt' \
            'app/src/main/java/sa/hulksa/player/ui/adaptive/AdaptiveUi.kt' \
            'app/src/main/java/sa/hulksa/player/ui/screens/LoginScreen.kt' \
            'app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt' \
            'app/src/test/java/sa/hulksa/player/ui/adaptive/AdaptiveUiClassifierTest.kt' \
            'tools/pr79_portrait_evidence_followup.py' \
            'tools/pr79_portrait_ime_cleanup.py' \
            'tools/pr79_portrait_no_back.py' \
            'tools/pr79_portrait_recovery.py')
          test "$actual" = "$expected"
          git commit -m 'fix: stabilize portrait login and full-width phone pages'
          git push origin HEAD:fix/v09320-galaxy-landscape-clean
