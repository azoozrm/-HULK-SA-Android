name: Format TV search source

on:
  pull_request:
    branches: [phase-3-v0.9.3.0-adaptive-foundation]
    paths: ['.github/workflows/format-tv-search-source.yml']

permissions:
  contents: write

concurrency:
  group: hulk-sa-tv-search-format
  cancel-in-progress: true

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr-tv-search-focus-v09317
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Format only TV search changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = path.read_text(encoding='utf-8')
          start_marker = '@Composable\nprivate fun UnifiedSearchScreen('
          end_marker = '\n@Composable\nprivate fun DownloadsScreen('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          clean_search = '''@Composable
          private fun UnifiedSearchScreen(
              state: HulkUiState,
              isTv: Boolean,
              navigationMemory: NavigationMemoryStore,
              isFavorite: (ContentItem) -> Boolean,
              onSearch: (String) -> Unit,
              onOpen: (ContentItem) -> Unit,
              onToggleFavorite: (ContentItem) -> Unit,
          ) {
              val colors = LocalHulkColors.current
              val searchFieldRequester = remember { FocusRequester() }
              val firstResultRequester = remember { FocusRequester() }
              val results = remember(state.catalogs, state.searchQuery) {
                  val query = state.searchQuery.trim()
                  if (query.isBlank()) emptyList() else state.catalogs.values.flatMap { it.items }
                      .filter { it.matchesSearch(query) }
                      .distinctBy { "${it.type}:${it.id}" }
              }
              Column(Modifier.fillMaxSize().padding(if (isTv) 24.dp else 13.dp)) {
                  PageTitle("البحث", "القنوات والافلام والمسلسلات", results.size, Icons.Rounded.Search)
                  Spacer(Modifier.height(14.dp))
                  TvSearchField(
                      value = state.searchQuery,
                      onValueChange = onSearch,
                      isTv = isTv,
                      hasResults = results.isNotEmpty(),
                      fieldRequester = searchFieldRequester,
                      firstResultRequester = firstResultRequester,
                      modifier = Modifier.fillMaxWidth(),
                  )
                  Spacer(Modifier.height(16.dp))
                  if (state.searchQuery.isBlank()) {
                      EmptyState("ابدا بكتابة الاسم او السنة او النوع او وصف المحتوى")
                  } else if (results.isEmpty()) {
                      EmptyState("لا توجد نتائج مطابقة")
                  } else {
                      Text("${results.size} نتيجة", color = colors.textMuted, fontSize = 11.sp)
                      Spacer(Modifier.height(9.dp))
                      ContentGrid(
                          content = results,
                          isTv = isTv,
                          destination = MainDestination.SEARCH,
                          navigationMemory = navigationMemory,
                          isFavorite = isFavorite,
                          onOpen = onOpen,
                          onToggleFavorite = onToggleFavorite,
                          firstItemFocusRequester = if (isTv) firstResultRequester else null,
                          firstItemUpRequester = if (isTv) searchFieldRequester else null,
                      )
                  }
              }
          }

          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          private fun TvSearchField(
              value: String,
              onValueChange: (String) -> Unit,
              isTv: Boolean,
              hasResults: Boolean,
              fieldRequester: FocusRequester,
              firstResultRequester: FocusRequester,
              modifier: Modifier = Modifier,
          ) {
              val keyboardController = LocalSoftwareKeyboardController.current
              val imeVisible = WindowInsets.isImeVisible
              val moveToResults: () -> Boolean = {
                  if (!isTv || !hasResults) {
                      false
                  } else {
                      keyboardController?.hide()
                      runCatching { firstResultRequester.requestFocus() }.isSuccess
                  }
              }

              LaunchedEffect(isTv) {
                  if (isTv) {
                      delay(140L)
                      runCatching { fieldRequester.requestFocus() }
                  }
              }

              val tvModifier = if (isTv) {
                  Modifier
                      .focusRequester(fieldRequester)
                      .onPreviewKeyEvent { event ->
                          when (tvSearchFocusAction(true, event.type, event.key, hasResults, imeVisible)) {
                              TvSearchFocusAction.MOVE_TO_RESULTS -> moveToResults()
                              TvSearchFocusAction.DISMISS_KEYBOARD -> {
                                  keyboardController?.hide()
                                  true
                              }
                              TvSearchFocusAction.NONE -> false
                          }
                      }
              } else {
                  Modifier
              }

              HulkTextField(
                  value = value,
                  onValueChange = onValueChange,
                  label = "ابحث بالاسم او السنة او النوع…",
                  modifier = modifier.then(tvModifier),
                  keyboardOptions = if (isTv) {
                      KeyboardOptions(imeAction = ImeAction.Search)
                  } else {
                      KeyboardOptions.Default
                  },
                  keyboardActions = if (isTv) {
                      KeyboardActions(onSearch = { moveToResults() })
                  } else {
                      KeyboardActions.Default
                  },
              )
          }
          '''
          clean_search = clean_search.replace('          ', '')
          text = text[:start] + clean_search + text[end:]

          grid_start = text.index('private fun ContentGrid(')
          card_start = text.index('            CompactPosterCard(\n', grid_start)
          on_long_click = text.index('                onLongClick = { onToggleFavorite(item) },\n', card_start)
          clean_card_prefix = '''            CompactPosterCard(
              item = item,
              isFavorite = isFavorite(item),
              onClick = { onOpen(item) },
              modifier = Modifier
                  .fillMaxWidth()
                  .then(
                      if (index == 0 && firstItemFocusRequester != null) {
                          Modifier.focusRequester(firstItemFocusRequester)
                      } else {
                          Modifier.restoreFocus(restore, targetRequester)
                      },
                  )
                  .then(
                      if (index == 0 && firstItemUpRequester != null) {
                          Modifier.focusProperties { up = firstItemUpRequester }
                      } else {
                          Modifier
                      },
                  ),
          '''
          clean_card_prefix = clean_card_prefix.replace('          ', '')
          text = text[:card_start] + clean_card_prefix + text[on_long_click:]
          path.write_text(text, encoding='utf-8')
          PY

          cat > app/src/main/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicy.kt <<'KOTLIN'
          package sa.hulksa.player.ui.screens

          import androidx.compose.ui.input.key.Key
          import androidx.compose.ui.input.key.KeyEventType

          internal enum class TvSearchFocusAction {
              NONE,
              MOVE_TO_RESULTS,
              DISMISS_KEYBOARD,
          }

          internal fun tvSearchFocusAction(
              isTv: Boolean,
              eventType: KeyEventType,
              key: Key,
              hasResults: Boolean,
              imeVisible: Boolean,
          ): TvSearchFocusAction {
              if (!isTv || eventType != KeyEventType.KeyDown) return TvSearchFocusAction.NONE
              return when {
                  key == Key.DirectionDown && hasResults -> TvSearchFocusAction.MOVE_TO_RESULTS
                  key == Key.Back && imeVisible -> TvSearchFocusAction.DISMISS_KEYBOARD
                  else -> TvSearchFocusAction.NONE
              }
          }
          KOTLIN

          cat > app/src/test/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicyTest.kt <<'KOTLIN'
          package sa.hulksa.player.ui.screens

          import androidx.compose.ui.input.key.Key
          import androidx.compose.ui.input.key.KeyEventType
          import org.junit.Assert.assertEquals
          import org.junit.Test

          class TvSearchFocusPolicyTest {
              @Test
              fun downMovesToResultsOnlyOnTvWithResults() {
                  assertEquals(
                      TvSearchFocusAction.MOVE_TO_RESULTS,
                      tvSearchFocusAction(true, KeyEventType.KeyDown, Key.DirectionDown, true, false),
                  )
                  assertEquals(
                      TvSearchFocusAction.NONE,
                      tvSearchFocusAction(true, KeyEventType.KeyDown, Key.DirectionDown, false, false),
                  )
                  assertEquals(
                      TvSearchFocusAction.NONE,
                      tvSearchFocusAction(false, KeyEventType.KeyDown, Key.DirectionDown, true, false),
                  )
              }

              @Test
              fun backDismissesOnlyVisibleTvKeyboard() {
                  assertEquals(
                      TvSearchFocusAction.DISMISS_KEYBOARD,
                      tvSearchFocusAction(true, KeyEventType.KeyDown, Key.Back, true, true),
                  )
                  assertEquals(
                      TvSearchFocusAction.NONE,
                      tvSearchFocusAction(true, KeyEventType.KeyDown, Key.Back, true, false),
                  )
              }

              @Test
              fun keyUpNeverChangesFocus() {
                  assertEquals(
                      TvSearchFocusAction.NONE,
                      tvSearchFocusAction(true, KeyEventType.KeyUp, Key.DirectionDown, true, true),
                  )
              }
          }
          KOTLIN
          git diff --check
      - name: Full qualification
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:bundleDebug \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL=https://example.invalid
          count=0
          while IFS= read -r -d '' archive; do
            python3 tools/verify-android-architectures.py "$archive" --require-native-libs
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4
      - name: Commit formatted verified source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/main/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicy.kt \
            app/src/test/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicyTest.kt
          git diff --cached --check
          git commit -m 'style: format TV search focus implementation'
          git push origin HEAD:pr-tv-search-focus-v09317
