name: HULK SA Mobile Safe Area Final Qualification

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/mobile-safe-area-final-qualification.yml'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

env:
  HULK_PORTAL_URL: http://3162356.xyz:8080
  HULK_CONFIG_URL: ''

jobs:
  phone-runtime:
    name: phone-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: portrait
            width: '1080'
            height: '2340'
            skin: '1080x2340'
            evidence: build/compatibility-v2/mobile-safe-area-portrait
          - profile: landscape
            width: '2340'
            height: '1080'
            skin: '2340x1080'
            evidence: build/compatibility-v2/mobile-safe-area-landscape
    env:
      APP_APK: app/build/outputs/apk/debug/app-debug.apk
      TEST_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
    steps:
      - uses: actions/checkout@v7

      - uses: android-actions/setup-android@v4

      - name: Install Android platform tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools'

      - name: Download exact Fast APKs from fixed app head
        uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-FAST-30760420526
          path: build/fast-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 30760420526

      - name: Prepare APKs and stable runtime wrapper
        env:
          PROFILE: ${{ matrix.profile }}
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
          EVIDENCE_ROOT: ${{ matrix.evidence }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APP_APK")" "$(dirname "$TEST_APK")" build/mobile-safe-area
          cp build/fast-source/apks/app-debug.apk "$APP_APK"
          cp build/fast-source/apks/app-debug-androidTest.apk "$TEST_APK"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          sha256sum "$APP_APK" "$TEST_APK"
          cat > build/mobile-safe-area/run-after-services-ready.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          stable=0
          for attempt in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            activity="$(adb shell service check activity 2>/dev/null || true)"
            package="$(adb shell service check package 2>/dev/null || true)"
            settings="$(adb shell service check settings 2>/dev/null || true)"
            if [[ "$boot" == "1" && "$activity" == *found* && "$package" == *found* && "$settings" == *found* ]]; then
              stable=$((stable + 1))
              if [[ "$stable" -ge 3 ]]; then break; fi
            else
              stable=0
            fi
            sleep 2
          done
          if [[ "$stable" -lt 3 ]]; then
            echo 'Android services did not become stable in time' >&2
            exit 70
          fi
          adb shell am wait-for-broadcast-idle || true
          bash quality/compatibility-v2/run_runtime_profile.sh \
            "phone-safe-area-${PROFILE}-api35" "$WIDTH" "$HEIGHT" '420' '1.0' '0' 'ar-SA' \
            'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' \
            "$EVIDENCE_ROOT"
          SCRIPT
          chmod +x build/mobile-safe-area/run-after-services-ready.sh

      - name: Configure Linux KVM
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm -a -w /dev/kvm

      - name: Execute phone runtime
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROFILE: ${{ matrix.profile }}
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
          EVIDENCE_ROOT: ${{ matrix.evidence }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin ${{ matrix.skin }}
          script: bash build/mobile-safe-area/run-after-services-ready.sh

      - name: Enforce runtime evidence
        if: always()
        env:
          EVIDENCE_ROOT: ${{ matrix.evidence }}
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root "$EVIDENCE_ROOT" \
            --out "$EVIDENCE_ROOT/gate"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-MOBILE-SAFE-AREA-${{ matrix.profile }}-${{ github.run_id }}
          path: ${{ matrix.evidence }}/
          if-no-files-found: error
          retention-days: 21

  signed-production:
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 70
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Materialize ephemeral keystore
        run: |
          set -euo pipefail
          test -n "$HULK_RELEASE_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD"
          test -n "$EXPECTED_CERT_SHA256"
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain clean :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"

      - name: Verify and package signed output
        run: |
          set -euo pipefail
          mkdir -p signed-mobile-safe-area
          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" signed-mobile-safe-area/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh "$aab" "$EXPECTED_CERT_SHA256" signed-mobile-safe-area/AAB-SIGNING.txt
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report signed-mobile-safe-area/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py "$aab" --require-native-libs --report signed-mobile-safe-area/AAB-ARCHITECTURES.md
          cp "$apk" signed-mobile-safe-area/HULK-SA-v0.9.3.20-mobile-safe-area-production-signed.apk
          cp "$aab" signed-mobile-safe-area/HULK-SA-v0.9.3.20-mobile-safe-area-production-signed.aab
          printf 'Application ID: sa.hulksa.player\nVersion code: 64\nVersion name: 0.9.3.20\nSource head: %s\n' "$GITHUB_SHA" > signed-mobile-safe-area/PACKAGE-IDENTITY.txt
          (
            cd signed-mobile-safe-area
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope release \
            --evidence-root signed-mobile-safe-area \
            --out signed-mobile-safe-area/gate

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-MOBILE-SAFE-AREA-SIGNED-${{ github.run_id }}
          path: signed-mobile-safe-area/
          if-no-files-found: error
          retention-days: 21

  report:
    if: always()
    needs: [phone-runtime, signed-production]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final qualification result to PR 78
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHONE_RESULT: ${{ needs.phone-runtime.result }}
          SIGN_RESULT: ${{ needs.signed-production.result }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body "## Mobile safe-area and orientation final qualification\n\n- Run: \`${{ github.run_id }}\`\n- Head: \`${{ github.sha }}\`\n- Portrait + landscape runtime: **$PHONE_RESULT**\n- Production APK/AAB signing: **$SIGN_RESULT**\n\nPhysical Galaxy closure still requires installing the signed APK from this exact run. No merge or release was performed."
