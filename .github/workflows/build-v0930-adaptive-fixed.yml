name: Build HULK SA v0.9.3.0 Adaptive Fixed

on:
  push:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/build-v0930-adaptive-fixed.yml'
      - 'patches/v0.9.3.0-adaptive-foundation.patch'
      - 'tools/**'
      - 'docs/PHASE-3-ADAPTIVE-FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v0930-adaptive-fixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          mkdir -p build-logs reports
          { yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'; } 2>&1 | tee build-logs/01-sdk.log

      - name: Prepare official source
        run: |
          set -euo pipefail
          ARCHIVE='HULK-SA-v0.9.1.20-PHASE1-FINAL-SOURCE(1).zip'
          rm -rf extracted project
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          ROOT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n1)
          test -n "$ROOT"
          cp -a "$ROOT" project
          sha256sum "$ARCHIVE" | tee archive.sha256
          python3 tools/repair-v09120.py project 2>&1 | tee build-logs/02-repair.log
          python3 tools/prepare-v0920-architecture.py project 2>&1 | tee build-logs/03-architecture.log

      - name: Normalize and apply adaptive source patch
        run: |
          set -euo pipefail
          cp patches/v0.9.3.0-adaptive-foundation.patch /tmp/adaptive.patch
          python3 tools/normalize-unified-diff.py /tmp/adaptive.patch 2>&1 | tee build-logs/04-normalize-patch.log
          git apply --check --directory=project --whitespace=error-all /tmp/adaptive.patch 2>&1 | tee build-logs/05-patch-check.log
          git apply --directory=project --whitespace=error-all /tmp/adaptive.patch 2>&1 | tee build-logs/06-patch-apply.log
          python3 tools/verify-v0930-adaptive-source.py project --report reports/ADAPTIVE-SOURCE-REPORT.md 2>&1 | tee build-logs/07-source-policy.log

      - name: Compile, test and build
        working-directory: project
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:compileDebugKotlin testDebugUnitTest :app:assembleDebug :app:bundleDebug --stacktrace 2>&1 | tee ../build-logs/08-gradle.log

      - name: Verify packages
        run: |
          set -euo pipefail
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          python3 tools/verify-android-architectures.py "$APK" --require-native-libs --report reports/APK-ARCHITECTURE-REPORT.md
          python3 tools/verify-android-architectures.py "$AAB" --require-native-libs --report reports/AAB-ARCHITECTURE-REPORT.md
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee reports/APK-BADGING.txt
          grep "package: name='sa.hulksa.player.dev' versionCode='44' versionName='0.9.3.0-beta'" reports/APK-BADGING.txt

      - name: Package delivery
        run: |
          set -euo pipefail
          rm -rf delivery source-delivery
          mkdir delivery source-delivery
          APK=$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          AAB=$(find project/app/build/outputs/bundle/debug -name '*.aab' | head -n1)
          cp "$APK" delivery/HULK-SA-v0.9.3.0-ADAPTIVE-FOUNDATION-UNIVERSAL-debug.apk
          cp "$AAB" delivery/HULK-SA-v0.9.3.0-ADAPTIVE-FOUNDATION-debug.aab
          cp reports/*.md reports/APK-BADGING.txt delivery/
          cp docs/PHASE-3-ADAPTIVE-FOUNDATION.md delivery/
          cp -a project/. source-delivery/
          rm -rf source-delivery/.gradle source-delivery/.kotlin source-delivery/build source-delivery/app/build
          (cd source-delivery && zip -qr ../delivery/HULK-SA-Source-v0.9.3.0-ADAPTIVE-FOUNDATION.zip .)
          printf '# HULK SA v0.9.3.0 Build Report\n\n- Commit: %s\n- Source-only adaptive build: PASS\n- Kotlin compilation: PASS\n- Unit tests: PASS\n- Universal APK and AAB: PASS\n- ABIs: arm64-v8a, armeabi-v7a, x86_64\n' "$GITHUB_SHA" > delivery/BUILD-REPORT-v0.9.3.0.md
          printf '# HULK SA v0.9.3.0 Changelog\n\n- Adaptive mobile, tablet and television foundation.\n- Touch, remote and keyboard input classification.\n- Adaptive top-bar and rail navigation.\n- Preserved data, domain, downloads, recommendations and architecture work.\n' > delivery/CHANGELOG-v0.9.3.0.md
          (cd delivery && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload complete delivery
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.0-ADAPTIVE-FOUNDATION-FIXED
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.3.0-ADAPTIVE-FIXED-DIAGNOSTICS
          path: |
            archive.sha256
            build-logs/
            reports/
            project/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
