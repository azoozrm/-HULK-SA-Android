name: PR250 TV Brand Clarity Fix Once

on:
  push:
    branches:
      - fix/hulk-sa-icon-system-v1-4

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: apply PR250 TV brand clarity fix'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/hulk-sa-icon-system-v1-4
          fetch-depth: 0

      - name: Apply verified TV brand clarity correction
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/drawable \
                   app/src/main/res/mipmap-nodpi \
                   app/src/main/res/mipmap-television-nodpi

          # Reuse the audited v1.4 masters only; no new artwork is generated here.
          cp brand/HULK-SA-Android-Icon-System-v1.4/play-store/hulk_sa_play_store_512.png \
             app/src/main/res/mipmap-nodpi/hulk_sa_tv_launcher_v14.png
          cp brand/HULK-SA-Android-Icon-System-v1.4/play-store/hulk_sa_play_store_512.png \
             app/src/main/res/mipmap-television-nodpi/ic_launcher.png
          cp brand/HULK-SA-Android-Icon-System-v1.4/play-store/hulk_sa_play_store_512.png \
             app/src/main/res/mipmap-television-nodpi/ic_launcher_round.png
          cp brand/HULK-SA-Android-Icon-System-v1.4/play-store/hulk_sa_play_store_512.png \
             app/src/main/res/mipmap-television-nodpi/ic_launcher_tv.png

          cat > app/src/main/res/drawable/hulk_sa_mark_master.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="1000"
              android:viewportHeight="1000">
              <group
                  android:translateX="191.5663"
                  android:translateY="100"
                  android:scaleX="1.927711"
                  android:scaleY="1.927711">
                  <path
                      android:fillType="evenOdd"
                      android:pathData="M 170 79 L 170 192 L 229 226 L 229 251 L 206 271 L 199 275 L 198 234 L 170 218 L 171 337 L 243 277 L 254 263 L 259 251 L 259 207 L 198 172 L 198 135 L 201 134 L 229 151 L 229 164 L 259 180 L 259 132 Z M 150 79 L 123 96 L 123 184 L 121 186 L 89 185 L 89 117 L 84 118 L 61 132 L 60 251 L 61 255 L 72 270 L 87 283 L 89 283 L 89 217 L 122 216 L 123 315 L 151 336 Z M 160 20 L 16 110 L 16 253 L 18 266 L 28 290 L 46 312 L 161 397 L 271 314 L 286 298 L 297 279 L 304 252 L 304 110 Z M 159 49 L 164 50 L 280 123 L 280 254 L 277 265 L 267 282 L 252 298 L 162 367 L 156 365 L 63 293 L 47 274 L 39 251 L 40 122 Z">
                      <aapt:attr name="android:fillColor">
                          <gradient
                              android:type="linear"
                              android:startX="0"
                              android:startY="0"
                              android:endX="320"
                              android:endY="415"
                              android:startColor="#FFF1A6"
                              android:centerColor="#F7C64A"
                              android:endColor="#C98912" />
                      </aapt:attr>
                  </path>
              </group>
          </vector>
          XML

          cat > app/src/main/res/drawable/hulk_sa_badge_master.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="1254"
              android:viewportHeight="1254">
              <path android:pathData="M0,0H1254V1254H0Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="627"
                          android:centerY="526.68"
                          android:gradientRadius="902.88"
                          android:startColor="#111419"
                          android:endColor="#07090B" />
                  </aapt:attr>
              </path>
              <path
                  android:fillType="evenOdd"
                  android:pathData="M 866 1045 L 866 1047 L 879 1047 L 887 1033 L 918 1033 L 926 1047 L 940 1047 L 907 987 L 897 988 Z M 901 1006 L 904 1006 L 911 1018 L 910 1022 L 896 1023 L 894 1021 L 894 1018 Z M 781 988 L 775 994 L 774 998 L 775 1015 L 785 1022 L 820 1022 L 823 1026 L 823 1032 L 820 1035 L 775 1035 L 774 1038 L 777 1046 L 823 1047 L 828 1045 L 834 1037 L 834 1020 L 831 1015 L 823 1011 L 789 1011 L 786 1007 L 786 1002 L 789 998 L 832 998 L 832 987 Z M 626 987 L 626 1047 L 638 1047 L 638 1029 L 649 1021 L 652 1021 L 676 1047 L 691 1047 L 691 1044 L 662 1014 L 662 1011 L 690 989 L 689 987 L 673 987 L 642 1012 L 638 1011 L 638 987 Z M 529 987 L 529 1046 L 586 1047 L 586 1035 L 542 1034 L 542 987 Z M 423 987 L 423 1035 L 429 1044 L 436 1047 L 471 1047 L 482 1041 L 485 1034 L 485 987 L 472 987 L 472 1032 L 469 1035 L 438 1035 L 436 1033 L 435 987 Z M 316 987 L 317 1047 L 329 1047 L 330 1022 L 365 1022 L 367 1025 L 366 1046 L 379 1047 L 379 987 L 367 987 L 367 1008 L 365 1011 L 330 1011 L 329 987 Z M 645 327 L 645 523 L 747 582 L 747 627 L 695 674 L 693 674 L 692 598 L 645 571 L 646 778 L 701 733 L 774 669 L 788 649 L 798 621 L 798 548 L 692 487 L 692 421 L 698 421 L 746 449 L 747 472 L 798 500 L 798 418 Z M 611 327 L 563 356 L 562 514 L 503 513 L 503 391 L 457 419 L 457 634 L 476 660 L 503 684 L 503 567 L 562 566 L 563 739 L 609 776 L 611 776 Z M 626 230 L 382 382 L 382 637 L 390 668 L 405 698 L 420 718 L 442 741 L 628 881 L 812 741 L 834 719 L 844 706 L 862 674 L 870 650 L 873 633 L 873 382 L 629 230 Z M 626 274 L 629 274 L 836 403 L 836 627 L 833 642 L 825 663 L 810 686 L 788 709 L 629 832 L 604 815 L 474 715 L 447 689 L 433 669 L 426 655 L 420 635 L 419 610 L 420 402 Z M 89 79 L 69 101 L 49 131 L 31 173 L 23 211 L 23 1045 L 31 1083 L 43 1114 L 58 1140 L 82 1170 L 114 1197 L 147 1216 L 180 1228 L 220 1235 L 1032 1235 L 1070 1229 L 1103 1217 L 1131 1202 L 1162 1178 L 1189 1147 L 1209 1113 L 1221 1082 L 1226 1062 L 1229 1038 L 1229 210 L 1222 175 L 1211 145 L 1196 118 L 1177 93 L 1145 63 L 1114 43 L 1074 27 L 1039 20 L 215 20 L 180 27 L 152 37 L 119 55 Z M 97 84 L 131 58 L 161 43 L 197 32 L 230 28 L 1024 28 L 1065 34 L 1097 45 L 1115 54 L 1138 69 L 1172 101 L 1189 124 L 1207 159 L 1217 191 L 1221 219 L 1219 481 L 1220 1042 L 1211 1085 L 1194 1123 L 1175 1151 L 1152 1175 L 1119 1199 L 1087 1214 L 1056 1223 L 1019 1227 L 232 1227 L 188 1221 L 153 1209 L 133 1199 L 115 1187 L 86 1161 L 61 1128 L 46 1099 L 36 1068 L 32 1045 L 32 209 L 39 177 L 52 144 L 69 116 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="0"
                          android:startY="0"
                          android:endX="1254"
                          android:endY="1254"
                          android:startColor="#FFF1A6"
                          android:centerColor="#F7C64A"
                          android:endColor="#C98912" />
                  </aapt:attr>
              </path>
          </vector>
          XML

          python3 - <<'PY'
          from pathlib import Path

          rail = Path('app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt')
          rail_text = rail.read_text(encoding='utf-8')
          if 'R.drawable.hulk_sa_mark_reference' not in rail_text:
              raise SystemExit('TV rail mark source contract mismatch')
          if 'compactScale = if (compactCategoryMark) 1.00f else 1f' not in rail_text:
              raise SystemExit('Compact category scale contract mismatch')
          if 'scaleX = 1.30f' not in rail_text or 'scaleY = 1.30f' not in rail_text:
              raise SystemExit('TV rail scale contract mismatch')
          rail_text = rail_text.replace('R.drawable.hulk_sa_mark_reference', 'R.drawable.hulk_sa_mark_master')
          rail_text = rail_text.replace(
              'compactScale = if (compactCategoryMark) 1.00f else 1f',
              'compactScale = if (compactCategoryMark) 1.12f else 1f',
          )
          rail_text = rail_text.replace('scaleX = 1.30f', 'scaleX = 1.38f')
          rail_text = rail_text.replace('scaleY = 1.30f', 'scaleY = 1.38f')
          rail.write_text(rail_text, encoding='utf-8')

          components = Path('app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt')
          text = components.read_text(encoding='utf-8')
          text = text.replace(
              'if (compactFallback) R.drawable.ic_launcher_foreground else R.drawable.hulk_sa_logo',
              'if (compactFallback) R.drawable.hulk_sa_mark_master else R.drawable.hulk_sa_logo',
              1,
          )
          start = text.index('@Composable\nfun ChannelLogo(')
          next_fun = text.index('fun ChannelListItem(', start)
          end = text.rfind('@Composable', start, next_fun)
          if end <= start:
              raise SystemExit('ChannelLogo block boundary mismatch')

          replacement = '''@Composable
          fun ChannelLogo(
              item: ContentItem,
              modifier: Modifier = Modifier,
          ) {
              var imageFailed by remember(item.posterUrl) { mutableStateOf(false) }
              BoxWithConstraints(
                  modifier = modifier
                      .clip(RoundedCornerShape(10.dp))
                      .background(Color(0xFFF0EEE7))
                      .border(1.dp, Color.White.copy(alpha = .18f), RoundedCornerShape(10.dp)),
                  contentAlignment = Alignment.Center,
              ) {
                  val compactCategoryFallback = maxWidth <= 24.dp && maxHeight <= 24.dp
                  val largePreviewFallback = maxWidth >= 96.dp && maxHeight >= 96.dp

                  if (!item.posterUrl.isNullOrBlank() && !imageFailed) {
                      AsyncImage(
                          model = item.posterUrl,
                          contentDescription = item.name,
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(if (compactCategoryFallback) 2.dp else 4.dp),
                          contentScale = ContentScale.Fit,
                          placeholder = painterResource(
                              if (compactCategoryFallback) {
                                  R.drawable.hulk_sa_mark_master
                              } else {
                                  R.drawable.hulk_sa_badge_master
                              },
                          ),
                          onError = { imageFailed = true },
                      )
                  } else if (compactCategoryFallback) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xFF10110D)),
                          contentAlignment = Alignment.Center,
                      ) {
                          Image(
                              painter = painterResource(R.drawable.hulk_sa_mark_master),
                              contentDescription = "HULK SA",
                              modifier = Modifier
                                  .fillMaxSize()
                                  .graphicsLayer {
                                      scaleX = 1.15f
                                      scaleY = 1.15f
                                  },
                              contentScale = ContentScale.Fit,
                          )
                      }
                  } else if (largePreviewFallback) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xFF090A08)),
                          contentAlignment = Alignment.Center,
                      ) {
                          Image(
                              painter = painterResource(R.drawable.hulk_sa_mark_master),
                              contentDescription = "HULK SA",
                              modifier = Modifier
                                  .fillMaxSize()
                                  .graphicsLayer {
                                      scaleX = 1.20f
                                      scaleY = 1.20f
                                  },
                              contentScale = ContentScale.Fit,
                          )
                      }
                  } else {
                      Image(
                          painter = painterResource(R.drawable.hulk_sa_badge_master),
                          contentDescription = "HULK SA",
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer {
                                  scaleX = 1.14f
                                  scaleY = 1.14f
                              },
                          contentScale = ContentScale.Fit,
                      )
                  }
              }
          }

          '''
          components.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text(encoding='utf-8')
          old = 'android:icon="@mipmap/ic_launcher_tv"\n            android:label="@string/app_name"'
          new = 'android:icon="@mipmap/hulk_sa_tv_launcher_v14"\n            android:logo="@mipmap/hulk_sa_tv_launcher_v14"\n            android:label="@string/app_name"'
          if old not in manifest_text:
              raise SystemExit('TV launcher manifest contract mismatch')
          manifest.write_text(manifest_text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -F 'compactScale = if (compactCategoryMark) 1.12f else 1f' app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt
          grep -F 'scaleX = 1.38f' app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt
          grep -F 'largePreviewFallback = maxWidth >= 96.dp' app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt
          grep -F 'R.drawable.hulk_sa_badge_master' app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt
          grep -F 'android:icon="@mipmap/hulk_sa_tv_launcher_v14"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/mipmap-nodpi/hulk_sa_tv_launcher_v14.png
          test -s app/src/main/res/mipmap-television-nodpi/ic_launcher.png
          test -s app/src/main/res/drawable/hulk_sa_mark_master.xml
          test -s app/src/main/res/drawable/hulk_sa_badge_master.xml

      - name: Commit production correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr250-tv-brand-clarity-fix-once.yml
          git add app/src/main/AndroidManifest.xml \
                  app/src/main/java/sa/hulksa/player/ui/components/TvRailBrandLogo.kt \
                  app/src/main/java/sa/hulksa/player/ui/components/HulkComponents.kt \
                  app/src/main/res/drawable/hulk_sa_mark_master.xml \
                  app/src/main/res/drawable/hulk_sa_badge_master.xml \
                  app/src/main/res/mipmap-nodpi/hulk_sa_tv_launcher_v14.png \
                  app/src/main/res/mipmap-television-nodpi/ic_launcher.png \
                  app/src/main/res/mipmap-television-nodpi/ic_launcher_round.png \
                  app/src/main/res/mipmap-television-nodpi/ic_launcher_tv.png
          git diff --cached --check
          git commit -m 'fix: sharpen and resize TV brand artwork'
          git push origin HEAD:fix/hulk-sa-icon-system-v1-4
