# Refresh after adding per-screen and final-foreground evidence.
name: Galaxy Landscape Retest V3 Beacon

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/physical-galaxy-landscape-retest-v3-beacon.yml'

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  expose-run:
    runs-on: ubuntu-latest
    steps:
      - name: Publish landscape retest run locator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/physical-galaxy-landscape-retest-v3.yml/runs" \
            -f branch='rebuild/adaptive-ui-compatibility-lab-v2' \
            -f event='push' \
            -f per_page='5' \
            --jq '.workflow_runs[] | "- Run: `\(.id)` | head: `\(.head_sha)` | status: **\(.status)** | conclusion: **\(.conclusion // "pending")**"')"
          test -n "$runs"
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body "## Galaxy landscape V3 run locator\n\n$runs\n\nThis locator does not run Portrait or production signing."
