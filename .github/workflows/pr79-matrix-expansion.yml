name: PR79 Compatibility Matrix Expansion

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-matrix-expansion.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr79-matrix-expansion
  cancel-in-progress: true

jobs:
  diagnose-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIAGNOSTIC_ROOT: build/compatibility-v2/matrix-expansion/diagnostic
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish diagnostic locator
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/79/comments" \
            -f body="Compatibility matrix generation diagnostic started: run ${GITHUB_RUN_ID}, source head ${GITHUB_SHA}."

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - name: Run guarded generators with preserved logs
        id: generators
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$DIAGNOSTIC_ROOT"

          run_generator() {
            local name="$1"
            local script="$2"
            echo "script=$script" > "$DIAGNOSTIC_ROOT/$name.status"
            set +e
            python3 "$script" > >(tee "$DIAGNOSTIC_ROOT/$name.stdout.log") \
              2> >(tee "$DIAGNOSTIC_ROOT/$name.stderr.log" >&2)
            local status=$?
            set -e
            echo "status=$status" >> "$DIAGNOSTIC_ROOT/$name.status"
            git status --short > "$DIAGNOSTIC_ROOT/$name.git-status.txt" || true
            git diff --check > "$DIAGNOSTIC_ROOT/$name.diff-check.txt" 2>&1 || true
            if [[ "$status" -ne 0 ]]; then
              return "$status"
            fi
          }

          set -e
          run_generator 01-bootstrap tools/pr79_matrix_expansion_bootstrap.py
          run_generator 02-compat-fix tools/pr79_matrix_expansion_compat_fix.py
          run_generator 03-expansion tools/pr79_matrix_expansion.py
          run_generator 04-followup tools/pr79_matrix_expansion_followup.py
          git diff --check

      - name: Print diagnostic logs
        if: always()
        run: |
          set +e
          echo "generator_outcome=${{ steps.generators.outcome }}"
          find "$DIAGNOSTIC_ROOT" -maxdepth 1 -type f -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-PR79-MATRIX-GENERATION-DIAGNOSTIC-${{ github.run_id }}
          path: ${{ env.DIAGNOSTIC_ROOT }}/
          if-no-files-found: error
          retention-days: 7

      - name: Require generator success
        if: always()
        run: |
          test '${{ steps.generators.outcome }}' = 'success'
