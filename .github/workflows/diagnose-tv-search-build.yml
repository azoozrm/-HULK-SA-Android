name: Diagnose TV search build

on:
  push:
    branches: [pr-tv-search-focus-v09317]
    paths: ['.github/workflows/diagnose-tv-search-build.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr-tv-search-focus-v09317
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reuse exact patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-tv-search-focus.yml').read_text().splitlines()
          start = workflow.index('      - name: Apply explicit TV search focus contract') + 2
          end = next(i for i in range(start, len(workflow)) if workflow[i].startswith('      - name:'))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          Path('/tmp/apply-tv-search.sh').write_text(script)
          PY
          bash /tmp/apply-tv-search.sh
          git diff > tv-search-generated.patch
      - name: Compile and capture diagnostics
        id: compile
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --console=plain clean :app:compileDebugKotlin testDebugUnitTest \
            -PHULK_PORTAL_URL=https://example.invalid > tv-search-build.log 2>&1
          status=$?
          echo "$status" > tv-search-build-status.txt
          tail -n 250 tv-search-build.log > tv-search-build-tail.log
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TV-SEARCH-BUILD-DIAGNOSTICS
          path: |
            tv-search-build.log
            tv-search-build-tail.log
            tv-search-build-status.txt
            tv-search-generated.patch
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
            app/src/main/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicy.kt
            app/src/test/java/sa/hulksa/player/ui/screens/TvSearchFocusPolicyTest.kt
          if-no-files-found: error
          retention-days: 3
      - name: Fail when compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
