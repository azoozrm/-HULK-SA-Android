name: Temporary Compatibility Lab Finalizer

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/quality-lab-import.trigger'
      - '.github/workflows/temp-import-quality-lab.yml'

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final fail-closed lab contracts
        run: |
          set -euo pipefail
          git fetch origin archive/pr57-codex-churn-20260801
          git checkout origin/archive/pr57-codex-churn-20260801 -- \
            .github/workflows/compatibility-lab.yml

          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path('qa/compatibility/run-lab.py')
          runner = runner_path.read_text(encoding='utf-8')
          replacements = {
              '''            if not stable:\n                reason = (\n                    "START_FOCUS_NOT_ESTABLISHED: "\n                    f"expected row-1-primary, observed {initial_target or 'unknown'}"\n                )\n                source = "PRODUCT"\n''': '''            if not stable:\n                reason = (\n                    "START_FOCUS_NOT_ESTABLISHED: "\n                    f"expected a stable supported start target, observed {initial_target or 'unknown'}"\n                )\n                source = "FIXTURE"\n''',
              '''                    if not precondition_established:\n                        reason = f"START_FOCUS_NOT_ESTABLISHED: expected {target}, observed {actual_target}"\n                        source = "PRODUCT"\n''': '''                    if not precondition_established:\n                        reason = f"START_FOCUS_NOT_ESTABLISHED: expected {target}, observed {actual_target}"\n                        source = "FIXTURE"\n''',
              '''                if wrong:\n                    reason = (\n                        "ACTION_CALLBACK_NOT_EXECUTED: callback marker(s) "\n                        f"{', '.join(wrong)} do not match {expected_action}"\n                    )\n                    source = "PRODUCT"\n''': '''                if wrong:\n                    reason = (\n                        "NAVIGATION_TARGET_MISMATCH: callback marker(s) "\n                        f"{', '.join(wrong)} prove a different control received the key instead of {expected_action}"\n                    )\n                    source = "PRODUCT"\n''',
          }
          for old, new in replacements.items():
              count = runner.count(old)
              if count != 1:
                  raise SystemExit(
                      f'BLOCKED: expected one runner contract, found {count}: {old[:80]!r}'
                  )
              runner = runner.replace(old, new)
          runner_path.write_text(runner, encoding='utf-8')

          tests_path = Path('qa/compatibility/tests/test_lab.py')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '\n\nclass AnalyzerTests(unittest.TestCase):\n'
          guards = '''\n    def test_runner_blocks_unknown_start_state_as_fixture(self) -> None:\n        source = (LAB_ROOT / "run-lab.py").read_text(encoding="utf-8")\n        audit = source.split("def _deterministic_download_action_audit", maxsplit=1)[1]\n        start_block = audit.split("if not stable:", maxsplit=1)[1].split("elif path is None:", maxsplit=1)[0]\n        final_block = audit.split("if not precondition_established:", maxsplit=1)[1].split("if reason is None and action is not None:", maxsplit=1)[0]\n        for block in (start_block, final_block):\n            self.assertIn("START_FOCUS_NOT_ESTABLISHED", block)\n            self.assertIn('source = "FIXTURE"', block)\n            self.assertNotIn('source = "PRODUCT"', block)\n\n    def test_runner_classifies_wrong_marker_as_navigation_mismatch(self) -> None:\n        source = (LAB_ROOT / "run-lab.py").read_text(encoding="utf-8")\n        audit = source.split("def _deterministic_download_action_audit", maxsplit=1)[1]\n        block = audit.split("if wrong:", maxsplit=1)[1].split("elif not expected_seen:", maxsplit=1)[0]\n        self.assertIn("NAVIGATION_TARGET_MISMATCH", block)\n        self.assertNotIn("ACTION_CALLBACK_NOT_EXECUTED", block)\n'''
          if 'test_runner_blocks_unknown_start_state_as_fixture' not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit('BLOCKED: test insertion anchor is not unique')
              tests = tests.replace(anchor, guards + anchor)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check

      - name: Install Compatibility Lab dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt

      - name: Validate all affected contracts
        run: |
          set -euo pipefail
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -p 'test_*.py' -v
          python3 -m unittest discover -s qa/quality/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 qa/compatibility/lab_config.py --validate
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh

      - name: Commit tested final lab repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/compatibility/run-lab.py \
            qa/compatibility/tests/test_lab.py \
            .github/workflows/compatibility-lab.yml
          git commit -m 'fix(lab): block invalid starts and classify wrong markers'
          git push origin HEAD:fix/quality-lab-tv-preconditions-20260801
