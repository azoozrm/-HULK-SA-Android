name: Temporary Compatibility Lab Import

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/quality-lab-import.trigger'
      - '.github/workflows/temp-import-quality-lab.yml'
  push:
    branches:
      - fix/quality-lab-tv-preconditions-20260801
    paths:
      - '.github/quality-lab-import.trigger'

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Import compatibility-lab-only repair
        run: |
          set -euo pipefail
          git fetch origin \
            archive/pr57-codex-churn-20260801 \
            ci/adapt-quality-marker-injection-v09320 \
            e18a2c920b55d0bd84e11e4f19d0cab190a718b0
          git checkout origin/archive/pr57-codex-churn-20260801 -- qa/compatibility
          git checkout origin/ci/adapt-quality-marker-injection-v09320 -- \
            qa/compatibility/inject_quality_markers.py \
            qa/compatibility/tests/test_marker_injection.py
          git checkout e18a2c920b55d0bd84e11e4f19d0cab190a718b0 -- \
            qa/compatibility/tests/test_lab.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('qa/compatibility/tests/test_lab.py')
          text = path.read_text(encoding='utf-8')

          def replace_method(source: str, name: str, replacement: str) -> str:
              marker = f'    def {name}('
              if source.count(marker) != 1:
                  raise SystemExit(
                      f'BLOCKED: expected one {name} test, found {source.count(marker)}'
                  )
              start = source.index(marker)
              candidates = [
                  position
                  for position in (
                      source.find('\n    def ', start + len(marker)),
                      source.find('\n\nclass ', start + len(marker)),
                  )
                  if position >= 0
              ]
              if not candidates:
                  raise SystemExit(f'BLOCKED: could not locate end of {name}')
              end = min(candidates)
              return source[:start] + replacement.rstrip() + '\n' + source[end:]

          text = replace_method(
              text,
              'test_tv_focus_sequences_are_page_specific_and_actions_are_isolated',
              '''    def test_tv_focus_sequences_are_page_specific_and_actions_are_isolated(self) -> None:
                  source = (LAB_ROOT / "run-lab.py").read_text(encoding="utf-8")
                  self.assertIn('page == "live"', source)
                  self.assertIn('page == "downloads"', source)
                  self.assertIn("def _deterministic_download_action_audit", source)
                  self.assertIn(
                      "DeviceLab.download_action_audit = _deterministic_download_action_audit",
                      source,
                  )
                  for contract in (
                      '("top-wifi-executes", "toolbar-wifi", "wifi")',
                      '("top-schedule-executes", "toolbar-schedule", "schedule")',
                      '("top-concurrent-executes", "toolbar-concurrent", "concurrent")',
                      'run_check("row-1-pause", "row-1-primary", "pause")',
                      '"row-1-resume"',
                      'restart_page=False',
                      'run_check("delete-row-1-executes", "row-1-cancel", "delete")',
                  ):
                      self.assertIn(contract, source)
                  self.assertIn('"key_events"', source)
                  self.assertIn('"precondition_established"', source)
                  self.assertIn("node_text_with_descendants", source)
              ''',
          )

          text = replace_method(
              text,
              'test_download_fixture_removes_process_owner_records_before_enqueue',
              '''    def test_download_fixture_removes_process_owner_records_before_enqueue(self) -> None:
                  source = (LAB_ROOT / "QaActivity.kt").read_text(encoding="utf-8")
                  self.assertIn("private object QaDownloadHarnessProcessOwner", source)
                  prepare = source.split(
                      "    private fun prepare(context: Context, launchToken: String): QaDownloadHarness",
                      maxsplit=1,
                  )[1].split(
                      "\\n    }\\n}\\n\\nprivate data class QaDownloadHarness",
                      maxsplit=1,
                  )[0]
                  cleanup = "repository.remove(downloadId)"
                  enqueue = "repeat(3) { index ->"
                  self.assertIn("WorkManager can restore a previous debug-fixture worker", prepare)
                  self.assertIn(cleanup, prepare)
                  self.assertIn(enqueue, prepare)
                  self.assertLess(prepare.index(cleanup), prepare.index(enqueue))
              ''',
          )

          text = replace_method(
              text,
              'test_download_action_runner_matches_analyzer_required_ids',
              '''    def test_download_action_runner_matches_analyzer_required_ids(self) -> None:
                  source = (LAB_ROOT / "run-lab.py").read_text(encoding="utf-8")
                  required_ids = (
                      "top-wifi-executes",
                      "top-schedule-executes",
                      "top-concurrent-executes",
                      "row-1-primary",
                      "row-1-pause",
                      "row-1-resume",
                      "row-1-priority",
                      "row-1-priority-executes",
                      "row-1-cancel",
                      "row-2-cancel",
                      "row-2-priority",
                      "row-2-primary",
                      "row-2-pause",
                      "delete-row-1-executes",
                  )
                  for check_id in required_ids:
                      self.assertIn(f'"{check_id}"', source)
                  self.assertNotIn('"cancel-row-1-executes"', source)
              ''',
          )

          text = replace_method(
              text,
              'test_download_action_audit_classifies_unreachable_and_unexecuted_controls',
              '''    def test_download_action_audit_classifies_unreachable_and_unexecuted_controls(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      evidence = root / "focus/landscape/downloads-actions/01-step"
                      evidence.mkdir(parents=True)
                      for name in ("screenshot.png", "ui.xml", "logcat.txt"):
                          (evidence / name).write_bytes(b"x")
                      normalized, findings = analyze_download_actions(
                          root,
                          {"is_tv": True},
                          [
                              {
                                  "orientation": "landscape",
                                  "checks": [
                                      {
                                          "id": "row-1-primary",
                                          "success": False,
                                          "expected_action": None,
                                          "precondition_established": False,
                                          "source": "FIXTURE",
                                          "reason": "START_FOCUS_NOT_ESTABLISHED",
                                          "evidence": {
                                              "screenshot": "focus/landscape/downloads-actions/01-step/screenshot.png",
                                              "xml": "focus/landscape/downloads-actions/01-step/ui.xml",
                                              "logcat": "focus/landscape/downloads-actions/01-step/logcat.txt",
                                          },
                                      },
                                      {
                                          "id": "row-1-pause",
                                          "success": False,
                                          "expected_action": "pause",
                                          "precondition_established": False,
                                          "key_press_confirmed": False,
                                          "source": "FIXTURE",
                                          "reason": "START_FOCUS_NOT_ESTABLISHED",
                                          "evidence": {},
                                      },
                                  ],
                              }
                          ],
                      )
                  self.assertEqual("BLOCKED", normalized[0]["status"])
                  codes = {item["code"] for item in findings}
                  self.assertIn("start_focus_not_established", codes)
                  self.assertIn("missing_mandatory_download_action_evidence", codes)
                  self.assertIn("tv_download_action_unreachable", codes)
                  self.assertIn("tv_download_action_not_executed", codes)
                  self.assertIn("tv_download_row_navigation_incomplete", codes)
                  self.assertTrue(all(item.get("source") != "PRODUCT" for item in findings))
              ''',
          )

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Install Compatibility Lab test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt

      - name: Validate compatibility and repository contracts
        run: |
          set -euo pipefail
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -p 'test_*.py' -v
          python3 -m unittest discover -s qa/quality/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 qa/compatibility/lab_config.py --validate
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh

      - name: Commit isolated compatibility repair
        run: |
          set -euo pipefail
          if git diff --quiet -- qa/compatibility; then
            echo 'No compatibility changes remain to import.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/compatibility
          git commit -m 'fix(lab): restore deterministic TV preconditions and evidence'
          git push origin HEAD:fix/quality-lab-tv-preconditions-20260801
