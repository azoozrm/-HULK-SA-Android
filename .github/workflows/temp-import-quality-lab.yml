name: Temporary Compatibility Lab Import

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/quality-lab-import.trigger'
      - '.github/workflows/temp-import-quality-lab.yml'
  push:
    branches:
      - fix/quality-lab-tv-preconditions-20260801
    paths:
      - '.github/quality-lab-import.trigger'

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Import compatibility-lab-only repair
        run: |
          set -euo pipefail
          git fetch origin archive/pr57-codex-churn-20260801 ci/adapt-quality-marker-injection-v09320
          git checkout origin/archive/pr57-codex-churn-20260801 -- qa/compatibility
          git checkout origin/ci/adapt-quality-marker-injection-v09320 -- \
            qa/compatibility/inject_quality_markers.py \
            qa/compatibility/tests/test_marker_injection.py
          git diff --check

      - name: Install Compatibility Lab test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt

      - name: Validate compatibility and repository contracts
        run: |
          set -euo pipefail
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -p 'test_*.py' -v
          python3 -m unittest discover -s qa/quality/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 qa/compatibility/lab_config.py --validate
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh

      - name: Commit isolated compatibility repair
        run: |
          set -euo pipefail
          if git diff --quiet -- qa/compatibility; then
            echo 'No compatibility changes remain to import.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/compatibility
          git commit -m 'fix(lab): restore deterministic TV preconditions and evidence'
          git push origin HEAD:fix/quality-lab-tv-preconditions-20260801
