name: Compact Landscape Login Fix Beacon

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/compact-landscape-login-fix-beacon.yml'

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  expose-run:
    runs-on: ubuntu-latest
    steps:
      - name: Publish latest compact Login fix run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/apply-compact-landscape-login-fix.yml/runs" \
            -f branch='rebuild/adaptive-ui-compatibility-lab-v2' \
            -f event='push' \
            -f per_page='6' \
            --jq '.workflow_runs[] | "- Run: `\(.id)` | head: `\(.head_sha)` | status: **\(.status)** | conclusion: **\(.conclusion // "pending")**"')"
          test -n "$runs"
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body "## Compact Login validated-run locator\n\n$runs\n\nNo merge or release was performed."
