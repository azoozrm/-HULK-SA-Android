name: PR79 Mobile Layout Polish V2

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-mobile-layout-polish-v2.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: pr79-mobile-layout-polish
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Publish qualification locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='ui/mobile-layout-polish' \
            -f description='Mobile header, hero and navigation repair is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v7
        with:
          ref: fix/v09320-galaxy-landscape-clean
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Apply reported mobile layout repairs
        run: |
          set -euo pipefail
          python3 tools/pr79_mobile_layout_polish.py
          git diff --check
          grep -F 'private val MOBILE_PAGE_GUTTER = 18.dp' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -F '.height(if (isTv) 374.dp else 340.dp)' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -F 'val dockShape = RoundedCornerShape(20.dp)' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -F 'testTag("catalog-header")' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -F 'testTag("page-title")' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt

      - name: Compile and test repaired layouts
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:compileDebugKotlin \
            :app:compileDebugAndroidTestKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug

      - name: Commit verified source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/androidTest/java/sa/hulksa/player/compatibilityv2/AdaptiveMainShellComposeTest.kt
          git commit -m 'fix: polish mobile headers hero and navigation dock'
          git push origin HEAD:fix/v09320-galaxy-landscape-clean

      - name: Publish final qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Mobile layout repair compiled and passed tests'
          else
            state=failure
            description='Mobile layout repair qualification failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='ui/mobile-layout-polish' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
