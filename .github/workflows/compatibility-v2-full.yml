name: HULK SA Compatibility V2 - Full Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v09318-production-host-qualification
    paths:
      - quality/compatibility-v2/run-full.request

permissions:
  contents: read
  statuses: write

concurrency:
  group: compatibility-v2-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-binaries:
    runs-on: ubuntu-latest
    outputs:
      runtime_matrix: ${{ steps.runtime-matrix.outputs.runtime_matrix }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - name: Publish Full Matrix run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='compatibility-v2/full-matrix' \
            -f description="Full Matrix run ${GITHUB_RUN_ID} is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Resolve runtime matrix from the canonical JSON
        id: runtime-matrix
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profiles = json.loads(Path('quality/compatibility-v2/config/device-matrix.json').read_text(encoding='utf-8'))['profiles']
          include = []
          compatibility_class = 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest'
          selectors = {
              'phone-small-api29': ','.join([
                  compatibility_class + '#phoneLauncherStartsRealApplicationAndSurvivesRecreation',
                  compatibility_class + '#phonePortraitLoginFieldsAcceptTypingWithoutCrash',
                  compatibility_class + '#loginFieldsAppearInRequiredResellerOrder',
                  compatibility_class + '#phonePortraitOrientationRestoresAfterLandscapePlayback',
                  compatibility_class + '#explicitManifestComponentStartsInstalledDebugPackage',
                  compatibility_class + '#phoneWindowUsesTransparentEdgeToEdgeSystemBars',
                  compatibility_class + '#visibleApplicationNodesHaveNonZeroBoundsInsideDisplay',
                  compatibility_class + '#capturesFullWindowScreenshotAndHierarchyWithoutCropping',
              ]),
              'phone-short-landscape-api35': ','.join([
                  compatibility_class + '#phoneLauncherStartsRealApplicationAndSurvivesRecreation',
                  compatibility_class + '#loginFieldsAppearInRequiredResellerOrder',
                  compatibility_class + '#explicitManifestComponentStartsInstalledDebugPackage',
                  compatibility_class + '#shortLandscapePhoneCanScrollToPrimaryLoginActions',
                  compatibility_class + '#visibleApplicationNodesHaveNonZeroBoundsInsideDisplay',
                  compatibility_class + '#capturesFullWindowScreenshotAndHierarchyWithoutCropping',
              ]),
          }
          for profile in profiles:
              if profile['id'] == 'tv-4k-api36':
                  continue
              include.append({
                  'id': profile['id'],
                  'api': profile['api'],
                  'target': profile['target'],
                  'profile': 'tv_1080p' if profile['target'] == 'android-tv' else 'pixel_2',
                  'width': profile['width_px'],
                  'height': profile['height_px'],
                  'density': profile['density_dpi'],
                  'font_scale': profile['font_scale'],
                  'rotation': 0,
                  'locale': profile['locale'],
                  'cutout_mode': profile.get('cutout_mode', 'none'),
                  'navigation_mode': profile.get('navigation_mode', 'default'),
                  'expected_device_class': profile['expected_device_class'],
                  'expected_input_mode': profile['expected_input_mode'],
                  'expected_width_class': profile['expected_width_class'],
                  'expected_height_class': profile['expected_height_class'],
                  'expected_orientation': profile['expected_orientation'],
                  'test_class': selectors.get(profile['id'], compatibility_class),
              })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('runtime_matrix=' + json.dumps({'include': include}, separators=(',', ':')) + '\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Static, unit and test binaries
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 quality/compatibility-v2/static_validate.py --repo-root . --out build/compatibility-v2/static
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          bash -n quality/compatibility-v2/prepare_avd_profile.sh
          bash -n quality/compatibility-v2/collect_runtime_evidence.sh
          bash -n quality/compatibility-v2/run_runtime_profile.sh
          bash -n quality/compatibility-v2/run_stable_emulator_profile.sh
          ./gradlew --no-daemon --console=plain \
            clean :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p build/compatibility-v2/binaries
          cp app/build/outputs/apk/debug/app-debug.apk build/compatibility-v2/binaries/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/compatibility-v2/binaries/
          cp -a build/compatibility-v2/static build/compatibility-v2/binaries/
          (
            cd build/compatibility-v2/binaries
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-BINARIES-${{ github.run_id }}
          path: build/compatibility-v2/binaries/
          if-no-files-found: error
          retention-days: 14

  runtime-matrix:
    needs: build-test-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-test-binaries.outputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-BINARIES-${{ github.run_id }}
          path: build/compatibility-v2/binaries

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]] && sudo chmod a+rw /dev/kvm && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'KVM_AVAILABLE=true' >> "$GITHUB_ENV"
            ls -l /dev/kvm
          else
            echo 'KVM_AVAILABLE=false' >> "$GITHUB_ENV"
            echo 'KVM is unavailable on this hosted runner; emulator boot and evidence remain mandatory.'
          fi

      - name: Run real application instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -no-snapshot-save -skin ${{ matrix.width }}x${{ matrix.height }}
          pre-emulator-launch-script: bash quality/compatibility-v2/prepare_avd_profile.sh '${{ matrix.width }}' '${{ matrix.height }}' '${{ matrix.density }}' 'test'
          script: bash quality/compatibility-v2/run_runtime_profile.sh '${{ matrix.id }}' '${{ matrix.width }}' '${{ matrix.height }}' '${{ matrix.density }}' '${{ matrix.font_scale }}' '${{ matrix.rotation }}' '${{ matrix.locale }}' '${{ matrix.test_class }}' 'build/compatibility-v2/runtime/${{ matrix.id }}' '${{ matrix.cutout_mode }}' '${{ matrix.navigation_mode }}' '${{ matrix.expected_device_class }}' '${{ matrix.expected_input_mode }}' '${{ matrix.expected_width_class }}' '${{ matrix.expected_height_class }}' '${{ matrix.expected_orientation }}'

      - name: Enforce runtime evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root 'build/compatibility-v2/runtime/${{ matrix.id }}' \
            --out 'build/compatibility-v2/runtime/${{ matrix.id }}/gate'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-RUNTIME-${{ matrix.id }}-${{ github.run_id }}
          path: build/compatibility-v2/runtime/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 21

  runtime-tv-4k:
    needs: build-test-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-BINARIES-${{ github.run_id }}
          path: build/compatibility-v2/binaries
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]] && sudo chmod a+rw /dev/kvm && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'KVM_AVAILABLE=true' >> "$GITHUB_ENV"
            ls -l /dev/kvm
          else
            echo 'KVM_AVAILABLE=false' >> "$GITHUB_ENV"
            echo 'KVM is unavailable on this hosted runner; emulator boot and evidence remain mandatory.'
          fi

      - name: Install the canonical Android TV image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'system-images;android-36;android-tv;x86_64'

      - name: Run 4K instrumentation after stable ADB readiness
        run: |
          bash quality/compatibility-v2/run_stable_emulator_profile.sh \
            'tv-4k-api36' \
            'build/compatibility-v2/runtime/tv-4k-api36'

      - name: Enforce 4K runtime evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root 'build/compatibility-v2/runtime/tv-4k-api36' \
            --out 'build/compatibility-v2/runtime/tv-4k-api36/gate'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-RUNTIME-tv-4k-api36-${{ github.run_id }}
          path: build/compatibility-v2/runtime/tv-4k-api36/
          if-no-files-found: error
          retention-days: 21

  publish-full-matrix-result:
    if: always()
    needs:
      - build-test-binaries
      - runtime-matrix
      - runtime-tv-4k
    runs-on: ubuntu-latest
    steps:
      - name: Publish final Full Matrix status
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-test-binaries.result }}
          MATRIX_RESULT: ${{ needs.runtime-matrix.result }}
          TV_4K_RESULT: ${{ needs.runtime-tv-4k.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Full Matrix run ${GITHUB_RUN_ID} failed"
          if [[ "$BUILD_RESULT" == success && "$MATRIX_RESULT" == success && "$TV_4K_RESULT" == success ]]; then
            state=success
            description="Full Matrix run ${GITHUB_RUN_ID} passed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='compatibility-v2/full-matrix' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ "$state" == success ]]
