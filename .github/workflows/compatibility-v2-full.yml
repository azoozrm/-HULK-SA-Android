name: HULK SA Compatibility V2 - Full Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-v2-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Static, unit and test binaries
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality/compatibility-v2/tests -p 'test_*.py' -v
          python3 quality/compatibility-v2/static_validate.py --repo-root . --out build/compatibility-v2/static
          bash -n quality/compatibility-v2/configure_emulator_profile.sh
          bash -n quality/compatibility-v2/collect_runtime_evidence.sh
          bash -n quality/compatibility-v2/run_runtime_profile.sh
          ./gradlew --no-daemon --console=plain \
            clean :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          mkdir -p build/compatibility-v2/binaries
          cp app/build/outputs/apk/debug/app-debug.apk build/compatibility-v2/binaries/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/compatibility-v2/binaries/
          cp -a build/compatibility-v2/static build/compatibility-v2/binaries/
          (
            cd build/compatibility-v2/binaries
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-BINARIES-${{ github.run_id }}
          path: build/compatibility-v2/binaries/
          if-no-files-found: error
          retention-days: 14

  runtime-matrix:
    needs: build-test-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: phone-small-api29
            api: 29
            target: google_apis
            profile: pixel_2
            width: 360
            height: 640
            density: 160
            font_scale: '1.0'
            rotation: 0
            locale: ar-SA
          - id: phone-medium-api35
            api: 35
            target: google_apis
            profile: pixel_2
            width: 1080
            height: 2340
            density: 420
            font_scale: '1.0'
            rotation: 0
            locale: ar-SA
          - id: phone-landscape-font150-api35
            api: 35
            target: google_apis
            profile: pixel_2
            width: 2340
            height: 1080
            density: 420
            font_scale: '1.5'
            rotation: 0
            locale: ar-SA
          - id: tablet-600-portrait-api35
            api: 35
            target: google_apis
            profile: pixel_2
            width: 1200
            height: 1920
            density: 240
            font_scale: '1.3'
            rotation: 0
            locale: ar-SA
          - id: tablet-expanded-landscape-api35
            api: 35
            target: google_apis
            profile: pixel_2
            width: 2560
            height: 1600
            density: 320
            font_scale: '1.0'
            rotation: 0
            locale: en-US
          - id: tv-logical-960x540-api36
            api: 36
            target: android-tv
            profile: tv_1080p
            width: 960
            height: 540
            density: 160
            font_scale: '1.0'
            rotation: 0
            locale: ar-SA
          - id: tv-720p-api36
            api: 36
            target: android-tv
            profile: tv_1080p
            width: 1280
            height: 720
            density: 213
            font_scale: '1.0'
            rotation: 0
            locale: ar-SA
          - id: tv-1080p-api36
            api: 36
            target: android-tv
            profile: tv_1080p
            width: 1920
            height: 1080
            density: 320
            font_scale: '1.0'
            rotation: 0
            locale: ar-SA

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: HULK-SA-COMPATIBILITY-V2-BINARIES-${{ github.run_id }}
          path: build/compatibility-v2/binaries

      - name: Configure Linux KVM when available
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]] && sudo chmod a+rw /dev/kvm && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'KVM_AVAILABLE=true' >> "$GITHUB_ENV"
            ls -l /dev/kvm
          else
            echo 'KVM_AVAILABLE=false' >> "$GITHUB_ENV"
            echo 'KVM is unavailable on this hosted runner; emulator boot and evidence remain mandatory.'
          fi

      - name: Run real application instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -skin ${{ matrix.width }}x${{ matrix.height }}
          script: bash quality/compatibility-v2/run_runtime_profile.sh '${{ matrix.id }}' '${{ matrix.width }}' '${{ matrix.height }}' '${{ matrix.density }}' '${{ matrix.font_scale }}' '${{ matrix.rotation }}' '${{ matrix.locale }}' 'sa.hulksa.player.compatibilityv2.CompatibilityV2InstrumentationTest' 'build/compatibility-v2/runtime/${{ matrix.id }}'

      - name: Enforce runtime evidence
        if: always()
        run: |
          set -euo pipefail
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope runtime \
            --evidence-root 'build/compatibility-v2/runtime/${{ matrix.id }}' \
            --out 'build/compatibility-v2/runtime/${{ matrix.id }}/gate'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-COMPATIBILITY-V2-RUNTIME-${{ matrix.id }}-${{ github.run_id }}
          path: build/compatibility-v2/runtime/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 21
