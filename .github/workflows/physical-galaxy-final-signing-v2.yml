name: HULK SA Final Galaxy Source Signing V2

on:
  push:
    branches:
      - rebuild/adaptive-ui-compatibility-lab-v2
    paths:
      - '.github/workflows/physical-galaxy-final-signing-v2.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  HULK_PORTAL_URL: http://3162356.xyz:8080
  HULK_CONFIG_URL: ''

jobs:
  production-signing:
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/adaptive-ui-compatibility-lab-v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate protected production inputs
        env:
          HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
          HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
          HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
          HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$HULK_RELEASE_KEYSTORE_BASE64"
          test -n "$HULK_RELEASE_KEY_ALIAS"
          test -n "$HULK_RELEASE_STORE_PASSWORD"
          test -n "$HULK_RELEASE_KEY_PASSWORD"
          test -n "$EXPECTED_CERT_SHA256"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hulk-release.jks"
          chmod 600 "$RUNNER_TEMP/hulk-release.jks"
          test -s "$RUNNER_TEMP/hulk-release.jks"
          echo "EXPECTED_CERT_SHA256=$EXPECTED_CERT_SHA256" >> "$GITHUB_ENV"

      - name: Build and verify final production APK and AAB
        env:
          HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
          HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
          HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -rf build/final-galaxy-signed
          mkdir -p build/final-galaxy-signed
          grep -F 'Box(Modifier.weight(1f).clipToBounds())' \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          ./gradlew --no-daemon --console=plain \
            -PHULK_RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/hulk-release.jks" \
            -PHULK_RELEASE_KEY_ALIAS="$HULK_RELEASE_KEY_ALIAS" \
            -PHULK_RELEASE_STORE_PASSWORD="$HULK_RELEASE_STORE_PASSWORD" \
            -PHULK_RELEASE_KEY_PASSWORD="$HULK_RELEASE_KEY_PASSWORD" \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL" \
            clean :app:assembleRelease :app:bundleRelease

          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$apk"
          test -s "$aab"
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'

          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" build/final-galaxy-signed/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh "$aab" "$EXPECTED_CERT_SHA256" build/final-galaxy-signed/AAB-SIGNING.txt
          apksigner verify --verbose --print-certs "$apk" > build/final-galaxy-signed/APKSIGNER-VERBOSE.txt
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report build/final-galaxy-signed/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py "$aab" --require-native-libs --report build/final-galaxy-signed/AAB-ARCHITECTURES.md

          cp "$apk" build/final-galaxy-signed/HULK-SA-v0.9.3.20-SIGNED.apk
          cp "$aab" build/final-galaxy-signed/HULK-SA-v0.9.3.20-SIGNED.aab
          printf 'Application ID: sa.hulksa.player\nVersion code: 64\nVersion name: 0.9.3.20\nWorkflow head: %s\nQualified application source: 617985f459f38a58346bbc8c33f85b786a9eaa90\nLandscape qualification run: 30773067624\nLandscape artifact: 8841243517\n' \
            "$GITHUB_SHA" > build/final-galaxy-signed/PACKAGE-IDENTITY.txt
          (
            cd build/final-galaxy-signed
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope release --evidence-root build/final-galaxy-signed \
            --out build/final-galaxy-signed/gate

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: HULK-SA-FINAL-GALAXY-SIGNED-${{ github.run_id }}
          path: build/final-galaxy-signed/
          if-no-files-found: error
          retention-days: 21

      - name: Report signing result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body $'## Final direct production signing V2\n\n- Run: `'$GITHUB_RUN_ID'`\n- Workflow head: `'$GITHUB_SHA'`\n- Qualified application source: `617985f459f38a58346bbc8c33f85b786a9eaa90`\n- Result: **'$JOB_STATUS'**\n- Artifact: `HULK-SA-FINAL-GALAXY-SIGNED-'$GITHUB_RUN_ID'`\n\nNo release, merge, Drive upload, or publication was performed.'
