name: Build HULK SA v0.7.1 Player UX

on:
  push:
    branches:
      - player-v070
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v071:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Prepare HULK SA v0.7.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          cp -a source/. project/

          REPOSITORY="project/app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt"
          grep -q '^import kotlinx.coroutines.isActive$' "$REPOSITORY" || sed -i '/^import kotlinx.coroutines.ensureActive$/a import kotlinx.coroutines.isActive' "$REPOSITORY"
          sed -i 's/raise RuntimeError(f"Expected block not found in {path}")/print(f"WARNING: expected block not found in {path}"); return/' tools/apply_v063_patch.py
          python3 tools/apply_v063_patch.py project
          python3 tools/apply_v064_patch.py project

          base64 --decode .payload/v065/apply_v065_targeted.py.xz.b64 | xz --decompress > /tmp/apply_v065.py
          echo "991eecdf79de0ce0c864e073035fb2fcdce9dce2a7470cce01851702d293475c  /tmp/apply_v065.py" | sha256sum --check
          python3 /tmp/apply_v065.py project
          python3 .payload/v065/apply_v065_hotfix.py project

          cat .payload/v070/files.part-* | base64 --decode > /tmp/v070-files.tar.gz
          echo "228c3417e8c4d0a6e678b8e09e72738357addc40a0b95202df3918ac24c5cbc9  /tmp/v070-files.tar.gz" | sha256sum --check
          tar -xzf /tmp/v070-files.tar.gz -C project

          cat .payload/v071/files.part-* | base64 --decode > /tmp/v071-files.tar.gz
          echo "78aaed9685a1603c6fe1ae7db671644e5b4c6a5b3d55cdef71ed412634806407  /tmp/v071-files.tar.gz" | sha256sum --check
          tar -xzf /tmp/v071-files.tar.gz -C project

          grep -q 'versionName = "0.7.1"' project/app/build.gradle.kts
          grep -q 'fun DetailsNavigationDrawer' project/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -q 'HulkTextField' project/app/src/main/java/sa/hulksa/player/ui/screens/PlayerScreen.kt
          grep -q 'unlockFocus' project/app/src/main/java/sa/hulksa/player/ui/screens/PlayerScreen.kt
          grep -q 'resumeFocus' project/app/src/main/java/sa/hulksa/player/ui/screens/PlayerScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore approved HULK SA branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/res/font project/app/src/main/res/drawable-nodpi
          FONT_BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic"
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Regular.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_regular.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Medium.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_medium.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-SemiBold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_semibold.ttf
          curl -fL --retry 5 --retry-delay 2 "$FONT_BASE/IBMPlexSansArabic-Bold.ttf" -o project/app/src/main/res/font/ibm_plex_sans_arabic_bold.ttf
          if ! curl -fL --retry 5 --retry-delay 2 "https://hulksa.com/assets/hulk-official-logo.webp" -o /tmp/hulk-logo.webp; then
            cat .payload/assets/logo.part-* | base64 --decode > /tmp/hulk-logo.webp
          fi
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/hulk_sa_logo.webp
          cp /tmp/hulk-logo.webp project/app/src/main/res/drawable-nodpi/ic_banner.webp
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('project/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('@mipmap/ic_launcher_round', '@drawable/hulk_sa_logo')
          text = text.replace('@mipmap/ic_launcher', '@drawable/hulk_sa_logo')
          manifest.write_text(text)
          PY

      - name: Test and build v0.7.1
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd project
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PHULK_PORTAL_URL=http://3162356.xyz:8080 --stacktrace 2>&1 | tee ../v071-build.log
          STATUS=${PIPESTATUS[0]}
          cd ..
          if [ "$STATUS" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "marker=HULK-V071-BUILD_OK" >> "$GITHUB_OUTPUT"
          else
            ERROR="$(grep -E '(^e: | error: |FAILURE:)' v071-build.log | head -n 1)"
            [ -n "$ERROR" ] || ERROR="$(tail -n 1 v071-build.log)"
            SAFE="$(printf '%s' "$ERROR" | sed 's/[^A-Za-z0-9._-]/_/g' | cut -c1-180)"
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "marker=HULK-V071-${SAFE}" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Prepare v0.7.1 APK
        if: steps.build.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/HULK-SA-v0.7.1-player-ux-hotfix-beta.apk
          sha256sum output/HULK-SA-v0.7.1-player-ux-hotfix-beta.apk | tee output/SHA256.txt

      - name: Upload v0.7.1 APK
        if: steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.7.1-player-ux-hotfix-beta
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification marker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.marker }}
          path: v071-build.log
          if-no-files-found: error
          retention-days: 3
