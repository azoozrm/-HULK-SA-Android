name: PR57 Product Integration

on:
  push:
    branches:
      - integration/pr57-quality-lab-product-strict
    paths:
      - '.github/workflows/pr57-product-integration.yml'

permissions:
  contents: write

concurrency:
  group: pr57-product-integration
  cancel-in-progress: false

jobs:
  integrate-product-only:
    name: Preserve Quality Lab and import PR57 product fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/pr57-quality-lab-product-strict
          fetch-depth: 0

      - name: Import only approved product and audit files
        run: |
          set -euo pipefail
          archive_ref='archive/pr57-before-quality-lab-integration'
          git fetch --no-tags origin \
            "$archive_ref:refs/remotes/origin/$archive_ref"

          files=(
            'app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt'
            'app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt'
            'app/src/test/java/sa/hulksa/player/data/DownloadTransportPolicyTest.kt'
            'app/src/test/java/sa/hulksa/player/ui/screens/TvLayoutPolicyTest.kt'
            'docs/project-audit/KNOWN-ISSUES.md'
            'docs/project-audit/PROJECT-STATE.md'
            'docs/project-audit/RELEASE-SIGNING-QUALIFICATION.md'
            'docs/project-audit/TEST-STRATEGY.md'
            'docs/project-audit/V09318-HOST-SIZE-RESCUE.md'
            'docs/project-audit/V09319-RUNTIME-TV-DOWNLOAD-RESCUE.md'
            'docs/project-audit/V09320-PHYSICAL-TV-DOWNLOAD-RESCUE.md'
            'qa/qualification/v0.9.3.20-qualification-trigger.md'
          )

          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "refs/remotes/origin/$archive_ref:$path" > "$path"
            test -s "$path"
            echo "IMPORTED: $path"
          done

      - name: Rebuild canonical source manifest from the merged tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          manifest = Path('qa/canonical/canonical-source.sha256')
          paths = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              raw = raw.strip()
              if not raw:
                  continue
              _, path = raw.split(maxsplit=1)
              paths.append(path)

          paths.extend(
              [
                  'app/src/test/java/sa/hulksa/player/data/DownloadTransportPolicyTest.kt',
                  'app/src/test/java/sa/hulksa/player/ui/screens/TvLayoutPolicyTest.kt',
              ]
          )
          paths = sorted(set(paths))

          lines = []
          for name in paths:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f'FAIL: canonical manifest path is missing: {name}')
              lines.append(f'{sha256(path.read_bytes()).hexdigest()}  {name}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'PASS: regenerated canonical manifest for {len(paths)} files')
          PY

      - name: Prove containment and approved branding integrity
        run: |
          set -euo pipefail
          baseline='78dbb8c6ea0b45d9156599fb758f6b2c3806b973'

          git diff --quiet "$baseline" -- \
            '.github/workflows/compatibility-lab.yml' \
            '.github/workflows/quality-lab-self-validation.yml' \
            '.github/workflows/quality-nightly.yml' \
            '.github/workflows/quality-pr-intelligence.yml' \
            '.github/workflows/quality-pr.yml' \
            '.github/workflows/quality-release.yml' \
            '.github/workflows/quality-ui.yml' \
            'qa/compatibility' \
            'qa/quality' \
            'app/src/androidTest'

          approved='2704350ef016a65733ed8eb89cd2d006a8d001c7139a0a535526a780d9691b9e'
          test "$(sha256sum app/src/main/res/drawable-nodpi/hulk_sa_logo.webp | awk '{print $1}')" = "$approved"
          test "$(sha256sum app/src/main/res/drawable-nodpi/ic_banner.webp | awk '{print $1}')" = "$approved"

          grep -Fq 'versionCode = 64' app/build.gradle.kts
          grep -Fq 'versionName = "0.9.3.20"' app/build.gradle.kts
          grep -Fq 'ANDROIDX_TEST_ORCHESTRATOR' app/build.gradle.kts
          grep -Fq 'DOWNLOAD_RANGE_CHUNK_BYTES' \
            app/src/main/java/sa/hulksa/player/data/DownloadRepository.kt
          grep -Fq 'screenWidthDp / 32' \
            app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          git diff --check
          echo 'PASS: Quality Lab, product scope, runtime version and approved logo are contained'

      - name: Commit the atomic product integration
        run: |
          set -euo pipefail
          rm '.github/workflows/pr57-product-integration.yml'
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate v0.9.3.20 with merged quality lab'
          git push origin HEAD:integration/pr57-quality-lab-product-strict
