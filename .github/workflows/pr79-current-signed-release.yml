name: PR79 Current Production Signed Release

on:
  push:
    branches:
      - fix/v09320-galaxy-landscape-clean
    paths:
      - .github/workflows/pr79-current-signed-release.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr79-current-production-signed
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 70
    env:
      HULK_RELEASE_KEYSTORE_BASE64: ${{ secrets.HULK_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS: ${{ secrets.HULK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD: ${{ secrets.HULK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD: ${{ secrets.HULK_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.HULK_RELEASE_CERT_SHA256 }}
      HULK_PORTAL_URL: http://3162356.xyz:8080
      HULK_CONFIG_URL: ''

    steps:
      - name: Publish signed release run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='release/current-production-signed' \
            -f description='Production-signed APK build is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate protected signing inputs
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$HULK_RELEASE_KEYSTORE_BASE64" ]] || missing+=(HULK_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_ALIAS" ]] || missing+=(HULK_RELEASE_KEY_ALIAS)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_STORE_PASSWORD" ]] || missing+=(HULK_RELEASE_STORE_PASSWORD)
          [[ -n "$ORG_GRADLE_PROJECT_HULK_RELEASE_KEY_PASSWORD" ]] || missing+=(HULK_RELEASE_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERT_SHA256" ]] || missing+=(HULK_RELEASE_CERT_SHA256)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Missing protected signing inputs: %s\n' "${missing[*]}" >&2
            exit 2
          fi

      - name: Materialize ephemeral production keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hulk-sa-release.jks"
          printf '%s' "$HULK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ORG_GRADLE_PROJECT_HULK_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build current production-signed APK and AAB
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            clean :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL" \
            -PHULK_CONFIG_URL="$HULK_CONFIG_URL"
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signer package version and architectures
        run: |
          set -euo pipefail
          mkdir -p signed-release-artifacts
          apk='app/build/outputs/apk/release/app-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test "$(apkanalyzer manifest application-id "$apk")" = 'sa.hulksa.player'
          test "$(apkanalyzer manifest version-code "$apk")" = '64'
          test "$(apkanalyzer manifest version-name "$apk")" = '0.9.3.20'
          bash tools/verify-apk-signing.sh "$apk" "$EXPECTED_CERT_SHA256" signed-release-artifacts/APK-SIGNING.txt
          bash tools/verify-aab-signing.sh "$aab" "$EXPECTED_CERT_SHA256" signed-release-artifacts/AAB-SIGNING.txt
          python3 tools/verify-android-architectures.py "$apk" --require-native-libs --report signed-release-artifacts/APK-ARCHITECTURES.md
          python3 tools/verify-android-architectures.py "$aab" --require-native-libs --report signed-release-artifacts/AAB-ARCHITECTURES.md
          printf 'Application ID: sa.hulksa.player\nVersion code: 64\nVersion name: 0.9.3.20\n' > signed-release-artifacts/PACKAGE-IDENTITY.txt
          cp "$apk" signed-release-artifacts/HULK-SA-v0.9.3.20.apk
          cp "$aab" signed-release-artifacts/HULK-SA-v0.9.3.20.aab
          (
            cd signed-release-artifacts
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          python3 quality/compatibility-v2/evidence_gate.py \
            --scope release \
            --evidence-root signed-release-artifacts \
            --out signed-release-artifacts/gate

      - uses: actions/upload-artifact@v7
        with:
          name: HULK-SA-CURRENT-PRODUCTION-SIGNED-${{ github.run_id }}
          path: signed-release-artifacts/
          if-no-files-found: error
          retention-days: 21

      - name: Publish final signed release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='Production-signed APK verified successfully'
          else
            state=failure
            description='Production-signed APK build or verification failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='release/current-production-signed' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
