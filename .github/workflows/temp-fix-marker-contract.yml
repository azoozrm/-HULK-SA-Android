name: Temporary Marker Contract Fix

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/workflows/temp-fix-marker-contract.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bind workflow to the current strict marker contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/compatibility-lab.yml')
          text = path.read_text(encoding='utf-8')
          old = "assert report['replacement_count'] == 28"
          new = "assert report['replacement_count'] == 13"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'BLOCKED: expected exactly two stale marker-count assertions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Validate injector and prepared debug checkout
        run: |
          set -euo pipefail
          python3 -m unittest qa.compatibility.tests.test_marker_injection -v
          bash qa/compatibility/prepare-project.sh "$RUNNER_TEMP/project"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path(__import__('os').environ['RUNNER_TEMP'])
              .joinpath('project/app/src/debug/quality-marker-injection.json')
              .read_text(encoding='utf-8')
          )
          assert report['schema_version'] == 1
          assert report['replacement_count'] == 13
          assert len(report['replacements']) == 13
          assert report['original_sha256'] != report['instrumented_sha256']
          assert report['markers']
          print('PASS: workflow and prepared artifact use the same strict 13-replacement contract')
          PY

      - name: Commit validated marker contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/compatibility-lab.yml
          git commit -m 'fix(ci): align lab marker contract with current source shape'
          git push origin HEAD:fix/quality-lab-tv-preconditions-20260801
