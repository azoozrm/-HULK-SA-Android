name: Apply home favorites cache fix

on:
  push:
    branches: [pr-home-favorites-cache-v09317]
    paths: ['.github/workflows/apply-home-favorites-cache.yml']
  pull_request:
    branches: [phase-3-v0.9.3.0-adaptive-foundation]
    paths: ['.github/workflows/apply-home-favorites-cache.yml']

permissions:
  contents: write

concurrency:
  group: hulk-sa-home-favorites-cache
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HULK_PORTAL_URL: https://example.invalid

    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr-home-favorites-cache-v09317
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v4

      - name: Install Android build SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Include favorites in home snapshot identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt')
          text = path.read_text(encoding='utf-8')

          old_condition = '''            homeLiveCatalog === liveCatalog &&
              homeHistory === state.history
          '''.replace('          ', '')
          new_condition = '''            homeLiveCatalog === liveCatalog &&
              homeHistory === state.history &&
              homeFavorites === state.favorites
          '''.replace('          ', '')
          if text.count(old_condition) != 1:
              raise SystemExit(f'Expected one home cache condition, found {text.count(old_condition)}')
          text = text.replace(old_condition, new_condition, 1)

          old_assignment = '''            homeLiveCatalog = liveCatalog
              homeHistory = state.history
              cachedHome = snapshot
          '''.replace('          ', '')
          new_assignment = '''            homeLiveCatalog = liveCatalog
              homeHistory = state.history
              homeFavorites = state.favorites
              cachedHome = snapshot
          '''.replace('          ', '')
          if text.count(old_assignment) != 1:
              raise SystemExit(f'Expected one home cache assignment, found {text.count(old_assignment)}')
          text = text.replace(old_assignment, new_assignment, 1)
          path.write_text(text, encoding='utf-8')
          PY

          mkdir -p app/src/test/java/sa/hulksa/player/ui/screens
          cat > app/src/test/java/sa/hulksa/player/ui/screens/HomeContentCacheTest.kt <<'KOTLIN'
          package sa.hulksa.player.ui.screens

          import org.junit.Assert.assertNotSame
          import org.junit.Assert.assertSame
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import sa.hulksa.player.HulkUiState
          import sa.hulksa.player.model.Catalog
          import sa.hulksa.player.model.ContentItem
          import sa.hulksa.player.model.ContentType

          class HomeContentCacheTest {
              @Test
              fun changingFavoritesInvalidatesPersonalizedHomeSnapshot() {
                  val movieCatalog = Catalog(
                      categories = emptyList(),
                      items = listOf(
                          movie(id = 1, name = "Action", categoryId = "action", rating = "8.0", genre = "Action"),
                          movie(id = 2, name = "Drama Favorite", categoryId = "drama", rating = "7.0", genre = "Drama"),
                          movie(id = 3, name = "More Drama", categoryId = "drama", rating = "6.0", genre = "Drama"),
                      ),
                  )
                  val initialState = HulkUiState(
                      catalogs = mapOf(ContentType.MOVIE to movieCatalog),
                      favorites = emptySet(),
                  )
                  val store = NavigationMemoryStore()

                  val initialSnapshot = store.homeContent(initialState)
                  val favoritedState = initialState.copy(favorites = setOf("MOVIE:2"))
                  val personalizedSnapshot = store.homeContent(favoritedState)

                  assertNotSame(initialSnapshot, personalizedSnapshot)
                  assertTrue(personalizedSnapshot.becauseYouWatched.any { it.categoryId == "drama" })
                  assertSame(personalizedSnapshot, store.homeContent(favoritedState))
              }

              private fun movie(
                  id: Int,
                  name: String,
                  categoryId: String,
                  rating: String,
                  genre: String,
              ): ContentItem = ContentItem(
                  id = id,
                  name = name,
                  categoryId = categoryId,
                  type = ContentType.MOVIE,
                  posterUrl = null,
                  rating = rating,
                  year = null,
                  containerExtension = null,
                  genre = genre,
              )
          }
          KOTLIN

          git diff --check
          grep -Fq 'homeFavorites === state.favorites' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt
          grep -Fq 'homeFavorites = state.favorites' app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt

      - name: Full canonical qualification
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -x gradlew
          test -d app/src/main
          test ! -e app/src/main/java/sa/hulksa/player/qa
          test ! -e project/app/src/main

          ./gradlew --no-daemon --console=plain \
            clean :app:compileDebugKotlin testDebugUnitTest \
            :app:assembleDebug :app:bundleDebug \
            :app:lintDebug \
            :app:assembleRelease :app:bundleRelease \
            -PHULK_PORTAL_URL="$HULK_PORTAL_URL"

          count=0
          while IFS= read -r -d '' archive; do
            python3 tools/verify-android-architectures.py "$archive" --require-native-libs
            count=$((count + 1))
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          test "$count" -ge 4

      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt \
            app/src/test/java/sa/hulksa/player/ui/screens/HomeContentCacheTest.kt
          git diff --cached --check
          git commit -m 'fix: invalidate home recommendations when favorites change'
          git push origin HEAD:pr-home-favorites-cache-v09317
