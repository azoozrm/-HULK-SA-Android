name: HULK SA Physical Galaxy V2 Report

on:
  workflow_run:
    workflows:
      - HULK SA Physical Galaxy Final Qualification V2
    types:
      - completed

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.head_branch == 'rebuild/adaptive-ui-compatibility-lab-v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report Galaxy V2 result to PR 78
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" --body "## Physical Galaxy V2 qualification completed\n\n- Run: \`$RUN_ID\`\n- Head: \`$RUN_HEAD\`\n- Overall result: **$RUN_RESULT**\n\nThe result is not accepted until the runtime and signed artifacts are opened and inspected. No merge or release was performed."
