name: Diagnose HULK SA v0.9.1.6

on:
  pull_request:
    branches:
      - v0913-build-base
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct current source and apply hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            rm -rf project source-artifact.zip source-artifact diagnostic-output
            mkdir -p project source-artifact diagnostic-output
            curl -fL --retry 5 --retry-delay 2 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8581493204/zip" -o source-artifact.zip
            unzip -q source-artifact.zip -d source-artifact
            tar -xzf source-artifact/HULK-SA-v0.9.1-current-source.tar.gz -C project
            cat .payload/v0911-patch/part-* | base64 --decode > /tmp/v0911-direct.patch.gz
            echo "566ddebe34fc136ae859db5b98032588d835946d1bc8fbbee6fedbf5000a2c9f  /tmp/v0911-direct.patch.gz" | sha256sum --check
            gzip -dc /tmp/v0911-direct.patch.gz > /tmp/v0911-direct.patch
            (cd project && patch -p1 < /tmp/v0911-direct.patch)
            python3 tools/apply-v0912.py project
            python3 tools/apply-v0913.py project
            python3 tools/apply-v0914-fixed.py project
            python3 tools/apply-v0915.py project
            cp project/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt diagnostic-output/MainShellScreen-before-v0916.kt
            python3 tools/apply-v0916.py project
            cp project/app/src/main/java/sa/hulksa/player/ui/screens/MainShellScreen.kt diagnostic-output/MainShellScreen-after-v0916.kt
            cp project/app/build.gradle.kts diagnostic-output/app-build.gradle.kts
            tar -czf diagnostic-output/HULK-SA-v0.9.1.6-transformed-source.tar.gz -C project .
          } 2>&1 | tee diagnostic-output/diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HULK-V0916-DIAGNOSTIC
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 3
