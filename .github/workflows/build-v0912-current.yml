name: Build HULK SA v0.9.1.10 Isolated

on:
  pull_request:
    branches:
      - v0913-build-base
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build current v0.9.1.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build-v0912-current.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HULK-SA-v0.9.1.10-current-beta
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Pack reconstructed source
        if: always()
        run: |
          if [ -d project ]; then tar -czf HULK-SA-v0.9.1.10-reconstructed-source.tar.gz -C project .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HULK-SA-v0.9.1.10-reconstructed-source
          path: HULK-SA-v0.9.1.10-reconstructed-source.tar.gz
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HULK-V09110-BUILD-LOG
          path: v09110-build.log
          if-no-files-found: ignore
          retention-days: 3
