name: Export HULK SA v0.9.1.7 Current Source

on:
  pull_request:
    branches:
      - v0913-build-base
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/export-v0917-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HULK-SA-v0.9.1.7-current-source
          path: export/
          if-no-files-found: error
          retention-days: 3
