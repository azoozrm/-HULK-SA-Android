name: Temporary Lab Supported Start Fix

on:
  pull_request:
    branches:
      - phase-3-v0.9.3.0-adaptive-foundation
    paths:
      - '.github/lab-supported-start.trigger'
      - '.github/workflows/temp-fix-lab-supported-start.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/quality-lab-tv-preconditions-20260801
          fetch-depth: 0

      - name: Patch supported Downloads start focus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path('qa/compatibility/run-lab.py')
          source = run_path.read_text(encoding='utf-8')
          helper_anchor = '\n\n\ndef parse_start_metrics(text: str) -> dict[str, int]:\n'
          helper = '''\n\n\ndef wait_for_supported_download_focus(\n    adb: Adb,\n    scratch: Path,\n    display_width: int,\n    *,\n    timeout: float = 5.0,\n    consecutive_reads: int = 2,\n) -> tuple[bool, str | None, dict[str, Any] | None, bytes]:\n    \"\"\"Prove any recognized Downloads start target across stable XML reads.\"\"\"\n    if consecutive_reads < 2:\n        raise ValueError(\"stable focus requires at least two consecutive reads\")\n    deadline = time.monotonic() + timeout\n    matching_reads = 0\n    read_number = 0\n    previous_target: str | None = None\n    last_target: str | None = None\n    last_node: dict[str, Any] | None = None\n    last_xml = b\"\"\n    while time.monotonic() < deadline:\n        read_number += 1\n        read_path = scratch.with_name(\n            f\"{scratch.stem}-read-{read_number}{scratch.suffix}\"\n        )\n        last_xml = dump_xml(adb, read_path, attempts=1)\n        last_target, last_node = download_focus_target(last_xml, display_width)\n        if last_target is not None and last_target == previous_target:\n            matching_reads += 1\n        elif last_target is not None:\n            previous_target = last_target\n            matching_reads = 1\n        else:\n            previous_target = None\n            matching_reads = 0\n        if matching_reads >= consecutive_reads:\n            safe_write(scratch, last_xml)\n            return True, last_target, last_node, last_xml\n        time.sleep(0.12)\n    if last_xml:\n        safe_write(scratch, last_xml)\n    return False, last_target, last_node, last_xml\n'''
          if 'def wait_for_supported_download_focus(' not in source:
              if source.count(helper_anchor) != 1:
                  raise SystemExit('BLOCKED: parse_start_metrics insertion anchor changed')
              source = source.replace(helper_anchor, helper + helper_anchor, 1)

          old_call = '''            stable, initial_target, initial_node, initial_xml = wait_for_download_focus_stability(\n                self.adb,\n                step_root / \"initial.xml\",\n                display_width,\n            )\n'''
          new_call = '''            stable, initial_target, initial_node, initial_xml = wait_for_supported_download_focus(\n                self.adb,\n                step_root / \"initial.xml\",\n                display_width,\n            )\n'''
          if source.count(old_call) != 1:
              raise SystemExit(f'BLOCKED: expected one deterministic initial-focus call, found {source.count(old_call)}')
          source = source.replace(old_call, new_call, 1)
          run_path.write_text(source, encoding='utf-8')

          test_path = Path('qa/compatibility/tests/test_lab.py')
          tests = test_path.read_text(encoding='utf-8')
          alias_anchor = 'evaluate_page_precondition = RUN_LAB_MODULE.evaluate_page_precondition\n'
          alias_line = 'wait_for_supported_download_focus = RUN_LAB_MODULE.wait_for_supported_download_focus\n'
          if alias_line not in tests:
              if tests.count(alias_anchor) != 1:
                  raise SystemExit('BLOCKED: test import anchor changed')
              tests = tests.replace(alias_anchor, alias_anchor + alias_line, 1)

          method_anchor = '    def test_external_error_dialog_close_target_is_detected(self) -> None:\n'
          method = '''    def test_supported_download_start_accepts_stable_toolbar_concurrent(self) -> None:\n        node = {\"text\": \"متزامنة 2\", \"bounds\": [10, 10, 100, 60]}\n        with tempfile.TemporaryDirectory() as temporary, (\n            patch(\n                \"compatibility_run_lab.dump_xml\",\n                side_effect=(b\"first\", b\"second\"),\n            ),\n            patch(\n                \"compatibility_run_lab.download_focus_target\",\n                side_effect=((\"toolbar-concurrent\", node), (\"toolbar-concurrent\", node)),\n            ),\n            patch(\"compatibility_run_lab.time.sleep\"),\n        ):\n            stable, target, observed, xml = wait_for_supported_download_focus(\n                object(),\n                Path(temporary) / \"initial.xml\",\n                1280,\n                timeout=1.0,\n                consecutive_reads=2,\n            )\n        self.assertTrue(stable)\n        self.assertEqual(\"toolbar-concurrent\", target)\n        self.assertEqual(node, observed)\n        self.assertEqual(b\"second\", xml)\n\n'''
          if 'test_supported_download_start_accepts_stable_toolbar_concurrent' not in tests:
              if tests.count(method_anchor) != 1:
                  raise SystemExit('BLOCKED: test method anchor changed')
              tests = tests.replace(method_anchor, method + method_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          git diff --check

      - name: Validate complete lab contracts
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qa/compatibility/requirements.txt
          python3 -m py_compile qa/compatibility/*.py qa/compatibility/tests/*.py
          python3 -m unittest discover -s qa/compatibility/tests -p 'test_*.py' -v
          python3 -m unittest discover -s qa/quality/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 qa/compatibility/lab_config.py --validate
          bash -n qa/compatibility/prepare-project.sh
          bash -n qa/compatibility/run-native-emulator.sh

      - name: Commit lab-only regression repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/compatibility/run-lab.py qa/compatibility/tests/test_lab.py
          git commit -m 'fix(lab): accept any stable supported Downloads start focus'
          git push origin HEAD:fix/quality-lab-tv-preconditions-20260801
